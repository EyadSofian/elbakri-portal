<script>
const { t, initI18n, applyTranslations, formatMoney, formatDate, formatNumber } = window.PortalI18n;

const state = {
  page: "dashboard",
  renderToken: 0,
  companies: [],
  companiesMeta: { page: 1, limit: 20, total: 0, pages: 1 },
  companyFilters: { page: 1, limit: 20, search: "", tier: "", isActive: "", country: "" },
  userFilters: { includeInactive: false },
  selectedCompanies: new Set(),
  currentCompany: null,
  cache: {},
  sort: {},
};

const pageMeta = {
  dashboard: ["page.dashboardTitle", "page.dashboardSub"],
  companies: ["page.companiesTitle", "page.companiesSub"],
  users: ["page.usersTitle", "page.usersSub"],
  hotels: ["page.hotelsTitle", "page.hotelsSub"],
  "sheets-config": ["page.sheetsTitle", "page.sheetsSub"],
  bookings: ["page.bookingsTitle", "page.bookingsSub"],
  invoices: ["page.invoicesTitle", "page.invoicesSub"],
  wallet: ["page.walletTitle", "page.walletSub"],
  reports: ["page.reportsTitle", "page.reportsSub"],
  cruises: ["nav.nileCruises", "page.servicesSub"],
  transport: ["nav.transport", "page.servicesSub"],
  activities: ["nav.activities", "page.servicesSub"],
  visa: ["nav.visa", "page.servicesSub"],
  reception: ["nav.reception", "page.servicesSub"],
  calculators: ["page.calculatorsTitle", "page.calculatorsSub"],
  destinations: ["nav.destinations", "page.destinationsSub"],
  "quote-requests": ["nav.quoteRequests", "page.quoteRequestsSub"],
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ─── WhatsApp helpers (admin uses fixed business number) ─────────────────────
const ADMIN_WA_NUMBER = "201147515456";
function waIconSvg(size = 16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;
}
function buildAdminWaUrl(lines) {
  const text = (Array.isArray(lines) ? lines.filter(Boolean).join("\n") : String(lines || "")).trim();
  return `https://wa.me/${ADMIN_WA_NUMBER}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}
function waButton(lines, label) {
  const url = buildAdminWaUrl(lines);
  const text = label || t("contact.whatsapp", "WhatsApp");
  return `<a href="${url}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="color:#25d366;border-color:#25d366;text-decoration:none;display:inline-flex;align-items:center;gap:6px">${waIconSvg(14)}${text}</a>`;
}
function waIconButton(lines, title) {
  const url = buildAdminWaUrl(lines);
  return `<a href="${url}" target="_blank" rel="noopener" class="icon-button btn-icon" title="${title || t("contact.whatsapp", "WhatsApp")}" style="color:#25d366;text-decoration:none">${waIconSvg(16)}</a>`;
}

function apiFetch(path, options = {}) {
  const token = localStorage.getItem("accessToken");
  return fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(options.headers || {}) },
    credentials: "include",
  }).then(async res => {
    if (res.status === 401) {
      const refresh = await fetch("/api/auth/refresh", { method: "POST", credentials: "include" });
      if (!refresh.ok) {
        localStorage.clear();
        location.href = "/login.html";
        return null;
      }
      const json = await refresh.json();
      localStorage.setItem("accessToken", json.data.accessToken);
      return apiFetch(path, options);
    }
    const json = await res.json().catch(() => ({ success: false, message: res.statusText }));
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Request failed");
    return json;
  }).catch(err => {
    toast(err.message || "Request failed", "error");
    return null;
  });
}

async function downloadInvoicePdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/invoices/${id}/pdf`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "PDF download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `invoice-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "PDF download failed", "error");
  }
}

function toast(message, type = "") {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = `toast ${type} show`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = "toast"; }, 3600);
}

function icon(name) {
  return `<i data-lucide="${name}"></i>`;
}

function refreshIcons(root = document) {
  applyTranslations(root);
  if (window.lucide) window.lucide.createIcons();
}

function statusBadge(status) {
  const key = String(status ?? "").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("status." + key, key.replace(/_/g, " "))}</span>`;
}

function tierBadge(tier) {
  const key = String(tier || "STANDARD").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("tier." + key, key)}</span>`;
}

function content(html) {
  const root = document.getElementById("content");
  root.innerHTML = html;
  refreshIcons(root);
}

function markRefreshed() {
  const el = document.getElementById("lastRefresh");
  if (el) el.textContent = t("topbar.justNow");
}

function refreshCurrentPage() {
  markRefreshed();
  const loader = pageLoaders[state.page] || renderDashboard;
  loader();
}

function pageHeader(actions = "") {
  const [titleKey, subKey] = pageMeta[state.page] || pageMeta.dashboard;
  document.getElementById("breadcrumbTitle").textContent = t(titleKey);
  return `<div class="page-header">
    <div>
      <div class="page-kicker">Elbakri B2B</div>
      <h1 class="page-title">${t(titleKey)}</h1>
      <p class="page-subtitle">${t(subKey)}</p>
    </div>
    <div class="page-actions">${actions}</div>
  </div>`;
}

function skeletonRows(cols = 8, rows = 8) {
  return Array.from({ length: rows }, () => `<tr>${Array.from({ length: cols }, () => `<td><div class="skeleton" style="height:14px;width:${50 + Math.random() * 40}%"></div></td>`).join("")}</tr>`).join("");
}

function emptyBlock(messageKey, action = "") {
  return `<div class="empty-state"><div class="empty-illustration"></div><strong>${t(messageKey)}</strong><span>${t("empty.adjustFilters")}</span>${action}</div>`;
}

function labelText(key) {
  const fallback = String(key || "")
    .split(".")
    .pop()
    .replace(/([A-Z])/g, " $1")
    .replace(/_/g, " ")
    .replace(/^./, char => char.toUpperCase());
  return t(key, fallback);
}

function sortable(labelKey, key) {
  return `<button class="sort-btn" onclick="sortCompanies('${key}')"><span>${t(labelKey)}</span>${icon("chevrons-up-down")}</button>`;
}

function tableFoot(meta, prefix, onPage) {
  const page = meta?.page || 1;
  const pages = Math.max(meta?.pages || 1, 1);
  const total = meta?.total || 0;
  const limit = meta?.limit || 20;
  const start = total ? ((page - 1) * limit) + 1 : 0;
  const end = Math.min(page * limit, total);
  const buttons = Array.from({ length: Math.min(pages, 7) }, (_, i) => {
    const p = i + 1;
    return `<button class="${p === page ? "active" : ""}" onclick="${onPage}(${p})">${p}</button>`;
  }).join("");
  return `<div class="table-foot">
    <span>${prefix || ""}${formatNumber(start)}-${formatNumber(end)} / ${formatNumber(total)}</span>
    <div class="pager">${buttons}</div>
  </div>`;
}

function exportRows(filename, rows) {
  if (!rows || !rows.length) {
    toast(t("toast.noRowsSelected"), "warning");
    return;
  }
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "Export");
    XLSX.writeFile(wb, `${filename}.xlsx`);
  } else {
    const headers = Object.keys(rows[0]);
    const csv = [headers.join(","), ...rows.map(row => headers.map(h => `"${String(row[h] ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${filename}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
  toast(t("toast.exported"), "success");
}

function openModal(title, body, footer = "") {
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal ${body.length > 2600 ? "modal-wide" : ""}" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div class="modal-title">${title}</div>
      <button class="icon-button" onclick="closeModal()" aria-label="Close">${icon("x")}</button>
    </div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-footer">${footer}</div>` : ""}
  </div>`;
  host.classList.add("open");
  refreshIcons(host);
}

function closeModal() {
  const host = document.getElementById("modalHost");
  host.classList.remove("open");
  host.innerHTML = "";
}

document.getElementById("modalHost").addEventListener("click", (event) => {
  if (event.target.id === "modalHost") closeModal();
});

function confirmAction(message, callback) {
  openModal(t("modal.confirmDelete"), `<p style="margin:0;color:var(--text-secondary)">${escapeHtml(message)}</p>`, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-danger" id="confirmActionBtn">${t("btn.confirm")}</button>
  `);
  document.getElementById("confirmActionBtn").onclick = async () => {
    closeModal();
    await callback();
  };
}

function setPage(page) {
  state.page = page;
  state.renderToken = (state.renderToken || 0) + 1;
  document.querySelectorAll(".nav-item").forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
  const loader = pageLoaders[page] || renderDashboard;
  loader();
}

document.querySelectorAll(".nav-item[data-page]").forEach(btn => {
  btn.addEventListener("click", () => {
    setPage(btn.dataset.page);
    closeSidebar();
  });
});

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    document.getElementById("globalSearch").focus();
  }
  if (event.key === "Escape") closeSidebar();
});

function toggleSidebar() {
  const isOpen = document.getElementById("sidebar").classList.toggle("open");
  document.body.classList.toggle("sidebar-open", isOpen);
  document.getElementById("sidebarBackdrop")?.classList.toggle("open", isOpen);
}

function closeSidebar() {
  document.getElementById("sidebar")?.classList.remove("open");
  document.body.classList.remove("sidebar-open");
  document.getElementById("sidebarBackdrop")?.classList.remove("open");
}

function logout() {
  apiFetch("/auth/logout", { method: "POST" }).finally(() => {
    localStorage.clear();
    location.href = "/login.html";
  });
}

async function renderDashboard() {
  const capturedToken = state.renderToken;
  content(pageHeader(`<button class="btn btn-outline" onclick="renderDashboard()">${icon("refresh-cw")}${t("btn.refresh")}</button>`) + `
    <div class="stats-grid">${Array.from({ length: 6 }, () => `<div class="stat-card"><div class="skeleton" style="height:12px;width:70%"></div><div class="skeleton" style="height:28px;width:48%;margin-top:14px"></div><div class="skeleton" style="height:12px;width:58%;margin-top:12px"></div></div>`).join("")}</div>
    <div class="grid-2">
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.bookings")}</div><div class="panel-subtitle">${t("stat.today")}</div></div></div><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(5, 6)}</tbody></table></div></section>
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.wallet")}</div><div class="panel-subtitle">${t("topbar.lastRefresh")}</div></div></div><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(4, 6)}</tbody></table></div></section>
    </div>`);

  const [overview, bookings, tx, platform, hotelsMeta] = await Promise.all([
    apiFetch("/admin/reports/overview"),
    apiFetch("/bookings?limit=8"),
    apiFetch("/admin/wallet/transactions?limit=8"),
    apiFetch("/admin/wallet/platform?currency=USD"),
    apiFetch("/hotels?page=1&limit=1"),
  ]);
  if (state.renderToken !== capturedToken) return;
  const d = overview?.data || {};
  const platformWallet = platform?.data?.wallet || { balance: 0, currency: "USD" };
  const platformBalance = Number(platformWallet.balance || 0);
  const hotelsCount = hotelsMeta?.meta?.total ?? d.bookingsByType?.HOTEL ?? 0;
  document.getElementById("walletPillValue").textContent = formatMoney(platformBalance, platformWallet.currency || "USD");
  document.getElementById("pendingCount").textContent = d.pendingBookings || 0;

  content(pageHeader(`<button class="btn btn-outline" onclick="renderDashboard()">${icon("refresh-cw")}${t("btn.refresh")}</button>`) + `
    <div class="stats-grid">
      ${statCard("stat.totalBookings", d.totalBookings || 0, "stat.allTime", "briefcase-business")}
      ${statCard("stat.totalRevenue", formatMoney(d.totalRevenue || 0, "USD"), "stat.monthToDate", "banknote")}
      ${statCard("stat.pending", d.pendingBookings || 0, "toast.validationError", "clock")}
      ${statCard("stat.activeCompanies", d.activeCompanies || 0, "status.ACTIVE", "building-2")}
      ${statCard("topbar.platformWallet", formatMoney(platformBalance, platformWallet.currency || "USD"), "stat.walletExposure", "wallet")}
      ${statCard("stat.hotels", hotelsCount, "nav.hotels", "hotel")}
    </div>
    <div class="grid-2">
      ${miniTable("nav.bookings", bookings?.data || [], [
        ["th.ref", b => `<span class="primary-text">${escapeHtml(b.refNumber)}</span>`],
        ["th.company", b => escapeHtml(b.company?.name || "—")],
        ["th.type", b => escapeHtml(b.type)],
        ["th.amount", b => `<span class="numeric">${formatMoney(b.totalAmount, b.currency || "USD")}</span>`],
        ["th.status", b => statusBadge(b.status)],
      ])}
      ${miniTable("nav.wallet", tx?.data || [], [

function miniTable(titleKey, rows, columns) {
  const body = rows.length ? rows.map(row => `<tr>${columns.map(([, fn]) => `<td>${fn(row)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${columns.length}">${emptyBlock("empty.noData")}</td></tr>`;
  return `<section class="panel">
    <div class="panel-header"><div><div class="panel-title">${t(titleKey)}</div><div class="panel-subtitle">${t("topbar.justNow")}</div></div></div>
    <div class="table-scroll"><table class="data-table"><thead><tr>${columns.map(([k]) => `<th>${labelText(k)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
  </section>`;
}

async function ensureCompanyOptions() {
  if (state.cache.companyOptions?.length) return;
  const res = await apiFetch("/admin/companies?limit=300");
  state.cache.companyOptions = res?.data || [];
}

let companiesTimer;
function debouncedCompanies() {
  clearTimeout(companiesTimer);
  companiesTimer = setTimeout(() => loadCompanies(1), 250);
}

function resetCompanyFilters() {
  ["coSearch", "coTier", "coActive", "coCountry"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
  const active = document.getElementById("coActive");
  if (active) active.value = "true";
  loadCompanies(1);
}

async function loadCompanies(page = state.companyFilters.page) {
  const activeValue = document.getElementById("coActive")?.value || "true";
  state.companyFilters = {
    page,
    limit: 20,
    search: document.getElementById("coSearch")?.value || "",
    tier: document.getElementById("coTier")?.value || "",
    isActive: activeValue === "all" ? "" : activeValue,
    includeInactive: activeValue === "all" ? "true" : "",
    country: document.getElementById("coCountry")?.value || "",
  };
  const params = new URLSearchParams(Object.entries(state.companyFilters).filter(([, v]) => v !== ""));
  const res = await apiFetch(`/admin/companies?${params}`);
  if (!res?.success) return;
  state.companies = res.data || [];
  state.companiesMeta = res.meta || { page, limit: 20, total: state.companies.length, pages: 1 };
  renderCompaniesTable();
}

function renderCompaniesTable() {
  const tbody = document.getElementById("companiesTbody");
  if (!tbody) return;
  if (!state.companies.length) {
    tbody.innerHTML = `<tr><td colspan="11">${emptyBlock("empty.noCompanies", `<button class="btn btn-primary" onclick="showCompanyModal()">${icon("plus")}${t("btn.newCompany")}</button>`)}</td></tr>`;
  } else {
    tbody.innerHTML = state.companies.map(c => {
      const selected = state.selectedCompanies.has(c.id);
      return `<tr class="${selected ? "selected" : ""}">
        <td><input type="checkbox" ${selected ? "checked" : ""} onchange="toggleCompanySelection('${c.id}', this.checked)"></td>
        <td><div class="logo-cell">${c.logoUrl ? `<img src="${escapeHtml(c.logoUrl)}" alt="">` : escapeHtml((c.name || "?").charAt(0).toUpperCase())}</div></td>
        <td><div class="company-cell"><div class="logo-cell">${escapeHtml((c.name || "?").slice(0, 2).toUpperCase())}</div><div class="truncate"><div class="primary-text truncate">${escapeHtml(c.name)}</div><div class="secondary-text truncate">${escapeHtml(c.email || c.nameAr || "—")}</div></div></div></td>
        <td>${tierBadge(c.tier)}</td>
        <td>${escapeHtml(c.country || "—")}</td>
        <td class="numeric">${formatMoney(c.balance, c.currency || "USD")}</td>
        <td class="numeric">${formatMoney(c.creditLimit, c.currency || "USD")}</td>
        <td>${formatNumber(c._count?.bookings || c.bookingsCount || 0)}</td>
        <td>${statusBadge(c.isActive ? "ACTIVE" : "INACTIVE")}</td>
        <td>${formatDate(c.lastActivityAt || c.updatedAt || c.createdAt)}</td>
        <td><div class="row-actions">
          <button class="icon-button btn-icon" title="${t("btn.view")}" onclick="showCompanyDetails('${c.id}')">${icon("eye")}</button>
          <button class="icon-button btn-icon" title="${t("btn.edit")}" onclick="showCompanyModal('${c.id}')">${icon("pencil")}</button>
          ${waIconButton([`Hello *${c.name}*,`], t("contact.whatsapp", "WhatsApp"))}
          <button class="icon-button btn-icon" title="${t("btn.topup")}" onclick="showTopupModal('${c.id}')">${icon("wallet")}</button>
          <button class="icon-button btn-icon" title="${t("btn.toggle")}" onclick="toggleCompany('${c.id}', ${!c.isActive})">${icon(c.isActive ? "ban" : "check-circle")}</button>
          <button class="icon-button btn-icon" title="${t("btn.delete")}" onclick="deleteCompany('${c.id}')">${icon("trash-2")}</button>
        </div></td>
      </tr>`;
    }).join("");
  }
  document.getElementById("companiesFoot").innerHTML = tableFoot(state.companiesMeta, "", "loadCompanies");
  document.getElementById("companiesMetaText").textContent = `${formatNumber(state.companiesMeta.total || 0)} ${t("nav.companies")}`;
  updateCompanyBulkBar();
  refreshIcons(tbody);
}

function sortCompanies(key) {
  const direction = state.sort[key] === "asc" ? "desc" : "asc";
  state.sort = { [key]: direction };
  state.companies.sort((a, b) => String(a[key] || "").localeCompare(String(b[key] || "")) * (direction === "asc" ? 1 : -1));
  renderCompaniesTable();
}

function toggleCompanySelection(id, checked) {
  if (checked) state.selectedCompanies.add(id);
  else state.selectedCompanies.delete(id);
  renderCompaniesTable();
}

function toggleAllCompanies(checked) {
  if (checked) state.companies.forEach(c => state.selectedCompanies.add(c.id));
  else state.companies.forEach(c => state.selectedCompanies.delete(c.id));
  renderCompaniesTable();
}

function updateCompanyBulkBar() {
  const count = state.selectedCompanies.size;
  const bar = document.getElementById("companyBulkBar");
  if (!bar) return;
  bar.classList.toggle("show", count > 0);
  document.getElementById("companySelectedCount").textContent = `${formatNumber(count)} selected`;
}

function companyRows(selectedOnly) {
  const rows = selectedOnly ? state.companies.filter(c => state.selectedCompanies.has(c.id)) : state.companies;
  return rows.map(c => ({
    Name: c.name,
    Email: c.email,
    Tier: c.tier,
    Country: c.country,
    Balance: Number(c.balance || 0),
    CreditLimit: Number(c.creditLimit || 0),
    Bookings: c._count?.bookings || 0,
    Status: c.isActive ? "Active" : "Inactive",
  }));
}

}

function masterActions(entity) {
  const cfg = masterConfigs[entity];
  const importBtn = entity === "hotels"
    ? `<button class="btn btn-outline" onclick="document.getElementById('hotelsImportFile').click()">${icon("upload")}${t("btn.importExcel", "Import Excel")}</button>
       <input type="file" id="hotelsImportFile" accept=".xlsx,.xls" style="display:none" onchange="importHotelsExcel(this)">`
    : "";
  return `<button class="btn btn-primary" onclick="showMasterModal('${entity}')">${icon("plus")}${t("btn.addNew")}</button>
    ${importBtn}
    <button class="btn btn-outline" onclick="syncEntity('${cfg.syncEntity}')">${icon("refresh-cw")}${t("btn.syncSheets")}</button>`;
}

async function importHotelsExcel(input) {
  const file = input?.files?.[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  toast(t("toast.syncStarted", "Import started"), "");
  try {
    const res = await fetch("/api/hotels/import-excel", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json();
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Import failed");
    const { created = 0, updated = 0, total = 0 } = json.data || {};
    toast(`${t("toast.syncComplete", "Import complete")} — +${created}, ~${updated} / ${total}`, "success");
    renderHotels();
  } catch (err) {
    toast(err.message || "Import failed", "error");
  } finally {
    input.value = "";
  }
}

    <button class="icon-button btn-icon" title="${t("btn.delete")}" onclick="deleteMasterRecord('${entity}', '${row.id}')">${icon("trash-2")}</button>
  </div>`;
}

function masterField(entity, fieldDef, row) {
  const id = `m_${entity.replace(/[^a-z0-9]/gi, "_")}_${fieldDef.name}`;
  const raw = row?.[fieldDef.name] ?? fieldDef.default ?? "";
  const value = Array.isArray(raw) ? raw.join(", ") : (fieldDef.type === "date" && raw ? String(raw).slice(0, 10) : raw);
  const required = fieldDef.required ? '<span class="required">*</span>' : "";
  const help = fieldDef.help ? `<div class="secondary-text" style="margin-top:4px">${escapeHtml(fieldDef.help)}</div>` : "";
  const label = `${t(fieldDef.label, fieldDef.fallback || fieldDef.name)} ${required}`;

  if (fieldDef.type === "textarea" || fieldDef.type === "list") {
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><textarea id="${id}" rows="3">${escapeHtml(value)}</textarea>${help}</div>`;
  }
  if (fieldDef.type === "select") {
    const emptyOpt = fieldDef.nullable ? `<option value="" ${!value ? "selected" : ""}>— None —</option>` : "";
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><select id="${id}">${emptyOpt}${fieldDef.options.map(opt => `<option value="${opt}" ${opt === value ? "selected" : ""}>${escapeHtml(opt.replace(/_/g, " "))}</option>`).join("")}</select>${help}</div>`;
  }
  if (fieldDef.type === "hotelSelect") {
    const hotels = state.cache.hotelOptions || [];
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><select id="${id}">${hotels.map(h => `<option value="${h.id}" ${h.id === value ? "selected" : ""}>${escapeHtml(h.name)} - ${escapeHtml(h.city || "")}</option>`).join("")}</select>${help}</div>`;
  }
  if (fieldDef.type === "checkbox") {
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><label class="check-row"><input id="${id}" type="checkbox" ${value ? "checked" : ""}> ${t("status.ACTIVE")}</label>${help}</div>`;
  }
  return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><input id="${id}" type="${fieldDef.type || "text"}" value="${escapeHtml(value)}" ${fieldDef.type === "number" ? 'step="0.01" min="0"' : ""}>${help}</div>`;
}

async function showMasterModal(entity, id = "") {
  const cfg = masterConfigs[entity];
  if (!cfg) return;
  const rows = state.cache[entity + "Rows"] || [];
  const row = id ? rows.find(item => item.id === id) : null;
  const title = `${id ? t("btn.edit") : t("btn.addNew")} ${t(cfg.titleKey)}`;
  const body = `<div class="form-section"><div class="form-section-title">${t("form.basicInfo")}</div><div class="form-grid">
    ${cfg.fields.map(fieldDef => masterField(entity, fieldDef, row)).join("")}
  </div></div>`;
  openModal(title, body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" onclick="saveMasterRecord('${entity}', '${id}')">${t("btn.save")}</button>
  `);
}

function collectMasterPayload(entity) {
  const cfg = masterConfigs[entity];
  const payload = {};
  let valid = true;
  for (const fieldDef of cfg.fields) {
    const id = `m_${entity.replace(/[^a-z0-9]/gi, "_")}_${fieldDef.name}`;
    const el = document.getElementById(id);
    if (!el) continue;
    let value = fieldDef.type === "checkbox" ? el.checked : el.value.trim();
    if (fieldDef.required && (value === "" || value === null || value === undefined)) valid = false;
    if (fieldDef.type === "number") value = value === "" ? 0 : Number(value);
    if (fieldDef.type === "list") value = String(value || "").split(",").map(item => item.trim()).filter(Boolean);
    if (fieldDef.nullable && value === "") value = null;
    if (value !== "" || value === null || fieldDef.required || fieldDef.type === "number" || fieldDef.type === "list") {
      payload[fieldDef.name] = value;
    }
  }
  return valid ? payload : null;
}

async function saveMasterRecord(entity, id = "") {
  const cfg = masterConfigs[entity];
  const payload = collectMasterPayload(entity);
  if (!payload) {
    toast(t("toast.validationError"), "error");

  const res = await apiFetch(id ? `${cfg.endpoint}/${id}` : cfg.endpoint, {

}

function formatCell(value) {
  if (value === true) return statusBadge("ACTIVE");

  if (String(value || "").match(/^\d{4}-\d{2}-\d{2}T/)) return formatDate(value);
  if (["PENDING","CONFIRMED","CANCELLED","REJECTED","COMPLETED","PAID","UNPAID","OVERDUE","CREDIT","DEBIT","REFUND"].includes(String(value))) return statusBadge(value);
  return escapeHtml(value ?? "—");
}

const hotelFilters = { search: "", city: "", stars: "", priceVisible: "", amenities: new Set() };

const AMENITY_PRESETS = [
  "Sea-front", "Private beach", "Sandy beach", "Coral reefs",
  "Aqua Park (small)", "Aqua Park (medium)", "Aqua Park (large)",
  "Kids pool", "Kids club", "All-inclusive",
  "Diving center", "Spa", "Gym", "Animation", "Tennis", "Marina",

];

function hotelThumb(h) {
  if (h.imageUrl) return `<img src="${escapeHtml(h.imageUrl)}" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover">`;
  const initials = (h.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
  return `<div style="width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-2,#5b8def),var(--accent,#7c5cff));color:#fff;font-weight:700;font-size:14px">${escapeHtml(initials)}</div>`;
}

function amenityChip(name) {
  return `<span class="badge badge-outline" style="font-size:10px;padding:2px 6px">${escapeHtml(name)}</span>`;
}

function applyHotelFilters(rows) {
  const f = hotelFilters;
  const search = f.search.trim().toLowerCase();
  const wanted = Array.from(f.amenities);
  return rows.filter(h => {
    if (search && !`${h.name} ${h.city || ""} ${h.cityAr || ""}`.toLowerCase().includes(search)) return false;
    if (f.city && (h.city || "").toLowerCase() !== f.city.toLowerCase()) return false;
    if (f.stars && Number(h.stars || 0) !== Number(f.stars)) return false;
    if (f.priceVisible === "yes" && !h.showPriceToAgents) return false;
    if (f.priceVisible === "no" && h.showPriceToAgents) return false;
    if (wanted.length) {
      const has = new Set((h.amenities || []).map(String));
      if (!wanted.every(a => has.has(a))) return false;
    }
    return true;
  });
}

async function renderHotels() {
  const capturedToken = state.renderToken;
  state.page = "hotels";

  // Fetch once and cache; subsequent filter changes re-render from cache.
  let rows = state.cache.hotelsRows || [];
  if (!rows.length) {
    content(pageHeader(masterActions("hotels")) + `
      <div class="table-card"><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(7, 8)}</tbody></table></div></div>`);
    const rowsFetched = [];
    let page = 1;
    let pages = 1;
    do {
      const res = await apiFetch(`/hotels?page=${page}&limit=100`);
      if (state.renderToken !== capturedToken) return;
      rowsFetched.push(...(res?.data || []));
      pages = res?.meta?.pages || page;
      page += 1;
    } while (page <= pages);
    if (state.renderToken !== capturedToken) return;
    rows = rowsFetched;
    state.cache.hotelsRows = rows;
  }

  drawHotelsPage(rows);
}

function drawHotelsPage(rows) {
  const f = hotelFilters;
  const cities = [...new Set(rows.map(h => h.city).filter(Boolean))].sort();
  const filtered = applyHotelFilters(rows);

  const cityOpts = `<option value="">${t("filter.all", "All cities")}</option>` +
    cities.map(c => `<option value="${escapeHtml(c)}" ${f.city === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
  const starsOpts = `<option value="">${t("filter.all", "Any")}</option>` +
    ["3","4","5"].map(s => `<option value="${s}" ${f.stars === s ? "selected" : ""}>${s}★</option>`).join("");

  const amenityChips = AMENITY_PRESETS.map(a => `

          </div></td>

    : `<tr><td colspan="7" style="text-align:center;padding:32px">${emptyBlock("empty.noData")}</td></tr>`;

  content(pageHeader(masterActions("hotels")) + `
    <div class="table-card">
      <div class="filter-body" style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:8px;padding:12px;border-bottom:1px solid var(--border);align-items:end">

        <div class="field"><label style="font-size:11px">${t("th.city","City")}</label><select onchange="hotelFilters.city=this.value;drawHotelsPage(state.cache.hotelsRows||[])">${cityOpts}</select></div>
        <div class="field"><label style="font-size:11px">${t("th.stars","Stars")}</label><select onchange="hotelFilters.stars=this.value;drawHotelsPage(state.cache.hotelsRows||[])">${starsOpts}</select></div>

          <option value="" ${f.priceVisible===""?"selected":""}>${t("filter.all","All")}</option>
          <option value="yes" ${f.priceVisible==="yes"?"selected":""}>${t("hotel.visible","Visible")}</option>

      <div class="table-scroll"><table class="data-table"><thead><tr>
        <th></th><th>${t("th.name","Name")}</th><th>${t("th.stars","Stars")}</th>

function toggleHotelAmenity(name) {
  if (hotelFilters.amenities.has(name)) hotelFilters.amenities.delete(name);
  else hotelFilters.amenities.add(name);
  drawHotelsPage(state.cache.hotelsRows || []);
}

function resetHotelFilters() {
  hotelFilters.search = ""; hotelFilters.city = ""; hotelFilters.stars = "";
  hotelFilters.priceVisible = ""; hotelFilters.amenities.clear();
  drawHotelsPage(state.cache.hotelsRows || []);
}

      <th>${t("th.amount","Price/Night")}</th><th>${t("form.validFrom","From")}</th><th>${t("form.validTo","To")}</th>

      <td>${escapeHtml(p.roomType)}</td><td>${escapeHtml(p.season)}</td>

        <div style="color:var(--text-secondary);margin-top:4px">${"★".repeat(Math.min(h.stars||0,5))} · ${escapeHtml(h.city||"")}${h.cityAr ? ` · ${escapeHtml(h.cityAr)}` : ""}, ${escapeHtml(h.country||"EG")}</div>
        <div style="color:var(--text-secondary);font-size:12px;margin-top:4px">${escapeHtml(h.address||"")}</div>

      <div class="info-item"><div class="info-label">${t("th.amount","Price/Night")}</div><div class="info-value">${Number(h.pricePerNight||0) > 0 ? formatMoney(h.pricePerNight, h.currency) : t("hotel.priceOnRequest","On request")}</div></div>
      <div class="info-item"><div class="info-label">${t("form.commissionPercent","Commission %")}</div><div class="info-value">${Number(h.commissionPercent||0).toFixed(2)}%</div></div>

async function togglePriceVisibility(id, show) {
  const res = await apiFetch(`/hotels/${id}/price-visibility`, {
    method: "PATCH",
    body: JSON.stringify({ showPriceToAgents: show }),
  });
  if (res?.success) {
    toast(t(show ? "hotel.pricesNowVisible" : "hotel.pricesNowHidden", show ? "Prices are now visible to agents" : "Prices are now hidden"), "success");
    // Refresh cache so the row reflects the new state.
    state.cache.hotelsRows = null;
    renderHotels();
  }
}

      </div>
    </div>
    <div class="table-scroll"><table><thead><tr>
      <th>${t("th.name","Name")}</th><th>${t("th.slug","Slug")}</th><th>${t("th.country","Country")}</th>
      <th>${t("th.region","Region")}</th><th>${t("th.type","Type")}</th><th>${t("th.status","Status")}</th><th>${t("th.actions","Actions")}</th>

function openAddDestinationModal(dest = null) {
  const title = dest ? t("btn.editDestination","Edit Destination") : t("btn.addDestination","Add Destination");
  const body = `
    <div class="form-grid">
      <div class="form-field"><label>${t("form.name","Name")} *</label><input id="destName" value="${dest?.name||""}" placeholder="e.g. North Coast"></div>
      <div class="form-field"><label>${t("form.nameAr","Arabic Name")}</label><input id="destNameAr" dir="rtl" value="${dest?.nameAr||""}" placeholder="مثل: الساحل الشمالي"></div>
      <div class="form-field"><label>${t("form.slug","Slug")} *</label><input id="destSlug" value="${dest?.slug||""}" placeholder="e.g. north-coast"></div>
      <div class="form-field"><label>${t("form.country","Country")}</label><input id="destCountry" value="${dest?.country||"EG"}" placeholder="EG"></div>
      <div class="form-field"><label>${t("form.region","Region")}</label><input id="destRegion" value="${dest?.region||""}" placeholder="e.g. Red Sea"></div>
      <div class="form-field"><label>${t("form.type","Type")}</label>
        <select id="destType">
          ${["CITY","RESORT","AREA","REGION"].map(t2 => `<option value="${t2}" ${dest?.type===t2?"selected":""}>${t2}</option>`).join("")}
        </select>
      </div>
      <div class="form-field"><label>${t("form.isActive","Active")}</label>
        <select id="destActive"><option value="true" ${!dest || dest.isActive?"selected":""}>Yes</option><option value="false" ${dest && !dest.isActive?"selected":""}>No</option></select>
      </div>
    </div>`;
  openModal(title, body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" onclick="saveDestination(${dest ? `'${dest.id}'` : "null"})">${t("btn.save","Save")}</button>
  `);
  document.getElementById("destName").addEventListener("input", function() {
    const slugEl = document.getElementById("destSlug");
    if (!dest) slugEl.value = this.value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  });
}

async function saveDestination(id) {
  const name = document.getElementById("destName").value.trim();
  const slug = document.getElementById("destSlug").value.trim();
  if (!name || !slug) { toast(t("validation.required","Name and slug are required"), "error"); return; }
  const body = {
    name, slug,
    nameAr: document.getElementById("destNameAr").value.trim() || null,
    country: document.getElementById("destCountry").value.trim() || "EG",
    region: document.getElementById("destRegion").value.trim() || null,
    type: document.getElementById("destType").value,
    isActive: document.getElementById("destActive").value === "true",
  };
  const res = await apiFetch(id ? `/destinations/${id}` : "/destinations", {
    method: id ? "PATCH" : "POST",
    body: JSON.stringify(body),
  });
  if (res?.success) {
    closeModal();
    toast(t("toast.saved","Saved"), "success");
    renderDestinations();
  }
}

function editDestination(jsonStr) {
  try { openAddDestinationModal(JSON.parse(jsonStr)); } catch {}
}

async function deleteDestination(id, name) {
  confirmAction(t("destination.deleteConfirm", `Deactivate destination "${name}"?`), async () => {
    const res = await apiFetch(`/destinations/${id}`, { method: "DELETE" });
    if (res?.success) { toast(t("toast.deleted","Deleted"), "success"); renderDestinations(); }
  });
}

let qrFilters = { status: "", serviceType: "", page: 1, limit: 20 };

async function renderQuoteRequests() {
  const capturedToken = state.renderToken;
  const params = new URLSearchParams({ limit: qrFilters.limit, page: qrFilters.page });
  if (qrFilters.status) params.set("status", qrFilters.status);
  if (qrFilters.serviceType) params.set("serviceType", qrFilters.serviceType);
  const res = await apiFetch("/quote-requests?" + params);
  if (!res || state.renderToken !== capturedToken) return;
  const quotes = res.data || [];
  const meta = res.meta || {};

  const statusOpts = ["","NEW","IN_REVIEW","QUOTED","ACCEPTED","CLOSED","CANCELLED"].map(s =>
    `<option value="${s}" ${qrFilters.status===s?"selected":""}>${s||t("filter.all","All Statuses")}</option>`).join("");
  const typeOpts = ["","HOTEL","PACKAGE","CRUISE","FLIGHT","MULTI_SERVICE"].map(s =>
    `<option value="${s}" ${qrFilters.serviceType===s?"selected":""}>${s||t("filter.all","All Types")}</option>`).join("");

  const filters = `<div class="toolbar-filters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <select onchange="qrFilters.status=this.value;qrFilters.page=1;renderQuoteRequests()">${statusOpts}</select>
    <select onchange="qrFilters.serviceType=this.value;qrFilters.page=1;renderQuoteRequests()">${typeOpts}</select>
    <button class="btn btn-outline" onclick="qrFilters={status:'',serviceType:'',page:1,limit:20};renderQuoteRequests()">${icon("x")}${t("btn.clearFilters","Clear")}</button>
  </div>`;

  const rows = quotes.map(q => {
    const dest = q.destination?.name || q.destinationName || "—";
    const hotel = q.serviceName || q.hotel?.name || "—";
    const dates = q.checkIn ? `${formatDate(q.checkIn)} – ${formatDate(q.checkOut||"")}` : "—";
    return `<tr>
      <td><span class="primary-text">${escapeHtml(q.refNumber)}</span></td>
      <td><span class="badge badge-${(q.serviceType||"").toLowerCase()}">${escapeHtml(q.serviceType)}</span></td>
      <td>${escapeHtml(q.company?.name || "—")}</td>
      <td>${escapeHtml(dest)}</td>
      <td>${escapeHtml(hotel)}</td>
      <td><div class="secondary-text">${dates}</div><div class="secondary-text">${q.adultsCount}A ${q.childrenCount ? q.childrenCount+"C" : ""}</div></td>
      <td>${statusBadge(q.status)}</td>
      <td>${escapeHtml(q.assignedTo?.name || "—")}</td>
      <td>${formatDate(q.createdAt)}</td>
      <td><div class="row-actions">
        <button class="btn btn-outline btn-sm" onclick="openQuoteRequestModal('${q.id}')">${icon("eye")}${t("btn.review","Review")}</button>
        ${waIconButton([
          `*Quote ${q.refNumber}*`,
          `Company: ${q.company?.name || "—"}`,
          `Type: ${q.serviceType}`,
          dest !== "—" ? `Destination: ${dest}` : "",
          hotel !== "—" ? `Service: ${hotel}` : "",
          dates !== "—" ? `Dates: ${dates}` : "",
        ], t("contact.whatsapp", "WhatsApp"))}
      </div></td>
    </tr>`;
  }).join("");

  content(pageHeader() + filters + `<div class="table-card"><div class="table-scroll"><table><thead><tr>
    <th>${t("th.ref","Ref")}</th><th>${t("th.type","Type")}</th><th>${t("th.company","Company")}</th>
    <th>${t("th.destination","Destination")}</th><th>${t("th.hotel","Hotel")}</th><th>${t("th.travelDates","Travel Dates")}</th>
    <th>${t("th.status","Status")}</th><th>${t("th.assignedTo","Assigned")}</th><th>${t("th.date","Date")}</th><th>${t("th.actions","Actions")}</th>
  </tr></thead><tbody>${rows.length ? rows : `<tr><td colspan="10" style="text-align:center;padding:24px">${t("empty.noQuotes","No quote requests found")}</td></tr>`}</tbody></table></div>
  ${tableFoot(meta, "", p => { qrFilters.page = p; renderQuoteRequests(); })}
  </div>`);

  // Update sidebar badge
  const newCount = quotes.filter(q => q.status === "NEW").length;
  const badge = document.getElementById("pendingQuoteCount");
  if (badge) badge.textContent = newCount || "";
}

      ${info("th.invoice", b.invoice ? `${escapeHtml(b.invoice.invoiceNumber)} · ${statusBadge(b.invoice.status)}` : "—")}

  const waLines = [
    `*Booking ${b.refNumber}*`,
    `Company: ${b.company?.name || "—"}`,
    `Type: ${b.type}`,
    b.hotel?.name ? `Hotel: ${b.hotel.name}` : "",

async function renderSimpleList(page, endpoint, columns, extraActions = "") {

  state.page = page;
  content(pageHeader(`${extraActions}<button class="btn btn-outline" onclick="exportRows('${page}', state.cache['${page}Rows'] || [])">${icon("download")}${t("btn.exportExcel")}</button>`) + `

}

async function testSheetsConnection() {

  toast(res?.success ? t("toast.connectionOk") : t("toast.connectionFailed"), res?.success ? "success" : "error");
}

async function loadSheetsSettings() {
  const res = await apiFetch("/admin/sheets/config");
  const data = res?.data;
  if (!data) return;
  const sheetsId = document.getElementById("sheetsId");
  const syncCron = document.getElementById("syncCron");
  if (sheetsId) sheetsId.value = data.spreadsheetId || "";
  if (syncCron) syncCron.value = data.cronExpression || "*/30 * * * *";
  (data.entities || []).forEach(item => {
    const resultEl = document.getElementById("result-" + item.entity);
    const lastEl = document.getElementById("last-" + item.entity);
    if (resultEl && item.lastSync) resultEl.innerHTML = statusBadge(item.lastSync.status);
    if (lastEl && item.lastSync?.finishedAt) lastEl.textContent = formatDate(item.lastSync.finishedAt);
  });
}

async function saveSheetsConfig() {
  const res = await apiFetch("/admin/sheets/config", {
    method: "PATCH",
    body: JSON.stringify({
      spreadsheetId: document.getElementById("sheetsId")?.value || "",
      cronExpression: document.getElementById("syncCron")?.value || "*/30 * * * *",
      autoSyncEnabled: true,
    }),
  });
  toast(res?.success ? t("toast.saved") : t("toast.validationError"), res?.success ? "success" : "error");
}

async function syncEntity(entity) {
  toast(t("toast.syncStarted"), "");
  const res = await apiFetch(`/admin/sheets/sync/${entity}`, { method: "POST", body: JSON.stringify({ spreadsheetId: document.getElementById("sheetsId")?.value || undefined }) });
  if (res?.success) {
    const d = res.data || {};
    const resultEl = document.getElementById("result-" + entity);
    const lastEl = document.getElementById("last-" + entity);
    if (resultEl) resultEl.textContent = `${d.synced || 0} ${t("th.synced")} (${d.created || 0}/${d.updated || 0})`;
    if (lastEl) lastEl.textContent = formatDate(new Date());
    toast(`${t("toast.syncComplete")}: ${d.synced || 0}`, "success");
    loadSyncHistory();
  } else {
    toast(t("toast.syncFailed"), "error");
  }
}

function calcCard(titleKey, input1, input2, resultId, handler) {
  return `<div class="stat-card" style="min-height:190px">
    <div class="stat-label">${t(titleKey)}</div>
    <div class="field" style="margin-top:10px"><input id="${input1}" type="number" placeholder="0.00" oninput="${handler}"></div>
    <div class="field" style="margin-top:8px"><input id="${input2}" type="number" placeholder="10" oninput="${handler}"></div>
    <div class="stat-value" id="${resultId}">USD 0.00</div>
  </div>`;
}

function calcCommissionAdmin() {
  const sale = Number(document.getElementById("calcCommSale")?.value || 0);
  const rate = Number(document.getElementById("calcCommRate")?.value || 0);
  document.getElementById("calcCommResult").textContent = formatMoney(sale * rate / 100, "USD");
}

function calcMarkupAdmin() {
  const cost = Number(document.getElementById("calcCost")?.value || 0);
  const rate = Number(document.getElementById("calcMarkup")?.value || 0);
  document.getElementById("calcMarkupResult").textContent = formatMoney(cost * (1 + rate / 100), "USD");
}

(function init() {
  const token = localStorage.getItem("accessToken");
  const role = localStorage.getItem("userRole");
  if (!token || role !== "SUPERADMIN") {
    location.href = "/login.html";
    return;
  }
  const name = localStorage.getItem("userName") || "Admin";
  document.getElementById("sidebarUserName").textContent = name;
  document.getElementById("userInitial").textContent = name.charAt(0).toUpperCase();
  initI18n();
  refreshIcons();
  setPage("dashboard");
})();
