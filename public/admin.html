    /* Dedicated hotel + transport tabbed editors */
    .he-tabs { display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--border); margin:-4px 0 16px; }
    .he-tabbtn { background:transparent; border:none; padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; }
    .he-tabbtn:hover { color:var(--brand-accent); background:var(--accent-tint); }
    .he-tabbtn.active { color:var(--brand-accent); border-bottom-color:var(--brand-accent); }
    .he-main-preview { position:relative; width:200px; height:140px; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--surface-muted); display:flex; align-items:center; justify-content:center; }
    .he-main-preview img { width:100%; height:100%; object-fit:cover; }
    .he-noimg { display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text-muted); font-size:12px; }
    .he-noimg svg { width:28px; height:28px; }
    .he-img-x, .he-thumb-actions button { cursor:pointer; }
    .he-img-x { position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(5,13,36,.68); color:#fff; display:flex; align-items:center; justify-content:center; }
    .he-img-x svg { width:14px; height:14px; }
    .he-gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
    .he-thumb { position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--border); aspect-ratio:4/3; background:var(--surface-muted); }
    .he-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .he-thumb-actions { position:absolute; inset:auto 0 0 0; display:flex; justify-content:center; gap:2px; padding:4px; background:linear-gradient(transparent,rgba(5,13,36,.78)); opacity:0; transition:opacity .15s; }
    .he-thumb:hover .he-thumb-actions { opacity:1; }
    .he-thumb-actions button { width:26px; height:26px; border-radius:6px; border:none; background:var(--surface); color:var(--text-primary); display:flex; align-items:center; justify-content:center; }

    .he-amenity:hover { border-color:var(--brand-accent); }
    .he-amenity.on { background:var(--brand-accent); color:#fff; border-color:var(--brand-accent); }
    .btn-sm { padding:5px 10px; font-size:12px; }
    /* Typed transport endpoint editor */
    .tr-ep { border:1px solid var(--border); border-radius:10px; padding:12px; }
    .tr-ep-grid { display:grid; grid-template-columns:1fr 1.4fr; gap:8px; }
    @media (max-width:640px){ .he-tabbtn{ padding:8px 10px; font-size:12px; } .he-main-preview{ width:100%; } .he-supp{ grid-template-columns:1fr 1fr !important; } .tr-ep-grid{ grid-template-columns:1fr; } }
  </style>

const { t, initI18n, applyTranslations, formatMoney, formatDate, formatNumber } = window.PortalI18n;

const state = {

  renderToken: 0,
  companies: [],
  companiesMeta: { page: 1, limit: 20, total: 0, pages: 1 },
  companyFilters: { page: 1, limit: 20, search: "", tier: "", isActive: "", country: "" },
  userFilters: { includeInactive: false },
  selectedCompanies: new Set(),
  selectedTransportRates: new Set(),
  currentCompany: null,
  cache: {},
  sort: {},
  // Mirrors the document language so the "show the Arabic label" checks
  // in this file actually answer yes when the portal is in Arabic.
  lang: document.documentElement.lang || localStorage.getItem("lang") || "en",
};

// Currencies a PRICE can be entered in. Deliberately wider than
// COMPANY_DISPLAY_CURRENCIES below: a company's wallet is billed in USD or EGP,
// but a supplier contract can be written in any of these — a Gulf hotel quoting
// SAR, a Jordanian transfer in JOD. The list used to be copy-pasted in seven
// places and had drifted apart (some copies were missing GBP), so every price
// dropdown now reads from here.
const PORTAL_CURRENCIES = [
  "EGP", "USD", "EUR", "GBP",
  "SAR", "AED", "KWD", "QAR", "BHD", "OMR",  // Gulf
  "JOD", "ILS",                               // Middle East / Arab 48
  "MAD", "TND", "DZD", "LYD",                 // North Africa
];

const COMPANY_DISPLAY_CURRENCIES = ["USD", "EGP"];

function companyDefaultCurrency(market) {
  return market === "EGYPTIAN" ? "EGP" : "USD";
}

function normalizedCompanyCurrency(value, market) {
  const cur = String(value || "").toUpperCase();
  return COMPANY_DISPLAY_CURRENCIES.includes(cur) ? cur : companyDefaultCurrency(market);
}

function companyCurrencyOptions(selected, market) {
  const value = normalizedCompanyCurrency(selected, market);
  return COMPANY_DISPLAY_CURRENCIES
    .map(cur => `<option value="${cur}" ${cur === value ? "selected" : ""}>${t("currency."+cur, cur)}</option>`)
    .join("");
}

const pageMeta = {
  dashboard: ["page.dashboardTitle", "page.dashboardSub"],
  companies: ["page.companiesTitle", "page.companiesSub"],
  users: ["page.usersTitle", "page.usersSub"],
  hotels: ["page.hotelsTitle", "page.hotelsSub"],

  "ui-builder": ["page.uiBuilderTitle", "page.uiBuilderSub"],

  destinations: ["nav.destinations", "page.destinationsSub"],
  "quote-requests": ["nav.quoteRequests", "page.quoteRequestsSub"],
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineJsonArg(value) {
  return escapeHtml(JSON.stringify(String(value ?? "")));
}

/** Render a request's dynamic customFields (from a Request Form Builder template). */
function customFieldsBlock(cf) {
  if (!cf || typeof cf !== "object" || Array.isArray(cf) || !Object.keys(cf).length) return "";
  const rows = Object.entries(cf).map(([k, v]) => {
    const val = Array.isArray(v) ? v.join(", ") : String(v);
    return `<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)">
      <span style="min-width:150px;color:var(--text-muted);font-weight:600">${escapeHtml(k)}</span>
      <span style="flex:1">${escapeHtml(val)}</span></div>`;
  }).join("");
  return `<div class="full" style="grid-column:1/-1;margin-top:8px">
    <strong>${t("quoteDetail.customFields", "Additional Fields")}:</strong>
    <div style="margin-top:6px">${rows}</div>
  </div>`;
}

// ─── WhatsApp helpers (admin uses fixed business number) ─────────────────────

function waIconSvg(size = 16) {

}
function buildAdminWaUrl(lines) {
  const text = (Array.isArray(lines) ? lines.filter(Boolean).join("\n") : String(lines || "")).trim();
  return `https://wa.me/${ADMIN_WA_NUMBER}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}
function waButton(lines, label) {
  const url = buildAdminWaUrl(lines);
  const text = label || t("contact.whatsapp", "WhatsApp");
  return `<a href="${url}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="color:#25d366;border-color:#25d366;text-decoration:none;display:inline-flex;align-items:center;gap:6px">${waIconSvg(14)}${text}</a>`;
}
function waIconButton(lines, title) {
  const url = buildAdminWaUrl(lines);
  return `<a href="${url}" target="_blank" rel="noopener" class="icon-button btn-icon" title="${title || t("contact.whatsapp", "WhatsApp")}" style="color:#25d366;text-decoration:none">${waIconSvg(16)}</a>`;
}

function apiFetch(path, options = {}) {
  const token = localStorage.getItem("accessToken");
  return fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(options.headers || {}) },
    credentials: "include",
  }).then(async res => {
    if (res.status === 401) {
      const refresh = await fetch("/api/auth/refresh", { method: "POST", credentials: "include" });
      if (!refresh.ok) {
        localStorage.clear();
        location.href = "/login.html";
        return null;
      }
      const json = await refresh.json();
      localStorage.setItem("accessToken", json.data.accessToken);
      return apiFetch(path, options);
    }
    const json = await res.json().catch(() => ({ success: false, message: res.statusText }));
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Request failed");
    return json;
  }).catch(err => {
    toast(err.message || "Request failed", "error");
    return null;
  });
}

async function downloadInvoicePdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/invoices/${id}/pdf`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "PDF download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `invoice-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "PDF download failed", "error");
  }
}

async function downloadVoucherPdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/vouchers/${id}/download`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "Voucher download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `voucher-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); link.remove();
    URL.revokeObjectURL(url);
  } catch (err) { toast(err.message || "Download failed", "error"); }
}

async function regenerateVoucher(id) {
  if (!confirm("Regenerate voucher PDF?")) return;
  const res = await apiFetch(`/vouchers/${id}/regenerate`, { method: "POST" });
  if (res?.success) toast("Voucher regenerated", "success");
}

async function downloadAuthenticatedFile(path, fallbackName) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api${path}`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "Download failed");
    }
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const url = URL.createObjectURL(await res.blob());
    const link = document.createElement("a");
    link.href = url;
    link.download = match?.[1] || fallbackName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "Download failed", "error");
  }
}

// Open a private customer document (passport / flight ticket). Protected uploads
// (/api/files/private/...) are fetched with the bearer token and shown as a blob;
// legacy public /uploads paths or externally-pasted URLs open directly.
async function openPrivateDoc(url, fallbackName) {
  if (!url) return;
  if (/^\/api\/files\//.test(url)) {
    const token = localStorage.getItem("accessToken");
    try {
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` }, credentials: "include" });
      if (!res.ok) {
        const json = await res.json().catch(() => null);
        throw new Error(json?.message || json?.error || "File access failed");
      }
      const blobUrl = URL.createObjectURL(await res.blob());
      window.open(blobUrl, "_blank");
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (err) {
      toast(err.message || "File access failed", "error");
    }
  } else {
    window.open(url, "_blank");
  }
}

// Disable a submit button and show a spinner while an async action runs.
function setBtnLoading(btn, loading, labelKey) {
  if (!btn) return;
  if (loading) {

    btn.disabled = true;
    btn.innerHTML = `<span class="btn-spin">${icon("loader-2")}</span>${t(labelKey || "btn.saving", "Saving")}`;
    refreshIcons(btn);
  } else {
    btn.disabled = false;
    if (btn._restore !== undefined) { btn.innerHTML = btn._restore; btn._restore = undefined; refreshIcons(btn); }
  }
}

function exportRows(filename, rows) {
  if (!rows || !rows.length) {
    toast(t("toast.noRowsSelected"), "warning");
    return;
  }
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "Export");
    XLSX.writeFile(wb, `${filename}.xlsx`);
  } else {
    // The spreadsheet library is a third-party CDN; when it does not load, the
    // browser builds the file itself. The UTF-8 BOM is what makes Excel read
    // Arabic names correctly instead of as mojibake.
    const headers = Object.keys(rows[0]);
    const cell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
    const csv = [headers.join(","), ...rows.map(row => headers.map(h => cell(row[h])).join(","))].join("\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `${filename}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoking in the same tick can cancel the download in some browsers.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  toast(t("toast.exported"), "success");
}

}

function sortCompanies(key) {
  const direction = state.sort[key] === "asc" ? "desc" : "asc";
  state.sort = { [key]: direction };
  state.companies.sort((a, b) => String(a[key] || "").localeCompare(String(b[key] || "")) * (direction === "asc" ? 1 : -1));
  renderCompaniesTable();
}

function toggleCompanySelection(id, checked) {
  if (checked) state.selectedCompanies.add(id);
  else state.selectedCompanies.delete(id);
  renderCompaniesTable();
}

function toggleAllCompanies(checked) {
  if (checked) state.companies.forEach(c => state.selectedCompanies.add(c.id));
  else state.companies.forEach(c => state.selectedCompanies.delete(c.id));
  renderCompaniesTable();
}

function updateCompanyBulkBar() {
  const count = state.selectedCompanies.size;
  const bar = document.getElementById("companyBulkBar");
  if (!bar) return;
  bar.classList.toggle("show", count > 0);
  document.getElementById("companySelectedCount").textContent = `${formatNumber(count)} selected`;
}

function companyRows(selectedOnly) {
  const rows = selectedOnly ? state.companies.filter(c => state.selectedCompanies.has(c.id)) : state.companies;
  return rows.map(c => ({
    Name: c.name,
    Email: c.email,
    Tier: c.tier,
    Country: c.country,
    Balance: Number(c.balance || 0),
    CreditLimit: Number(c.creditLimit || 0),
    Bookings: c._count?.bookings || 0,
    Status: c.isActive ? "Active" : "Inactive",
  }));
}

function exportCompanyRows(selectedOnly) {
  exportRows("companies", companyRows(selectedOnly));
}

async function importHotelsExcel(input) {
  const file = input?.files?.[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  const importBtn = document.getElementById("hotelsImportBtn");
  setBtnLoading(importBtn, true, "btn.importing");
  toast(t("toast.syncStarted", "Import started"), "");
  try {
    const res = await fetch("/api/hotels/import-excel", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json();
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Import failed");
    const { created = 0, updated = 0, total = 0 } = json.data || {};
    toast(`${t("toast.syncComplete", "Import complete")} — +${created}, ~${updated} / ${total}`, "success");
    renderHotels();
  } catch (err) {
    toast(err.message || "Import failed", "error");
  } finally {
    setBtnLoading(importBtn, false);
    input.value = "";
  }
}

// Upload an image to the shared /api/upload endpoint. Validates type + size on
// the client (the server re-validates) and returns the stored URL, or null.
async function uploadImageToServer(file) {
  const okTypes = ["image/jpeg", "image/png", "image/gif", "image/webp"];
  if (!okTypes.includes(file.type)) {
    toast(t("upload.badType", "Only JPG, PNG, GIF or WebP images are allowed"), "error");
    return null;
  }
  if (file.size > 10 * 1024 * 1024) {
    toast(t("upload.tooLarge", "Image must be under 10 MB"), "error");
    return null;
  }
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json?.success) throw new Error(json?.message || json?.error || "Upload failed");
    return json.data.url;
  } catch (err) {
    toast(err.message || t("upload.failed", "Upload failed"), "error");
    return null;
  }
}

function masterField(entity, fieldDef, row) {
  const id = `m_${entity.replace(/[^a-z0-9]/gi, "_")}_${fieldDef.name}`;
  const raw = row?.[fieldDef.name] ?? fieldDef.default ?? "";
  const value = Array.isArray(raw) ? raw.join(fieldDef.name === "galleryUrls" ? "\n" : ", ") : (fieldDef.type === "date" && raw ? String(raw).slice(0, 10) : raw);
  const required = fieldDef.required ? '<span class="required">*</span>' : "";
  const help = fieldDef.help ? `<div class="secondary-text" style="margin-top:4px">${escapeHtml(fieldDef.help)}</div>` : "";
  const label = `${t(fieldDef.label, fieldDef.fallback || fieldDef.name)} ${required}`;

  if (fieldDef.type === "textarea" || fieldDef.type === "list") {
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><textarea id="${id}" rows="3">${escapeHtml(value)}</textarea>${help}</div>`;
  }
  if (fieldDef.type === "select") {
    const emptyOpt = fieldDef.nullable ? `<option value="" ${!value ? "selected" : ""}>— None —</option>` : "";
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><select id="${id}">${emptyOpt}${fieldDef.options.map(opt => `<option value="${opt}" ${opt === value ? "selected" : ""}>${escapeHtml(opt.replace(/_/g, " "))}</option>`).join("")}</select>${help}</div>`;
  }
  if (fieldDef.type === "hotelSelect") {
    const hotels = state.cache.hotelOptions || [];
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><select id="${id}">${hotels.map(h => `<option value="${h.id}" ${h.id === value ? "selected" : ""}>${escapeHtml(h.name)} - ${escapeHtml(h.city || "")}</option>`).join("")}</select>${help}</div>`;
  }
  if (fieldDef.type === "checkbox") {
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><label class="check-row"><input id="${id}" type="checkbox" ${value ? "checked" : ""}> ${t("status.ACTIVE")}</label>${help}</div>`;
  }
  return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><input id="${id}" type="${fieldDef.type || "text"}" value="${escapeHtml(value)}" ${fieldDef.type === "number" ? 'step="0.01" min="0"' : ""}>${help}</div>`;
}

  const mpData = {};

    window._mpCompanies = await mpLoadCompanies();
    for (const mp of cfg.marketPrices) {
      const res = await apiFetch(`/admin/price-rows?entityType=${mp.entityType}&entityId=${encodeURIComponent(id)}`).catch(() => null);

      <div class="form-field"><label>${t("form.amount", "Amount")}</label><input class="mp-amount" type="number" step="0.01" min="0" value="${escapeHtml(amount)}"></div>
      <div class="form-field"><label>${t("form.minPax", "Min pax")}</label><input class="mp-minpax" type="number" min="0" value="${row.minPax != null ? escapeHtml(row.minPax) : ""}"></div>
      <div class="form-field"><label>${t("form.maxPax", "Max pax")}</label><input class="mp-maxpax" type="number" min="0" value="${row.maxPax != null ? escapeHtml(row.maxPax) : ""}"></div>
      <div class="form-field"><label>${t("form.validFrom", "Valid from")}</label><input class="mp-from" type="date" value="${vf}"></div>

function mpAddRow(containerId, row) {
  const box = document.getElementById(containerId);
  if (!box) return;

}
function mpRemoveRow(btn) {
  const row = btn.closest(".mp-row");

}

/** Collect every price row in a container into MarketPriceRowInput[] (rows with no amount are dropped). */
function mpCollectRows(containerId) {
  const box = document.getElementById(containerId);
  if (!box) return [];
  return [...box.querySelectorAll(".mp-row")].map(row => {
    const g = sel => row.querySelector(sel);
    const amount = g(".mp-amount")?.value;
    if (amount === "" || amount == null) return null;
    const num = el => (el && el.value !== "" ? Number(el.value) : null);
    return {
      market: g(".mp-market")?.value || null,
      companyId: g(".mp-company")?.value || null,
      currency: g(".mp-cur")?.value || "USD",
      amount: Number(amount),
      minPax: num(g(".mp-minpax")),
      maxPax: num(g(".mp-maxpax")),
      validFrom: g(".mp-from")?.value || null,
      validTo: g(".mp-to")?.value || null,
      isActive: g(".mp-active")?.checked !== false,
    };
  }).filter(Boolean);
}

function marketPriceSection(entity, cfg, mpData, id) {
  const safe = entity.replace(/[^a-z0-9]/gi, "_");
  if (!id) {
    return `<div class="form-section"><div class="form-section-title">${t("market.pricingTitle", "Explicit Price Matrix")}</div>
      <div class="secondary-text">${t("market.pricingHelpNew", "Save first, then re-open this record to define explicit market / company prices.")}</div></div>`;
  }
  const companies = window._mpCompanies || [];
  const blocks = cfg.marketPrices.map(mp => {
    const rows = mpData[mp.entityType] || [];
    const cid = `mpRows_${safe}_${mp.entityType}`;
    const rowsHtml = rows.map(r => mpRowHtml(companies, r)).join("");
    return `<div class="mp-block" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong>${escapeHtml(mp.label)}</strong>
        <button type="button" class="btn btn-outline btn-sm" onclick="mpAddRow('${cid}')">+ ${t("market.addRow", "Add price row")}</button>
      </div>
      <div id="${cid}" class="mp-rows">${rowsHtml}</div>
    </div>`;
  }).join("");
  return `<div class="form-section"><div class="form-section-title">${t("market.pricingTitle", "Explicit Price Matrix")}</div>
    <div class="secondary-text" style="margin-bottom:10px">${t("market.pricingHelp2", "Each row is an explicit selling price — returned verbatim with NO FX conversion. Priority: company override → market row → all-markets row → base price. Leave empty to use the base price field above.")}</div>
    ${blocks}</div>`;
}

function collectMasterPayload(entity) {
  const cfg = masterConfigs[entity];
  const payload = {};
  let valid = true;
  for (const fieldDef of cfg.fields) {
    const id = `m_${entity.replace(/[^a-z0-9]/gi, "_")}_${fieldDef.name}`;
    const el = document.getElementById(id);
    if (!el) continue;
    let value = fieldDef.type === "checkbox" ? el.checked : el.value.trim();
    if (fieldDef.required && (value === "" || value === null || value === undefined)) valid = false;
    if (fieldDef.type === "number") value = value === "" ? 0 : Number(value);
    if (fieldDef.type === "list") value = String(value || "").split(/[\n,]+/).map(item => item.trim()).filter(Boolean);
    if (fieldDef.nullable && value === "") value = null;
    if (value !== "" || value === null || fieldDef.required || fieldDef.type === "number" || fieldDef.type === "list") {
      payload[fieldDef.name] = value;
    }
  }
  return valid ? payload : null;
}

async function saveMasterRecord(entity, id = "") {
  const cfg = masterConfigs[entity];
  const payload = collectMasterPayload(entity);
  if (!payload) {
    toast(t("toast.validationError"), "error");
    return;
  }
  const res = await apiFetch(id ? `${cfg.endpoint}/${id}` : cfg.endpoint, {
    method: id ? "PATCH" : "POST",
    body: JSON.stringify(payload),
  });
  if (res?.success) {
    // Persist the Egyptian override. International customers use the base price.
    const savedId = id || res.data?.id;
    if (cfg.marketPrices && savedId) {
      const safe = entity.replace(/[^a-z0-9]/gi, "_");
      for (const mp of cfg.marketPrices) {
        const cid = `mpRows_${safe}_${mp.entityType}`;
        if (!document.getElementById(cid)) continue;
        await apiFetch("/admin/price-rows", {
          method: "PUT",
          body: JSON.stringify({ entityType: mp.entityType, entityId: savedId, rows: mpCollectRows(cid) }),
        }).catch(() => null);
      }
    }
    closeModal();
    toast(id ? t("toast.updated") : t("toast.created"), "success");
    setPage(entity);
  }
}

async function deleteMasterRecord(entity, id) {
  const cfg = masterConfigs[entity];

    const res = await apiFetch(`${cfg.endpoint}/${id}`, { method: "DELETE" });

      setPage(entity);

  });
}

function detailTable(rows, keys) {

function formatCell(value) {
  if (value === true) return statusBadge("ACTIVE");
  if (value === false) return statusBadge("INACTIVE");
  if (typeof value === "number") return formatMoney(value, "USD");
  if (String(value || "").match(/^\d{4}-\d{2}-\d{2}T/)) return formatDate(value);
  if (["PENDING","CONFIRMED","CANCELLED","REJECTED","COMPLETED","PAID","UNPAID","OVERDUE","CREDIT","DEBIT","REFUND"].includes(String(value))) return statusBadge(value);
  return escapeHtml(value ?? "—");
}

function switchDetailTab(tab, btn) {
  document.querySelectorAll(".detail-tabs .tab").forEach(x => x.classList.remove("active"));

async function submitTopup(ids) {
  const amount = Number(document.getElementById("topupAmount").value || 0);
  const currency = document.getElementById("topupCurrency").value;
  const description = document.getElementById("topupDescription").value.trim();
  if (amount <= 0 || !description) return toast(t("toast.validationError"), "error");
  let success = true;
  for (const id of ids) {
    const res = await apiFetch(`/admin/companies/${id}/topup`, { method: "POST", body: JSON.stringify({ amount, currency, description, notify: document.getElementById("topupNotify").checked }) });
    if (!res?.success) success = false;
  }
  if (!success) return;
  closeModal();
  toast(t("toast.topupDone"), "success");
  state.selectedCompanies.clear();
  await refreshPlatformWalletPill(currency);
  loadCompanies();
}

const hotelFilters = { search: "", city: "", stars: "", priceVisible: "", amenities: new Set() };

const AMENITY_PRESETS = [
  "Sea-front", "Private beach", "Sandy beach", "Coral reefs",
  "Aqua Park (small)", "Aqua Park (medium)", "Aqua Park (large)",
  "Kids pool", "Kids club", "All-inclusive",
  "Diving center", "Spa", "Gym", "Animation", "Tennis", "Marina",
  "Family friendly", "Quiet",
];

function hotelThumb(h) {
  if (h.imageUrl) return `<img src="${escapeHtml(hotelImageSrc(h.imageUrl))}" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover">`;
  const initials = (h.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
  return `<div style="width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--navy-800);color:#fff;font-weight:700;font-size:14px">${escapeHtml(initials)}</div>`;
}

// Upscale Booking/bstatic thumbnails (square60, max300, square600…) to large res.
function hiRes(u) {
  return String(u || "")
    .replace(/\/xdata\/images\/hotel\/(?:square|max)\d+(?:x\d+)?\//i, "/xdata/images/hotel/max1280x900/")
    .replace(/\/(?:square|max)\d+(?:x\d+)?\//i, "/max1280x900/");
}

function hotelImageSrc(u) {
  const url = hiRes(u);
  try {
    const parsed = new URL(url, window.location.origin);
    if (parsed.hostname === "bstatic.com" || parsed.hostname.endsWith(".bstatic.com")) {
      return `/media/hotel-image?url=${encodeURIComponent(parsed.href)}`;
    }
  } catch (e) {}
  return url;
}

function hotelMediaShowcase(h) {
  const urls = [...new Set([h.imageUrl, ...(h.galleryUrls || [])].filter(Boolean))].map(hotelImageSrc);
  if (!urls.length) {
    return `<div class="hotel-media-empty">${escapeHtml((h.name||"?").charAt(0).toUpperCase())}</div>`;
  }
  const id = "hms" + Math.random().toString(36).slice(2, 7);
  const name = escapeHtml(h.name || "");
  return `<div class="hotel-media-showcase" id="${id}" data-imgs='${escapeHtml(JSON.stringify(urls))}'>
    <div class="hotel-media-stage">
      <div class="hotel-media-main-scroll" onscroll="hmsSync('${id}')">
        ${urls.map((u, i) => `<button type="button" class="hotel-media-slide" onclick="hotelLightbox('${id}',${i})"><img src="${u}" alt="${name} ${i + 1}" loading="${i ? "lazy" : "eager"}"></button>`).join("")}
      </div>
      ${urls.length > 1 ? `
        <button type="button" class="hms-nav hms-prev" onclick="hmsScroll('${id}',-1)" aria-label="Previous photo">${icon("chevron-left")}</button>
        <button type="button" class="hms-nav hms-next" onclick="hmsScroll('${id}',1)" aria-label="Next photo">${icon("chevron-right")}</button>
        <div class="hms-count"><span id="${id}_i">1</span> / ${urls.length}</div>` : ""}
    </div>
    ${urls.length > 1 ? `<div class="hotel-media-thumbs" id="${id}_t">${urls.slice(0, 24).map((u, i) => `<button type="button" class="hms-thumb${i === 0 ? " active" : ""}" onclick="hmsGo('${id}',${i})"><img src="${u}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
  </div>`;
}

function hmsEl(id) { return document.querySelector("#" + id + " .hotel-media-main-scroll"); }
function hmsScroll(id, dir) { const el = hmsEl(id); if (el) el.scrollBy({ left: dir * el.clientWidth, behavior: "smooth" }); }
function hmsGo(id, i) {
  const el = hmsEl(id); if (!el) return;
  const slide = el.children[i];
  if (slide) el.scrollTo({ left: slide.offsetLeft - el.offsetLeft, behavior: "smooth" });
}
function hmsSync(id) {
  const el = hmsEl(id); if (!el) return;
  const i = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
  const idx = document.getElementById(id + "_i"); if (idx) idx.textContent = i + 1;
  document.querySelectorAll("#" + id + "_t .hms-thumb").forEach((t, k) => t.classList.toggle("active", k === i));
}

// In-portal full-screen lightbox — keeps users on our site (never opens Booking).
function hotelLightbox(id, start) {
  let imgs = [];
  try { imgs = JSON.parse(document.getElementById(id).getAttribute("data-imgs")); } catch (e) {}
  if (!imgs.length) return;
  let i = start || 0;
  const host = document.createElement("div");
  host.className = "lightbox-overlay";
  host.innerHTML = `
    <button class="lightbox-close" aria-label="Close">${icon("x")}</button>
    <button class="lightbox-nav lb-prev" aria-label="Previous">${icon("chevron-left")}</button>
    <img class="lightbox-img" src="${imgs[i]}" alt="">
    <button class="lightbox-nav lb-next" aria-label="Next">${icon("chevron-right")}</button>
    <div class="lightbox-count"></div>`;
  const imgEl = host.querySelector(".lightbox-img");
  const cnt = host.querySelector(".lightbox-count");
  const render = () => { imgEl.src = imgs[i]; cnt.textContent = (i + 1) + " / " + imgs.length; };
  const close = () => { host.remove(); document.removeEventListener("keydown", onKey); };
  const prev = () => { i = (i - 1 + imgs.length) % imgs.length; render(); };
  const next = () => { i = (i + 1) % imgs.length; render(); };
  const onKey = (e) => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") prev(); };
  host.addEventListener("click", (e) => { if (e.target === host || e.target.closest(".lightbox-close")) close(); });
  host.querySelector(".lb-prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
  host.querySelector(".lb-next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
  document.body.appendChild(host);
  document.addEventListener("keydown", onKey);
  render();
  if (window.lucide) lucide.createIcons();
}

function amenityChip(name) {
  return `<span class="badge badge-outline" style="font-size:10px;padding:2px 6px">${escapeHtml(name)}</span>`;
}

function applyHotelFilters(rows) {
  const f = hotelFilters;
  const search = f.search.trim().toLowerCase();
  const wanted = Array.from(f.amenities);
  return rows.filter(h => {
    if (search && !`${h.name} ${h.city || ""} ${h.cityAr || ""}`.toLowerCase().includes(search)) return false;
    if (f.city && (h.city || "").toLowerCase() !== f.city.toLowerCase()) return false;
    if (f.stars && Number(h.stars || 0) !== Number(f.stars)) return false;
    if (f.priceVisible === "yes" && !h.showPriceToAgents) return false;
    if (f.priceVisible === "no" && h.showPriceToAgents) return false;
    if (wanted.length) {
      const has = new Set((h.amenities || []).map(String));
      if (!wanted.every(a => has.has(a))) return false;
    }
    return true;
  });
}

function hotelRowsHtml(filtered) {
  return filtered.length
    ? filtered.map(h => {
        const amenities = (h.amenities || []).slice(0, 4).map(amenityChip).join(" ");
        const extra = (h.amenities || []).length > 4 ? `<span style="color:var(--text-secondary);font-size:10px"> +${(h.amenities||[]).length - 4}</span>` : "";
        return `<tr>
          <td>${hotelThumb(h)}</td>
          <td>
            <div class="primary-text">${escapeHtml(h.name)}</div>
            <div class="secondary-text">${escapeHtml(h.city || "—")}${h.cityAr ? ' · ' + escapeHtml(h.cityAr) : ''}</div>
            <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${amenities}${extra}</div>
          </td>
          <td style="white-space:nowrap">${"★".repeat(Math.min(h.stars || 0, 5))}</td>
          <td class="numeric">${Number(h.pricePerNight || 0) > 0 ? formatMoney(h.pricePerNight, h.currency) : `<span style="color:var(--text-secondary)">${t("hotel.priceOnRequest","On request")}</span>`}</td>
          <td>
            <button class="badge ${h.showPriceToAgents ? "badge-confirmed" : "badge-pending"}" style="cursor:pointer;border:none" onclick="togglePriceVisibility('${h.id}', ${!h.showPriceToAgents})" title="${h.showPriceToAgents ? t("hotel.hidePrices","Hide Prices") : t("hotel.showPrices","Show Prices")}">${h.showPriceToAgents ? icon("eye") + " " + t("hotel.visible","Visible") : icon("eye-off") + " " + t("hotel.hidden","Hidden")}</button>
          </td>
          <td>${statusBadge(h.isActive ? "ACTIVE" : "INACTIVE")}</td>
          <td><div class="row-actions">
            <button class="icon-button btn-icon" title="${t("btn.view","View")}" onclick="showHotelDetails('${h.id}')">${icon("eye")}</button>
            <button class="icon-button btn-icon" title="${t("btn.edit")}" onclick="showMasterModal('hotels', '${h.id}')">${icon("pencil")}</button>
            <button class="icon-button btn-icon" title="${t("btn.delete")}" onclick="deleteMasterRecord('hotels', '${h.id}')">${icon("trash-2")}</button>
          </div></td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="7" style="text-align:center;padding:32px">${emptyBlock("empty.noData")}</td></tr>`;
}

function refreshHotelsTableOnly() {

async function createMealPlanRow() {

      labelEn,
      labelAr: (document.getElementById("mpNewAr")?.value || "").trim() || null,
      displayOrder: Number(document.getElementById("mpNewOrder")?.value || 0),

async function saveMealPlanRow(id) {
  const tr = document.querySelector(`#mpTbody tr[data-id="${id}"]`);

  const res = await apiFetch(`/meal-plans/${id}`, {
    method: "PATCH",
    body: JSON.stringify({
      labelEn: tr.querySelector(".mp-en")?.value || "",
      labelAr: tr.querySelector(".mp-ar")?.value || null,
      displayOrder: Number(tr.querySelector(".mp-order")?.value || 0),
      isActive: !!tr.querySelector(".mp-active")?.checked,

  if (res?.success) toast(t("mealPlanAdmin.saved", "Meal plan saved"), "success");

}

function heTab(key) {
  document.querySelectorAll(".he-tabbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
  document.querySelectorAll(".he-panel").forEach(p => p.style.display = p.dataset.panel === key ? "" : "none");
  if (key === "pricing") heBindRateTitles();
}

/**
 * Keep each rate row's header in step with what the admin types, so a hotel
 * with a season per market stays readable instead of becoming a wall of
 * identical cards. Bound once per editor.
 */
function heBindRateTitles() {
  const box = document.getElementById("heRatesBox");
  if (!box) return;
  if (!box.dataset.titlesBound) {
    box.dataset.titlesBound = "1";
    box.addEventListener("input", (e) => {
      if (e.target.closest(".he-room, .he-vf, .he-vt")) heSyncRateTitles();
    });
    box.addEventListener("change", (e) => {
      if (e.target.closest(".he-market, .he-vf, .he-vt")) heSyncRateTitles();
    });
  }
  heSyncRateTitles();
}

async function heUploadMain(input) {
  const file = input?.files?.[0];
  input.value = "";
  if (!file) return;
  const btn = document.getElementById("heMainBtn");
  setBtnLoading(btn, true, "btn.uploading");
  const url = await uploadImageToServer(file);
  setBtnLoading(btn, false);
  if (url) { hotelEditor.mainImage = url; heRefreshImages(); }
}
async function heUploadGallery(input) {
  const files = [...(input?.files || [])];
  input.value = "";
  if (!files.length) return;
  const btn = document.getElementById("heGalleryBtn");
  setBtnLoading(btn, true, "btn.uploading");
  // Multi-file endpoint in one request.
  const fd = new FormData();
  files.forEach(f => fd.append("files", f));
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch("/api/upload/images", { method: "POST", headers: { Authorization: `Bearer ${token}` }, body: fd, credentials: "include" });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json?.success) throw new Error(json?.message || "Upload failed");
    (json.data || []).forEach(d => { if (d.url) hotelEditor.gallery.push(d.url); });
    heRefreshImages();
  } catch (err) {
    toast(err.message || t("upload.failed", "Upload failed"), "error");
  } finally {
    setBtnLoading(btn, false);
  }
}
function heRemoveMain() { hotelEditor.mainImage = ""; heRefreshImages(); }
function heSetMain(i) {
  const url = hotelEditor.gallery[i];
  if (!url) return;
  if (hotelEditor.mainImage) hotelEditor.gallery[i] = hotelEditor.mainImage;
  else hotelEditor.gallery.splice(i, 1);
  hotelEditor.mainImage = url;
  heRefreshImages();
}
function heRemoveImage(i) { hotelEditor.gallery.splice(i, 1); heRefreshImages(); }
function heMoveImage(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= hotelEditor.gallery.length) return;
  const tmp = hotelEditor.gallery[i];
  hotelEditor.gallery[i] = hotelEditor.gallery[j];
  hotelEditor.gallery[j] = tmp;
  heRefreshImages();
}

function heAmenityChipsInner() {
  const presets = AMENITY_PRESETS.slice();
  const set = new Set(hotelEditor.amenities);
  const customs = hotelEditor.amenities.filter(a => !presets.includes(a));
  const all = presets.concat(customs);
  return all.map(a => {
    const on = set.has(a);
    return `<label class="he-amenity ${on ? "on" : ""}"><input type="checkbox" ${on ? "checked" : ""} onchange="heToggleAmenity('${escapeHtml(a).replace(/'/g, "\\'")}')" style="display:none">${escapeHtml(a)}</label>`;
  }).join("");
}
function heToggleAmenity(name) {
  const i = hotelEditor.amenities.indexOf(name);
  if (i >= 0) hotelEditor.amenities.splice(i, 1);
  else hotelEditor.amenities.push(name);
  const box = document.getElementById("heAmenityChips");
  if (box) box.innerHTML = heAmenityChipsInner();
}
function heAddCustomAmenity() {
  const el = document.getElementById("heCustomAmenity");
  const v = (el?.value || "").trim();
  if (!v) return;
  if (!hotelEditor.amenities.includes(v)) hotelEditor.amenities.push(v);

  if (box) box.innerHTML = heAmenityChipsInner();

function heAddRate() {

/**
 * Copy a row so a second season or a second market is one click rather than
 * re-typing the room, currency, meal plan and prices. The dates are cleared —
 * a duplicate exists precisely to carry a different period.
 */
function heDuplicateRate(btn) {
  const card = btn.closest(".he-rate");
  if (!card) return;
  const g = sel => card.querySelector(sel);
  const supplements = [...card.querySelectorAll(".he-supp")].map(sc => ({
    name: sc.querySelector(".hs-name")?.value || "",
    type: sc.querySelector(".hs-type")?.value || "TEXT_ONLY",
    amount: sc.querySelector(".hs-amount")?.value === "" ? null : Number(sc.querySelector(".hs-amount")?.value),
    currency: sc.querySelector(".hs-cur")?.value || null,
    notes: sc.querySelector(".hs-notes")?.value || "",
  }));
  const copy = {
    roomName: g(".he-room")?.value || "",
    market: g(".he-market")?.value || "",
    currency: g(".he-cur")?.value || "USD",
    mealPlan: g(".he-meal")?.value || "",
    singlePrice: g(".he-single")?.value === "" ? null : Number(g(".he-single").value),
    doublePrice: g(".he-double")?.value === "" ? null : Number(g(".he-double").value),
    triplePrice: g(".he-triple")?.value === "" ? null : Number(g(".he-triple").value),
    validFrom: "", validTo: "",
    notes: g(".he-rnotes")?.value || "",
    supplements,
  };
  const tmp = document.createElement("div");
  tmp.innerHTML = heRateCardHtml(copy);
  const el = tmp.firstElementChild;
  card.after(el);
  refreshIcons(el);
  heSyncRateTitles();
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.querySelector(".he-vf")?.focus();
}

/** Label each row with room · market · period so a long list stays scannable. */
function heSyncRateTitles() {
  const cards = [...document.querySelectorAll("#heRatesBox .he-rate")];
  cards.forEach((card, i) => {
    const g = sel => card.querySelector(sel);
    const room = (g(".he-room")?.value || "").trim();
    const marketSel = g(".he-market");
    const market = marketSel?.options[marketSel.selectedIndex]?.textContent?.trim() || "";
    const vf = g(".he-vf")?.value || "";
    const vt = g(".he-vt")?.value || "";
    const period = vf || vt ? `${vf || "…"} → ${vt || "…"}` : t("hotel.allYear", "All year");
    const title = card.querySelector(".he-rate-title");
    if (title) title.textContent = `${i + 1}. ${room || t("hotel.roomName", "Room name")} · ${market} · ${period}`;
  });
  const count = document.getElementById("heRatesCount");
  if (count) count.textContent = `${formatNumber(cards.length)} ${t("hotel.rowsCount", "rows")}`;
  heSyncMarketCoverage();
}
function heAddSupp(btn) {
  const box = btn.closest(".he-rate").querySelector(".he-supps");
  const tmp = document.createElement("div");
  tmp.innerHTML = heSuppHtml({});
  box.appendChild(tmp.firstElementChild);
  refreshIcons(box);
}
function heCollectRates() {
  const out = [];
  document.querySelectorAll("#heRatesBox .he-rate").forEach(card => {
    const g = sel => card.querySelector(sel);
    const roomName = (g(".he-room")?.value || "").trim();
    if (!roomName) return;
    const numOrNull = el => (el && el.value !== "" ? Number(el.value) : null);
    const supplements = [...card.querySelectorAll(".he-supp")].map(sr => {
      const sg = sel => sr.querySelector(sel);
      const name = (sg(".hs-name")?.value || "").trim();
      if (!name) return null;
      return {
        name,
        type: sg(".hs-type")?.value || "TEXT_ONLY",
        amount: sg(".hs-amount")?.value !== "" ? Number(sg(".hs-amount").value) : null,
        currency: sg(".hs-cur")?.value || null,
        notes: (sg(".hs-notes")?.value || "").trim() || null,
      };
    }).filter(Boolean);
    out.push({
      roomName,
      market: g(".he-market")?.value || null,
      currency: g(".he-cur")?.value || "USD",
      singlePrice: numOrNull(g(".he-single")),
      doublePrice: numOrNull(g(".he-double")),
      triplePrice: numOrNull(g(".he-triple")),
      mealPlan: g(".he-meal")?.value || null,
      validFrom: g(".he-vf")?.value || null,
      validTo: g(".he-vt")?.value || null,
      isActive: g(".he-ractive")?.checked !== false,
      notes: (g(".he-rnotes")?.value || "").trim() || null,
      supplements,
    });
  });
  return out;
}

async function heSave() {
  const val = id2 => (document.getElementById(id2)?.value ?? "").trim();
  const name = val("heName"), city = val("heCity"), address = val("heAddress");
  if (!name || !city || !address) {
    heTab("basic");
    toast(t("toast.validationError", "Please fill required fields"), "error");
    return;
  }
  const ratingRaw = val("heRating");
  const payload = {
    name, nameAr: val("heNameAr") || null,
    city, cityAr: val("heCityAr") || null,
    area: val("heArea") || null,
    country: val("heCountry") || "EG",
    destinationId: val("heDestinationId") || null,
    address,
    stars: Number(document.getElementById("heStars")?.value || 3),
    googleRating: ratingRaw === "" ? null : Number(ratingRaw),
    pricePerNight: Number(val("hePrice") || 0) || 1,
    currency: document.getElementById("heCurrency")?.value || "USD",
    commissionPercent: Number(val("heCommission") || 0),
    availableRooms: Number(val("heRooms") || 0),
    maxGuestsPerRoom: Number(val("heMaxGuests") || 2),
    minVisibleTier: document.getElementById("heMinTier")?.value || null,
    description: val("heDesc") || null,
    descriptionAr: val("heDescAr") || null,
    isActive: document.getElementById("heActive")?.checked !== false,
    showPriceToAgents: !!document.getElementById("heShowPrice")?.checked,
    allowQuoteRequest: !!document.getElementById("heAllowQuote")?.checked,
    imageUrl: hotelEditor.mainImage || null,
    galleryUrls: hotelEditor.gallery,
    amenities: hotelEditor.amenities,
    // policies
    checkInTime: val("heCheckIn") || null,
    checkOutTime: val("heCheckOut") || null,
    cancellationPolicy: val("heCancel") || null,
    cancellationPolicyAr: val("heCancelAr") || null,
    childrenPolicy: val("heChildren") || null,
    childrenPolicyAr: val("heChildrenAr") || null,
    extraBedPolicy: val("heExtraBed") || null,
    extraBedPolicyAr: val("heExtraBedAr") || null,
    mealPolicy: val("heMeal") || null,
    mealPolicyAr: val("heMealAr") || null,
    importantNotes: val("heNotes") || null,
    importantNotesAr: val("heNotesAr") || null,
  };
  const btn = document.getElementById("heSaveBtn");
  setBtnLoading(btn, true, "btn.saving");
  const editing = !!hotelEditor.id;
  const res = await apiFetch(editing ? `/hotels/${hotelEditor.id}` : "/hotels", {
    method: editing ? "PATCH" : "POST",
    body: JSON.stringify(payload),
  });
  if (!res?.success) { setBtnLoading(btn, false); return; }
  const hotelId = hotelEditor.id || res.data?.id;
  // Save the rate matrix.
  if (hotelId) {
    await apiFetch(`/hotels/${hotelId}/rates`, { method: "PUT", body: JSON.stringify({ rates: heCollectRates() }) }).catch(() => null);
  }
  setBtnLoading(btn, false);
  closeModal();
  toast(editing ? t("toast.updated", "Updated") : t("toast.created", "Created"), "success");
  state.cache.hotelsRows = null;
  renderHotels();
}

async function renderHotels() {
  const capturedToken = state.renderToken;
  state.page = "hotels";

  // Fetch once and cache; subsequent filter changes re-render from cache.
  let rows = state.cache.hotelsRows || [];
  if (!rows.length) {
    content(pageHeader(masterActions("hotels")) + `
      <div class="table-card"><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(7, 8)}</tbody></table></div></div>`);
    const rowsFetched = [];
    let page = 1;
    let pages = 1;
    do {
      const res = await apiFetch(`/hotels?page=${page}&limit=100`);
      if (state.renderToken !== capturedToken) return;
      rowsFetched.push(...(res?.data || []));
      pages = res?.meta?.pages || page;
      page += 1;
    } while (page <= pages);
    if (state.renderToken !== capturedToken) return;
    rows = rowsFetched;
    state.cache.hotelsRows = rows;
  }

  drawHotelsPage(rows);
}

            <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${amenities}${extra}</div>
          </td>

          <td class="numeric">${Number(h.pricePerNight || 0) > 0 ? formatMoney(h.pricePerNight, h.currency) : `<span style="color:var(--text-secondary)">${t("hotel.priceOnRequest","On request")}</span>`}</td>
          <td>
            <button class="badge ${h.showPriceToAgents ? "badge-confirmed" : "badge-pending"}" style="cursor:pointer;border:none" onclick="togglePriceVisibility('${h.id}', ${!h.showPriceToAgents})" title="${h.showPriceToAgents ? t("hotel.hidePrices","Hide Prices") : t("hotel.showPrices","Show Prices")}">${h.showPriceToAgents ? icon("eye") + " " + t("hotel.visible","Visible") : icon("eye-off") + " " + t("hotel.hidden","Hidden")}</button>

            <button class="icon-button btn-icon" title="${t("btn.delete")}" onclick="deleteMasterRecord('hotels', '${h.id}')">${icon("trash-2")}</button>
          </div></td>

  content(pageHeader(masterActions("hotels")) + `

function toggleHotelAmenity(name) {
  if (hotelFilters.amenities.has(name)) hotelFilters.amenities.delete(name);
  else hotelFilters.amenities.add(name);
  drawHotelsPage(state.cache.hotelsRows || []);
}

function resetHotelFilters() {
  hotelFilters.search = ""; hotelFilters.city = ""; hotelFilters.stars = "";

async function addHotelPricingFromDetails(hotelId) {
  const amount = Number(document.getElementById("hotelPriceAmount")?.value || 0);
  const validFrom = document.getElementById("hotelPriceFrom")?.value;
  const validTo = document.getElementById("hotelPriceTo")?.value;
  if (!amount || !validFrom || !validTo) {
    toast(t("toast.validationError"), "error");
    return;
  }
  if (new Date(validTo) < new Date(validFrom)) {
    toast(t("toast.invalidDateRange", "Valid To must be after Valid From"), "error");
    return;
  }
  const payload = {
    roomType: document.getElementById("hotelPriceRoomType")?.value || "STANDARD",
    season: document.getElementById("hotelPriceSeason")?.value || "REGULAR",
    pricePerNight: amount,
    currency: document.getElementById("hotelPriceCurrency")?.value || "USD",
    validFrom,
    validTo,
  };
  const res = await apiFetch(`/hotels/${hotelId}/pricing`, { method: "POST", body: JSON.stringify(payload) });
  if (res?.success) {
    toast(t("toast.created"), "success");
    showHotelDetails(hotelId);
  }
}

async function deleteHotelPricingRecord(hotelId, pricingId) {
  confirmAction(t("modal.confirmDelete"), async () => {
    const res = await apiFetch(`/hotels/pricing/${pricingId}`, { method: "DELETE" });
    if (res?.success) {
      toast(t("toast.deleted"), "success");
      showHotelDetails(hotelId);
    }
  });
}

async function saveHotelCompanyVisibility(hotelId) {
  const companyId = document.getElementById("hotelVisibilityCompany")?.value;
  if (!companyId) {
    toast(t("toast.validationError"), "error");
    return;
  }
  const quoteValue = document.getElementById("hotelVisibilityQuote")?.value || "";
  const payload = {
    companyId,
    canViewPrice: document.getElementById("hotelVisibilityCanView")?.value === "true",
    canRequestQuote: quoteValue === "" ? null : quoteValue === "true",
    note: document.getElementById("hotelVisibilityNote")?.value || "",
  };
  const res = await apiFetch(`/hotels/${hotelId}/company-visibility`, { method: "PUT", body: JSON.stringify(payload) });
  if (res?.success) {
    toast(t("toast.updated"), "success");
    loadHotelCompanyVisibility(hotelId);
  }
}

async function deleteHotelCompanyVisibility(hotelId, companyId) {
  confirmAction(t("modal.confirmDelete"), async () => {
    const res = await apiFetch(`/hotels/${hotelId}/company-visibility/${companyId}`, { method: "DELETE" });
    if (res?.success) {
      toast(t("toast.deleted"), "success");
      loadHotelCompanyVisibility(hotelId);
    }
  });
}

async function togglePriceVisibility(id, show) {
  const res = await apiFetch(`/hotels/${id}/price-visibility`, {
    method: "PATCH",
    body: JSON.stringify({ showPriceToAgents: show }),
  });
  if (res?.success) {
    toast(t(show ? "hotel.pricesNowVisible" : "hotel.pricesNowHidden", show ? "Prices are now visible to agents" : "Prices are now hidden"), "success");
    // Refresh cache so the row reflects the new state.
    state.cache.hotelsRows = null;
    renderHotels();
  }
}

// ── Lifecycle date helpers (Phase 1) ─────────────────────────────────────────
// "Date Requested" uses the explicit requestedAt column (fallback createdAt).
function requestedDate(r) { return formatDate(r.requestedAt || r.createdAt); }
// "Date Confirmed" prefers an explicit confirmation field; falls back to
// updatedAt for legacy confirmed rows; otherwise a clear "Not confirmed" label.
function confirmedDate(r) {
  const explicit = r.confirmedAt || r.approvedAt;
  if (explicit) return formatDate(explicit);
  const s = String(r.status || "").toUpperCase();
  if ((s === "CONFIRMED" || s === "COMPLETED" || s === "APPROVED") && r.updatedAt) return formatDate(r.updatedAt);
  return t("th.notConfirmed", "Not confirmed");
}
// Name of the admin who confirmed (Phase 1 audit), or a dash.
function confirmedByName(r) { return r.confirmedBy?.name ? escapeHtml(r.confirmedBy.name) : "—"; }

function clearConsolidatedSelection() {
  const host = document.getElementById("ciEligibleList");
  if (host) host.innerHTML = `<div class="empty-inline">${t("invoice.loadEligible","Choose a company, then load eligible invoices.")}</div>`;
  const createButton = document.getElementById("ciCreateBtn");
  if (createButton) createButton.disabled = true;
}

function consolidatedFilterParams() {
  const companyId = document.getElementById("ciCompany")?.value || "";
  const params = new URLSearchParams({ companyId });
  const status = document.getElementById("ciStatus")?.value || "";
  const from = document.getElementById("ciFrom")?.value || "";
  const to = document.getElementById("ciTo")?.value || "";
  if (status) params.set("status", status);
  if (from) params.set("from", from);
  if (to) params.set("to", to);
  return params;
}

async function loadEligibleConsolidatedInvoices() {
  const params = consolidatedFilterParams();
  if (!params.get("companyId")) {
    toast(t("toast.validationError","Select a company"), "error");
    return;
  }
  const host = document.getElementById("ciEligibleList");
  const button = document.getElementById("ciLoadBtn");
  setBtnLoading(button, true, "btn.loading");
  if (host) host.innerHTML = skeletonRows(5, 4);
  const res = await apiFetch(`/invoices/consolidated/eligible?${params}`);
  setBtnLoading(button, false);
  const rows = res?.data || [];
  state.cache.consolidatedEligible = rows;
  if (!host) return;
  host.innerHTML = rows.length ? `
    <div class="consolidated-picker__toolbar">
      <label class="check-row"><input type="checkbox" onchange="toggleEligibleInvoices(this.checked)" checked> ${t("btn.selectAll","Select All")}</label>
      <strong>${formatNumber(rows.length)} ${t("invoice.eligible","eligible invoices")}</strong>
    </div>
    <div class="consolidated-picker__list">${rows.map(row => `<label class="consolidated-invoice-option">
      <input type="checkbox" class="ciInvoiceCheck" value="${row.id}" checked onchange="updateConsolidatedCreateState()">
      <span><strong>${escapeHtml(row.invoiceNumber)}</strong><small>${escapeHtml(row.company?.name || "")} · ${escapeHtml(row.summary?.service || row.summary?.refNumber || "Service")}</small></span>
      <span class="numeric">${formatMoney(row.total, row.currency)}</span>
      ${statusBadge(row.status)}
    </label>`).join("")}</div>`
    : `<div class="empty-inline">${t("invoice.noneEligible","No unconsolidated invoices match these filters.")}</div>`;
  updateConsolidatedCreateState();
}

function toggleEligibleInvoices(checked) {
  document.querySelectorAll(".ciInvoiceCheck").forEach(input => { input.checked = checked; });
  updateConsolidatedCreateState();
}

function updateConsolidatedCreateState() {
  const selected = document.querySelectorAll(".ciInvoiceCheck:checked").length;
  const button = document.getElementById("ciCreateBtn");
  if (button) button.disabled = selected === 0;
}

async function createConsolidatedInvoice() {
  const companyId = document.getElementById("ciCompany")?.value || "";
  const invoiceIds = [...document.querySelectorAll(".ciInvoiceCheck:checked")].map(input => input.value);
  if (!companyId || !invoiceIds.length) {
    toast(t("toast.validationError","Select at least one invoice"), "error");
    return;
  }
  const button = document.getElementById("ciCreateBtn");
  setBtnLoading(button, true, "btn.saving");
  const res = await apiFetch("/invoices/consolidated", {
    method: "POST",
    body: JSON.stringify({
      companyId,
      invoiceIds,
      from: document.getElementById("ciFrom")?.value || undefined,
      to: document.getElementById("ciTo")?.value || undefined,
      notes: document.getElementById("ciNotes")?.value.trim() || undefined,
    }),
  });
  setBtnLoading(button, false);
  if (res?.success) {
    closeModal();
    toast(t("toast.created","Consolidated statement created"), "success");
    renderInvoices();
  }
}

async function markInvoicePaid(id) {

  });
}

function actShowTab(tab) {
  ["catalog", "bookings", "packages", "types"].forEach(name => {
    const title = name[0].toUpperCase() + name.slice(1);
    const section = document.getElementById(`act${title}Section`);
    const button = document.getElementById(`actTab${title}`);
    if (section) section.style.display = name === tab ? "" : "none";
    if (button) button.className = name === tab ? "btn btn-primary" : "btn btn-outline";
  });
  if (tab === "bookings") loadAdminActivityBookings();
  if (tab === "packages") loadAdminActivityPackages();
  if (tab === "types") loadAdminGroupTypes("ACTIVITY");
}

// ─────────────────────────────────────────────
// TYPED TRANSPORT RATE EDITOR (endpoints + dual EGP/USD + bidirectional)
// ─────────────────────────────────────────────
/**
 * Is this rate an airport run? Those are the ones whose two directions are
 * commonly priced differently — an arrival includes meet-and-greet and waiting
 * on a delayed flight, a departure does not — so they are the exception to
 * "the reverse costs the same".
 */
/** Which rates the bulk direction action applies to. */
function trToggleRateSelection(id, checked) {
  if (checked) state.selectedTransportRates.add(id);
  else state.selectedTransportRates.delete(id);
  renderTransportRatesTable();
}

function trToggleAllRates(checked) {
  const rates = state.cache.transportRows || [];
  if (checked) rates.forEach(r => state.selectedTransportRates.add(r.id));
  else state.selectedTransportRates.clear();
  renderTransportRatesTable();
}

/** Show the bulk buttons only when there is a selection to act on. */
function trUpdateRatesBulkBar() {
  const count = state.selectedTransportRates.size;
  const label = document.getElementById("trRatesSelectedCount");
  const bidir = document.getElementById("trBulkBidirBtn");
  const oneWay = document.getElementById("trBulkOneWayBtn");
  if (label) {
    label.style.display = count ? "" : "none";
    label.textContent = `${formatNumber(count)} ${t("invoice.selected", "selected")}`;
  }
  if (bidir) bidir.style.display = count ? "" : "none";
  if (oneWay) oneWay.style.display = count ? "" : "none";
  const all = document.getElementById("trRatesSelectAll");
  const rates = state.cache.transportRows || [];
  if (all) all.checked = rates.length > 0 && rates.every(r => state.selectedTransportRates.has(r.id));
}

/**
 * Flip the reverse direction for every selected rate in one call, so a
 * catalogue entered one-way does not have to be reopened row by row.
 */
async function trBulkSetDirection(isBidirectional) {
  const ids = Array.from(state.selectedTransportRates);
  if (!ids.length) return;
  const res = await apiFetch("/transport-rates/bulk-direction", {
    method: "PATCH",
    body: JSON.stringify({ ids, isBidirectional }),
  });
  if (!res?.success) return;
  state.selectedTransportRates.clear();
  toast(
    isBidirectional
      ? `${t("transport.madeBidir", "Now priced in both directions")}: ${formatNumber(res.data.updated)}`
      : `${t("transport.madeOneWay", "Now priced one way only")}: ${formatNumber(res.data.updated)}`,
    "success",
  );
  renderTransport();
}

function trIsAirportShaped(type, serviceMode) {
  return type === "AIRPORT_TRANSFER" || serviceMode === "AIRPORT_TRANSFER";
}

/**
 * Show only the fields the chosen service mode actually uses.
 *
 * A transport product is one of two shapes, and the form used to show both at
 * once: an admin adding an at-disposal package was asked for a From, a To, a
 * bidirectional flag and two round-trip prices, none of which mean anything for
 * a car booked by the hour — which is exactly what made the screen impossible
 * to fill in. Route rates likewise have no service area or duration.
 */
function trSyncModeFields() {
  const mode = document.getElementById("trMode")?.value || "POINT_TO_POINT";
  const isDisposal = mode === "HOURLY_CHARTER" || mode === "DAY_USE";
  document.querySelectorAll('[data-shape="disposal"]').forEach(el => {
    el.style.display = isDisposal ? "" : "none";
  });
  document.querySelectorAll('[data-shape="route"]').forEach(el => {
    el.style.display = isDisposal ? "none" : "";
  });
  const hint = document.getElementById("trModeHint");
  if (hint) {
    hint.textContent = isDisposal
      ? t("transport.modeHintDisposal", "The car stays with the client inside one area for a block of time. Fill in the area and the hours — there is no From/To and no round-trip price, because coming back is already part of the package.")
      : t("transport.modeHintRoute", "A journey from one point to another. Fill in the From and To below; the round-trip price is optional and defaults to twice the one-way.");
  }
}

/**
 * Type or service mode changed while adding a rate: re-apply the direction
 * default, unless the admin already set the box themselves — their choice wins.
 */
function trSyncBidirDefault() {
  const box = document.getElementById("trBidir");
  if (!box || box.dataset.touched === "1" || box.dataset.existing === "1") return;
  const type = document.getElementById("trType")?.value;
  const mode = document.getElementById("trMode")?.value;
  box.checked = !trIsAirportShaped(type, mode);
}

/** Mode or type changed: refresh both the visible fields and the direction default. */
function trModeChanged() {
  trSyncModeFields();
  trSyncBidirDefault();
}

const TR_SERVICE_MODES = ["POINT_TO_POINT", "AIRPORT_TRANSFER", "HOURLY_CHARTER", "DAY_USE"];
const TR_TYPES = ["AIRPORT_TRANSFER", "PRIVATE_TRANSFER", "DAY_TOUR_TRANSPORT", "INTERCITY"];
const TR_VEHICLES = ["SEDAN", "SUV", "VAN_6", "VAN_12", "MINIBUS_20", "BUS_45", "LUXURY_LIMO"];

async function openTransportRateEditor(id = "") {
  const rows = state.cache.transportRows || [];
  const r = id ? (rows.find(x => x.id === id) || {}) : {};
  const [airRes, destRes] = await Promise.all([
    apiFetch("/airports?includeInactive=true"),
    apiFetch("/destinations?limit=300"),
  ]);
  await ensureHotelOptions();
  const airports = airRes?.data || [];
  const destinations = (destRes?.data || []).filter(d => d && d.id);
  const hotels = state.cache.hotelOptions || [];
  // Legacy rates carry a single `rate`/`currency`; surface it in the matching
  // dual-price field so editing preserves the price (and the Save guard passes).
  const legacyCur = String(r.currency || "USD").toUpperCase();
  const egpVal = r.priceEgp != null ? r.priceEgp : (legacyCur === "EGP" ? r.rate : null);
  const usdVal = r.priceUsd != null ? r.priceUsd : (legacyCur === "USD" ? r.rate : null);
  const rtEgpVal = r.roundTripPriceEgp != null ? r.roundTripPriceEgp : (legacyCur === "EGP" ? r.roundTripRate : null);
  const rtUsdVal = r.roundTripPriceUsd != null ? r.roundTripPriceUsd : (legacyCur === "USD" ? r.roundTripRate : null);

  // optLabel lets a dropdown show a human phrase instead of the raw enum name
  // (service modes especially — "HOURLY CHARTER" means nothing to an operator,
  // least of all in Arabic).
  const sel = (id2, opts, val, label, optLabel, onChange) => `<div class="form-field"><label>${label}</label><select id="${id2}"${onChange ? ` onchange="${onChange}"` : ""}>${opts.map(o => `<option value="${o}" ${o === val ? "selected" : ""}>${escapeHtml(optLabel ? optLabel(o) : String(o).replace(/_/g, " "))}</option>`).join("")}</select></div>`;
  const serviceModeLabel = (m) => t(`serviceMode.${m}`, String(m).replace(/_/g, " "));

  // A rate prices one direction only unless it is flagged bidirectional, which
  // is why "Cairo → Sahel" used to leave "Sahel → Cairo" unpriced. A new
  // city-to-city transfer is almost always symmetric, so it starts ticked;
  // an airport transfer does not, because an arrival carries meet-and-greet and
  // waiting time that a departure does not. An existing rate always shows what
  // was actually saved.
  const isNewRate = !id;
  const trBidirDefault = isNewRate ? !trIsAirportShaped(r.type, r.serviceMode) : !!r.isBidirectional;
  const num = (id2, val, label, ph = "") => `<div class="form-field"><label>${label}</label><input id="${id2}" type="number" step="0.01" min="0" value="${val != null ? escapeHtml(val) : ""}" placeholder="${escapeHtml(ph)}"></div>`;
  const txt = (id2, val, label, ph = "") => `<div class="form-field"><label>${label}</label><input id="${id2}" value="${escapeHtml(val ?? "")}" placeholder="${escapeHtml(ph)}"></div>`;

  const body = `
    <div class="form-section">
      <div class="form-section-title">${t("transport.service", "Service")}</div>
      <div class="form-grid">
        ${sel("trType", TR_TYPES, r.type || "PRIVATE_TRANSFER", t("th.type", "Type"), null, "trModeChanged()")}
        ${sel("trMode", TR_SERVICE_MODES, r.serviceMode || "POINT_TO_POINT", t("transport.mode", "Service mode"), serviceModeLabel, "trModeChanged()")}
        ${sel("trVehicle", TR_VEHICLES, r.vehicleType || "SEDAN", t("form.vehicleType", "Vehicle"))}
      </div>
      <div class="secondary-text" id="trModeHint" style="margin:6px 0 12px"></div>
      <!-- At-disposal only: the car stays in an area for a block of time. -->
      <div class="form-grid" data-shape="disposal">
        ${txt("trServiceArea", r.serviceArea, t("transport.serviceAreaReq", "Area the car stays in (e.g. Cairo)"))}
        ${num("trDuration", r.durationHours, t("transport.durationHoursReq", "Hours the car is at disposal"))}
      </div>
      <div class="form-grid">
        ${txt("trCity", r.city, t("th.city", "City"))}
        ${txt("trServiceNameEn", r.serviceNameEn, t("transport.serviceNameEn", "Service name (EN)"))}
        ${txt("trServiceNameAr", r.serviceNameAr, t("transport.serviceNameAr", "Service name (AR)"))}
      </div>
    </div>
    <div class="form-section" data-shape="route">
      <div class="form-section-title">${t("transport.route", "Route (typed endpoints)")}</div>
      <div class="tr-ep-grid" style="gap:14px">
        ${trEpBlock("from", r, airports, destinations, hotels, t("form.from", "From"))}
        ${trEpBlock("to", r, airports, destinations, hotels, t("form.to", "To"))}
      </div>
      <label class="check-row" style="margin-top:12px"><input id="trBidir" type="checkbox" ${trBidirDefault ? "checked" : ""} ${isNewRate ? "" : 'data-existing="1"'} onchange="this.dataset.touched='1'"> ${t("transport.bidirectional", "Bidirectional — also prices the reverse route (B → A) at the same price")}</label>
      <div class="secondary-text" id="trBidirHint" style="margin-top:4px">${t("transport.bidirAirportHint", "Left on for a normal city-to-city transfer, which usually costs the same both ways. Airport transfers start off, because an arrival often costs more than a departure — tick it yourself when the two directions are priced alike.")}</div>
    </div>
    <div class="form-section">
      <div class="form-section-title">${t("transport.pricingDual", "Pricing (explicit, no FX — Egyptian sees EGP, others USD)")}</div>
      <div class="form-grid" style="grid-template-columns:repeat(4,1fr)">
        ${num("trPriceEgp", egpVal, t("transport.priceEgp", "One-way EGP"))}
        ${num("trPriceUsd", usdVal, t("transport.priceUsd", "One-way USD"))}
        <div class="form-field" data-shape="route"><label>${t("transport.rtEgp", "Round-trip EGP")}</label><input id="trRtEgp" type="number" step="0.01" min="0" value="${rtEgpVal != null ? escapeHtml(rtEgpVal) : ""}"></div>
        <div class="form-field" data-shape="route"><label>${t("transport.rtUsd", "Round-trip USD")}</label><input id="trRtUsd" type="number" step="0.01" min="0" value="${rtUsdVal != null ? escapeHtml(rtUsdVal) : ""}"></div>
        ${num("trMinCap", r.minCapacity ?? 1, t("form.minPax", "Min pax"))}
        ${num("trMaxCap", r.maxCapacity, t("form.maxPax", "Max pax (blank = no limit)"))}
      </div>
      <div class="secondary-text" style="margin-top:6px">${t("transport.priceHint", "Leave a currency blank to show 'Price on request' for that market. Round-trip blank = 2 × one-way.")}</div>
    </div>
    <div class="form-section">
      <div class="form-grid"><div class="form-field full"><label>${t("placeholder.notes", "Notes")}</label><textarea id="trNotes" rows="2">${escapeHtml(r.notes || "")}</textarea></div></div>
      <label class="check-row"><input id="trActive" type="checkbox" ${r.id ? (r.isActive ? "checked" : "") : "checked"}> ${t("form.active", "Active")}</label>
    </div>`;

  openModal(`${id ? t("btn.edit", "Edit") : t("btn.addNew", "Add")} ${t("nav.transport", "Transport Rate")}`, body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel", "Cancel")}</button>
    <button class="btn btn-primary" id="trSaveBtn" onclick="saveTransportRateEditor('${id}')">${icon("save")}${t("btn.save", "Save")}</button>
  `);
  trEpInit("from");
  trEpInit("to");
  // Show only the fields this service mode uses, before the admin sees the form.
  trSyncModeFields();
}

function trEpBlock(side, r, airports, destinations, hotels, label) {
  const curType = r[`${side}Type`] || "";
  const curId = r[`${side}Id`] || "";
  const opt = (arr, getName) => arr.map(a => `<option value="${a.id}" data-name="${escapeHtml(getName(a))}" ${curId === a.id ? "selected" : ""}>${escapeHtml(getName(a))}</option>`).join("");
  const airOpts = `<option value="">—</option>` + opt(airports, a => `${a.code} · ${a.nameEn}`);
  const destOpts = `<option value="">—</option>` + opt(destinations, d => d.name);
  const hotOpts = `<option value="">—</option>` + opt(hotels, h => `${h.name}${h.city ? " (" + h.city + ")" : ""}`);
  return `<div class="tr-ep" data-side="${side}">
    <label style="font-weight:600;font-size:13px">${label}</label>
    <div class="form-field" style="margin-top:6px"><label>${t("transport.endpointType", "Type")}</label>
      <select class="tr-ep-type" onchange="trEpTypeChange('${side}')">
        <option value="" ${!curType ? "selected" : ""}>— ${t("transport.endpointType", "Type")} —</option>
        <option value="AIRPORT" ${curType === "AIRPORT" ? "selected" : ""}>${t("transport.airport", "Airport")}</option>
        <option value="HOTEL" ${curType === "HOTEL" ? "selected" : ""}>${t("transport.hotel", "Hotel")}</option>
        <option value="DESTINATION" ${curType === "DESTINATION" ? "selected" : ""}>${t("transport.destination", "Destination")}</option>
      </select>
    </div>
    <div class="form-field tr-ep-pick" data-kind="AIRPORT" style="display:none"><label>${t("transport.airport", "Airport")}</label><select class="tr-ep-airport">${airOpts}</select></div>
    <div class="form-field tr-ep-pick" data-kind="DESTINATION" style="display:none"><label>${t("transport.destination", "Destination")}</label><select class="tr-ep-dest">${destOpts}</select></div>
    <div class="form-field tr-ep-pick" data-kind="HOTEL" style="display:none"><label>${t("transport.hotel", "Hotel")}</label><select class="tr-ep-hotel">${hotOpts}</select></div>
    <div class="form-field"><label>${t("transport.endpointName", "Display name (optional override)")}</label><input class="tr-ep-name" value="${escapeHtml(r[`${side}Name`] || r[`${side}Location`] || "")}" placeholder="${escapeHtml(t("transport.endpointNamePh", "Auto from selection, or type a name"))}"></div>
  </div>`;
}
function trEpTypeChange(side) {
  const ep = document.querySelector(`.tr-ep[data-side="${side}"]`);
  if (!ep) return;
  const type = ep.querySelector(".tr-ep-type").value;
  ep.querySelectorAll(".tr-ep-pick").forEach(p => p.style.display = p.dataset.kind === type ? "" : "none");
}
function trEpInit(side) { trEpTypeChange(side); }
function trCollectEp(side) {
  const ep = document.querySelector(`.tr-ep[data-side="${side}"]`);
  if (!ep) return { type: null, id: null, name: null };
  const type = ep.querySelector(".tr-ep-type").value || null;
  let id = null, name = null;
  if (type === "AIRPORT") { const s = ep.querySelector(".tr-ep-airport"); id = s.value || null; name = s.selectedOptions[0]?.dataset.name || null; }
  else if (type === "DESTINATION") { const s = ep.querySelector(".tr-ep-dest"); id = s.value || null; name = s.selectedOptions[0]?.dataset.name || null; }
  else if (type === "HOTEL") { const s = ep.querySelector(".tr-ep-hotel"); id = s.value || null; name = s.selectedOptions[0]?.dataset.name || null; }
  const typed = (ep.querySelector(".tr-ep-name")?.value || "").trim();
  if (typed) name = typed;
  return { type, id: id || null, name: name || null };
}
async function saveTransportRateEditor(id = "") {
  const from = trCollectEp("from");
  const to = trCollectEp("to");
  const v = id2 => document.getElementById(id2)?.value;
  const numOrNull = id2 => { const x = v(id2); return x === "" || x == null ? null : Number(x); };
  const payload = {
    type: v("trType"), serviceMode: v("trMode"), vehicleType: v("trVehicle"),
    serviceArea: v("trServiceArea") || null, durationHours: numOrNull("trDuration"),
    city: v("trCity") || null, serviceNameEn: v("trServiceNameEn") || null, serviceNameAr: v("trServiceNameAr") || null,
    fromType: from.type, fromId: from.id, fromName: from.name,
    toType: to.type, toId: to.id, toName: to.name,
    isBidirectional: !!document.getElementById("trBidir")?.checked,
    priceEgp: numOrNull("trPriceEgp"), priceUsd: numOrNull("trPriceUsd"),
    roundTripPriceEgp: numOrNull("trRtEgp"), roundTripPriceUsd: numOrNull("trRtUsd"),
    minCapacity: numOrNull("trMinCap") ?? 1, maxCapacity: numOrNull("trMaxCap"),
    notes: v("trNotes") || null, isActive: document.getElementById("trActive")?.checked !== false,
  };
  if (payload.priceEgp == null && payload.priceUsd == null) {
    toast(t("transport.needPrice", "Enter at least an EGP or USD price."), "error");
    return;
  }
  const btn = document.getElementById("trSaveBtn");
  setBtnLoading(btn, true, "btn.saving");
  const res = await apiFetch(id ? `/transport-rates/${id}` : "/transport-rates", {
    method: id ? "PATCH" : "POST",
    body: JSON.stringify(payload),
  });
  setBtnLoading(btn, false);
  if (res?.success) {
    closeModal();
    toast(id ? t("toast.updated", "Updated") : t("toast.created", "Created"), "success");
    renderTransport();
  }
}

async function saveAirport(id = "") {
  const code = (document.getElementById("apCode")?.value || "").trim();
  const nameEn = (document.getElementById("apNameEn")?.value || "").trim();
  if (!code || !nameEn) { toast(t("toast.validationError", "Code and name are required"), "error"); return; }
  const payload = {
