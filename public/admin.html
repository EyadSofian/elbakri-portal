let rfbDraft = null;        // editable template
let rfbTemplateId = null;   // id when editing an existing template
let rfbTarget = "hotel_request";

async function renderRequestFormBuilder() {
  state.page = "request-forms";
  const captured = state.renderToken;
  // The built-in defaults read both lists straight out of the cache, so a form
  // opened before any other page filled them would offer empty dropdowns.
  await Promise.all([ensureAirportOptions(), ensureSecurityDestinations()]);
  content(pageHeader() + `
    <section class="panel" style="margin-bottom:16px">
      <div class="panel-body" style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
        <div class="form-field" style="min-width:260px;margin:0">
          <label>${t("rfBuilder.targetForm","Target Form")}</label>
          <select id="rfbTarget" onchange="rfbLoadTarget(this.value)">
            ${RF_TARGETS.map(x => `<option value="${x.value}" ${x.value===rfbTarget?"selected":""}>${x.label}</option>`).join("")}
          </select>
        </div>
        <div id="rfbStatusChip"></div>
        <div style="flex:1"></div>
        <button class="btn btn-outline" onclick="rfbResetDefault()">${icon("rotate-ccw")}&nbsp;${t("rfBuilder.loadDefault","Load Default Fields")}</button>
      </div>
    </section>
    <div id="rfbEditorArea"><div class="skeleton" style="height:300px"></div></div>`);
  await rfbLoadTarget(rfbTarget, captured);
}

async function rfbLoadTarget(target, captured) {
  rfbTarget = target;
  const res = await apiFetch(`/admin/ui-templates?target=${encodeURIComponent(target)}`);
  if (captured != null && state.renderToken !== captured) return;
  const templates = (res && res.data) || [];
  // Only consider form-shaped templates (config.fields[]); ignore legacy block templates.
  const existing = templates.find(x => x.config && Array.isArray(x.config.fields) && x.isActive)
                || templates.find(x => x.config && Array.isArray(x.config.fields))
                || null;
  if (existing) {
    rfbTemplateId = existing.id;
    rfbDraft = JSON.parse(JSON.stringify(existing));
    rfbDraft.config = rfbDraft.config || {};
    if (!Array.isArray(rfbDraft.config.fields)) rfbDraft.config.fields = [];
  } else {
    const meta = RF_TARGETS.find(x => x.value === target) || { label: target };
    rfbTemplateId = null;
    rfbDraft = {
      id: null,
      key: target.replace(/_/g, "-") + "-form",
      name: meta.label + " Form",
      target,
      langMode: "both",
      isActive: false,
      config: { title: meta.label, titleAr: "", fields: RF_DEFAULTS[target] ? RF_DEFAULTS[target]() : [] },
    };
  }
  rfbRenderEditor();
}

function rfbResetDefault() {
  if (!confirm(t("rfBuilder.confirmDefault", "Replace the fields below with the built-in defaults?"))) return;
  rfbDraft.config.fields = RF_DEFAULTS[rfbTarget] ? RF_DEFAULTS[rfbTarget]() : [];
  rfbRenderEditor();
}

function rfbRenderEditor() {
  const area = document.getElementById("rfbEditorArea");
  if (!area) return;

          <div class="form-field"><label>${t("rfBuilder.titleEn", "Form Title (EN)")}</label><input value="${escapeHtml(rfbDraft.config.title || "")}" oninput="rfbDraft.config.title=this.value;rfbRenderPreview()"></div>
          <div class="form-field"><label>${t("rfBuilder.titleAr", "Form Title (AR)")}</label><input dir="rtl" value="${escapeHtml(rfbDraft.config.titleAr || "")}" oninput="rfbDraft.config.titleAr=this.value;rfbRenderPreview()"></div>
        </div>
        <div id="rfbFieldList"></div>
      </div>
      <div class="rfb-col">
        <div class="rfb-col-head"><strong>${t("rfBuilder.customerPreview", "Customer Preview")}</strong></div>

  rfbRenderFieldList();
  rfbRenderPreview();
  refreshIcons(area);

function rfbRenderFieldList() {
  const el = document.getElementById("rfbFieldList");
  if (!el) return;
  const fields = rfbDraft.config.fields;
  el.innerHTML = fields.length
    ? fields.map((f, i) => rfbFieldCard(f, i)).join("")
    : `<div class="empty-state" style="padding:20px">${t("rfBuilder.noFields", "No fields yet — click Add Field")}</div>`;
  refreshIcons(el);
}

function rfbFieldCard(f, i) {
  const isSelect = RF_SELECT_TYPES.includes(f.type) || f.type === "meal-plan-select";
  const isNum = RF_NUM_TYPES.includes(f.type);
  const last = i === rfbDraft.config.fields.length - 1;
  return `
  <div class="rfb-field${f.visible === false ? " rfb-field--hidden" : ""}">
    <div class="rfb-field-head">
      <span class="rfb-grip">${icon("grip-vertical")}</span>
      <strong>${escapeHtml(f.label || f.key)}</strong>
      <span class="badge badge-outline">${escapeHtml(f.type)}</span>
      <div class="rfb-field-actions">
        <button class="icon-button btn-icon" onclick="rfbMove(${i},-1)" ${i === 0 ? "disabled" : ""}>${icon("chevron-up")}</button>
        <button class="icon-button btn-icon" onclick="rfbMove(${i},1)" ${last ? "disabled" : ""}>${icon("chevron-down")}</button>
        <button class="icon-button btn-icon" title="${f.visible === false ? t("rfBuilder.show", "Show") : t("rfBuilder.hide", "Hide")}" onclick="rfbSet(${i},'visible',${f.visible === false})">${icon(f.visible === false ? "eye-off" : "eye")}</button>
        <button class="icon-button btn-icon" onclick="rfbRemove(${i})">${icon("trash-2")}</button>
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div class="form-field"><label>${t("rfBuilder.key", "Key")}</label><input value="${escapeHtml(f.key || "")}" oninput="rfbSet(${i},'key',this.value)"></div>
      <div class="form-field"><label>${t("rfBuilder.type", "Type")}</label><select onchange="rfbSet(${i},'type',this.value)">${RF_FIELD_TYPES.map(tp => `<option value="${tp}" ${f.type === tp ? "selected" : ""}>${tp}</option>`).join("")}</select></div>
      <div class="form-field"><label>${t("rfBuilder.labelEn", "Label (EN)")}</label><input value="${escapeHtml(f.label || "")}" oninput="rfbSet(${i},'label',this.value)"></div>
      <div class="form-field"><label>${t("rfBuilder.labelAr", "Label (AR)")}</label><input dir="rtl" value="${escapeHtml(f.labelAr || "")}" oninput="rfbSet(${i},'labelAr',this.value)"></div>
      <div class="form-field"><label>${t("rfBuilder.phEn", "Placeholder (EN)")}</label><input value="${escapeHtml(f.placeholder || "")}" oninput="rfbSet(${i},'placeholder',this.value)"></div>
      <div class="form-field"><label>${t("rfBuilder.phAr", "Placeholder (AR)")}</label><input dir="rtl" value="${escapeHtml(f.placeholderAr || "")}" oninput="rfbSet(${i},'placeholderAr',this.value)"></div>
      <div class="form-field"><label>${t("rfBuilder.icon", "Icon")}</label><select onchange="rfbSet(${i},'icon',this.value)"><option value="">—</option>${UI_ICONS.map(ic => `<option value="${ic}" ${f.icon === ic ? "selected" : ""}>${ic}</option>`).join("")}</select></div>
      <div class="form-field"><label>${t("rfBuilder.width", "Width")}</label><select onchange="rfbSet(${i},'width',this.value)"><option value="half" ${f.width !== "full" ? "selected" : ""}>Half</option><option value="full" ${f.width === "full" ? "selected" : ""}>Full</option></select></div>
      ${isNum ? `<div class="form-field"><label>${t("rfBuilder.min", "Min")}</label><input type="number" value="${f.min ?? ""}" oninput="rfbSetNum(${i},'min',this.value)"></div>
      <div class="form-field"><label>${t("rfBuilder.max", "Max")}</label><input type="number" value="${f.max ?? ""}" oninput="rfbSetNum(${i},'max',this.value)"></div>` : ""}
      ${isSelect ? `<div class="form-field full"><label>${t("rfBuilder.options", "Options — value | label | labelAr per line")}</label><textarea rows="3" oninput="rfbSetOptions(${i},this.value)" placeholder="value | Label | تسمية">${escapeHtml((f.options || []).map(o => [o.value, o.label, o.labelAr].filter(v => v != null && v !== "").join(" | ")).join("\n"))}</textarea></div>` : ""}
      <div class="form-field"><label class="check-row" style="margin-top:18px"><input type="checkbox" ${f.required ? "checked" : ""} onchange="rfbSet(${i},'required',this.checked)"> ${t("rfBuilder.required", "Required")}</label></div>
      <div class="form-field"><label class="check-row" style="margin-top:18px"><input type="checkbox" ${f.visible !== false ? "checked" : ""} onchange="rfbSet(${i},'visible',this.checked)"> ${t("rfBuilder.visible", "Visible")}</label></div>
    </div>
  </div>`;
}

function rfbSet(i, key, val) {
  rfbDraft.config.fields[i][key] = val;
  if (key === "type" || key === "label" || key === "visible") rfbRenderFieldList();
  rfbRenderPreview();
}
function rfbSetNum(i, key, val) {
  const n = parseFloat(val);
  rfbDraft.config.fields[i][key] = (val === "" || isNaN(n)) ? undefined : n;
  rfbRenderPreview();
}
function rfbSetOptions(i, text) {
  rfbDraft.config.fields[i].options = text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
    const [value, label, labelAr] = line.split("|").map(s => (s || "").trim());
    const o = { value: value || "", label: label || value || "" };
    if (labelAr) o.labelAr = labelAr;
    return o;
  });
  rfbRenderPreview();
}
function rfbAddField() {
  rfbDraft.config.fields.push(rfbField({ key: "field_" + Math.random().toString(36).slice(2, 6), type: "text", label: "New Field", order: rfbDraft.config.fields.length + 1 }));
  rfbRenderFieldList();
  rfbRenderPreview();
}
function rfbMove(i, dir) {
  const a = rfbDraft.config.fields, j = i + dir;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  a.forEach((f, idx) => f.order = idx + 1);
  rfbRenderFieldList();
  rfbRenderPreview();
}
function rfbRemove(i) {
  rfbDraft.config.fields.splice(i, 1);
  rfbDraft.config.fields.forEach((f, idx) => f.order = idx + 1);
  rfbRenderFieldList();
  rfbRenderPreview();
}

function rfbRenderPreview() {
  const el = document.getElementById("rfbPreview");
  if (!el) return;
  const isAr = (localStorage.getItem("lang") || "en") === "ar";
  const title = (isAr && rfbDraft.config.titleAr) ? rfbDraft.config.titleAr : (rfbDraft.config.title || rfbDraft.name || "Request Form");
  const fields = (rfbDraft.config.fields || []).filter(f => f.visible !== false).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  el.innerHTML = `
    <div class="rfb-preview-modal">
      <div class="rfb-preview-title">${escapeHtml(title)}</div>
      <div class="form-grid">
        ${fields.map(f => rfbPreviewCell(f, isAr)).join("") || `<div class="secondary-text">${t("rfBuilder.noVisible", "No visible fields")}</div>`}
      </div>
      <div class="rfb-preview-actions">
        <button class="btn btn-outline btn-sm" disabled>${t("btn.cancel", "Cancel")}</button>
        <button class="btn btn-primary btn-sm" disabled>${icon("send")}&nbsp;${t("btn.sendRequest", "Send Request")}</button>
      </div>
    </div>`;
  refreshIcons(el);
}

function rfbPreviewCell(f, isAr) {
  const fullTypes = ["textarea", "child-age-repeater", "readonly-service", "readonly-price", "file-upload", "image-upload"];
  const full = f.width === "full" || (!f.width && fullTypes.includes(f.type));
  const labelTxt = (isAr && f.labelAr) ? f.labelAr : (f.label || f.key);
  const lbl = escapeHtml(labelTxt) + (f.required ? ` <span class="required">*</span>` : "");
  const ph = escapeHtml((isAr && f.placeholderAr) ? f.placeholderAr : (f.placeholder || ""));
  let ctrl;
  switch (f.type) {
    case "textarea": ctrl = `<textarea rows="2" placeholder="${ph}" disabled></textarea>`; break;
    case "readonly-service": ctrl = `<input value="${escapeHtml(t("rfBuilder.selectedService", "Selected service"))}" disabled style="opacity:.7">`; break;
    case "readonly-price": ctrl = `<div class="rf-price">—</div>`; break;
    case "select": case "searchable-select": case "meal-plan-select": {
      const opts = f.type === "meal-plan-select" ? ["Room Only", "Breakfast", "Half Board", "Full Board"] : (f.options || []).map(o => (isAr && o.labelAr) ? o.labelAr : (o.label || o.value));
      ctrl = `<select disabled><option>${ph || t("form.select", "Select")}</option>${opts.map(o => `<option>${escapeHtml(o)}</option>`).join("")}</select>`; break;
    }
    case "nationality-select": ctrl = `<input placeholder="${ph || "e.g. Egyptian"}" disabled>`; break;
    case "child-count": case "number": case "pax-counter": case "room-counter": ctrl = `<input type="number" placeholder="${ph}" disabled>`; break;
    case "child-age-repeater": ctrl = `<div class="secondary-text" style="font-size:11px">${t("rfBuilder.childAgesNote", "Child age inputs appear based on children count")}</div>`; break;
    case "date": ctrl = `<input type="date" disabled>`; break;
    case "time": ctrl = `<input type="time" disabled>`; break;
    case "datetime": ctrl = `<input type="datetime-local" disabled>`; break;
    case "checkbox": case "toggle": return `<div class="form-field${full ? " full" : ""}"><label class="check-row"><input type="checkbox" disabled> ${escapeHtml(labelTxt)}</label></div>`;
    case "file-upload": case "image-upload": ctrl = `<input type="file" disabled>`; break;
    default: ctrl = `<input type="text" placeholder="${ph}" disabled>`;
  }
  return `<div class="form-field${full ? " full" : ""}"><label>${lbl}</label>${ctrl}</div>`;
}

async function rfbSave(activate) {
  const fields = rfbDraft.config.fields || [];
  const keys = fields.map(f => (f.key || "").trim());
  if (keys.some(k => !k)) { toast(t("rfBuilder.errKey", "Every field needs a key"), "error"); return; }
  if (keys.some(k => !/^[a-zA-Z0-9_]+$/.test(k))) { toast(t("rfBuilder.errKeyChars", "Keys allow letters, numbers and underscore only"), "error"); return; }
  if (new Set(keys).size !== keys.length) { toast(t("rfBuilder.errDup", "Field keys must be unique"), "error"); return; }
  fields.forEach((f, idx) => f.order = idx + 1);

  const payload = {
    key: rfbDraft.key, name: rfbDraft.name, target: rfbDraft.target,
    langMode: rfbDraft.langMode || "both", isActive: activate,
    config: { title: rfbDraft.config.title || "", titleAr: rfbDraft.config.titleAr || "", fields },
  };

  let res;
  if (rfbTemplateId) {
    res = await apiFetch(`/admin/ui-templates/${rfbTemplateId}`, { method: "PATCH", body: JSON.stringify(payload) });
  } else {
    res = await apiFetch(`/admin/ui-templates`, { method: "POST", body: JSON.stringify(payload) });
    if (!res?.success && /key already exists/i.test(res?.message || "")) {
      payload.key = rfbDraft.key + "-" + Date.now().toString(36);
      res = await apiFetch(`/admin/ui-templates`, { method: "POST", body: JSON.stringify(payload) });
    }
  }
  if (res?.success) {
    rfbTemplateId = res.data.id;
    if (activate) await apiFetch(`/admin/ui-templates/${res.data.id}/activate`, { method: "POST" });
    toast(activate ? t("rfBuilder.activated", "Form activated") : t("toast.saved", "Saved"), "success");
    rfbLoadTarget(rfbTarget);
  } else if (res?.message) {
    toast(res.message, "error");
  }
}

async function rfbDelete() {
  if (!rfbTemplateId) return;
  if (!confirm(t("rfBuilder.confirmDelete", "Delete this form template? The form reverts to its built-in default."))) return;
  const res = await apiFetch(`/admin/ui-templates/${rfbTemplateId}`, { method: "DELETE" });
  if (res?.success) { toast(t("toast.deleted", "Deleted"), "success"); rfbTemplateId = null; rfbLoadTarget(rfbTarget); }
}

// ─── Generic SSE-over-fetch reader ──────────────────────────────────────────
async function bkStream(path, body, onEvent) {
  const controller = new AbortController();
  bkRun.controller = controller; bkRun.running = true;
  try {
    const res = await fetch("/api" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${localStorage.getItem("accessToken")}` },
      body: JSON.stringify(body), signal: controller.signal,
    });
    if (!res.ok) { toast("Server error " + res.status, "error"); return; }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n"); buf = parts.pop() || "";
      for (const chunk of parts) {
        let et = "message", ed = "";
        chunk.split("\n").forEach(l => { if (l.startsWith("event: ")) et = l.slice(7).trim(); if (l.startsWith("data: ")) ed = l.slice(6).trim(); });
        if (ed) { try { onEvent(et, JSON.parse(ed)); } catch (e) {} }
      }
    }
  } catch (err) {
    if (!String(err.message || "").includes("abort")) toast("Connection error: " + err.message, "error");
  } finally {
    bkRun.running = false; bkRun.controller = null;
  }
}
function bkStop() { if (bkRun.controller) bkRun.controller.abort(); bkRun.running = false; }
function bkProgress(id, pct) { const f = document.getElementById(id); if (f) f.style.width = Math.min(100, Math.round(pct)) + "%"; }
function bkFeed(id, type, msg) {
  const feed = document.getElementById(id); if (!feed) return;
  const div = document.createElement("div");
  div.className = "enrich-feed-row";
  div.innerHTML = `<span class="enrich-feed-msg">${escapeHtml(String(msg || ""))}</span>`;
  feed.appendChild(div); feed.scrollTop = feed.scrollHeight;
}

function bkSetStat(prefix, k, v) { const el = document.getElementById(prefix + k); if (el) el.textContent = String(v); }

function bkDiscoverEvent(type, d, stats) {
  if (type === "init") { stats.total = d.total || 0; bkSetStat("bkS_", "total", stats.total); bkFeed("bkDiscoverFeed", "info", `${d.city} — ${d.total} hotels · ${d.candidates} candidates · ${d.mode}`); return; }
  if (type === "candidates") { bkFeed("bkDiscoverFeed", "info", `Fetched ${d.fetched} Booking properties (${d.withId} with usable IDs)`); return; }
  if (type === "done") {
    stats.auto = d.matched||0; stats.manual = d.manual||0; stats.applied = d.applied||0; stats.errors = d.errors||0;
    ["auto","manual","applied","errors"].forEach(k=>bkSetStat("bkS_",k,stats[k]));
    bkProgress("bkDiscoverFill", 100);
    bkFeed("bkDiscoverFeed","done",`Done — auto ${d.matched}, manual ${d.manual}, applied ${d.applied}, skipped ${d.skipped}, errors ${d.errors}`);
    toast(`Discovery complete — ${d.matched} auto, ${d.manual} manual`, "success");
    return;
  }
  if (type === "quota") { bkFeed("bkDiscoverFeed","quota", d.message); toast("Apify quota/auth issue", "error"); return; }
  if (type === "error") { bkFeed("bkDiscoverFeed","error", d.message || "Error"); toast(d.message || "Error", "error"); return; }
  if (type === "hotel") {
    const pct = d.total > 0 ? (d.i / d.total) * 100 : 0; bkProgress("bkDiscoverFill", pct);
    if (d.status === "auto") { stats.auto++; bkSetStat("bkS_","auto",stats.auto); }
    if (d.status === "manual") { stats.manual++; bkSetStat("bkS_","manual",stats.manual); }
    if (d.apply && (d.status === "auto" || d.status === "manual")) { stats.applied++; bkSetStat("bkS_","applied",stats.applied); }
    const meta = BK_STATUS[d.status] || BK_STATUS.missing;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="numeric" style="color:var(--text-muted)">${d.i}</td>
      <td><span class="primary-text">${escapeHtml(d.name)}</span></td>
      <td><span style="color:var(--text-secondary)">${escapeHtml(d.matched||"—")}</span></td>
      <td class="numeric">${d.bookingHotelId ? escapeHtml(d.bookingHotelId) : "—"}</td>
      <td class="numeric">${d.score ?? "—"}</td>
      <td><span class="badge ${meta.badge}">${meta.label}</span></td>`;
    document.getElementById("bkDiscoverBody")?.appendChild(tr);
  }
}

async function bkLoadMatches() {
  const city = bkCity(); if (!city) return;
  bkSelected = new Set();
  const res = await apiFetch(`/admin/enrich/booking-matches?city=${encodeURIComponent(city)}`);
  bkMatches = res?.data || [];
  bkRenderMatchRows("all");
}

function bkScoreBadge(s) {
  if (s == null) return "—";
  const cls = s >= bkMeta.thresholds.auto ? "badge-confirmed" : s >= bkMeta.thresholds.review ? "badge-pending" : "badge-cancelled";
  return `<span class="badge ${cls}">${s.toFixed(2)}</span>`;
}

function bkRenderMatchRows(filter) {
  const tbody = document.getElementById("bkReviewBody"); if (!tbody) return;
  const rows = bkMatches.filter(m => filter === "all" || m.status === filter);
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:24px">No hotels in this filter.</td></tr>`; return; }
  tbody.innerHTML = rows.map(m => {
    const meta = BK_STATUS[m.status] || BK_STATUS.missing;
    const checked = bkSelected.has(m.id) ? "checked" : "";
    const approve = m.status === "manual" ? `<button class="icon-button btn-icon" title="Approve" onclick="bkMatchAction('${m.id}','approve')">${icon("check")}</button>` : "";
    const reject = m.bookingHotelId ? `<button class="icon-button btn-icon" title="Reject (clear ID)" onclick="bkMatchAction('${m.id}','reject')">${icon("x")}</button>` : "";
    return `<tr data-status="${m.status}">
      <td><input type="checkbox" ${checked} onchange="bkToggleSelect('${m.id}',this)"></td>
      <td><span class="primary-text">${escapeHtml(m.name)}</span><div class="secondary-text">${"★".repeat(Math.min(m.stars||0,5))}${m.area ? " · " + escapeHtml(m.area) : ""}</div></td>
      <td><span style="color:var(--text-secondary)">${escapeHtml(m.bookingMatchedName||"—")}</span></td>
      <td class="numeric">${m.bookingHotelId ? escapeHtml(m.bookingHotelId) : `<span style="color:var(--text-muted)">—</span>`}</td>
      <td class="numeric">${bkScoreBadge(m.score)}</td>
      <td class="numeric">${m.galleryCount || 0}${m.mediaSyncedAt ? " ✓" : ""}</td>
      <td><span class="badge ${meta.badge}">${meta.label}</span></td>
      <td><div style="display:flex;gap:4px">${approve}${reject}
        <button class="icon-button btn-icon" title="Edit Booking ID" onclick="bkEditId('${m.id}')">${icon("pencil")}</button>
        <button class="icon-button btn-icon" title="Open hotel" onclick="showHotelDetails('${m.id}')">${icon("eye")}</button>
      </div></td>
    </tr>`;
  }).join("");
  refreshIcons(tbody);
}

function bkFilterMatches(f) {
  document.querySelectorAll(".bkf").forEach(b => b.classList.toggle("active", b.dataset.f === f));
  bkRenderMatchRows(f);
}
function bkToggleSelect(id, cb) { if (cb.checked) bkSelected.add(id); else bkSelected.delete(id); }
function bkToggleSelectAll(cb) {
  document.querySelectorAll("#bkReviewBody input[type=checkbox]").forEach(x => { x.checked = cb.checked; });
  const visible = bkMatches.filter(m => { const f = document.querySelector(".bkf.active")?.dataset.f || "all"; return f === "all" || m.status === f; });
  if (cb.checked) visible.forEach(m => bkSelected.add(m.id)); else bkSelected.clear();
}

async function bkMatchAction(id, action, idValue) {
  const res = await apiFetch(`/admin/enrich/booking-match/${id}`, { method: "POST", body: JSON.stringify({ action, bookingHotelId: idValue }) });
  if (res?.success) { toast(`Match ${action}d`, "success"); bkLoadMatches(); }
}
function bkEditId(id) {
  const cur = bkMatches.find(m => m.id === id)?.bookingHotelId || "";
  const val = prompt("Enter Booking hotel ID (numeric):", cur);
  if (val == null) return;
  if (!/^\d{3,}$/.test(val.trim())) { toast("ID must be numeric", "error"); return; }
  bkMatchAction(id, "edit", val.trim());
}

  const res = await apiFetch("/admin/enrich/booking-matches/bulk-approve", { method: "POST", body: JSON.stringify({ hotelIds: ids }) });

}

async function bkFetchStart() {
  if (!bkRequireToken()) return;
  const selectedOnly = document.getElementById("bkSelectedOnly")?.checked;
  const body = {
    city: bkCity(), apifyToken: bkToken(), actorId: document.getElementById("bkPhotoActor")?.value,

    limit: parseInt(document.getElementById("bkFetchLimit")?.value || "50"),

    apply: document.getElementById("bkFetchApply")?.checked || false,
    selectedOnly: selectedOnly || false,
  };
  if (selectedOnly) {
    if (!bkSelected.size) { toast("No hotels selected in Review tab", "error"); return; }
    body.hotelIds = [...bkSelected];
  }
  bkFetchResults = [];
  let stats = { applied: 0, skipped: 0, errors: 0, rows: 0 };
  document.getElementById("bkFetchProgress").style.display = "";
  document.getElementById("bkFetchStats").style.display = "";
  document.getElementById("bkFetchFeed").innerHTML = "";

  document.getElementById("bkFetchBtn").style.display = "none";
  document.getElementById("bkFetchStop").style.display = "";

  await bkStream("/admin/enrich/fetch-booking-photos", body, (type, d) => bkFetchEvent(type, d, stats));

  document.getElementById("bkFetchBtn").style.display = "";
  document.getElementById("bkFetchStop").style.display = "none";
}

function bkFetchEvent(type, d, stats) {
  if (type === "estimate") { bkFeed("bkFetchFeed", "info", `${d.hotels} hotels × ${d.maxPhotosPerHotel} = ~${d.estimatedRows} rows · ${d.mode}`); return; }
  if (type === "done") {
    stats.applied = d.applied||0; stats.skipped = d.skipped||0; stats.errors = d.errors||0; stats.rows = d.photoRows||0;
    ["applied","skipped","errors","rows"].forEach(k=>bkSetStat("bkF_",k,stats[k]));
    bkProgress("bkFetchFill", 100);
    bkFeed("bkFetchFeed","done",`Done — applied ${d.applied}, skipped ${d.skipped}, errors ${d.errors}, ${d.photoRows} rows`);
    toast(`Photos done — ${d.applied} hotels updated`, "success");
    return;
  }
  if (type === "quota") { bkFeed("bkFetchFeed","quota", d.message); toast("Apify quota/auth issue", "error"); return; }
  if (type === "error") { bkFeed("bkFetchFeed","error", d.message || "Error"); return; }
  if (type === "hotel") {
    const pct = d.total > 0 ? (d.i / d.total) * 100 : 0; bkProgress("bkFetchFill", pct);
    if (d.status === "fetching") { bkFeed("bkFetchFeed","fetching",`[${d.i}/${d.total}] ${d.name}…`); return; }
    if (d.status === "ok") { stats.applied += d.apply ? 1 : 0; if (d.apply) bkSetStat("bkF_","applied",stats.applied); }
    if (d.status === "no_result") { stats.skipped++; bkSetStat("bkF_","skipped",stats.skipped); }
    if (d.status === "error") { stats.errors++; bkSetStat("bkF_","errors",stats.errors); }
    bkFetchResults.push({ name: d.name, bookingHotelId: d.bookingHotelId, count: d.count || 0, status: d.status });
    if (d.status === "ok") {
      const thumbs = (d.thumbs || []).map(u => `<img src="${hotelImageSrc(u)}" loading="lazy" alt="">`).join("");
      const card = document.createElement("div");
      card.className = "bk-thumb-card";
      card.innerHTML = `<div class="bk-thumb-head"><span class="primary-text">${escapeHtml(d.name)}</span><span class="badge badge-confirmed">${d.count} 📷${d.apply?"":" (dry)"}</span></div><div class="bk-thumb-row">${thumbs}</div>`;
      document.getElementById("bkFetchGrid")?.prepend(card);
    } else {
      bkFeed("bkFetchFeed", d.status, `${d.name} — ${BK_STATUS[d.status]?.label || d.status}${d.reason ? ": " + d.reason : ""}`);
    }
  }
}

}

let enrichResults = [];
let enrichRunStats = { applied: 0, cross: 0, manual: 0, errors: 0, total: 0 };

async function enrichStart() {
  const token     = document.getElementById("enrichToken")?.value?.trim();
  const city      = document.getElementById("enrichCity")?.value;
  const actorSel  = document.getElementById("enrichActorSel")?.value;
  const actorId   = actorSel === "custom" ? (document.getElementById("enrichCustomActor")?.value?.trim() || "") : actorSel;
  const apply     = document.getElementById("enrichApply")?.checked || false;
  const start     = parseInt(document.getElementById("enrichStart")?.value || "0");
  const limit     = parseInt(document.getElementById("enrichLimit")?.value || "999");
  const minScore  = parseFloat(document.getElementById("enrichMinScore")?.value || "0.30");

  if (!token)   { toast("Enter your Apify token first", "error"); return; }
  if (!actorId) { toast("Enter Actor ID", "error"); return; }

  // Reset UI
  enrichResults = [];
  enrichRunStats = { applied: 0, cross: 0, manual: 0, errors: 0, total: 0 };
  document.getElementById("enrichFeed").innerHTML = "";
  document.getElementById("enrichResultsBody").innerHTML = "";
  document.getElementById("enrichProgressPanel").style.display = "";
  document.getElementById("enrichResultsCard").style.display = "";
  document.getElementById("enrichStats").style.display = "";
  document.getElementById("enrichModeBadge").style.display = "";
  document.getElementById("enrichModeBadge").innerHTML = apply
    ? `<span class="badge badge-confirmed">${icon("database")}&nbsp;APPLY MODE — writing to DB</span>`
    : `<span class="badge badge-outline">${icon("eye")}&nbsp;DRY RUN — no changes</span>`;
  enrichProgressSet(0);

  document.getElementById("enrichStartBtn").style.display = "none";
  document.getElementById("enrichStopBtn").style.display = "";
  enrichState.running = true;

  try {
    const controller = new AbortController();
    enrichState.reader = controller;
    const res = await fetch("/api/admin/enrich/run", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${localStorage.getItem("accessToken")}` },
      body: JSON.stringify({ city, apifyToken: token, actorId, apply, start, limit, minScore }),
      signal: controller.signal,
    });

    if (!res.ok) { toast("Server error " + res.status, "error"); enrichDone(); return; }

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf      = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop() || "";
      for (const chunk of parts) {
        let evtType = "message", evtData = "";
        chunk.split("\n").forEach(line => {
          if (line.startsWith("event: ")) evtType = line.slice(7).trim();
          if (line.startsWith("data: "))  evtData = line.slice(6).trim();
        });
        if (evtData) {
          try { enrichHandleEvent(evtType, JSON.parse(evtData)); } catch {}
        }
      }
    }
  } catch (err) {
    if (!err.message?.includes("abort")) toast("Connection error: " + err.message, "error");
  }

  enrichDone();
}

function enrichStop() {
  if (enrichState.reader) enrichState.reader.abort();
  enrichState.running = false;
  enrichFeedPush("abort", { message: "Stopped by admin." });
  enrichDone();
}

function enrichDone() {
  document.getElementById("enrichStartBtn").style.display = "";
  document.getElementById("enrichStopBtn").style.display = "none";
  enrichState.running = false;
  refreshIcons(document.getElementById("enrichResultsBody"));
}

function enrichProgressSet(pct) {
  const fill  = document.getElementById("enrichProgressFill");
  const label = document.getElementById("enrichProgressLabel");
  if (fill) fill.style.width = Math.min(100, Math.round(pct)) + "%";
  if (label) label.textContent = Math.round(pct) + "%";
}

function enrichStatUpdate() {
  ["applied","cross","manual","errors","total"].forEach(k => {
    const el = document.getElementById("eStat_" + k);
    if (el) el.textContent = String(enrichRunStats[k] || 0);
  });
}

  cross:      { icon: "link",         cls: "enrich-row--cross",   badge: "badge-info",       label: "Cross-match" },

  no_result:  { icon: "minus-circle", cls: "enrich-row--skip",    badge: "badge-outline",    label: "No result" },
  quota:      { icon: "ban",          cls: "enrich-row--error",   badge: "badge-cancelled",  label: "Quota hit" },
  abort:      { icon: "octagon-x",    cls: "enrich-row--error",   badge: "badge-cancelled",  label: "Stopped" },
};

function enrichHandleEvent(type, data) {
  const feed = document.getElementById("enrichFeed");
  if (!feed) return;

  if (type === "init") {
    enrichRunStats.total = data.total || 0;
    enrichStatUpdate();
    enrichFeedPush("info", { message: `${data.city} — ${data.total} hotels to process (${data.alreadyEnriched} already enriched)` });
    return;
  }

  if (type === "done") {
    enrichRunStats.applied = data.applied || 0;
    enrichRunStats.cross   = data.crossMatched || 0;
    enrichRunStats.manual  = data.manual || 0;
    enrichRunStats.errors  = data.errors || 0;
    enrichRunStats.total   = data.total || 0;
    enrichStatUpdate();
    enrichProgressSet(100);
    enrichFeedPush("done", { message: `Done — Applied: ${data.applied}, Manual: ${data.manual}, Errors: ${data.errors}` });
    toast(`Enrichment complete — ${data.applied} hotels updated`, "success");
    return;
  }

  if (type === "quota") {
    enrichFeedPush("quota", { message: data.message || "Quota exceeded." });
    toast("Apify monthly quota hit — add a new token.", "error");
    return;
  }

  if (type === "abort" || type === "error") {
    enrichFeedPush(type, data);
    return;
  }

  if (type === "hotel") {
    // Update progress bar
    const pct = data.total > 0 ? (data.i / data.total) * 100 : 0;
    enrichProgressSet(pct);

    // Skip "fetching" rows in the table; only show final status
    if (data.status === "fetching") {
      enrichFeedPush("fetching", { message: `[${data.i}/${data.total}] ${data.name}…` });
      return;
    }

    // Update or replace the last feed row for this hotel
    enrichFeedPush(data.status, { message: `${data.name}${data.matched ? " → " + data.matched : ""}${data.imgs != null ? " · " + data.imgs + " 📷" : ""}${data.reason ? " — " + data.reason : ""}` });

    // Update stats
    if (data.status === "ok")     { enrichRunStats.applied = (enrichRunStats.applied||0)+1; }
    if (data.status === "cross")  { enrichRunStats.cross   = (enrichRunStats.cross||0)+1; enrichRunStats.applied=(enrichRunStats.applied||0)+1; }
    if (data.status === "manual") { enrichRunStats.manual  = (enrichRunStats.manual||0)+1; }
    if (data.status === "error")  { enrichRunStats.errors  = (enrichRunStats.errors||0)+1; }
    enrichStatUpdate();

    // Add to results table
    const meta    = ENRICH_STATUS_META[data.status] || ENRICH_STATUS_META.no_result;
    const modeTag = data.apply ? "" : `<span style="font-size:10px;color:var(--text-muted)">(dry)</span>`;
    const row     = document.createElement("tr");
    row.className = meta.cls;
    row.setAttribute("data-status", data.status);
    row.innerHTML = `
      <td class="numeric" style="color:var(--text-muted)">${data.i}</td>
      <td><span class="primary-text">${escapeHtml(data.name)}</span></td>
      <td><span style="color:var(--text-secondary)">${escapeHtml(data.matched||"—")}</span></td>
      <td class="numeric">${data.score != null ? data.score : "—"}</td>
      <td class="numeric">${data.imgs != null ? data.imgs : "—"}</td>
      <td><span class="badge ${meta.badge}">${meta.label}</span>${modeTag}</td>`;
    const tbody = document.getElementById("enrichResultsBody");
    if (tbody) { tbody.appendChild(row); }

    enrichResults.push({ ...data, _meta: meta });
  }
}

function enrichFeedPush(type, data) {
  const feed = document.getElementById("enrichFeed");
  if (!feed) return;
  const meta = ENRICH_STATUS_META[type] || { icon: "info", cls: "enrich-row--info", label: type };
  const div  = document.createElement("div");
  div.className = "enrich-feed-row " + (meta.cls || "");
  div.innerHTML  = `<span class="enrich-feed-icon">${icon(meta.icon || "info")}</span><span class="enrich-feed-msg">${escapeHtml(String(data.message||""))}</span>`;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  if (window.lucide) lucide.createIcons({ el: div });
}

function enrichFilterResults(filter) {
  document.querySelectorAll("#enrichResultsBody tr").forEach(row => {
    const status = row.getAttribute("data-status") || "";
    row.style.display = (filter === "all" || status === filter) ? "" : "none";
  });
  ["rfAll","rfManual","rfError"].forEach(id => document.getElementById(id)?.style?.setProperty("font-weight","400"));
  const map = { all: "rfAll", manual: "rfManual", error: "rfError" };
  if (map[filter]) document.getElementById(map[filter])?.style?.setProperty("font-weight","800");
}

  const token = localStorage.getItem("accessToken");
  const role = localStorage.getItem("userRole");
  if (!token || role !== "SUPERADMIN") {
    location.href = "/login.html";
    return;
  }
  const name = localStorage.getItem("userName") || "Admin";
  document.getElementById("sidebarUserName").textContent = name;
  document.getElementById("userInitial").textContent = name.charAt(0).toUpperCase();
  initI18n();
  refreshIcons();
  setPage("dashboard");
})();
