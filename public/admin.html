function heDuplicateRate(btn) {
  const card = btn.closest(".he-rate");
  if (!card) return;
  const g = sel => card.querySelector(sel);
  const supplements = [...card.querySelectorAll(".he-supp")].map(sc => ({
    name: sc.querySelector(".hs-name")?.value || "",
    type: sc.querySelector(".hs-type")?.value || "FIXED_AMOUNT",
    amount: sc.querySelector(".hs-amount")?.value === "" ? null : Number(sc.querySelector(".hs-amount")?.value),
    currency: sc.querySelector(".hs-cur")?.value || null,
    notes: sc.querySelector(".hs-notes")?.value || "",
  }));
  const copy = {
    roomName: g(".he-room")?.value || "",
    market: g(".he-market")?.value || "",
    currency: g(".he-cur")?.value || "USD",
    mealPlan: g(".he-meal")?.value || "",
    singlePrice: g(".he-single")?.value === "" ? null : Number(g(".he-single").value),
    doublePrice: g(".he-double")?.value === "" ? null : Number(g(".he-double").value),
    triplePrice: g(".he-triple")?.value === "" ? null : Number(g(".he-triple").value),
    validFrom: "", validTo: "",
    notes: g(".he-rnotes")?.value || "",
    supplements,
  };
  const tmp = document.createElement("div");
  tmp.innerHTML = heRateCardHtml(copy);
  const el = tmp.firstElementChild;
  card.after(el);
  refreshIcons(el);
  heSyncRateTitles();
  heSyncAllSupps(el);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.querySelector(".he-vf")?.focus();
}

/** Label each row with room · market · period so a long list stays scannable. */
function heSyncRateTitles() {
  const cards = [...document.querySelectorAll("#heRatesBox .he-rate")];
  cards.forEach((card, i) => {
    const g = sel => card.querySelector(sel);
    const room = (g(".he-room")?.value || "").trim();
    const marketSel = g(".he-market");
    const market = marketSel?.options[marketSel.selectedIndex]?.textContent?.trim() || "";
    const vf = g(".he-vf")?.value || "";
    const vt = g(".he-vt")?.value || "";
    const period = vf || vt ? `${vf || "…"} → ${vt || "…"}` : t("hotel.allYear", "All year");
    const title = card.querySelector(".he-rate-title");
    if (title) title.textContent = `${i + 1}. ${room || t("hotel.roomName", "Room name")} · ${market} · ${period}`;
  });
  const count = document.getElementById("heRatesCount");
  if (count) count.textContent = `${formatNumber(cards.length)} ${t("hotel.rowsCount", "rows")}`;
  heSyncMarketCoverage();
}
function heAddSupp(btn) {
  const box = btn.closest(".he-rate").querySelector(".he-supps");
  const tmp = document.createElement("div");
  tmp.innerHTML = heSuppHtml({});
  const row = tmp.firstElementChild;
  box.appendChild(row);
  refreshIcons(box);
  heSyncSupp(row);
  row.querySelector(".hs-name")?.focus();
}
function heCollectRates() {
  const out = [];
  document.querySelectorAll("#heRatesBox .he-rate").forEach(card => {
    const g = sel => card.querySelector(sel);
    const roomName = (g(".he-room")?.value || "").trim();
    if (!roomName) return;
    const numOrNull = el => (el && el.value !== "" ? Number(el.value) : null);
    const supplements = [...card.querySelectorAll(".he-supp")].map(sr => {
      const sg = sel => sr.querySelector(sel);
      const name = (sg(".hs-name")?.value || "").trim();
      if (!name) return null;
      return {
        name,
        type: sg(".hs-type")?.value || "FIXED_AMOUNT",
        amount: sg(".hs-amount")?.value !== "" ? Number(sg(".hs-amount").value) : null,
        currency: sg(".hs-cur")?.value || null,
        notes: (sg(".hs-notes")?.value || "").trim() || null,
      };
    }).filter(Boolean);
    out.push({
      roomName,
      market: g(".he-market")?.value || null,
      currency: g(".he-cur")?.value || "USD",
      singlePrice: numOrNull(g(".he-single")),
      doublePrice: numOrNull(g(".he-double")),
      triplePrice: numOrNull(g(".he-triple")),
      mealPlan: g(".he-meal")?.value || null,
      validFrom: g(".he-vf")?.value || null,
      validTo: g(".he-vt")?.value || null,
      isActive: g(".he-ractive")?.checked !== false,
      notes: (g(".he-rnotes")?.value || "").trim() || null,
      supplements,
    });
  });
  return out;
}

async function heSave() {
  const val = id2 => (document.getElementById(id2)?.value ?? "").trim();
  const name = val("heName"), city = val("heCity"), address = val("heAddress");
  if (!name || !city || !address) {
    heTab("basic");
    toast(t("toast.validationError", "Please fill required fields"), "error");
    return;
  }
  const ratingRaw = val("heRating");
  const payload = {
    name, nameAr: val("heNameAr") || null,
    city, cityAr: val("heCityAr") || null,
    area: val("heArea") || null,
    country: val("heCountry") || "EG",
    destinationId: val("heDestinationId") || null,
    address,
    stars: Number(document.getElementById("heStars")?.value || 3),
    googleRating: ratingRaw === "" ? null : Number(ratingRaw),
    pricePerNight: Number(val("hePrice") || 0) || 1,
    currency: document.getElementById("heCurrency")?.value || "USD",
    description: val("heDesc") || null,
    descriptionAr: val("heDescAr") || null,
    isActive: document.getElementById("heActive")?.checked !== false,
    showPriceToAgents: !!document.getElementById("heShowPrice")?.checked,
    allowQuoteRequest: !!document.getElementById("heAllowQuote")?.checked,
    imageUrl: hotelEditor.mainImage || null,
    galleryUrls: hotelEditor.gallery,
    amenities: hotelEditor.amenities,
    // policies
    checkInTime: val("heCheckIn") || null,
    checkOutTime: val("heCheckOut") || null,
    cancellationPolicy: val("heCancel") || null,
    cancellationPolicyAr: val("heCancelAr") || null,
    childrenPolicy: val("heChildren") || null,
    childrenPolicyAr: val("heChildrenAr") || null,
    extraBedPolicy: val("heExtraBed") || null,
    extraBedPolicyAr: val("heExtraBedAr") || null,
    mealPolicy: val("heMeal") || null,
    mealPolicyAr: val("heMealAr") || null,
    importantNotes: val("heNotes") || null,
    importantNotesAr: val("heNotesAr") || null,
  };
  const btn = document.getElementById("heSaveBtn");
  setBtnLoading(btn, true, "btn.saving");
  const editing = !!hotelEditor.id;
  const res = await apiFetch(editing ? `/hotels/${hotelEditor.id}` : "/hotels", {
    method: editing ? "PATCH" : "POST",
    body: JSON.stringify(payload),
  });
  if (!res?.success) { setBtnLoading(btn, false); return; }
  const hotelId = hotelEditor.id || res.data?.id;
  // Save the rate matrix and the tagged albums.
  if (hotelId) {
    await Promise.all([
      apiFetch(`/hotels/${hotelId}/rates`, { method: "PUT", body: JSON.stringify({ rates: heCollectRates() }) }).catch(() => null),
      apiFetch(`/hotels/${hotelId}/images`, { method: "PUT", body: JSON.stringify({ images: heCollectAlbumImages() }) }).catch(() => null),
    ]);
  }
  setBtnLoading(btn, false);
  closeModal();
  toast(editing ? t("toast.updated", "Updated") : t("toast.created", "Created"), "success");
  state.cache.hotelsRows = null;
  renderHotels();
}

async function renderHotels() {
  const capturedToken = state.renderToken;
  state.page = "hotels";

  // Fetch once and cache; subsequent filter changes re-render from cache.
  let rows = state.cache.hotelsRows || [];
  if (!rows.length) {
    content(pageHeader(masterActions("hotels")) + `
      <div class="table-card"><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(7, 8)}</tbody></table></div></div>`);
    const rowsFetched = [];
    let page = 1;
    let pages = 1;
    do {
      const res = await apiFetch(`/hotels?page=${page}&limit=100`);
      if (state.renderToken !== capturedToken) return;
      rowsFetched.push(...(res?.data || []));
      pages = res?.meta?.pages || page;
      page += 1;
    } while (page <= pages);
    if (state.renderToken !== capturedToken) return;
    rows = rowsFetched;
    state.cache.hotelsRows = rows;
  }

  drawHotelsPage(rows);
}

async function addHotelPricingFromDetails(hotelId) {
  const amount = Number(document.getElementById("hotelPriceAmount")?.value || 0);
  const validFrom = document.getElementById("hotelPriceFrom")?.value;
  const validTo = document.getElementById("hotelPriceTo")?.value;
  if (!amount || !validFrom || !validTo) {
    toast(t("toast.validationError"), "error");
    return;
  }
  if (new Date(validTo) < new Date(validFrom)) {
    toast(t("toast.invalidDateRange", "Valid To must be after Valid From"), "error");
    return;
  }
  const payload = {
    roomType: document.getElementById("hotelPriceRoomType")?.value || "STANDARD",
    season: document.getElementById("hotelPriceSeason")?.value || "REGULAR",
    pricePerNight: amount,
    currency: document.getElementById("hotelPriceCurrency")?.value || "USD",
    validFrom,
    validTo,
  };
  const res = await apiFetch(`/hotels/${hotelId}/pricing`, { method: "POST", body: JSON.stringify(payload) });
  if (res?.success) {
    toast(t("toast.created"), "success");
    showHotelDetails(hotelId);
  }
}

async function deleteHotelPricingRecord(hotelId, pricingId) {
  confirmAction(t("modal.confirmDelete"), async () => {
    const res = await apiFetch(`/hotels/pricing/${pricingId}`, { method: "DELETE" });
    if (res?.success) {
      toast(t("toast.deleted"), "success");
      showHotelDetails(hotelId);
    }
  });
}

async function saveHotelCompanyVisibility(hotelId) {
  const companyId = document.getElementById("hotelVisibilityCompany")?.value;
  if (!companyId) {
    toast(t("toast.validationError"), "error");
    return;
  }
  const quoteValue = document.getElementById("hotelVisibilityQuote")?.value || "";
  const payload = {
    companyId,
    canViewPrice: document.getElementById("hotelVisibilityCanView")?.value === "true",
    canRequestQuote: quoteValue === "" ? null : quoteValue === "true",
    note: document.getElementById("hotelVisibilityNote")?.value || "",

    loadHotelCompanyVisibility(hotelId);

async function saveDestination(id, onSaved = null) {
  const name = document.getElementById("destName").value.trim();
  const slug = document.getElementById("destSlug").value.trim();
  if (!name || !slug) { toast(t("validation.required","Name and slug are required"), "error"); return; }
  const body = {
    name, slug,
    nameAr: document.getElementById("destNameAr").value.trim() || null,
    country: document.getElementById("destCountry").value.trim() || "EG",
    region: document.getElementById("destRegion").value.trim() || null,
    type: document.getElementById("destType").value,
    isActive: document.getElementById("destActive").value === "true",
    imageUrl: document.getElementById("destImageUrl").value.trim() || null,
    imageAltEn: document.getElementById("destImageAltEn").value.trim() || null,
    imageAltAr: document.getElementById("destImageAltAr").value.trim() || null,
  };
  const res = await apiFetch(id ? `/destinations/${id}` : "/destinations", {
    method: id ? "PATCH" : "POST",
    body: JSON.stringify(body),
  });
  if (res?.success) {
    closeModal();
    toast(t("toast.saved","Saved"), "success");
    // A caller that opened this from another screen decides what to refresh —
    // only the Destinations page itself should redraw the Destinations page.
    if (onSaved) { state.cache.destinationOptions = null; await onSaved(res.data); }
    else renderDestinations();
  }
}

// ── Lifecycle date helpers (Phase 1) ─────────────────────────────────────────
// "Date Requested" uses the explicit requestedAt column (fallback createdAt).
function requestedDate(r) { return formatDate(r.requestedAt || r.createdAt); }
// "Date Confirmed" prefers an explicit confirmation field; falls back to
// updatedAt for legacy confirmed rows; otherwise a clear "Not confirmed" label.
function confirmedDate(r) {
  const explicit = r.confirmedAt || r.approvedAt;
  if (explicit) return formatDate(explicit);
  const s = String(r.status || "").toUpperCase();
  if ((s === "CONFIRMED" || s === "COMPLETED" || s === "APPROVED") && r.updatedAt) return formatDate(r.updatedAt);
  return t("th.notConfirmed", "Not confirmed");
}
// Name of the admin who confirmed (Phase 1 audit), or a dash.
function confirmedByName(r) { return r.confirmedBy?.name ? escapeHtml(r.confirmedBy.name) : "—"; }

function bookingRowActions(booking) {
  return `<div class="row-actions">
    <button class="icon-button btn-icon" title="${t("btn.view", "View")}" onclick="showBookingDetails('${booking.id}')">${icon("eye")}</button>
    ${waIconButton([

      booking.hotel?.name ? `Hotel: ${booking.hotel.name}` : "",
      `Amount: ${booking.totalAmount} ${booking.currency || "USD"}`,
      `Status: ${booking.status}`,
    ], t("contact.whatsapp", "WhatsApp"))}
    ${booking.invoice?.id ? `<button class="icon-button btn-icon" title="${t("btn.downloadPdf")}" onclick="downloadInvoicePdf('${booking.invoice.id}')">${icon("file-down")}</button>` : ""}
  </div>`;
}

  if (!res?.data) return;

/**
 * Every invoice in one PDF, without ticking a box per row.
 *
 * The combined file already ends with a grand total after the per-invoice
 * detail pages, which is what an accountant is actually asking for when they
 * say "send me all the invoices".
 */
async function invDownloadAllPdf() {
  const btn = document.getElementById("invAllBtn");
  const restore = `${icon("file-down")}${t("invoice.downloadAll","Download All Invoices")}`;
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-spinner"></span>&nbsp;${t("invoice.preparing","Preparing…")}`; }
  try {
    const token = localStorage.getItem("accessToken");
    const res = await fetch("/api/invoices/bulk-pdf", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ all: true }),
    });
    if (!res.ok) throw new Error("bulk pdf failed");
    const blob = await res.blob();
    const disp = res.headers.get("Content-Disposition") || "";
    const name = (disp.match(/filename="?([^"]+)"?/) || [])[1] || "ELBAKRI-INVOICES.pdf";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(t("invoice.downloaded","Combined invoice PDF downloaded"), "success");
  } catch {
    toast(t("toast.error","Download failed"), "error");
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = restore; refreshIcons(btn.parentElement); }
  }
}

    }],
    // Priced but hidden is the state that had every agent seeing an empty cabin
    // table, so the list says which of the two a boat is in.

    <div class="cr-transfer-product-head">

    <div class="form-grid">

      <div class="form-field"><label>${t("market.label","Market")}</label><select class="cr-market" onchange="crRateMarketChanged(this)">${CRUISE_MARKETS.map(([value,label]) => `<option value="${value}" ${market === value ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")}</select><input class="cr-cur" type="hidden" value="${currency}"></div>
      <div class="form-field"><label>${t("cruise.transferTripType","Transfer type")} *</label><select class="cr-transfer-trip-type"><option value="ONE_WAY" ${tripType === "ONE_WAY" ? "selected" : ""}>${t("cruise.oneWay","One-way")}</option><option value="ROUND_TRIP" ${tripType === "ROUND_TRIP" ? "selected" : ""}>${t("cruise.roundTrip","Round-trip")}</option></select></div>
      <div class="form-field"><label>${t("form.from","From")} *</label><input class="cr-transfer-from" value="${escapeHtml(rate.fromLocation || "")}"></div>
      <div class="form-field"><label>${t("form.to","To")} *</label><input class="cr-transfer-to" value="${escapeHtml(rate.toLocation || "")}"></div>
      <div class="form-field"><label>${t("form.vehicleType","Vehicle type")} *</label><select class="cr-transfer-vehicle" onchange="crSharedVehicleChanged(this)">${CRUISE_TRANSFER_VEHICLES.map(([value,capacity]) => `<option value="${value}" data-capacity="${capacity}" ${vehicleType === value ? "selected" : ""}>${escapeHtml(value.replace(/_/g," "))} · ${formatNumber(capacity)}</option>`).join("")}</select></div>
      <div class="form-field"><label>${t("cruise.vehicleCapacity","Maximum passengers")} *</label><input class="cr-transfer-capacity" type="number" min="1" max="99" value="${escapeHtml(rate.vehicleCapacity ?? defaultCapacity)}"><small class="field-hint">${t("cruise.capacityHelp","More passengers automatically require another vehicle.")}</small></div>
      <div class="form-field"><label>${t("cruise.pricePerVehicle","Price per vehicle")} · ${currency} *</label><input class="cr-transfer-amount" type="number" min="0" step="0.01" value="${escapeHtml(rate.amount ?? rate.oneWayAmount ?? "")}"></div>
      <div class="form-field"><label>${t("form.validFrom","Valid from")}</label><input class="cr-from" type="date" value="${dateVal(rate.validFrom)}"></div>
      <div class="form-field"><label>${t("form.validTo","Valid to")}</label><input class="cr-to" type="date" value="${dateVal(rate.validTo)}"></div>
    </div>
    <div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-outline btn-sm" onclick="this.closest('.cr-shared-transfer-row').remove()">${icon("trash-2")}${t("btn.remove","Remove")}</button></div>

function openCruiseSharedEditor() {
  const data = state.cache.cruiseSharedCatalogue || { programmes: [], transferRates: [] };
  openModal(t("cruise.sharedCatalogue","Shared programmes & transfers"), `
    <div class="cr-editor-tabs">
      <button type="button" class="cr-editor-tab is-active" onclick="crSharedEditorTab('programmes',this)"><span>1</span>${t("cruise.programmes","Programmes")}</button>

    </div>
    <div data-cr-shared-panel="programmes"><div class="secondary-text" style="margin-bottom:10px">${t("cruise.sharedProgrammeHelp","Choose route and nights once; the programme appears on every matching cruise.")}</div><div id="crSharedProgrammeRows">${(data.programmes || []).map(crSharedProgrammeHtml).join("")}</div><button class="btn btn-primary btn-sm" type="button" onclick="crAddSharedProgramme()">${icon("plus")}${t("cruise.addProgramme","Add programme")}</button></div>
    <div data-cr-shared-panel="transfers" hidden><div class="cr-shared-guidance">${icon("car")}<div><strong>${t("cruise.transferPricingTitle","Vehicle pricing")}</strong><span>${t("cruise.sharedTransferHelp","Add a separate row for each one-way or round-trip vehicle. The price is for the whole vehicle, not per person.")}</span></div></div><div id="crSharedTransferRows">${(data.transferRates || []).map(crSharedTransferHtml).join("")}</div><button class="btn btn-primary btn-sm" type="button" onclick="crAddSharedTransfer()">${icon("plus")}${t("cruise.addTransferRate","Add transfer price")}</button></div>`, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel","Cancel")}</button>
    <button class="btn btn-primary" id="crSharedSaveBtn" onclick="saveCruiseSharedCatalogue()">${t("btn.save","Save")}</button>`, "modal-wide");

function crSharedEditorTab(name, button) {
  document.querySelectorAll("[data-cr-shared-panel]").forEach(panel => { panel.hidden = panel.dataset.crSharedPanel !== name; });
  document.querySelectorAll(".cr-editor-tab").forEach(tab => tab.classList.toggle("is-active", tab === button));
}
function crAddSharedProgramme() { const host = document.getElementById("crSharedProgrammeRows"); host?.insertAdjacentHTML("beforeend", crSharedProgrammeHtml({})); refreshIcons(host?.lastElementChild); }
function crAddSharedTransfer() { const host = document.getElementById("crSharedTransferRows"); host?.insertAdjacentHTML("beforeend", crSharedTransferHtml({})); refreshIcons(host?.lastElementChild); }
function crSharedVehicleChanged(select) {
  const capacity = Number(select.selectedOptions?.[0]?.dataset?.capacity || 0);
  const input = select.closest(".cr-shared-transfer-row")?.querySelector(".cr-transfer-capacity");
  if (input && capacity > 0) input.value = capacity;
}

function crCollectSharedProgrammes() {
  return [...document.querySelectorAll("#crSharedProgrammeRows .cr-shared-programme-card")].map(card => ({
    route: card.querySelector(".cr-shared-route")?.value,
    nights: Number(card.querySelector(".cr-shared-nights")?.value || 0),
    name: card.querySelector(".cr-prog-name")?.value.trim() || "",
    nameAr: card.querySelector(".cr-prog-name-ar")?.value.trim() || null,
    description: card.querySelector(".cr-prog-desc")?.value.trim() || null,
    transferFromName: card.querySelector(".cr-prog-transfer-from")?.value.trim() || "",
    transferToName: card.querySelector(".cr-prog-transfer-to")?.value.trim() || "",
    itinerary: [...card.querySelectorAll(".cr-programme-day")].map(day => ({ day:Number(day.querySelector(".cr-prog-day-num")?.value || 1), title:day.querySelector(".cr-prog-day-title")?.value.trim() || null, description:day.querySelector(".cr-prog-day-desc")?.value.trim() || null })),
    rates: crCollectProgrammeRates(card).map(rate => ({ ...rate, adultPrice: rate.adultPrice ?? rate.singlePrice })),
    isActive: true,
  }));
}

function crCollectSharedTransfers() {
  return [...document.querySelectorAll("#crSharedTransferRows .cr-shared-transfer-row")].map(row => ({
    route: row.querySelector(".cr-shared-route")?.value,
    nights: Number(row.querySelector(".cr-shared-nights")?.value || 0),
    market: row.querySelector(".cr-market")?.value || "FOREIGN",
    fromLocation: row.querySelector(".cr-transfer-from")?.value.trim() || "",
    toLocation: row.querySelector(".cr-transfer-to")?.value.trim() || "",
    tripType: row.querySelector(".cr-transfer-trip-type")?.value || "ONE_WAY",
    vehicleType: row.querySelector(".cr-transfer-vehicle")?.value || "VAN_6",
    vehicleCapacity: Number(row.querySelector(".cr-transfer-capacity")?.value || 0),
    amount: row.querySelector(".cr-transfer-amount")?.value === "" ? null : Number(row.querySelector(".cr-transfer-amount")?.value),
    validFrom: row.querySelector(".cr-from")?.value || null,
    validTo: row.querySelector(".cr-to")?.value || null,
    isActive: row.querySelector(".cr-active")?.checked !== false,
  }));
}

async function saveCruiseSharedCatalogue() {
  const programmes = crCollectSharedProgrammes();
  const transferRates = crCollectSharedTransfers();
  if (programmes.some(p => !p.name || !p.route || p.nights < 1 || !p.transferFromName || !p.transferToName || p.rates.some(r => r.adultPrice == null))
    || transferRates.some(r => !r.route || r.nights < 1 || !r.fromLocation || !r.toLocation || !r.amount && r.amount !== 0 || r.vehicleCapacity < 1)) return toast(t("toast.validationError","Check required fields"), "error");
  const btn = document.getElementById("crSharedSaveBtn");
  setBtnLoading(btn, true, "btn.saving");
  const res = await apiFetch("/cruise-shared-catalogue", { method:"PUT", body:JSON.stringify({ programmes, transferRates }) });
  setBtnLoading(btn, false);
  if (!res?.success) return;
  state.cache.cruiseSharedCatalogue = res.data;
  closeModal(); toast(t("toast.saved","Saved"), "success"); renderCruiseSharedCatalogue();
}

function adminWeekdayLabel(day) {

}

function adminCruiseScheduleSummary(c) {
  const list = (c.schedules || []).filter(sc => sc.isActive !== false);

  return list.slice(0, 3).map(sc =>
    `<div style="font-size:12px">${escapeHtml(adminWeekdayLabel(sc.departureDay))} → ${escapeHtml(adminWeekdayLabel(sc.returnDay))}<span class="secondary-text"> · ${formatNumber(sc.nights)}n</span></div>`
  ).join("") + (list.length > 3 ? `<div class="secondary-text">+${formatNumber(list.length - 3)}</div>` : "");
}

/* ── Cruise per-person fares and sailing schedule ──────────────────────────
   A boat is priced the way a hotel is: one row per fare plan, market and
   period, with a per-person price for each sharing basis. Both tables are saved as a whole set, so
   the editor is a plain list the admin adds to, reorders and deletes from. */

const CRUISE_MARKETS = [["EGYPTIAN", "Egyptian · EGP"], ["FOREIGN", "Foreign · USD"]];
const CRUISE_CABIN_TYPES = ["STANDARD", "DELUXE", "SUITE", "PRESIDENTIAL"];
const CRUISE_WEEKDAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

    <div class="form-grid cr-schedule-row-grid">
      <div class="form-field"><label>${t("cruise.from","From")} · ${t("cruise.departureDay","Departs")}</label><select class="cr-dep" onchange="crRefreshScheduleSelects()">${dayOpts(sc.departureDay || "MONDAY")}</select></div>
      <div class="form-field"><label>${t("cruise.back","Back")} · ${t("cruise.returnDay","Returns")}</label><select class="cr-ret" onchange="crRefreshScheduleSelects()">${dayOpts(sc.returnDay || "THURSDAY")}</select></div>
      <div class="form-field"><label>${t("cruise.nights","Nights")}</label><input class="cr-nights" type="number" min="1" value="${escapeHtml(sc.nights ?? "")}" placeholder="auto" oninput="crRefreshScheduleSelects()"></div>
      <div class="form-field"><label>${t("form.name","Label")}</label><input class="cr-sched-label" value="${escapeHtml(sc.label || "")}" placeholder="${escapeHtml(t("form.optional","optional"))}"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">

      <button type="button" class="btn btn-outline btn-sm" onclick="this.closest('.cr-row').remove();crRefreshScheduleSelects()">${t("btn.remove","Remove")}</button>

  </div>`;
}

function crScheduleIndexForId(id) {
  const list = window._crEditorSchedules || [];
  const index = list.findIndex(schedule => schedule.id && schedule.id === id);
  return index >= 0 ? index : 0;
}

function crScheduleOptions(selectedIndex) {
  const rows = [...document.querySelectorAll("#crSchedRows .cr-row")];
  const source = rows.length ? rows.map((row, index) => ({
    index,

  })) : (window._crEditorSchedules || []).map((schedule, index) => ({
    index,
    label: `${schedule.departureDay || "From"} → ${schedule.returnDay || "Back"} · ${schedule.nights || "?"} nights`,
  }));
  return source.map(item => `<option value="${item.index}" ${Number(selectedIndex) === item.index ? "selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
}

function crProgrammePeriods(rates) {
  const source = Array.isArray(rates) ? rates : [];
  if (!source.length) return [{ validFrom: null, validTo: null, egyptian: {}, foreign: {} }];
  const grouped = new Map();
  source.forEach(rate => {
    const validFrom = rate.validFrom ? String(rate.validFrom).slice(0,10) : "";
    const validTo = rate.validTo ? String(rate.validTo).slice(0,10) : "";
    const key = `${validFrom}|${validTo}`;
    if (!grouped.has(key)) grouped.set(key, { validFrom, validTo, egyptian: {}, foreign: {} });
    grouped.get(key)[rate.market === "EGYPTIAN" ? "egyptian" : "foreign"] = rate;
  });
  return [...grouped.values()];
}

  const rows = [...document.querySelectorAll("#crRateRows .cr-period-row")];

    const g = sel => row.querySelector(sel);
    const cabin = g(".cr-cabin")?.value.trim() || t("cruise.cabinName","Cabin");
    const marketEl = g(".cr-market");

    const schedule = scheduleEl?.options?.[scheduleEl.selectedIndex]?.textContent?.trim() || "—";

    const to = g(".cr-to")?.value || "…";
    const title = row.querySelector(".cr-rate-title");
    if (title) title.textContent = `${i + 1}. ${cabin} · ${schedule} · ${market} · ${from} → ${to}`;
  });
  const count = document.getElementById("crRatesCount");
  if (count) count.textContent = `${t("cruise.periodCount","Pricing periods")}: ${formatNumber(rows.length)}`;

function crValidateCatalogue({ schedules, rates, programmes, transferRates }) {
  if (!schedules.length) {
    toast(t("cruise.scheduleRequired","Add at least one From / Back sailing schedule."), "error");
    return false;
  }
  if (schedules.some(schedule => schedule.nights != null && (!Number.isFinite(schedule.nights) || schedule.nights < 1))) {
    toast(t("toast.validationError","Check required fields"), "error");
    return false;
  }
  const showPrices = document.getElementById("m_cruises_showPriceToAgents")?.checked === true;
  if (showPrices && !rates.length && !programmes.length) {
    toast(t("cruise.rateRequired","Add at least one cruise-only fare or programme before showing prices to agents."), "error");
    return false;
  }
  for (const rate of rates) {
    if (!schedules[rate.scheduleIndex]) {
      toast(t("cruise.programmeScheduleRequired","Every fare needs a valid From / Back schedule."), "error");
      return false;
    }
    if (rate.validFrom && rate.validTo && new Date(rate.validTo) < new Date(rate.validFrom)) {
      toast(t("toast.invalidDateRange","Valid To must be after Valid From"), "error");
      return false;
    }
    if (rate.singlePrice == null && rate.doublePrice == null && rate.triplePrice == null) {
      toast(t("cruise.occupancyPriceRequired","Enter at least one Single, Double or Triple price in every rate row."), "error");
      return false;
    }
    const prices = [rate.singlePrice, rate.doublePrice, rate.triplePrice, rate.childPrice].filter(value => value != null);
    if (prices.some(value => !Number.isFinite(value) || value < 0)) {
      toast(t("toast.validationError","Check required fields"), "error");
      return false;
    }
  }
  for (const programme of programmes) {
    if (!schedules[programme.scheduleIndex] || !programme.name || !programme.transferFromName || !programme.transferToName) {
      toast(t("cruise.programmeScheduleRequired","Every programme needs a name, From / Back schedule and included transfer route."), "error"); return false;
    }
    const markets = new Set(programme.rates.map(rate => rate.market));
    if (!markets.has("EGYPTIAN") || !markets.has("FOREIGN")) {
      toast(t("cruise.programmeMarketsRequired","Every programme needs Egyptian/EGP and Foreign/USD prices."), "error"); return false;
    }
    for (const rate of programme.rates) {
      if (rate.validFrom && rate.validTo && new Date(rate.validTo) < new Date(rate.validFrom)) return toast(t("toast.invalidDateRange","Valid To must be after Valid From"), "error"), false;
      if (rate.adultPrice == null) return toast(t("cruise.programmeAdultPriceRequired","Enter the adult per-person price for every programme market."), "error"), false;
    }
  }
  for (const rate of transferRates) {
    if (!schedules[rate.scheduleIndex] || !rate.fromLocation || !rate.toLocation || !Number.isFinite(rate.amount) || rate.amount < 0 || !Number.isFinite(rate.vehicleCapacity) || rate.vehicleCapacity < 1) {
      toast(t("cruise.transferRateInvalid","Check transfer From, To, market, schedule and price."), "error"); return false;
    }
  }
  return true;
}

/** One chip per destination, plus "All" and a bucket for the unfiled ones. */
function actRenderDestChips(activities) {
  const host = document.getElementById("actDestChips");
  if (!host) return;
  const counts = new Map();
  let unfiled = 0;
  for (const a of activities) {
    if (a.destinationId) counts.set(a.destinationId, (counts.get(a.destinationId) || 0) + 1);
    else unfiled += 1;
  }
  // Every destination is offered, even an empty one — that is how the admin
  // opens a brand-new destination and starts filling it with trips.
  const chips = [[ "", t("filter.all", "All"), activities.length ]];
  for (const d of (state.cache.destinationOptions || [])) {
    chips.push([d.id, destinationLabel(d), counts.get(d.id) || 0]);
  }
  if (unfiled) chips.push(["__none__", t("activity.noDestination", "No destination"), unfiled]);
  host.innerHTML = chips.map(([id, label, count]) =>
    `<button class="btn btn-sm ${actDestFilter === id ? "btn-primary" : "btn-outline"}" onclick="actPickDestination(${inlineJsonArg(id)})">${escapeHtml(label)}<span style="margin-inline-start:6px;opacity:.75;font-variant-numeric:tabular-nums">(${formatNumber(count)})</span></button>`
  ).join("");
  refreshIcons(host);
}

function actRenderCatalogRows(activities) {

    !actDestFilter ? true : (actDestFilter === "__none__" ? !a.destinationId : a.destinationId === actDestFilter));

  const title = document.getElementById("actCatalogTitle");
  if (title) {
    title.textContent = chosen ? destinationLabel(chosen)
      : (actDestFilter === "__none__" ? t("activity.noDestination", "No destination") : t("activity.catalog", "Activity Catalog"));
  }
  const addBtn = document.getElementById("actAddBtn");
  if (addBtn) {
    addBtn.innerHTML = `${icon("plus")}${chosen ? `${t("btn.addNew")} · ${escapeHtml(destinationLabel(chosen))}` : t("btn.addNew")}`;

  }

  if (meta) meta.textContent = `${formatNumber(rows.length)} ${t("nav.activities", "activities")}`;

  // this way" and must stay invisible rather than reading as zero.
  const priceBits = a => [
    [t("form.priceAdult", "Adult"), a.priceAdult],
    [t("form.priceChild", "Child"), a.priceChild],
    [t("hotel.single", "Single"), a.priceSingle],
    [t("hotel.double", "Double"), a.priceDouble],

  tbody.innerHTML = rows.length ? rows.map(a => {

    return `<tr>
      <td>${a.imageUrl
        ? `<img src="${escapeHtml(a.imageUrl)}" alt="" style="height:44px;width:64px;object-fit:cover;border-radius:6px" onerror="this.style.display='none'">`

          : `<span class="badge badge-outline" style="font-size:10px">${t("activity.transferNotIncluded","Transfer not included")}</span>`}</div>
      </td>
      <td>${a.destination ? escapeHtml(destinationLabel(a.destination)) : `<span class="secondary-text">${escapeHtml(a.city || "—")}</span>`}</td>
      <td>
        ${a.duration ? `<div style="font-size:12px;color:var(--info)">${icon("clock")}&nbsp;${escapeHtml(a.duration)}</div>` : ""}
        ${(a.timeSlots||[]).length ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px">${a.timeSlots.slice(0,3).map(x=>`<span class="badge badge-outline" style="font-size:10px">${escapeHtml(x)}</span>`).join("")}${a.timeSlots.length>3?`<span class="badge badge-outline" style="font-size:10px">+${a.timeSlots.length-3}</span>`:""}</div>` : ""}

/**
 * Is this rate an airport run? Those are the ones whose two directions are
 * commonly priced differently — an arrival includes meet-and-greet and waiting
 * on a delayed flight, a departure does not — so they are the exception to
 * "the reverse costs the same".
 */
/** Which rates the bulk direction action applies to. */
function trToggleRateSelection(id, checked) {
  if (checked) state.selectedTransportRates.add(id);
  else state.selectedTransportRates.delete(id);
  renderTransportRatesTable();
}

function trToggleAllRates(checked) {
  const rates = state.cache.transportRows || [];
  if (checked) rates.forEach(r => state.selectedTransportRates.add(r.id));
  else state.selectedTransportRates.clear();
  renderTransportRatesTable();
}

/** Show the bulk buttons only when there is a selection to act on. */
function trUpdateRatesBulkBar() {
  const count = state.selectedTransportRates.size;
  const label = document.getElementById("trRatesSelectedCount");
  const bidir = document.getElementById("trBulkBidirBtn");
  const oneWay = document.getElementById("trBulkOneWayBtn");
  if (label) {
    label.style.display = count ? "" : "none";
    label.textContent = `${formatNumber(count)} ${t("invoice.selected", "selected")}`;
  }
  if (bidir) bidir.style.display = count ? "" : "none";
  if (oneWay) oneWay.style.display = count ? "" : "none";
  const all = document.getElementById("trRatesSelectAll");
  const rates = state.cache.transportRows || [];
  if (all) all.checked = rates.length > 0 && rates.every(r => state.selectedTransportRates.has(r.id));
}

/**
 * Flip the reverse direction for every selected rate in one call, so a
 * catalogue entered one-way does not have to be reopened row by row.
 */
async function trBulkSetDirection(isBidirectional) {
  const ids = Array.from(state.selectedTransportRates);
  if (!ids.length) return;
  const res = await apiFetch("/transport-rates/bulk-direction", {
    method: "PATCH",
    body: JSON.stringify({ ids, isBidirectional }),
  });
  if (!res?.success) return;
  state.selectedTransportRates.clear();
  toast(
    isBidirectional
      ? `${t("transport.madeBidir", "Now priced in both directions")}: ${formatNumber(res.data.updated)}`
      : `${t("transport.madeOneWay", "Now priced one way only")}: ${formatNumber(res.data.updated)}`,
    "success",
  );
  renderTransport();
}

function trIsAirportShaped(type, serviceMode) {
  return type === "AIRPORT_TRANSFER" || serviceMode === "AIRPORT_TRANSFER";
}

/**
 * Show only the fields the chosen service mode actually uses.
 *
 * A transport product is one of two shapes, and the form used to show both at
 * once: an admin adding an at-disposal package was asked for a From, a To, a
 * bidirectional flag and two round-trip prices, none of which mean anything for
 * a car booked by the hour — which is exactly what made the screen impossible
 * to fill in. Route rates likewise have no service area or duration.
 */
/** True for the service modes sold as a block of time rather than a route. */
function trIsDisposalMode(mode) {
  return mode === "HOURLY_CHARTER" || mode === "DAY_USE";
}

/** The area label follows the destination unless the admin typed their own. */
function trDisposalDestChanged() {
  const select = document.getElementById("trDisposalDest");
  const areaEl = document.getElementById("trServiceArea");
  if (!select || !areaEl) return;
  const chosen = select.options[select.selectedIndex]?.text || "";
  // Only the destination's English name, not the " · Arabic" suffix.
  areaEl.placeholder = chosen && select.value ? chosen.split(" · ")[0] : t("transport.serviceAreaPlaceholder", "Leave blank to use the destination name");
}

function trSyncModeFields() {
  const mode = document.getElementById("trMode")?.value || "POINT_TO_POINT";
  const isDisposal = trIsDisposalMode(mode);
  document.querySelectorAll('[data-shape="disposal"]').forEach(el => {
    el.style.display = isDisposal ? "" : "none";
  });
  document.querySelectorAll('[data-shape="route"]').forEach(el => {
    el.style.display = isDisposal ? "none" : "";
  });
  const hint = document.getElementById("trModeHint");
  if (hint) {
    hint.textContent = isDisposal
      ? t("transport.modeHintDisposal", "The car stays with the client inside one area for a block of time. Fill in the area and the hours — there is no From/To and no round-trip price, because coming back is already part of the package.")
      : t("transport.modeHintRoute", "A journey from one point to another. Fill in the From and To below; the round-trip price is optional and defaults to twice the one-way.");
  }
}

/**
 * Type or service mode changed while adding a rate: re-apply the direction
 * default, unless the admin already set the box themselves — their choice wins.
 */
function trSyncBidirDefault() {
  const box = document.getElementById("trBidir");
  if (!box || box.dataset.touched === "1" || box.dataset.existing === "1") return;
  const type = document.getElementById("trType")?.value;
  const mode = document.getElementById("trMode")?.value;
  box.checked = !trIsAirportShaped(type, mode);
}

/**
 * Spell out, in the operator's own terms, what the direction box will do to
 * THIS rate — naming the actual return trip and the actual price rather than
 * describing the setting in the abstract. "Bidirectional" tells someone
 * entering a Cairo → North Coast rate nothing about whether a customer coming
 * back from the coast will see a price.
 */
function trSyncBidirHint() {
  const hint = document.getElementById("trBidirHint");
  const box = document.getElementById("trBidir");
  if (!hint || !box) return;
  const from = trCollectEp("from").name;
  const to = trCollectEp("to").name;
  const egp = document.getElementById("trPriceEgp")?.value;
  const usd = document.getElementById("trPriceUsd")?.value;
  const money = [egp ? `${formatNumber(egp)} EGP` : "", usd ? `${formatNumber(usd)} USD` : ""].filter(Boolean).join(" / ");
  // Until both ends are chosen there is no return trip to name.
  // Isolated as LTR so the route reads the same way round in an Arabic sentence.
  const back = (from && to) ? `<strong dir="ltr">${escapeHtml(to)} → ${escapeHtml(from)}</strong>` : "";

  if (box.checked) {
    hint.innerHTML = back
      ? `${t("transport.bidirOnRoute", "The return trip is priced too:")} ${back}${money ? ` — ${escapeHtml(money)}` : ""}`
      : t("transport.bidirOn", "The return trip is priced at the same price. Choose From and To to see it.");
  } else {
    hint.innerHTML = back
      ? `${t("transport.bidirOffRoute", "The return trip has no price — a customer travelling")} ${back} ${t("transport.bidirOffTail", "sees \"Price on request\".")}`
      : t("transport.bidirOff", "The return trip has no price. A customer travelling the other way sees \"Price on request\".");
  }
  // The airport nuance only matters on an airport rate, so it is only said there.
  if (trIsAirportShaped(document.getElementById("trType")?.value, document.getElementById("trMode")?.value)) {
    hint.innerHTML += `<div style="margin-top:4px">${t("transport.bidirAirportHint", "Airport transfers start off, because meeting an arrival usually costs more than dropping off a departure. Tick it when both directions really are the same price.")}</div>`;
  }
}

/** Mode or type changed: refresh both the visible fields and the direction default. */
function trModeChanged() {
  trSyncModeFields();
  trSyncBidirDefault();
  trSyncBidirHint();
}

function trEpTypeChange(side) {
  const ep = document.querySelector(`.tr-ep[data-side="${side}"]`);
  if (!ep) return;
  const type = ep.querySelector(".tr-ep-type").value;
  ep.querySelectorAll(".tr-ep-pick").forEach(p => p.style.display = p.dataset.kind === type ? "" : "none");
}
function trEpInit(side) { trEpTypeChange(side); }
function trCollectEp(side) {
  const ep = document.querySelector(`.tr-ep[data-side="${side}"]`);
  if (!ep) return { type: null, id: null, name: null };
  const type = ep.querySelector(".tr-ep-type").value || null;
  let id = null, name = null;
  if (type === "AIRPORT") { const s = ep.querySelector(".tr-ep-airport"); id = s.value || null; name = s.selectedOptions[0]?.dataset.name || null; }
  else if (type === "DESTINATION") { const s = ep.querySelector(".tr-ep-dest"); id = s.value || null; name = s.selectedOptions[0]?.dataset.name || null; }
  else if (type === "HOTEL") { const s = ep.querySelector(".tr-ep-hotel"); id = s.value || null; name = s.selectedOptions[0]?.dataset.name || null; }
  const typed = (ep.querySelector(".tr-ep-name")?.value || "").trim();
  if (typed) name = typed;
  return { type, id: id || null, name: name || null };
}
async function saveTransportRateEditor(id = "") {
  const from = trCollectEp("from");
  const to = trCollectEp("to");
  const v = id2 => document.getElementById(id2)?.value;
  const numOrNull = id2 => { const x = v(id2); return x === "" || x == null ? null : Number(x); };
  if (trIsDisposalMode(v("trMode")) && !v("trDisposalDest")) {
    toast(t("transport.disposalDestinationRequired", "Choose the destination this car serves"), "error");
    document.getElementById("trDisposalDest")?.focus();
    return;
  }
  const payload = {
    type: v("trType"), serviceMode: v("trMode"), vehicleType: v("trVehicle"),
    serviceArea: v("trServiceArea") || null, durationHours: numOrNull("trDuration"),
    // An at-disposal car belongs to a destination; a routed rate takes its
    // destination from the endpoints instead, so only send it for disposal.
    ...(trIsDisposalMode(v("trMode")) ? { destinationId: v("trDisposalDest") || null } : {}),
    city: v("trCity") || null, serviceNameEn: v("trServiceNameEn") || null, serviceNameAr: v("trServiceNameAr") || null,
    fromType: from.type, fromId: from.id, fromName: from.name,
    toType: to.type, toId: to.id, toName: to.name,
    isBidirectional: !!document.getElementById("trBidir")?.checked,
    priceEgp: numOrNull("trPriceEgp"), priceUsd: numOrNull("trPriceUsd"),
    roundTripPriceEgp: numOrNull("trRtEgp"), roundTripPriceUsd: numOrNull("trRtUsd"),
    minCapacity: numOrNull("trMinCap") ?? 1, maxCapacity: numOrNull("trMaxCap"),
    notes: v("trNotes") || null, isActive: document.getElementById("trActive")?.checked !== false,
  };
  if (payload.priceEgp == null && payload.priceUsd == null) {
    toast(t("transport.needPrice", "Enter at least an EGP or USD price."), "error");
    return;
  }
  const btn = document.getElementById("trSaveBtn");
  setBtnLoading(btn, true, "btn.saving");
  const res = await apiFetch(id ? `/transport-rates/${id}` : "/transport-rates", {
    method: id ? "PATCH" : "POST",
    body: JSON.stringify(payload),
  });
  setBtnLoading(btn, false);
  if (res?.success) {
    closeModal();
    toast(id ? t("toast.updated", "Updated") : t("toast.created", "Created"), "success");
    renderTransport();
  }
}

/**
 * Summarise which markets the hotel is actually priced for, next to the base
 * price. Without this an admin fills in one price and one currency on the Basic
 * tab and has no way to tell that a Gulf client is quoted from a different row
 * — or that no row covers them at all and the fallback is what they will see.
 */
function heSyncMarketCoverage() {
  const box = document.getElementById("heMarketCoverage");
  if (!box) return;
  const cards = [...document.querySelectorAll("#heRatesBox .he-rate")];
  const priced = new Map();
  cards.forEach(card => {
    const room = (card.querySelector(".he-room")?.value || "").trim();
    if (!room) return;                       // an unnamed row is never saved
    const sel = card.querySelector(".he-market");
    const label = sel?.options[sel.selectedIndex]?.textContent?.trim() || "";
    const cur = card.querySelector(".he-cur")?.value || "";
    const key = label + "|" + cur;
    priced.set(key, { label, cur, n: (priced.get(key)?.n || 0) + 1 });
  });
  if (!priced.size) {
    box.innerHTML = `<span class="he-coverage-none">${escapeHtml(t("hotel.noMarketRates", "No market rates yet — every client sees the base price above."))}</span>`;
    return;
  }
  box.innerHTML = [...priced.values()]
    .map(m => `<span class="badge badge-outline">${escapeHtml(m.label)} · ${escapeHtml(m.cur)}${m.n > 1 ? ` × ${m.n}` : ""}</span>`)
    .join("");
}

/** Paint the rates table from the cached rows (used on load and after a
    selection change, so toggling a checkbox costs no network call). */
function renderTransportRatesTable() {
  const rates = state.cache.transportRows || [];
  const rTbody = document.getElementById("trRatesTbody");
  const rMeta = document.getElementById("trRatesMeta");
  if (rMeta) rMeta.textContent = `${formatNumber(rates.length)} rates`;
  if (rTbody) {
    const dualOneWay = r => {
      const parts = [];
      if (r.priceEgp != null) parts.push(`${formatNumber(r.priceEgp)} EGP`);
      if (r.priceUsd != null) parts.push(`${formatNumber(r.priceUsd)} USD`);
      return parts.length ? parts.join("<div></div>") : formatMoney(r.rate, r.currency);
    };
    const dualRt = r => {
      const parts = [];
      if (r.roundTripPriceEgp != null) parts.push(`${formatNumber(r.roundTripPriceEgp)} EGP`);
      if (r.roundTripPriceUsd != null) parts.push(`${formatNumber(r.roundTripPriceUsd)} USD`);
      if (parts.length) return parts.join("<div></div>");
      return r.roundTripRate ? formatMoney(r.roundTripRate, r.currency) : "<span style='color:var(--text-muted)'>2×</span>";
    };
    const arrow = r => r.isBidirectional ? "⇄" : "→";
    rTbody.innerHTML = rates.length ? rates.map(r => `<tr class="${state.selectedTransportRates.has(r.id) ? "selected" : ""}">
      <td><input type="checkbox" ${state.selectedTransportRates.has(r.id) ? "checked" : ""} onchange="trToggleRateSelection('${r.id}', this.checked)" aria-label="Select rate"></td>

function trShowTab(tab) {
  ["rates", "bookings", "types", "airports"].forEach(name => {
    const title = name[0].toUpperCase() + name.slice(1);
    const section = document.getElementById(`tr${title}Section`);

    if (button) button.className = name === tab ? "btn btn-primary" : "btn btn-outline";
  });
  if (tab === "bookings") loadAdminTransportBookings();
  if (tab === "types") loadAdminGroupTypes("TRANSPORT");
  if (tab === "airports") loadAirportsAdmin();
}

async function ensureGroupTypeOptions() {
  if (state.cache.groupTypeDestinations && state.cache.groupTypeActivities && state.cache.groupTypeRates) return;
  const [destinations, activities, rates] = await Promise.all([
    apiFetch("/destinations?limit=300"),
    apiFetch("/activities?limit=300"),
    apiFetch("/transport-rates?limit=300"),
  ]);
  state.cache.groupTypeDestinations = destinations?.data || [];
  state.cache.groupTypeActivities = activities?.data || [];
  state.cache.groupTypeRates = rates?.data || [];
}

function groupTypeTargetLabel(row) {
  if (row.activity) return `Activity: ${row.activity.name}`;
  if (row.transportRate) {
    return `Route: ${row.transportRate.fromLocation} → ${row.transportRate.toLocation} · ${String(row.transportRate.vehicleType || "").replace(/_/g, " ")}`;
  }
  if (row.destination) return `Destination: ${state.lang === "ar" ? (row.destination.nameAr || row.destination.name) : row.destination.name}`;
  return "All services";
}

function groupTypeAdjustmentLabel(row) {
  const value = Number(row.adjustmentValue || 0);
  if (row.adjustmentType === "PERCENTAGE") return value ? `+${formatNumber(value)}%` : "No adjustment";
  if (row.adjustmentType === "FIXED") return value ? `+${formatNumber(value)} fixed` : "No adjustment";
  return "No adjustment";
}

function groupTypeTargetOptions(scope, mode, selectedId) {
  if (mode === "DESTINATION") {
    return (state.cache.groupTypeDestinations || []).map(row =>
      `<option value="${row.id}" ${row.id === selectedId ? "selected" : ""}>${escapeHtml(row.name)}${row.nameAr ? ` · ${escapeHtml(row.nameAr)}` : ""}</option>`
    ).join("");
  }
  if (mode === "ACTIVITY") {
    return (state.cache.groupTypeActivities || []).map(row =>
      `<option value="${row.id}" ${row.id === selectedId ? "selected" : ""}>${escapeHtml(row.name)} · ${escapeHtml(row.city || "")}</option>`
    ).join("");
  }
  if (mode === "TRANSPORT_RATE") {
    return (state.cache.groupTypeRates || []).map(row =>
      `<option value="${row.id}" ${row.id === selectedId ? "selected" : ""}>${escapeHtml(row.fromLocation || "—")} → ${escapeHtml(row.toLocation || "—")} · ${escapeHtml(String(row.vehicleType || "").replace(/_/g, " "))}</option>`
    ).join("");
  }
  return "";
}

function updateGroupTypeTarget() {
  const scope = document.getElementById("gtScope")?.value || "ACTIVITY";
  const mode = document.getElementById("gtTargetMode")?.value || "GLOBAL";
  const field = document.getElementById("gtTargetField");
  const select = document.getElementById("gtTargetId");
  if (!field || !select) return;
  field.style.display = mode === "GLOBAL" ? "none" : "";
  select.innerHTML = groupTypeTargetOptions(scope, mode, select.dataset.selected || "");
  select.dataset.selected = "";
}

  const targetId = row?.activityId || row?.transportRateId || row?.destinationId || "";
  const targetModes = scope === "ACTIVITY"
    ? [["GLOBAL","All Activities"],["DESTINATION","One Destination"],["ACTIVITY","One Activity"]]
    : [["GLOBAL","All Transport"],["DESTINATION","One Destination"],["TRANSPORT_RATE","One Route / Rate"]];
  const body = `<input type="hidden" id="gtScope" value="${scope}">
    <div class="form-grid">
      <div class="form-field"><label>Code <span class="required">*</span></label><input id="gtCode" value="${escapeHtml(row?.code || "")}" placeholder="PRIVATE"></div>
      <div class="form-field"><label>English Label <span class="required">*</span></label><input id="gtLabelEn" value="${escapeHtml(row?.labelEn || "")}" placeholder="Private"></div>
      <div class="form-field"><label>Arabic Label</label><input id="gtLabelAr" dir="rtl" value="${escapeHtml(row?.labelAr || "")}" placeholder="خاص"></div>
      <div class="form-field"><label>Applies To</label><select id="gtTargetMode" onchange="updateGroupTypeTarget()">${targetModes.map(([value,label]) => `<option value="${value}" ${value === mode ? "selected" : ""}>${label}</option>`).join("")}</select></div>
      <div class="form-field full" id="gtTargetField" ${mode === "GLOBAL" ? 'style="display:none"' : ""}><label>Target</label>
        <select id="gtTargetId" data-selected="${escapeHtml(targetId)}">${groupTypeTargetOptions(scope, mode, targetId)}</select></div>
      <div class="form-field full"><label>English Description</label><textarea id="gtDescriptionEn" rows="2">${escapeHtml(row?.descriptionEn || "")}</textarea></div>
      <div class="form-field full"><label>Arabic Description</label><textarea id="gtDescriptionAr" dir="rtl" rows="2">${escapeHtml(row?.descriptionAr || "")}</textarea></div>
      <div class="form-field"><label>Price Adjustment</label><select id="gtAdjustmentType">
        ${["NONE","FIXED","PERCENTAGE"].map(value => `<option value="${value}" ${value === (row?.adjustmentType || "NONE") ? "selected" : ""}>${value.replace(/_/g," ")}</option>`).join("")}
      </select></div>
      <div class="form-field"><label>Adjustment Value</label><input id="gtAdjustmentValue" type="number" min="0" step="0.01" value="${escapeHtml(row?.adjustmentValue || 0)}"></div>
      <div class="form-field"><label>Minimum Pax</label><input id="gtMinPax" type="number" min="1" value="${escapeHtml(row?.minPax || 1)}"></div>
      <div class="form-field"><label>Maximum Pax</label><input id="gtMaxPax" type="number" min="1" value="${escapeHtml(row?.maxPax || "")}" placeholder="No limit"></div>
      <div class="form-field"><label>Valid From</label><input id="gtValidFrom" type="datetime-local" value="${row?.validFrom ? String(row.validFrom).slice(0,16) : ""}"></div>
      <div class="form-field"><label>Valid To</label><input id="gtValidTo" type="datetime-local" value="${row?.validTo ? String(row.validTo).slice(0,16) : ""}"></div>
      <div class="form-field"><label>Display Order</label><input id="gtDisplayOrder" type="number" min="0" value="${escapeHtml(row?.displayOrder || 0)}"></div>
      <div class="form-field"><label>Status</label><label class="check-row"><input id="gtIsActive" type="checkbox" ${row?.isActive === false ? "" : "checked"}> Active</label></div>
    </div>`;
  openModal(id ? "Edit Service Type" : "New Service Type", body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" onclick="saveGroupType('${scope}','${id}')">${icon("save")}${t("btn.save")}</button>`);
}

async function saveGroupType(scope, id) {
  const code = document.getElementById("gtCode")?.value.trim();
  const labelEn = document.getElementById("gtLabelEn")?.value.trim();
  if (!code || !labelEn) {
    toast(t("toast.validationError","Code and English label are required"), "error");
    return;
  }
  const mode = document.getElementById("gtTargetMode")?.value || "GLOBAL";
  const targetId = document.getElementById("gtTargetId")?.value || null;
  if (mode !== "GLOBAL" && !targetId) {
    toast(t("toast.validationError","Select a target"), "error");
    return;
  }
  const dateValue = inputId => {
    const value = document.getElementById(inputId)?.value;
    return value ? new Date(value).toISOString() : null;
  };
  const payload = {
    scope,
    code,
    labelEn,
    labelAr: document.getElementById("gtLabelAr")?.value.trim() || null,
    descriptionEn: document.getElementById("gtDescriptionEn")?.value.trim() || null,
    descriptionAr: document.getElementById("gtDescriptionAr")?.value.trim() || null,
    destinationId: mode === "DESTINATION" ? targetId : null,
    activityId: mode === "ACTIVITY" ? targetId : null,
    transportRateId: mode === "TRANSPORT_RATE" ? targetId : null,
    adjustmentType: document.getElementById("gtAdjustmentType")?.value || "NONE",
    adjustmentValue: Number(document.getElementById("gtAdjustmentValue")?.value || 0),
    minPax: Number(document.getElementById("gtMinPax")?.value || 1),
    maxPax: document.getElementById("gtMaxPax")?.value ? Number(document.getElementById("gtMaxPax").value) : null,
    validFrom: dateValue("gtValidFrom"),
    validTo: dateValue("gtValidTo"),
    displayOrder: Number(document.getElementById("gtDisplayOrder")?.value || 0),
    isActive: Boolean(document.getElementById("gtIsActive")?.checked),
  };
  const res = await apiFetch(id ? `/group-types/${id}` : "/group-types", {
    method: id ? "PUT" : "POST",
    body: JSON.stringify(payload),
  });
  if (res?.success) {
    closeModal();
    toast(t("toast.saved","Saved"), "success");
    loadAdminGroupTypes(scope);
  }
}

async function deactivateGroupType(scope, id) {
  confirmAction("Deactivate this service type? Existing bookings will keep their saved label.", async () => {
    const res = await apiFetch(`/group-types/${id}`, { method: "DELETE" });
    if (res?.success) {
      toast(t("toast.saved","Deactivated"), "success");
      loadAdminGroupTypes(scope);
    }
  });
}

async function syncEntity(entity, ev) {
  const btn = ev?.currentTarget || (ev?.target && ev.target.closest("button")) || null;
  setBtnLoading(btn, true, "btn.syncing");
  toast(t("toast.syncStarted"), "");
  const res = await apiFetch(`/admin/sheets/sync/${entity}`, { method: "POST", body: JSON.stringify({ spreadsheetId: document.getElementById("sheetsId")?.value || undefined }) });
  setBtnLoading(btn, false);
  // On failure apiFetch already surfaces the real error (e.g. "GOOGLE_SHEETS_ID is not configured");
  // don't overwrite it with a generic message.
  if (!res?.success) return;
  const d = res.data || {};
  const errCount = (d.errors || []).length;
  const resultEl = document.getElementById("result-" + entity);
  const lastEl = document.getElementById("last-" + entity);
  if (resultEl) resultEl.textContent = `${d.synced || 0} ${t("th.synced")} (${d.created || 0}/${d.updated || 0}/${errCount})`;
  if (lastEl) lastEl.textContent = formatDate(new Date());

    .replace("{synced}", d.synced || 0).replace("{created}", d.created || 0)
    .replace("{updated}", d.updated || 0).replace("{errors}", errCount);
  toast(detail, errCount ? "warning" : "success");
  loadSyncHistory();
}

// Live FX state for the converter.
state.fx = state.fx || { rates: null, lastUpdated: null };
const FX_UI_CURRENCIES = ["USD", "EUR", "EGP", "SAR", "AED", "GBP"];

async function loadFxRates(force = false) {
  const lbl = document.getElementById("fxUpdatedLabel");
  if (lbl) lbl.textContent = t("fx.loading", "Loading rates…");
  const res = await apiFetch("/admin/fx/rates").catch(() => null);
  if (!res?.data?.rates) {
    if (lbl) lbl.textContent = t("fx.unavailable", "Rates unavailable");
    setFxHealth("down", null);
    return;
  }
  state.fx.rates = res.data.rates;
  state.fx.lastUpdated = res.data.lastUpdated;
  const codes = FX_UI_CURRENCIES.filter(c => res.data.rates[c] != null);
  const opts = (sel, def) => `${codes.map(c => `<option value="${c}" ${c === def ? "selected" : ""}>${c}</option>`).join("")}`;
  const fromSel = document.getElementById("fxFrom");
  const toSel = document.getElementById("fxTo");
  if (fromSel && !fromSel.options.length) fromSel.innerHTML = opts(fromSel, "USD");
  if (toSel && !toSel.options.length) toSel.innerHTML = opts(toSel, "EGP");
  if (lbl) lbl.textContent = `${t("fx.updated","Rates updated")}: ${state.fx.lastUpdated ? new Date(state.fx.lastUpdated).toLocaleString() : "—"}`;
  setFxHealth("ok", state.fx.lastUpdated);
  fxConvert();
}

// Admin rate-provider health/status badge (Phase 9). Green = reachable & fresh,
// amber = serving cached/stale rates, red = provider unavailable.
function setFxHealth(status, lastUpdated) {
  const el = document.getElementById("fxHealth");
  if (!el) return;
  const ts = lastUpdated ? new Date(lastUpdated).getTime() : 0;
  let dot, label;
  if (status === "down" || !ts) {
    dot = "var(--danger)";
    label = t("fx.providerDown", "Provider unavailable — using last cached rates");
  } else if (Date.now() - ts < 26 * 60 * 60 * 1000) {
    dot = "var(--success)";
    label = t("fx.providerLive", "Live — provider reachable");
  } else {
    dot = "var(--warning, var(--warning))";
    label = t("fx.providerStale", "Cached — rates may be stale");
  }
  el.innerHTML = `<span class="secondary-text" style="display:inline-flex;align-items:center;gap:7px">
    <span style="width:9px;height:9px;border-radius:50%;background:${dot};display:inline-block;flex-shrink:0"></span>
    <span><strong>${t("fx.providerStatus","Rate provider")}:</strong> ${escapeHtml(label)}</span>
  </span>`;
}

// Convert via USD base: amount_in_to = amount * (rate[to] / rate[from]).
function fxConvert() {
  const rates = state.fx.rates;
  const resEl = document.getElementById("fxResult");
  const lineEl = document.getElementById("fxRateLine");
  if (!rates || !resEl) return;
  const amount = Number(document.getElementById("fxAmount")?.value || 0);
  const from = document.getElementById("fxFrom")?.value || "USD";
  const to = document.getElementById("fxTo")?.value || "USD";
  const rf = rates[from], rt = rates[to];
  if (rf == null || rt == null) { resEl.textContent = t("fx.unavailable","Rates unavailable"); if (lineEl) lineEl.textContent = ""; return; }
  const converted = amount * (rt / rf);
  resEl.textContent = `${converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${to}`;
  if (lineEl) lineEl.textContent = `1 ${from} = ${(rt / rf).toLocaleString(undefined, { maximumFractionDigits: 4 })} ${to}`;
}

function fxSwap() {
  const fromSel = document.getElementById("fxFrom");
  const toSel = document.getElementById("fxTo");
  if (!fromSel || !toSel) return;
  const tmp = fromSel.value; fromSel.value = toSel.value; toSel.value = tmp;
  fxConvert();
}

// this editor is for is fixing a record an agency got something wrong on, so the
// whole record is editable; it deliberately cannot create one, because nobody
// but the requesting agency holds the guest's passport details.

/** The approval's own fields, in the order they are asked for. */
function saField(id, label, input, cls = "") {
  return `<div class="form-field ${cls}"><label>${escapeHtml(label)}</label>${input}</div>`;

async function openSecurityApprovalModal(id) {
  if (!id) return;
  await Promise.all([ensureAirportOptions(), ensureSecurityDestinations()]);
  const rows = window._adminListState["security-approval"]?.rows || [];
  const v = rows.find(r => r.id === id);
  if (!v) { toast(t("toast.notFound", "Record not found — refresh and try again"), "error"); return; }
  const airports = state.cache.airportOptions || [];
  const day = value => (value ? String(value).slice(0, 10) : "");
  const opts = (list, current) => list.map(([value, label]) =>
    `<option value="${escapeHtml(value)}" ${value === current ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");

  // Read-only: the approval belongs to the agency that filed it, and moving it
  // to another company would strand its invoice on the old one.
  const companyField = saField("saCompany", t("securityAdmin.company", "Company"),
    `<input value="${escapeHtml(v.company?.name || "—")}" disabled>`);

  // With no airports configured there is nothing to approve against, and an
  // empty dropdown gives no clue why — say so, and point at the page that fixes it.
  const locationField = airports.length
    ? saField("saLoc", t("form.approvalLocation", "Approval location"), `<select id="saDestination">${opts(airports.map(a => [a.code, a.label]), v?.destinationCountry)}</select>`)

         <div class="secondary-text" style="margin-top:4px">${t("securityAdmin.noAirports", "No airports yet — add one on the Airports page first.")}
         <button type="button" class="btn btn-outline btn-sm" style="margin-inline-start:6px" onclick="closeModal(); openAirportsTab()">${t("nav.airports", "Airports")}</button></div>`);

  // The blank stays reachable: an approval filed before this question existed has
  // no answer, and fixing an unrelated field on it should not invent one. Changing
  // it reprices the approval — the hint at the foot of the form says so.
  const destinationField = saField("saDestCity", t("form.destinationCity", "Destination"),
    `<select id="saDestinationCity"><option value="">— ${escapeHtml(t("form.destinationCityNone", "Not specified"))} —</option>${
      opts(securityDestinationOptions(), v?.destinationCity)}</select>`);

  const body = `<div class="form-grid">
    ${companyField}
    ${locationField}
    ${destinationField}
    ${saField("saType", t("form.type", "Type"), `<select id="saVisaType">${opts(["TOURIST","BUSINESS","TRANSIT","STUDENT","MEDICAL","UMRAH","HAJJ"].map(x => [x, x]), v?.visaType || "TOURIST")}</select>`)}
    ${saField("saProc", t("form.processing", "Processing"), `<select id="saProcessing">${opts(["NORMAL","EXPRESS","URGENT"].map(x => [x, x]), v?.processingType || "NORMAL")}</select>`)}
    ${saField("saName", `${t("th.name", "Client name")} *`, `<input id="saApplicantName" value="${escapeHtml(v?.applicantName || "")}">`)}
    ${saField("saNat", `${t("form.nationality", "Nationality")} *`, `<input id="saNationality" value="${escapeHtml(v?.nationality || "")}">`)}

/** Save an edit. There is no create path: an approval is filed by the agency
 *  that holds the guest's details, never typed in here. */
async function saveSecurityApproval(id) {
  const val = elId => document.getElementById(elId)?.value.trim() || "";
  const payload = {
    destinationCountry: val("saDestination"),
    destinationCity: val("saDestinationCity") || null,
    visaType: val("saVisaType"),
    processingType: val("saProcessing"),
    applicantName: val("saApplicantName"),
    nationality: val("saNationality"),
    passportNumber: val("saPassportNumber"),
    passportExpiry: val("saPassportExpiry"),
    travelDate: val("saTravelDate"),
    paxCount: Number(val("saPaxCount") || 1),
    phone: val("saPhone") || null,
    hotelName: val("saHotelName") || null,
    comingFrom: val("saComingFrom") || null,
    flightNumber: val("saFlightNumber") || null,
    notes: val("saNotes") || null,
  };
  const missing = ["applicantName","nationality","passportNumber","passportExpiry","travelDate","destinationCountry"]
    .filter(k => !payload[k]);
  if (missing.length) { toast(t("toast.validationError", "Fill in the required fields"), "error"); return; }
  const btn = document.getElementById("saSaveBtn");
  setBtnLoading(btn, true);
  const res = await apiFetch(`/visa-applications/${id}`, {
    method: "PATCH",
    body: JSON.stringify(payload),
  });
  setBtnLoading(btn, false);
  if (!res?.success) return;
  closeModal();
  toast(res.repriced ? t("securityAdmin.repriced", "Saved. The fee was recalculated.") : t("toast.saved", "Saved"), "success");
  adminReloadList("security-approval");
}

function deleteSecurityApproval(id) {
  confirmAction(t("securityAdmin.deleteConfirm", "Delete this security approval and its invoice? This cannot be undone."), async () => {
    const res = await apiFetch(`/visa-applications/${id}`, { method: "DELETE" });
    if (res?.success) { toast(t("toast.deleted", "Deleted"), "success"); adminReloadList("security-approval"); }
  });
}

async function adminApproveVisa(id) {
  if (!confirm("Approve this security approval?")) return;
  const res = await apiFetch(`/visa-applications/${id}/approve`, { method: "PATCH" });
  if (res?.success) { toast("Approved", "success"); renderSecurityApproval(); }
}
async function adminRejectVisa(id) {
  const reason = prompt("Rejection reason:");
  if (reason === null) return;
  const res = await apiFetch(`/visa-applications/${id}/reject`, { method: "PATCH", body: JSON.stringify({ reason }) });
  if (res?.success) { toast("Rejected", "success"); renderSecurityApproval(); }
}

async function saveSimPackage(id) {
  const payload = {
    name: document.getElementById("spName").value.trim(),
    nameAr: document.getElementById("spNameAr").value.trim() || undefined,
    dataSize: document.getElementById("spData").value.trim(),
    minutes: document.getElementById("spMin").value.trim() || undefined,
    validity: document.getElementById("spValid").value.trim(),
    price: parseFloat(document.getElementById("spPrice").value || "0"),
    currency: document.getElementById("spCur").value,
    isActive: document.getElementById("spActive").checked,
  };
  if (!payload.name || !payload.dataSize || !payload.validity) { toast(t("toast.validationError"), "error"); return; }
  const method = id ? "PATCH" : "POST";
  const url = id ? `/sim-card/packages/${id}` : "/sim-card/packages";
  const res = await apiFetch(url, { method, body: JSON.stringify(payload) });
  if (res?.success) { closeModal(); toast(t("toast.saved"), "success"); renderSimCardAdmin(); }
}

async function toggleSimPackage(id, isActive) {
  await apiFetch(`/sim-card/packages/${id}`, { method: "PATCH", body: JSON.stringify({ isActive }) });
  renderSimCardAdmin();
}

async function deleteSimPackage(id) {
  if (!confirm("Delete this SIM package?")) return;
  await apiFetch(`/sim-card/packages/${id}`, { method: "DELETE" });
  renderSimCardAdmin();
}

async function updateSimStatus(id, status) {
  const res = await apiFetch(`/sim-card/requests/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) });
  if (res?.success) { toast(t("toast.statusChanged"), "success"); renderSimCardAdmin(); }
}

function ofShowPackageTab(tab) {
  ["hotels","transfers","activities","pricing"].forEach(key => {
    const panel = document.getElementById(`ofPanel${key[0].toUpperCase()}${key.slice(1)}`);
    if (panel) panel.style.display = key === tab ? "block" : "none";
  });
  document.querySelectorAll("[data-of-tab]").forEach(btn => {
    btn.classList.toggle("is-active", btn.dataset.ofTab === tab);
  });
}

async function ofPickImage(input) {
  const file = input?.files?.[0];
  if (input) input.value = "";
  if (!file) return;
  const button = document.getElementById("ofImgBtn");
  setBtnLoading(button, true, "btn.uploading");
  const url = await uploadImageToServer(file);
  setBtnLoading(button, false);
  if (!url) return;
  document.getElementById("ofImg").value = url;
  document.getElementById("ofImagePreview").innerHTML = `<img src="${escapeHtml(url)}" alt="">`;

function ofCollectPackageRows() {

    })).filter(row => row.name),
    transferItems: [...document.querySelectorAll(".of-transfer-row")].map(row => ({
      from: row.querySelector(".of-transfer-from").value.trim(), to: row.querySelector(".of-transfer-to").value.trim(), vehicleType: row.querySelector(".of-transfer-vehicle").value.trim() || undefined,
    })).filter(row => row.from && row.to),
    activityItems: [...document.querySelectorAll(".of-activity-row")].map(row => ({
      name: row.querySelector(".of-activity-name").value.trim(), activityId: row.querySelector(".of-activity-id").value.trim() || undefined, date: row.querySelector(".of-activity-date").value.trim() || undefined,
    })).filter(row => row.name),
    pricingPeriods: [...document.querySelectorAll(".of-pricing-row")].map(row => ({
      validFrom: row.querySelector(".of-price-from").value, validTo: row.querySelector(".of-price-to").value,
      market: row.querySelector(".of-price-market").value, currency: row.querySelector(".of-price-currency").value,
      singlePrice: numberOrNull(row.querySelector(".of-price-single").value), doublePrice: numberOrNull(row.querySelector(".of-price-double").value),
      triplePrice: numberOrNull(row.querySelector(".of-price-triple").value), childPrice: numberOrNull(row.querySelector(".of-price-child").value),
    })),

async function saveOffer(id) {
  const kind = document.getElementById("ofKind").value;
  const payload = {
    kind,
    title: document.getElementById("ofTitle").value.trim(),
    titleAr: document.getElementById("ofTitleAr").value.trim() || null,
    description: document.getElementById("ofDesc").value.trim() || null,
    descriptionAr: document.getElementById("ofDescAr").value.trim() || null,
    imageUrl: document.getElementById("ofImg").value.trim() || null,
    ctaLabel: document.getElementById("ofCtaLabel").value.trim() || null,
    ctaLabelAr: document.getElementById("ofCtaLabelAr").value.trim() || null,
    ctaAction: document.getElementById("ofCtaAction").value || null,
    serviceType: document.getElementById("ofSvcType").value || null,
    validFrom: document.getElementById("ofFrom").value || null,
    validTo: document.getElementById("ofTo").value || null,
    priority: parseInt(document.getElementById("ofPriority").value || "0"),
    isActive: document.getElementById("ofActive").checked,
  };
  if (kind === "PACKAGE") Object.assign(payload, ofCollectPackageRows());
  if (!payload.title) { toast(t("toast.validationError"), "error"); return; }
  if (kind === "PACKAGE") {
    if (!payload.hotelItems.length) { toast("Add at least one hotel to the package", "error"); ofShowPackageTab("hotels"); return; }
    if (!payload.pricingPeriods.length || payload.pricingPeriods.some(period => !period.validFrom || !period.validTo || period.validTo < period.validFrom || [period.singlePrice, period.doublePrice, period.triplePrice, period.childPrice].some(price => price == null || price < 0))) {
      toast("Complete every package price period and its Single / Double / Triple / Child prices", "error"); ofShowPackageTab("pricing"); return;
    }
  }
  const method = id ? "PATCH" : "POST";
  const url = id ? `/offers/${id}` : "/offers";
  const res = await apiFetch(url, { method, body: JSON.stringify(payload) });
  if (res?.success) { closeModal(); toast(t("toast.saved"), "success"); renderOffers(); }
}

async function toggleOffer(id, isActive) {
  await apiFetch(`/offers/${id}`, { method: "PATCH", body: JSON.stringify({ isActive }) });
  renderOffers();
}

async function deleteOffer(id) {
  if (!confirm("Delete this offer?")) return;
  const res = await apiFetch(`/offers/${id}`, { method: "DELETE" });
  if (res?.success) { toast(t("toast.deleted"), "success"); renderOffers(); }
}

// ─── Shared admin list renderer ───────────────────────────────────────────────
// Stores the column defs for the active admin list so filter/search handlers can reload
window._adminListState = {};

async function renderAdminList(page, endpoint, columns, options = {}) {
  state.page = page;
  const capturedToken = state.renderToken;
  const filters = options.filters || [];
  window._adminListState[page] = { endpoint, columns };

  // Optional markup rendered above the workbench — used by the pages that carry
  // a sub-tab bar (requests ⇄ settings).
  content(pageHeader() + (options.beforeContent || "") + `
    <div class="workbench">
      <aside class="filter-rail">
        <div class="filter-head"><span>${t("filter.title")}</span>${icon("sliders-horizontal")}</div>
        <div class="filter-body">
          <div class="field"><label>${t("filter.search")}</label>
            <input id="${page}Search" placeholder="${t("placeholder.searchAny")}" oninput="adminListDebounce('${page}')"></div>
          ${filters.map(([key, labelKey, values]) => `<div class="field"><label>${t(labelKey)}</label>
            <select id="${page}-${key}" onchange="adminReloadList('${page}')">
              ${values.map(v => `<option value="${v}">${v ? t("status."+v,v) : t("form.allTypes")}</option>`).join("")}
            </select></div>`).join("")}
          <button class="btn btn-outline" onclick="adminClearFilters('${page}')">${icon("rotate-ccw")}${t("btn.reset")}</button>
        </div>
      </aside>
      <section class="workbench-main table-card">
        <div class="table-toolbar">
          <div><strong>${t((pageMeta[page]||[])[0]||"nav."+page)}</strong>
            <div class="secondary-text" id="${page}Meta">Loading…</div></div>
          <div class="toolbar-actions">
            <button class="btn btn-outline" onclick="adminReloadList('${page}')">${icon("refresh-cw")}${t("btn.refresh")}</button>
            ${options.toolbarActions || ""}
          </div>
        </div>
        <div class="table-scroll"><table class="data-table">
          <thead><tr>${columns.map(([k]) => `<th>${labelText(k)}</th>`).join("")}</tr></thead>
          <tbody id="${page}Tbody">${skeletonRows(columns.length, 8)}</tbody>
        </table></div>
        <div id="${page}Foot"></div>
      </section>
    </div>`);

  await adminReloadList(page);
}

function adminListDebounce(page) {
  clearTimeout(window._adminListTimer);
  window._adminListTimer = setTimeout(() => adminReloadList(page), 280);
}

async function adminReloadList(page) {
  const cfg = window._adminListState[page];
  if (!cfg) return;
  const { endpoint, columns } = cfg;
  const params = new URLSearchParams({ page: 1, limit: 50 });
  const search = document.getElementById(`${page}Search`)?.value;
  if (search) params.set("search", search);
  document.querySelectorAll(`[id^="${page}-"]`).forEach(el => {
    if (el.value) params.set(el.id.replace(`${page}-`, ""), el.value);
  });
  const res = await apiFetch(`${endpoint}?${params}`);
  const rows = res?.data || [];
  // Keep the loaded rows so a row action can open an editor on the full record
  // without refetching it one at a time.
  cfg.rows = rows;
  const meta = res?.meta || { total: rows.length };
  const tbody = document.getElementById(`${page}Tbody`);
  if (tbody) {
    tbody.innerHTML = rows.length
      ? rows.map(row => `<tr>${columns.map(([, fn]) => `<td>${fn(row)}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${columns.length}">${emptyBlock("empty.noData")}</td></tr>`;
    refreshIcons(tbody);
  }
  const metaEl = document.getElementById(`${page}Meta`);
  if (metaEl) metaEl.textContent = `${formatNumber(meta.total)} records`;
}

function adminClearFilters(page) {
  document.querySelectorAll(`[id^="${page}-"], #${page}Search`).forEach(el => { el.value = ""; });
  adminReloadList(page);
}

function uiSetBlock(i, key, val) { uiDraft.config.blocks[i][key] = val; uiRenderPreview(); if (key==="icon"||key==="title") uiRenderBlockList(); }
function uiMoveBlock(i, dir) {
  const arr = uiDraft.config.blocks; const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  arr.forEach((b, idx) => b.order = idx + 1);
  uiRenderBlockList(); uiRenderPreview();
}
function uiRemoveBlock(i) { uiDraft.config.blocks.splice(i, 1); uiRenderBlockList(); uiRenderPreview(); }

  const payload = {
    key: uiDraft.key, name: uiDraft.name, target: uiDraft.target,
    langMode: uiDraft.langMode || "both",
    isActive: activate,
    config: uiDraft.config,
  };
  const res = uiDraft.id
    ? await apiFetch(`/admin/ui-templates/${uiDraft.id}`, { method: "PATCH", body: JSON.stringify(payload) })
    : await apiFetch("/admin/ui-templates", { method: "POST", body: JSON.stringify(payload) });
  if (res?.success) {
    if (activate && res.data?.id && !uiDraft.id) {
      await apiFetch(`/admin/ui-templates/${res.data.id}/activate`, { method: "POST" });
    }
    closeModal();
    toast(t("toast.saved","Saved"), "success");
    renderUiBuilder();
  }
}

async function uiActivate(id) {
  const res = await apiFetch(`/admin/ui-templates/${id}/activate`, { method: "POST" });
  if (res?.success) { toast(t("uiBuilder.activate","Activated"), "success"); renderUiBuilder(); }
}
async function uiDuplicate(id) {
  const res = await apiFetch(`/admin/ui-templates/${id}/duplicate`, { method: "POST" });
  if (res?.success) { toast(t("toast.created","Duplicated"), "success"); renderUiBuilder(); }
}
async function uiDelete(id) {
  if (!confirm("Delete this template?")) return;
  const res = await apiFetch(`/admin/ui-templates/${id}`, { method: "DELETE" });
  if (res?.success) { toast(t("toast.deleted","Deleted"), "success"); renderUiBuilder(); }
}
