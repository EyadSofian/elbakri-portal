<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1F52" />
  <title>Elbakri Overseas - Super Admin</title>
  <!-- Runs before the stylesheet so the theme is on <html> at first paint. -->
  <script src="/assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/portal.css">
  <style>
    /* Dedicated hotel + transport tabbed editors */
    .he-tabs { display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--border); margin:-4px 0 16px; }
    .he-tabbtn { background:transparent; border:none; padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; border-radius:8px 8px 0 0; }
    .he-tabbtn:hover { color:var(--brand-accent); background:var(--accent-tint); }
    .he-tabbtn.active { color:var(--brand-accent); border-bottom-color:var(--brand-accent); }
    .he-main-preview { position:relative; width:200px; height:140px; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--surface-muted); display:flex; align-items:center; justify-content:center; }
    .he-main-preview img { width:100%; height:100%; object-fit:cover; }
    .he-noimg { display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text-muted); font-size:12px; }
    .he-noimg svg { width:28px; height:28px; }
    .he-img-x, .he-thumb-actions button { cursor:pointer; }
    .he-img-x { position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(5,13,36,.68); color:#fff; display:flex; align-items:center; justify-content:center; }
    .he-img-x svg { width:14px; height:14px; }
    .he-gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
    .he-thumb { position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--border); aspect-ratio:4/3; background:var(--surface-muted); }
    .he-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .he-thumb-actions { position:absolute; inset:auto 0 0 0; display:flex; justify-content:center; gap:2px; padding:4px; background:linear-gradient(transparent,rgba(5,13,36,.78)); opacity:0; transition:opacity .15s; }
    .he-thumb:hover .he-thumb-actions { opacity:1; }
    .he-thumb-actions button { width:26px; height:26px; border-radius:6px; border:none; background:var(--surface); color:var(--text-primary); display:flex; align-items:center; justify-content:center; }
    .he-thumb-actions button:disabled { opacity:.4; cursor:default; }
    .he-thumb-actions button svg { width:14px; height:14px; }
    /* A named photo album, e.g. Sea View / Single Room. */
    .he-album { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--surface); }
    .he-thumb-x { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(5,13,36,.68); color:#fff; font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .he-amenity { display:inline-flex; align-items:center; gap:4px; padding:7px 13px; border:1px solid var(--border); border-radius:999px; cursor:pointer; font-size:13px; user-select:none; transition:all .12s; }
    .he-amenity:hover { border-color:var(--brand-accent); }
    .he-amenity.on { background:var(--brand-accent); color:#fff; border-color:var(--brand-accent); }
    .btn-sm { padding:5px 10px; font-size:12px; }
    /* Typed transport endpoint editor */
    .tr-ep { border:1px solid var(--border); border-radius:10px; padding:12px; }
    .tr-ep-grid { display:grid; grid-template-columns:1fr 1.4fr; gap:8px; }
    @media (max-width:640px){ .he-tabbtn{ padding:8px 10px; font-size:12px; } .he-main-preview{ width:100%; } .he-supp{ grid-template-columns:1fr 1fr !important; } .tr-ep-grid{ grid-template-columns:1fr; } }
  </style>
  <!-- Icon font, served from our own origin. It used to come from unpkg: a
       blocked, slow or CSP-refused CDN painted every icon as an empty box and
       the buttons read as broken. onerror still marks a failure so the icon
       layer can fall back to text-only buttons. -->
  <link rel="stylesheet" href="/assets/vendor/phosphor/style.css"
        onerror="document.documentElement.classList.add('icons-unavailable')" />
  <script src="/assets/icons.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/responsive-tables.js" defer></script>
  <script src="/assets/global-search.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">

        <div class="brand-row">
          <!-- Official brand artwork, supplied by Elbakri. Do not substitute. -->

          <button class="icon-button sidebar-close" onclick="closeSidebar()" aria-label="Close menu"><i data-lucide="x"></i></button>
        </div>
        <div class="role-chip" data-i18n="app.superAdmin">Super Admin</div>
      </div>

      <div class="nav-scroll">
        <div class="nav-group">
          <div class="nav-label" data-i18n="nav.overview">Overview</div>
          <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span data-i18n="nav.dashboard">Dashboard</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-label" data-i18n="nav.management">Management</div>
          <button class="nav-item" data-page="companies"><i data-lucide="building-2"></i><span data-i18n="nav.companies">Companies</span></button>

          <div class="nav-label" data-i18n="nav.services">Services</div>
          <button class="nav-item" data-page="destinations"><i data-lucide="map"></i><span data-i18n="nav.destinations">Destinations</span></button>
          <button class="nav-item" data-page="hotels"><i data-lucide="hotel"></i><span data-i18n="nav.hotels">Hotels</span></button>
          <button class="nav-item" data-page="cruises"><i data-lucide="ship"></i><span data-i18n="nav.nileCruises">Nile Cruises</span></button>
          <button class="nav-item" data-page="activities"><i data-lucide="map-pin"></i><span data-i18n="nav.activities">Activities</span></button>
          <button class="nav-item" data-page="transport"><i data-lucide="bus"></i><span data-i18n="nav.transport">Transport</span></button>

          <button class="nav-item" data-page="airport-assist"><i data-lucide="plane-landing"></i><span data-i18n="nav.airportAssist">Airport Assist</span></button>
          <button class="nav-item" data-page="sim-card"><i data-lucide="credit-card"></i><span data-i18n="nav.simCard">SIM Card</span></button>
          <button class="nav-item" data-page="offers"><i data-lucide="tag"></i><span data-i18n="nav.offers">Offers</span></button>

        <div class="nav-group">
          <div class="nav-label" data-i18n="nav.finance">Finance</div>
          <button class="nav-item" data-page="quote-requests"><i data-lucide="mail-question"></i><span data-i18n="nav.quoteRequests">Quote Requests</span><span class="nav-count" id="pendingQuoteCount">0</span></button>
          <button class="nav-item" data-page="bookings"><i data-lucide="briefcase-business"></i><span data-i18n="nav.bookings">Bookings</span><span class="nav-count" id="pendingCount">0</span></button>
          <button class="nav-item" data-page="invoices"><i data-lucide="receipt-text"></i><span data-i18n="nav.invoices">Invoices</span></button>
          <button class="nav-item" data-page="wallet"><i data-lucide="wallet-cards"></i><span data-i18n="nav.wallet">Wallet</span></button>
          <button class="nav-item" data-page="reports"><i data-lucide="chart-column"></i><span data-i18n="nav.reports">Reports</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-label" data-i18n="nav.tools">Tools</div>
          <button class="nav-item" data-page="ui-builder"><i data-lucide="layout-template"></i><span data-i18n="nav.uiBuilder">UI Builder</span></button>
          <button class="nav-item" data-page="request-forms"><i data-lucide="text-cursor-input"></i><span data-i18n="nav.requestForms">Request Forms</span></button>
          <button class="nav-item" data-page="hotel-enrichment"><i data-lucide="image-play"></i><span>Hotel Enrichment</span></button>
          <button class="nav-item" data-page="sheets-config"><i data-lucide="sheet"></i><span data-i18n="nav.sheetsConfig">Sheets Config</span></button>
          <button class="nav-item" data-page="calculators"><i data-lucide="calculator"></i><span data-i18n="nav.calculators">Calculators</span></button>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="account-mini">
          <div class="avatar" id="userInitial">A</div>
          <div class="truncate">
            <div class="account-name truncate" id="sidebarUserName">Admin</div>
            <div class="account-role truncate" data-i18n="app.adminPortal">Admin Portal</div>
          </div>
        </div>
        <button class="btn btn-danger" style="width:100%;margin-top:10px" onclick="logout()">
          <i data-lucide="log-out"></i><span data-i18n="nav.logout">Logout</span>
        </button>

    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <div class="main-content">
      <header class="topbar">
        <button class="icon-button mobile-menu" onclick="toggleSidebar()" aria-label="Menu"><i data-lucide="menu"></i></button>
        <button class="icon-button sidebar-collapse-btn" onclick="toggleSidebarCollapse()" aria-label="Collapse sidebar" title="Collapse sidebar"><i data-lucide="panel-left"></i></button>
        <div class="breadcrumb">
          <div class="breadcrumb-label" data-i18n="app.superAdmin">Super Admin</div>
          <div class="breadcrumb-title" id="breadcrumbTitle">Dashboard</div>

        <label class="quick-search">
          <i data-lucide="search"></i>
          <input id="globalSearch" data-i18n-placeholder="topbar.search" placeholder="Search booking, company, client" />

        <div class="topbar-spacer"></div>
        <div class="wallet-pill" title="Agent wallet exposure">

          <span data-i18n="topbar.platformWallet">Platform Wallet</span>
          <strong id="walletPillValue">USD 0.00</strong>
        </div>
        <button class="refresh-pill" onclick="refreshCurrentPage()" title="Refresh">
          <i data-lucide="refresh-cw"></i><span id="lastRefresh" data-i18n="topbar.justNow">Just now</span>
        </button>
        <div class="lang-toggle" role="group" aria-label="Language">

        <div class="theme-toggle" role="group" data-i18n-label="theme.label" aria-label="Theme">
          <button type="button" data-theme-set="light" data-i18n-title="theme.light" title="Light" aria-label="Light"><i data-lucide="sun"></i></button>
          <button type="button" data-theme-set="dark" data-i18n-title="theme.dark" title="Dark" aria-label="Dark"><i data-lucide="moon"></i></button>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" data-i18n-label="topbar.notifications" title="Notifications"><i data-lucide="bell"></i></button>
          <button class="icon-button" data-i18n-label="topbar.help" title="Help"><i data-lucide="circle-help"></i></button>

      <main class="page-wrap" id="content"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="modalHost"></div>

<script>
const { t, initI18n, applyTranslations, formatMoney, formatDate, formatNumber } = window.PortalI18n;

const state = {
  page: "dashboard",
  renderToken: 0,
  companies: [],
  companiesMeta: { page: 1, limit: 20, total: 0, pages: 1 },
  companyFilters: { page: 1, limit: 20, search: "", tier: "", isActive: "", country: "" },
  userFilters: { includeInactive: false },
  selectedCompanies: new Set(),
  selectedTransportRates: new Set(),
  currentCompany: null,
  cache: {},
  sort: {},
  // Mirrors the document language so the "show the Arabic label" checks
  // in this file actually answer yes when the portal is in Arabic.
  lang: document.documentElement.lang || localStorage.getItem("lang") || "en",
};

// Currencies a PRICE can be entered in. Deliberately wider than
// COMPANY_DISPLAY_CURRENCIES below: a company's wallet is billed in USD or EGP,
// but a supplier contract can be written in any of these — a Gulf hotel quoting
// SAR, a Jordanian transfer in JOD. The list used to be copy-pasted in seven
// places and had drifted apart (some copies were missing GBP), so every price
// dropdown now reads from here.
/**
 * Airports come from the admin-managed Airport table, so any code an admin adds
 * under Transport → Airports is immediately offered everywhere an airport is
 * picked. Cached for the session; ensureAirportOptions() refreshes it.
 */
async function ensureAirportOptions(force = false) {
  if (!force && state.cache.airportOptions) return state.cache.airportOptions;
  const res = await apiFetch("/airports");
  state.cache.airportOptions = (res?.data || []).map(a => ({
    code: a.code,
    label: `${a.code} · ${state.lang === "ar" ? (a.nameAr || a.nameEn) : a.nameEn}`,
  }));
  return state.cache.airportOptions;
}

/**
 * The three areas a security approval can be filed for. Served by the API so the
 * admin offers exactly what it accepts, and kept raw so the label follows the
 * language the page is being read in.
 */
async function ensureSecurityDestinations() {
  if (state.cache.securityDestinations) return state.cache.securityDestinations;
  const res = await apiFetch("/visa-applications/destinations");
  const list = res?.data || [];
  // Only remember a list that actually arrived — caching a failed fetch would
  // leave the dropdown empty for the rest of the session.
  if (list.length) state.cache.securityDestinations = list;
  return list;
}

/**
 * The three nationalities approvals are filed for. Same shape and same reason
 * as the destinations list above: served by the API so the admin prices exactly
 * the passports the portal will accept.
 */
async function ensureSecurityNationalities() {
  if (state.cache.securityNationalities) return state.cache.securityNationalities;
  const res = await apiFetch("/visa-applications/nationalities");
  const list = res?.data || [];
  if (list.length) state.cache.securityNationalities = list;
  return list;
}

function securityNationalityOptions() {
  return (state.cache.securityNationalities || []).map(n => [n.code, state.lang === "ar" ? n.ar : n.en]);
}

function securityNationalityLabel(code) {
  if (!code) return "";
  const found = (state.cache.securityNationalities || []).find(n => n.code === code);
  return found ? (state.lang === "ar" ? found.ar : found.en) : code;
}

/** [code, label] pairs for a <select>, in the reader's language. */
function securityDestinationOptions() {
  return (state.cache.securityDestinations || []).map(d => [d.code, state.lang === "ar" ? d.ar : d.en]);
}

function securityDestinationLabel(code) {
  if (!code) return "";
  const found = (state.cache.securityDestinations || []).find(d => d.code === code);
  return found ? (state.lang === "ar" ? found.ar : found.en) : code;
}

/**
 * The destination list every "where does this belong?" dropdown is built from,
 * so an activity, a hotel and a transfer all offer exactly the destinations the
 * Destinations page manages — add one there (or inline) and it shows up here.
 * Cached for the session; pass force after creating a destination.
 */
async function ensureDestinationOptions(force = false) {
  if (!force && state.cache.destinationOptions) return state.cache.destinationOptions;
  const res = await apiFetch("/destinations?limit=300");
  state.cache.destinationOptions = (res?.data || []).filter(d => d && d.id);
  return state.cache.destinationOptions;
}

/** Label a destination in the reader's language, keeping the other name visible. */
function destinationLabel(d) {
  const primary = state.lang === "ar" ? (d.nameAr || d.name) : d.name;
  const secondary = state.lang === "ar" ? (d.nameAr ? d.name : "") : (d.nameAr || "");
  return secondary ? `${primary} · ${secondary}` : primary;
}

/** [code, label] pairs for a <select>, falling back to the code alone. */
function airportSelectOptions() {
  return (state.cache.airportOptions || []).map(a => [a.code, a.label]);
}

const PORTAL_CURRENCIES = [
  "EGP", "USD", "EUR", "GBP",
  "SAR", "AED", "KWD", "QAR", "BHD", "OMR",  // Gulf
  "JOD", "ILS",                               // Middle East / Arab 48
  "MAD", "TND", "DZD", "LYD",                 // North Africa
];

const COMPANY_DISPLAY_CURRENCIES = ["USD", "EGP"];

function companyDefaultCurrency(market) {
  return market === "EGYPTIAN" ? "EGP" : "USD";
}

function normalizedCompanyCurrency(value, market) {
  const cur = String(value || "").toUpperCase();
  return COMPANY_DISPLAY_CURRENCIES.includes(cur) ? cur : companyDefaultCurrency(market);
}

function companyCurrencyOptions(selected, market) {
  const value = normalizedCompanyCurrency(selected, market);
  return COMPANY_DISPLAY_CURRENCIES
    .map(cur => `<option value="${cur}" ${cur === value ? "selected" : ""}>${t("currency."+cur, cur)}</option>`)
    .join("");
}

const pageMeta = {
  dashboard: ["page.dashboardTitle", "page.dashboardSub"],
  companies: ["page.companiesTitle", "page.companiesSub"],
  users: ["page.usersTitle", "page.usersSub"],
  hotels: ["page.hotelsTitle", "page.hotelsSub"],
  "sheets-config": ["page.sheetsTitle", "page.sheetsSub"],
  bookings: ["page.bookingsTitle", "page.bookingsSub"],
  invoices: ["page.invoicesTitle", "page.invoicesSub"],
  wallet: ["page.walletTitle", "page.walletSub"],
  reports: ["page.reportsTitle", "page.reportsSub"],
  cruises: ["nav.nileCruises", "page.servicesSub"],
  transport: ["nav.transport", "page.servicesSub"],
  activities: ["nav.activities", "page.servicesSub"],
  "security-approval": ["page.securityApprovalTitle", "page.securityApprovalSub"],
  "airport-assist": ["page.airportAssistTitle", "page.airportAssistSub"],
  // Settings tabs of the two pages above. Without their own entry the header
  // fell through to the dashboard's title, so the page read "Dashboard".
  visa: ["page.visaFeesTitle", "page.visaFeesSub"],
  reception: ["page.receptionServicesTitle", "page.receptionServicesSub"],
  "sim-card": ["page.simCardTitle", "page.simCardSub"],
  offers: ["page.offersTitle", "page.offersSub"],
  "ui-builder": ["page.uiBuilderTitle", "page.uiBuilderSub"],
  "request-forms": ["page.requestFormsTitle", "page.requestFormsSub"],
  "hotel-enrichment": ["page.enrichTitle", "page.enrichSub"],
  calculators: ["page.calculatorsTitle", "page.calculatorsSub"],
  destinations: ["nav.destinations", "page.destinationsSub"],
  "quote-requests": ["nav.quoteRequests", "page.quoteRequestsSub"],
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineJsonArg(value) {
  return escapeHtml(JSON.stringify(String(value ?? "")));
}

/** Render a request's dynamic customFields (from a Request Form Builder template). */
function customFieldsBlock(cf) {
  if (!cf || typeof cf !== "object" || Array.isArray(cf)) return "";
  // Cruise selections have a dedicated operations card below. Hiding their
  // internal keys here also prevents the same information appearing twice.
  const visibleFields = Object.entries(cf).filter(([key]) => !key.startsWith("cruise"));
  if (!visibleFields.length) return "";
  const rows = visibleFields.map(([k, v]) => {
    const val = Array.isArray(v) ? v.join(", ") : String(v);
    return `<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)">
      <span style="min-width:150px;color:var(--text-muted);font-weight:600">${escapeHtml(k)}</span>
      <span style="flex:1">${escapeHtml(val)}</span></div>`;
  }).join("");
  return `<div class="full" style="grid-column:1/-1;margin-top:8px">
    <strong>${t("quoteDetail.customFields", "Additional Fields")}:</strong>
    <div style="margin-top:6px">${rows}</div>
  </div>`;
}

function cruiseQuoteDayLabel(day) {
  const value = String(day || "").toLowerCase();
  return value ? value.charAt(0).toUpperCase() + value.slice(1) : "—";
}

/** Turn the flat request snapshot into the information operations actually
 * needs: the sailing/programme and the exact one-way or round-trip vehicle. */
function cruiseSelectionBlock(q) {
  const cf = q?.customFields;
  if (!cf || typeof cf !== "object" || Array.isArray(cf) || !cf.cruiseProductMode) return "";
  const mode = cf.cruiseProductMode;
  const productLabel = mode === "PROGRAMME"
    ? t("cruise.cruiseWithProgramme", "Cruise + programme")
    : mode === "TRANSFER"
      ? t("cruise.cruiseWithTransfer", "Cruise + transfer")
      : t("cruise.cruiseOnly", "Cruise only");
  const [departureDay, returnDay] = String(cf.cruiseScheduleRoute || "").split("_TO_");
  const route = departureDay && returnDay
    ? `${cruiseQuoteDayLabel(departureDay)} → ${cruiseQuoteDayLabel(returnDay)}`
    : "—";
  const currency = cf.cruiseCurrency || q.currency || "USD";
  const rows = [
    [t("cruise.bookingType", "Booking type"), productLabel],
    [t("cruise.sailing", "Sailing"), `${route}${cf.cruiseNights ? ` · ${cf.cruiseNights} ${t("cruise.nights", "nights")}` : ""}`],
    [t("th.date", "Date"), cf.cruiseSailingDate],
    mode === "PROGRAMME" ? [t("cruise.programme", "Programme"), cf.cruiseProgrammeName || cf.cruiseProgrammeId] : null,
    cf.cruiseOccupancy ? [t("cruise.sharingBasis", "Sharing basis"), String(cf.cruiseOccupancy).replace(/_/g, " ")] : null,
    cf.cruiseAdultUnitPrice != null ? [t("cruise.adultPerPerson", "Adult · per person"), formatMoney(cf.cruiseAdultUnitPrice, currency)] : null,
    cf.cruiseChildUnitPrice != null ? [t("cruise.childPerPerson", "Child · per person"), formatMoney(cf.cruiseChildUnitPrice, currency)] : null,
    mode === "TRANSFER" ? [t("cruise.transferTripType", "Transfer type"), cf.cruiseTransferTripType === "ROUND_TRIP" ? t("cruise.roundTrip", "Round-trip") : t("cruise.oneWay", "One-way")] : null,
    mode === "TRANSFER" ? [t("cruise.route", "Transfer route"), `${q.transferFromName || "—"} → ${q.transferToName || "—"}`] : null,
    mode === "TRANSFER" ? [t("cruise.vehicle", "Vehicle"), `${String(cf.cruiseTransferVehicleType || q.transferVehicleType || "—").replace(/_/g, " ")} · ${cf.cruiseTransferVehicleCapacity || q.transferVehicleCapacity || "—"} ${t("form.passengers", "passengers")}`] : null,

function apiFetch(path, options = {}) {
  const token = localStorage.getItem("accessToken");
  return fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(options.headers || {}) },
    credentials: "include",
  }).then(async res => {
    if (res.status === 401) {
      const refresh = await fetch("/api/auth/refresh", { method: "POST", credentials: "include" });
      if (!refresh.ok) {
        localStorage.clear();
        location.href = "/login.html";
        return null;
      }
      const json = await refresh.json();
      localStorage.setItem("accessToken", json.data.accessToken);
      return apiFetch(path, options);
    }
    const json = await res.json().catch(() => ({ success: false, message: res.statusText }));
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Request failed");
    return json;
  }).catch(err => {
    toast(err.message || "Request failed", "error");
    return null;
  });
}

async function downloadInvoicePdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/invoices/${id}/pdf`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "PDF download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `invoice-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "PDF download failed", "error");
  }
}

// Open a private customer document (passport / flight ticket). Protected uploads
// (/api/files/private/...) are fetched with the bearer token and shown as a blob;
// legacy public /uploads paths or externally-pasted URLs open directly.
async function openPrivateDoc(url, fallbackName) {
  if (!url) return;
  if (/^\/api\/files\//.test(url)) {
    const token = localStorage.getItem("accessToken");
    try {
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` }, credentials: "include" });
      if (!res.ok) {
        const json = await res.json().catch(() => null);
        throw new Error(json?.message || json?.error || "File access failed");
      }
      const blobUrl = URL.createObjectURL(await res.blob());
      window.open(blobUrl, "_blank");
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (err) {
      toast(err.message || "File access failed", "error");
    }
  } else {
    window.open(url, "_blank");
  }
}

// Disable a submit button and show a spinner while an async action runs.
function setBtnLoading(btn, loading, labelKey) {
  if (!btn) return;
  if (loading) {
    if (btn._restore === undefined) btn._restore = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="btn-spin">${icon("loader-2")}</span>${t(labelKey || "btn.saving", "Saving")}`;
    refreshIcons(btn);
  } else {
    btn.disabled = false;
    if (btn._restore !== undefined) { btn.innerHTML = btn._restore; btn._restore = undefined; refreshIcons(btn); }
  }
}

function exportRows(filename, rows) {
  if (!rows || !rows.length) {
    toast(t("toast.noRowsSelected"), "warning");
    return;
  }
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "Export");
    XLSX.writeFile(wb, `${filename}.xlsx`);
  } else {
    // The spreadsheet library is a third-party CDN; when it does not load, the
    // browser builds the file itself. The UTF-8 BOM is what makes Excel read
    // Arabic names correctly instead of as mojibake.
    const headers = Object.keys(rows[0]);
    const cell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
    const csv = [headers.join(","), ...rows.map(row => headers.map(h => cell(row[h])).join(","))].join("\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `${filename}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoking in the same tick can cancel the download in some browsers.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  toast(t("toast.exported"), "success");
}

function formatRevenueSummary(revenueByCurrency, fallbackAmount = 0, fallbackCurrency = "USD") {
  const entries = Object.entries(revenueByCurrency || {})
    .filter(([, amount]) => Number(amount) !== 0)
    .sort(([a], [b]) => a.localeCompare(b));
  if (!entries.length) return formatMoney(fallbackAmount || 0, fallbackCurrency || "USD");
  return entries.map(([currency, amount]) => formatMoney(amount, currency)).join(" · ");
}

function miniTable(titleKey, rows, columns) {
  const body = rows.length ? rows.map(row => `<tr>${columns.map(([, fn]) => `<td>${fn(row)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${columns.length}">${emptyBlock("empty.noData")}</td></tr>`;
  return `<section class="panel">
    <div class="panel-header"><div><div class="panel-title">${t(titleKey)}</div><div class="panel-subtitle">${t("topbar.justNow")}</div></div></div>
    <div class="table-scroll"><table class="data-table"><thead><tr>${columns.map(([k]) => `<th>${labelText(k)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
  </section>`;
}

function option(value, key) {

async function ensureCompanyOptions(force = false) {
  if (!force && state.cache.companyOptions?.length) return;
  const res = await apiFetch("/admin/companies?includeInactive=true&limit=1000");
  state.cache.companyOptions = res?.data || [];
}

let companiesTimer;
function debouncedCompanies() {
  clearTimeout(companiesTimer);
  companiesTimer = setTimeout(() => loadCompanies(1), 250);
}

function resetCompanyFilters() {
  ["coSearch", "coTier", "coActive", "coCountry"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
  const active = document.getElementById("coActive");
  if (active) active.value = "true";
  loadCompanies(1);
}

async function loadCompanies(page = state.companyFilters.page) {
  const activeValue = document.getElementById("coActive")?.value || "true";
  state.companyFilters = {
    page,
    limit: 20,
    search: document.getElementById("coSearch")?.value || "",
    tier: document.getElementById("coTier")?.value || "",
    isActive: activeValue === "all" ? "" : activeValue,
    includeInactive: activeValue === "all" ? "true" : "",
    country: document.getElementById("coCountry")?.value || "",
  };
  const params = new URLSearchParams(Object.entries(state.companyFilters).filter(([, v]) => v !== ""));
  const res = await apiFetch(`/admin/companies?${params}`);
  if (!res?.success) return;
  state.companies = res.data || [];
  state.companiesMeta = res.meta || { page, limit: 20, total: state.companies.length, pages: 1 };
  renderCompaniesTable();
}

function renderCompaniesTable() {
  const tbody = document.getElementById("companiesTbody");
  if (!tbody) return;
  if (!state.companies.length) {
    tbody.innerHTML = `<tr><td colspan="11">${emptyBlock("empty.noCompanies", `<button class="btn btn-primary" onclick="showCompanyModal()">${icon("plus")}${t("btn.newCompany")}</button>`)}</td></tr>`;
  } else {
    tbody.innerHTML = state.companies.map(c => {
      const selected = state.selectedCompanies.has(c.id);
      return `<tr class="${selected ? "selected" : ""}">
        <td><input type="checkbox" ${selected ? "checked" : ""} onchange="toggleCompanySelection('${c.id}', this.checked)"></td>
        <td><div class="logo-cell">${c.logoUrl ? `<img src="${escapeHtml(c.logoUrl)}" alt="">` : escapeHtml((c.name || "?").charAt(0).toUpperCase())}</div></td>
        <td><div class="company-cell"><div class="logo-cell">${escapeHtml((c.name || "?").slice(0, 2).toUpperCase())}</div><div class="truncate"><div class="primary-text truncate">${escapeHtml(c.name)}</div><div class="secondary-text truncate">${escapeHtml(c.email || c.nameAr || "—")}</div></div></div></td>
        <td>${tierBadge(c.tier)}</td>
        <td>${escapeHtml(c.country || "—")}</td>
        <td class="numeric">${formatMoney(c.balance, c.currency || "USD")}</td>
        <td class="numeric">${formatMoney(c.creditLimit, c.currency || "USD")}</td>
        <td>${formatNumber(c._count?.bookings || c.bookingsCount || 0)}</td>
        <td>${statusBadge(c.isActive ? "ACTIVE" : "INACTIVE")}</td>
        <td>${formatDate(c.lastActivityAt || c.updatedAt || c.createdAt)}</td>
        <td><div class="row-actions">
          <button class="icon-button btn-icon" title="${t("btn.view")}" onclick="showCompanyDetails('${c.id}')">${icon("eye")}</button>
          <button class="icon-button btn-icon" title="${t("btn.edit")}" onclick="showCompanyModal('${c.id}')">${icon("pencil")}</button>
          ${waIconButton([
            `*${t("th.company", "Company")}: ${c.name}*`,
            c.email ? `${t("th.email", "Email")}: ${c.email}` : null,
            c.phone ? `${t("th.phone", "Phone")}: ${c.phone}` : null,
            `${t("th.tier", "Tier")}: ${t("tier." + String(c.tier || "STANDARD").toUpperCase(), c.tier || "STANDARD")}`,
            `${t("th.balance", "Balance")}: ${formatMoney(c.balance, c.currency || "USD")}`,
            `${t("th.status", "Status")}: ${t("status." + (c.isActive ? "ACTIVE" : "INACTIVE"))}`,
          ], `${t("contact.whatsapp", "WhatsApp")} — ${escapeHtml(c.name)}`)}
          <button class="icon-button btn-icon" title="${t("btn.topup")}" onclick="showTopupModal('${c.id}')">${icon("wallet")}</button>
          <button class="icon-button btn-icon" title="${t("btn.toggle")}" onclick="toggleCompany('${c.id}', ${!c.isActive})">${icon(c.isActive ? "ban" : "check-circle")}</button>
          <button class="icon-button btn-icon" title="${t("btn.delete")}" onclick="deleteCompany('${c.id}')">${icon("trash-2")}</button>
        </div></td>
      </tr>`;
    }).join("");
  }
  document.getElementById("companiesFoot").innerHTML = tableFoot(state.companiesMeta, "", "loadCompanies");
  document.getElementById("companiesMetaText").textContent = `${formatNumber(state.companiesMeta.total || 0)} ${t("nav.companies")}`;
  updateCompanyBulkBar();
  refreshIcons(tbody);
}

function sortCompanies(key) {
  const direction = state.sort[key] === "asc" ? "desc" : "asc";
  state.sort = { [key]: direction };
  state.companies.sort((a, b) => String(a[key] || "").localeCompare(String(b[key] || "")) * (direction === "asc" ? 1 : -1));
  renderCompaniesTable();
}

function toggleCompanySelection(id, checked) {
  if (checked) state.selectedCompanies.add(id);
  else state.selectedCompanies.delete(id);
  renderCompaniesTable();
}

function toggleAllCompanies(checked) {
  if (checked) state.companies.forEach(c => state.selectedCompanies.add(c.id));
  else state.companies.forEach(c => state.selectedCompanies.delete(c.id));
  renderCompaniesTable();
}

function updateCompanyBulkBar() {
  const count = state.selectedCompanies.size;
  const bar = document.getElementById("companyBulkBar");
  if (!bar) return;
  bar.classList.toggle("show", count > 0);
  document.getElementById("companySelectedCount").textContent = `${formatNumber(count)} selected`;
}

function companyRows(selectedOnly) {
  const rows = selectedOnly ? state.companies.filter(c => state.selectedCompanies.has(c.id)) : state.companies;
  return rows.map(c => ({
    Name: c.name,
    Email: c.email,
    Tier: c.tier,
    Country: c.country,
    Balance: Number(c.balance || 0),
    CreditLimit: Number(c.creditLimit || 0),
    Bookings: c._count?.bookings || 0,
    Status: c.isActive ? "Active" : "Inactive",
  }));
}

function exportCompanyRows(selectedOnly) {
  exportRows("companies", companyRows(selectedOnly));
}

async function importHotelsExcel(input) {
  const file = input?.files?.[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  const importBtn = document.getElementById("hotelsImportBtn");
  setBtnLoading(importBtn, true, "btn.importing");
  toast(t("toast.syncStarted", "Import started"), "");
  try {
    const res = await fetch("/api/hotels/import-excel", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json();
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Import failed");
    const { created = 0, updated = 0, total = 0 } = json.data || {};
    toast(`${t("toast.syncComplete", "Import complete")} — +${created}, ~${updated} / ${total}`, "success");
    renderHotels();
  } catch (err) {
    toast(err.message || "Import failed", "error");
  } finally {
    setBtnLoading(importBtn, false);
    input.value = "";
  }
}

// Upload an image to the shared /api/upload endpoint. Validates type + size on
// the client (the server re-validates) and returns the stored URL, or null.
async function uploadImageToServer(file) {
  const okTypes = ["image/jpeg", "image/png", "image/gif", "image/webp"];
  if (!okTypes.includes(file.type)) {
    toast(t("upload.badType", "Only JPG, PNG, GIF or WebP images are allowed"), "error");
    return null;
  }
  if (file.size > 10 * 1024 * 1024) {
    toast(t("upload.tooLarge", "Image must be under 10 MB"), "error");
    return null;
  }
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json?.success) throw new Error(json?.message || json?.error || "Upload failed");
    return json.data.url;
  } catch (err) {
    toast(err.message || t("upload.failed", "Upload failed"), "error");
    return null;
  }
}

function actTimeValueAdmin(raw) {
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(raw ?? "").trim());
  if (!m) return "";
  let hour = Number(m[1]);
  const minute = Number(m[2]);
  const suffix = (m[3] || "").toUpperCase();
  if (suffix === "PM" && hour !== 12) hour += 12;
  if (suffix === "AM" && hour === 12) hour = 0;
  if (hour > 23 || minute > 59) return "";
  return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
}

/** Keep the real saved checkbox and the two clear status cards in lockstep. */

  const id = `m_${entity.replace(/[^a-z0-9]/gi, "_")}_${fieldDef.name}`;

    return `<div class="form-field full activity-transfer-admin" id="${id}_card" data-included="${included ? "1" : "0"}">

        <label class="activity-transfer-choice activity-transfer-choice--included ${included ? "is-selected" : ""}" id="${id}_yesChoice">
          <input type="radio" name="${id}_mode" value="included" ${included ? "checked" : ""} onchange="adminActivityTransferMode(true)">
          <span><b>${t("activityAdmin.includedInPrice", "Included in price")}</b></span>

        <div class="form-grid activity-transfer-admin__grid">
          <div class="form-field"><label>${t("activityAdmin.transferPrice", "Transfer price")} · ${escapeHtml(currency)} <span class="required">*</span></label><input id="${fieldId("transferPrice")}" type="number" min="0" step="0.01" value="${escapeHtml(price)}" placeholder="0.00"><small class="field-hint">${t("activityAdmin.pricePerBooking", "Fixed price once per booking")}</small></div>
          <div class="form-field"><label>${t("activityAdmin.transferFrom", "Pickup from")} <span class="required">*</span></label><input id="${fieldId("transferFromName")}" value="${escapeHtml(from)}" placeholder="${escapeHtml(t("activityAdmin.transferFromPlaceholder", "Hotel / area / address"))}"></div>
          <div class="form-field"><label>${t("activityAdmin.transferTo", "Return to")} <span class="required">*</span></label><input id="${fieldId("transferToName")}" value="${escapeHtml(to)}" placeholder="${escapeHtml(t("activityAdmin.transferToPlaceholder", "Activity point / hotel / area"))}"></div>

        </div>

      </div>
    </div>`;
  }

  if (fieldDef.type === "textarea" || fieldDef.type === "list") {
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><textarea id="${id}" rows="3">${escapeHtml(value)}</textarea>${help}</div>`;
  }
  if (fieldDef.type === "select") {
    // "— None —" reads as "nothing", which is wrong where blank means "applies
    // to all of them" — such a field names what its blank stands for instead.
    const emptyText = fieldDef.emptyKey ? t(fieldDef.emptyKey, fieldDef.emptyLabel) : (fieldDef.emptyLabel || "None");
    const emptyOpt = fieldDef.nullable ? `<option value="" ${!value ? "selected" : ""}>— ${escapeHtml(emptyText)} —</option>` : "";
    // options may be a plain array or a function, so a field can be built from
    // admin-managed data (airports) instead of a list frozen in the source.
    const opts = typeof fieldDef.options === "function" ? fieldDef.options() : fieldDef.options;
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label><select id="${id}">${emptyOpt}${opts.map(opt => {
      const [v, lbl] = Array.isArray(opt) ? opt : [opt, String(opt).replace(/_/g, " ")];
      return `<option value="${escapeHtml(v)}" ${v === value ? "selected" : ""}>${escapeHtml(lbl)}</option>`;
    }).join("")}</select>${help}</div>`;
  }
  if (fieldDef.type === "hotelSelect") {
    const hotels = state.cache.hotelOptions || [];

  }
  if (fieldDef.type === "checkbox") {
    // "Transfer included in the fare — [x] Active" reads as nonsense. A field
    // may name what ticking it actually means; the rest keep the old wording.
    const on = fieldDef.checkKey ? t(fieldDef.checkKey, fieldDef.checkLabel) : (fieldDef.checkLabel || t("status.ACTIVE"));
    return `<div class="form-field form-check-card ${fieldDef.cls || ""}"><label class="form-check-control"><input id="${id}" type="checkbox" ${value ? "checked" : ""}><span><b>${label}</b><small>${escapeHtml(on)}</small></span></label>${help}</div>`;
  }
  // The destination this record belongs to, drawn from the Destinations page —
  // one list, so a destination added there is instantly offered here. The ＋
  // button adds a missing destination without losing the half-filled form.
  if (fieldDef.type === "destinationSelect") {
    const list = state.cache.destinationOptions || [];
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="${id}" style="flex:1">
          <option value="">— ${t("form.pickDestination", "Pick a destination")} —</option>
          ${list.map(d => `<option value="${escapeHtml(d.id)}" ${d.id === value ? "selected" : ""}>${escapeHtml(destinationLabel(d))}</option>`).join("")}

      </div>
      <div id="${id}_new" style="display:none;margin-top:8px;padding:10px;border:1px dashed var(--border);border-radius:8px">
        <div class="secondary-text" style="margin-bottom:6px">${t("form.newDestinationHint", "Add a destination that is missing — it is saved to the Destinations page too.")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <input id="${id}_newName" style="flex:1;min-width:140px" placeholder="${escapeHtml(t("form.name", "Name"))}">

          <button type="button" class="btn btn-primary" id="${id}_newSave" onclick="masterSaveNewDestination('${id}')">${t("btn.save", "Save")}</button>
        </div>
      </div>${help}</div>`;
  }
  // One uploaded picture: the URL lives in a hidden input so the existing form
  // collector still just reads .value, while the admin only ever sees a preview.
  if (fieldDef.type === "image") {
    return `<div class="form-field ${fieldDef.cls || ""}"><label>${label}</label>
      <input type="hidden" id="${id}" value="${escapeHtml(value)}">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">

  }
  // Several pictures. Same trick — a hidden newline-separated list, rendered as

/**
 * Read whatever the boat already holds into the editor's shape.
 *
 * A row saved before this existed has nothing at all, and one edited straight
 * in the database may be missing a day number — it falls back to its position
 * rather than being dropped, which is the same rule the server applies.
 */
function itineraryRowsFrom(raw) {
  if (!Array.isArray(raw)) return [];
  const rows = [];
  for (const entry of raw) {
    if (!entry || typeof entry !== "object") continue;
    const title = String(entry.title ?? "").trim();
    const titleAr = String(entry.titleAr ?? "").trim();
    const description = String(entry.description ?? "").trim();
    const descriptionAr = String(entry.descriptionAr ?? "").trim();
    if (!title && !titleAr && !description && !descriptionAr) continue;
    const day = Number(entry.day);
    rows.push({
      day: Number.isInteger(day) && day >= 1 ? day : rows.length + 1,
      title, titleAr, description, descriptionAr,
    });
  }
  return rows;
}

  return `<div class="itin-row" data-index="${index}">

    </div>
    <div class="itin-row-fields">

/**
 * Read whatever the row already holds into the editor's shape.
 *
 * A trip saved before this existed has two flat lists and no marked list, so
 * they are folded in — everything under "includes" is included, everything
 * under "excludes" is not — and the operator's earlier work is not lost.
 */
function inclusionRowsFrom(raw, row) {
  const rows = [];
  const seen = new Set();
  const push = (label, labelAr, included) => {
    const text = String(label ?? "").trim();
    if (!text || seen.has(text.toLowerCase())) return;
    seen.add(text.toLowerCase());
    rows.push({ label: text, labelAr: String(labelAr ?? "").trim(), included });
  };
  if (Array.isArray(raw) && raw.length && typeof raw[0] === "object") {
    for (const r of raw) push(r?.label, r?.labelAr, r?.included !== false);
    return rows;
  }
  // No marked list on this row yet: fold in whatever the two flat lists hold,
  // so an editor opened on an older trip starts with the operator's own words.
  if (Array.isArray(raw)) for (const x of raw) push(x, "", true);
  for (const x of (row?.includes || [])) push(x, "", true);
  for (const x of (row?.excludes || [])) push(x, "", false);
  return rows;
}

async function masterPickImage(id, input) {

  const url = await uploadImageToServer(file);

async function masterPickGallery(id, input) {
  const files = Array.from(input?.files || []);
  if (!files.length) return;
  const btn = document.getElementById(`${id}_btn`);
  setBtnLoading(btn, true, "btn.uploading");
  // Upload one at a time so a single rejected file does not lose the others.
  const urls = masterReadGallery(id);
  for (const file of files) {
    const url = await uploadImageToServer(file);
    if (url) urls.push(url);
  }
  setBtnLoading(btn, false);
  input.value = "";
  masterWriteGallery(id, urls);

async function showMasterModal(entity, id = "") {
  // Hotels and transport use dedicated tabbed editors (rich images / policies /
  // rate matrix; typed endpoints + dual EGP/USD pricing).
  if (entity === "hotels") return openHotelEditor(id);
  if (entity === "transport") return openTransportRateEditor(id);
  const cfg = masterConfigs[entity];
  if (!cfg) return;
  // The reception form's airport list is admin-managed, so load it before the
  // dropdown is built — otherwise it renders empty on first open.
  if (entity === "reception") await ensureAirportOptions();
  // The destination dropdown is built from admin-managed data, so load it
  // before the markup is generated — otherwise it renders empty on first open.
  if (masterConfigs[entity].fields.some(f => f.type === "destinationSelect")) await ensureDestinationOptions();
  const rows = state.cache[entity + "Rows"] || [];
  let row = id ? rows.find(item => item.id === id) : null;
  const title = `${id ? t("btn.edit") : t("btn.addNew")} ${t(cfg.titleKey)}`;

  // The catalogue list intentionally contains only active rows for the agent
  // view. Editing must fetch the complete tables, including disabled periods,
  // or saving this combined form would silently delete them.
  if (entity === "cruises" && id) {
    const [rateRes, scheduleRes] = await Promise.all([
      apiFetch(`/cruises/${id}/rates`).catch(() => null),
      apiFetch(`/cruises/${id}/schedules`).catch(() => null),
    ]);
    row = {
      ...(row || {}),
      cabinRates: rateRes?.data || row?.cabinRates || [],
      schedules: scheduleRes?.data || row?.schedules || [],
    };
  }

  // Prefetch existing per-market price overrides when editing
  const mpData = {};
  if (cfg.marketPrices && id) {
    window._mpCompanies = await mpLoadCompanies();
    for (const mp of cfg.marketPrices) {
      const res = await apiFetch(`/admin/price-rows?entityType=${mp.entityType}&entityId=${encodeURIComponent(id)}`).catch(() => null);
      mpData[mp.entityType] = res?.data || [];
    }
  }

  const basicSection = `<div class="form-section"><div class="form-section-title">${t("form.basicInfo")}</div><div class="form-grid">
    ${cfg.fields.map(fieldDef => masterField(entity, fieldDef, row)).join("")}
  </div></div>`;
  const body = entity === "cruises"
    ? cruiseCatalogueFormSection(row, basicSection)
    : `${basicSection}${cfg.marketPrices ? marketPriceSection(entity, cfg, mpData, id) : ""}`;
  openModal(title, body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" id="masterSaveBtn" onclick="saveMasterRecord('${entity}', '${id}')">${t("btn.save")}</button>
  `);
  if (entity === "cruises") crSyncRateTitles();
}

  const safe = entity.replace(/[^a-z0-9]/gi, "_");

function collectMasterPayload(entity) {
  const cfg = masterConfigs[entity];
  const payload = {};
  let valid = true;
  for (const fieldDef of cfg.fields) {
    const id = `m_${entity.replace(/[^a-z0-9]/gi, "_")}_${fieldDef.name}`;
    const el = document.getElementById(id);
    if (!el) continue;
    let value = (fieldDef.type === "checkbox" || fieldDef.type === "activityTransfer") ? el.checked : el.value.trim();
    if (fieldDef.required && (value === "" || value === null || value === undefined)) valid = false;
    // A blank number is only a zero when the field must carry one. Where blank
    // means "not sold this way" — an excursion with no triple price, say — it
    // has to reach the API as null, or the record would advertise it as free.
    if (fieldDef.type === "number") value = value === "" ? (fieldDef.nullable ? null : 0) : Number(value);
    if (fieldDef.type === "list") value = String(value || "").split(/[\n,]+/).map(item => item.trim()).filter(Boolean);
    if (fieldDef.type === "gallery") value = String(value || "").split(/\n+/).map(item => item.trim()).filter(Boolean);
    if (fieldDef.type === "inclusions" || fieldDef.type === "itinerary") {
      try { value = JSON.parse(value || "[]"); } catch { value = []; }
    }
    if (fieldDef.nullable && value === "") value = null;
    if (value !== "" || value === null || fieldDef.required || fieldDef.type === "number" || fieldDef.type === "list" || fieldDef.type === "gallery" || fieldDef.type === "inclusions" || fieldDef.type === "itinerary") {
      payload[fieldDef.name] = value;
    }
  }
  return valid ? payload : null;
}

async function saveMasterRecord(entity, id = "") {
  const cfg = masterConfigs[entity];
  const payload = collectMasterPayload(entity);
  if (!payload) {
    toast(t("toast.validationError"), "error");
    return;
  }
  // "Not included" is a sellable paid add-on, not a label. Refuse the save
  // until it has everything the booking needs; otherwise the agent sees an
  // Add transfer button that can only fail with "price not configured".
  if (entity === "activities" && payload.transferIncluded === false) {
    const requiredTransferFields = [
      ["transferPrice", "activityAdmin.transferPrice", "Transfer price"],
      ["transferFromName", "activityAdmin.transferFrom", "Pickup from"],
      ["transferToName", "activityAdmin.transferTo", "Return to"],
    ];
    const missing = requiredTransferFields.find(([field]) => payload[field] === null || payload[field] === "" || payload[field] === undefined);
    if (missing) {
      const input = document.getElementById(`m_activities_${missing[0]}`);
      toast(`${t("toast.validationError", "Check required fields")}: ${t(missing[1], missing[2])}`, "error");
      input?.scrollIntoView({ behavior: "smooth", block: "center" });
      input?.focus();
      return;
    }
  }
  const cruiseCatalogue = entity === "cruises" ? {
    schedules: crCollectScheduleRows(),
    rates: crCollectRateRows(),
    programmes: [],
    transferRates: [],
  } : null;
  if (cruiseCatalogue && !crValidateCatalogue(cruiseCatalogue)) return;
  // A cruise is priced only by its period rows. Clear any legacy headline the
  // first time an older boat is saved in the new editor.
  if (entity === "cruises") payload.priceFrom = null;
  const saveBtn = document.getElementById("masterSaveBtn");
  setBtnLoading(saveBtn, true, "btn.saving");
  const res = await apiFetch(id ? `${cfg.endpoint}/${id}` : cfg.endpoint, {
    method: id ? "PATCH" : "POST",
    body: JSON.stringify(payload),
  });
  if (!res?.success) { setBtnLoading(saveBtn, false); return; }
  if (res?.success) {
    // Persist the Egyptian override. International customers use the base price.
    const savedId = id || res.data?.id;
    if (cfg.marketPrices && savedId) {
      const safe = entity.replace(/[^a-z0-9]/gi, "_");
      for (const mp of cfg.marketPrices) {
        const cid = `mpRows_${safe}_${mp.entityType}`;
        if (!document.getElementById(cid)) continue;
        await apiFetch("/admin/price-rows", {
          method: "PUT",
          body: JSON.stringify({ entityType: mp.entityType, entityId: savedId, rows: mpCollectRows(cid) }),
        }).catch(() => null);
      }
    }
    if (cruiseCatalogue && savedId) {
      // Schedules are replaced and receive new ids, so save them first and map
      // every fare/programme/transfer from its visible row index to the saved id.
      const scheduleRes = await apiFetch(`/cruises/${savedId}/schedules`, {
        method: "PUT", body: JSON.stringify({ schedules: cruiseCatalogue.schedules }),
      });
      if (!scheduleRes?.success) {
        setBtnLoading(saveBtn, false);
        toast(t("cruise.catalogueSaveFailed","The cruise was saved, but its periods could not be saved. Please try again."), "error");
        return;
      }
      const savedSchedules = scheduleRes.data || [];
      const withScheduleId = row => ({
        ...row,
        scheduleId: savedSchedules[row.scheduleIndex]?.id || null,
        scheduleIndex: undefined,
      });
      const rates = cruiseCatalogue.rates.map(withScheduleId);
      const rateRes = await apiFetch(`/cruises/${savedId}/rates`, { method: "PUT", body: JSON.stringify({ rates }) });
      if (!rateRes?.success) {
        setBtnLoading(saveBtn, false);
        toast(t("cruise.catalogueSaveFailed","The cruise was saved, but its programmes or prices could not be saved. Please try again."), "error");
        return;
      }
    }
    setBtnLoading(saveBtn, false);
    closeModal();
    toast(id ? t("toast.updated") : t("toast.created"), "success");
    setPage(entity);
  }
}

/**
 * The company's money, with the difference between the two numbers spelled out.
 *
 * "Credit" and "balance" were shown side by side as two amounts, which read as
 * two pots of money — so topping a company up looked like it had done nothing
 * whenever the credit limit was the number being watched. A credit limit is a
 * permission to book past the wallet, not money in it, and the panel now says
 * so, with the deposits and spend that reconcile the balance.
 */
function companyWalletPanel(c) {
  const cur = c.wallet?.currency || c.currency || "USD";
  const w = c.wallet || {};
  const tile = (labelKey, fallback, value, hint) => `
    <div class="info-item">
      <div class="info-label">${t(labelKey, fallback)}</div>
      <div class="info-value">${formatMoney(value ?? 0, cur)}</div>
      ${hint ? `<div class="secondary-text" style="margin-top:2px">${escapeHtml(hint)}</div>` : ""}
    </div>`;
  return `
    <div style="margin-top:16px">
      <div class="info-grid">
        ${tile("wallet.walletBalance", "Wallet Balance", w.balance ?? c.balance)}
        ${tile("th.creditLimit", "Credit Limit", w.creditLimit ?? c.creditLimit)}
        ${tile("wallet.availableCredit", "Available Credit", w.availableCredit)}
        ${tile("wallet.spendingPower", "Total Spending Power", w.spendingPower)}
        ${tile("wallet.totalDeposited", "Total Deposited", w.totalDeposited)}
        ${tile("wallet.totalUsed", "Total Used / Deducted", w.totalUsed)}
      </div>
      <div class="secondary-text" style="margin-top:8px;line-height:1.7">
        ${t("wallet.creditVsBalance", "Balance is money in the wallet. A credit limit is permission to book past it — raising it adds no money.")}
      </div>
    </div>`;
}

function detailTable(rows, keys) {
  if (!rows.length) return emptyBlock("empty.noData");
  return `<div class="table-scroll"><table class="data-table"><thead><tr>${keys.map(k => `<th>${escapeHtml(k)}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${keys.map(k => `<td>${formatCell(row[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function formatCell(value) {
  if (value === true) return statusBadge("ACTIVE");
  if (value === false) return statusBadge("INACTIVE");
  if (typeof value === "number") return formatMoney(value, "USD");
  if (String(value || "").match(/^\d{4}-\d{2}-\d{2}T/)) return formatDate(value);
  if (["PENDING","CONFIRMED","CANCELLED","REJECTED","COMPLETED","PAID","UNPAID","OVERDUE","CREDIT","DEBIT","REFUND"].includes(String(value))) return statusBadge(value);
  return escapeHtml(value ?? "—");
}

function switchDetailTab(tab, btn) {
  document.querySelectorAll(".detail-tabs .tab").forEach(x => x.classList.remove("active"));

async function submitTopup(ids) {
  const amount = Number(document.getElementById("topupAmount").value || 0);
  const currency = document.getElementById("topupCurrency").value;
  const description = document.getElementById("topupDescription").value.trim();
  if (amount <= 0 || !description) return toast(t("toast.validationError"), "error");
  let success = true;
  for (const id of ids) {
    const res = await apiFetch(`/admin/companies/${id}/topup`, { method: "POST", body: JSON.stringify({ amount, currency, description, notify: document.getElementById("topupNotify").checked }) });
    if (!res?.success) success = false;
  }
  if (!success) return;
  closeModal();
  toast(t("toast.topupDone"), "success");
  state.selectedCompanies.clear();
  await refreshPlatformWalletPill(currency);
  loadCompanies();
  // Topping up from a company's own page used to close it, so the new credit
  // was only visible after reopening — which read as "the top-up did nothing".
  // Reopen it on the freshly-read figures instead.
  if (ids.length === 1 && state.currentCompany?.id === ids[0]) {
    await showCompanyDetails(ids[0]);
  }
}

  if (h.imageUrl) return `<img src="${escapeHtml(hotelImageSrc(h.imageUrl))}" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover">`;
  const initials = (h.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
  return `<div style="width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--navy-800);color:#fff;font-weight:700;font-size:14px">${escapeHtml(initials)}</div>`;
}

// Upscale Booking/bstatic thumbnails (square60, max300, square600…) to large res.
function hiRes(u) {
  return String(u || "")
    .replace(/\/xdata\/images\/hotel\/(?:square|max)\d+(?:x\d+)?\//i, "/xdata/images/hotel/max1280x900/")
    .replace(/\/(?:square|max)\d+(?:x\d+)?\//i, "/max1280x900/");
}

function hotelImageSrc(u) {
  const url = hiRes(u);
  try {
    const parsed = new URL(url, window.location.origin);
    if (parsed.hostname === "bstatic.com" || parsed.hostname.endsWith(".bstatic.com")) {
      return `/media/hotel-image?url=${encodeURIComponent(parsed.href)}`;
    }
  } catch (e) {}
  return url;
}

function hotelMediaShowcase(h) {
  const urls = [...new Set([h.imageUrl, ...(h.galleryUrls || [])].filter(Boolean))].map(hotelImageSrc);
  if (!urls.length) {
    return `<div class="hotel-media-empty">${escapeHtml((h.name||"?").charAt(0).toUpperCase())}</div>`;
  }
  const id = "hms" + Math.random().toString(36).slice(2, 7);
  const name = escapeHtml(h.name || "");
  return `<div class="hotel-media-showcase" id="${id}" data-imgs='${escapeHtml(JSON.stringify(urls))}'>
    <div class="hotel-media-stage">
      <div class="hotel-media-main-scroll" onscroll="hmsSync('${id}')">
        ${urls.map((u, i) => `<button type="button" class="hotel-media-slide" onclick="hotelLightbox('${id}',${i})"><img src="${u}" alt="${name} ${i + 1}" loading="${i ? "lazy" : "eager"}"></button>`).join("")}
      </div>
      ${urls.length > 1 ? `
        <button type="button" class="hms-nav hms-prev" onclick="hmsScroll('${id}',-1)" aria-label="Previous photo">${icon("chevron-left")}</button>
        <button type="button" class="hms-nav hms-next" onclick="hmsScroll('${id}',1)" aria-label="Next photo">${icon("chevron-right")}</button>
        <div class="hms-count"><span id="${id}_i">1</span> / ${urls.length}</div>` : ""}
    </div>
    ${urls.length > 1 ? `<div class="hotel-media-thumbs" id="${id}_t">${urls.slice(0, 24).map((u, i) => `<button type="button" class="hms-thumb${i === 0 ? " active" : ""}" onclick="hmsGo('${id}',${i})"><img src="${u}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
  </div>`;
}

function hmsEl(id) { return document.querySelector("#" + id + " .hotel-media-main-scroll"); }
function hmsScroll(id, dir) { const el = hmsEl(id); if (el) el.scrollBy({ left: dir * el.clientWidth, behavior: "smooth" }); }
function hmsGo(id, i) {
  const el = hmsEl(id); if (!el) return;
  const slide = el.children[i];
  if (slide) el.scrollTo({ left: slide.offsetLeft - el.offsetLeft, behavior: "smooth" });
}
function hmsSync(id) {
  const el = hmsEl(id); if (!el) return;
  const i = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
  const idx = document.getElementById(id + "_i"); if (idx) idx.textContent = i + 1;
  document.querySelectorAll("#" + id + "_t .hms-thumb").forEach((t, k) => t.classList.toggle("active", k === i));
}

// In-portal full-screen lightbox — keeps users on our site (never opens Booking).
function hotelLightbox(id, start) {
  let imgs = [];
  try { imgs = JSON.parse(document.getElementById(id).getAttribute("data-imgs")); } catch (e) {}
  if (!imgs.length) return;
  let i = start || 0;
  const host = document.createElement("div");
  host.className = "lightbox-overlay";
  host.innerHTML = `
    <button class="lightbox-close" aria-label="Close">${icon("x")}</button>
    <button class="lightbox-nav lb-prev" aria-label="Previous">${icon("chevron-left")}</button>
    <img class="lightbox-img" src="${imgs[i]}" alt="">
    <button class="lightbox-nav lb-next" aria-label="Next">${icon("chevron-right")}</button>
    <div class="lightbox-count"></div>`;
  const imgEl = host.querySelector(".lightbox-img");
  const cnt = host.querySelector(".lightbox-count");
  const render = () => { imgEl.src = imgs[i]; cnt.textContent = (i + 1) + " / " + imgs.length; };
  const close = () => { host.remove(); document.removeEventListener("keydown", onKey); };
  const prev = () => { i = (i - 1 + imgs.length) % imgs.length; render(); };
  const next = () => { i = (i + 1) % imgs.length; render(); };
  const onKey = (e) => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") prev(); };
  host.addEventListener("click", (e) => { if (e.target === host || e.target.closest(".lightbox-close")) close(); });
  host.querySelector(".lb-prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
  host.querySelector(".lb-next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
  document.body.appendChild(host);
  document.addEventListener("keydown", onKey);
  render();
  if (window.lucide) lucide.createIcons();
}

function amenityChip(name) {
  return `<span class="badge badge-outline" style="font-size:10px;padding:2px 6px">${escapeHtml(name)}</span>`;
}

function applyHotelFilters(rows) {
  const f = hotelFilters;
  const search = f.search.trim().toLowerCase();
  const wanted = Array.from(f.amenities);
  return rows.filter(h => {
    if (search && !`${h.name} ${h.city || ""} ${h.cityAr || ""}`.toLowerCase().includes(search)) return false;
    if (f.city && (h.city || "").toLowerCase() !== f.city.toLowerCase()) return false;
    if (f.stars && Number(h.stars || 0) !== Number(f.stars)) return false;
    if (f.priceVisible === "yes" && !h.showPriceToAgents) return false;
    if (f.priceVisible === "no" && h.showPriceToAgents) return false;
    if (wanted.length) {
      const has = new Set((h.amenities || []).map(String));
      if (!wanted.every(a => has.has(a))) return false;
    }
    return true;
  });
}

function hotelRowsHtml(filtered) {
  return filtered.length
    ? filtered.map(h => {
        const amenities = (h.amenities || []).slice(0, 4).map(amenityChip).join(" ");
        const extra = (h.amenities || []).length > 4 ? `<span style="color:var(--text-secondary);font-size:10px"> +${(h.amenities||[]).length - 4}</span>` : "";
        return `<tr>
          <td>${hotelThumb(h)}</td>
          <td>
            <div class="primary-text">${escapeHtml(h.name)}</div>
            <div class="secondary-text">${escapeHtml(h.city || "—")}${h.cityAr ? ' · ' + escapeHtml(h.cityAr) : ''}</div>
            <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${amenities}${extra}</div>
          </td>
          <td style="white-space:nowrap">${"★".repeat(Math.min(h.stars || 0, 5))}</td>
          <td class="numeric">${Number(h.pricePerNight || 0) > 0 ? formatMoney(h.pricePerNight, h.currency) : `<span style="color:var(--text-secondary)">${t("hotel.priceOnRequest","On request")}</span>`}</td>
          <td>
            <button class="badge ${h.showPriceToAgents ? "badge-confirmed" : "badge-pending"}" style="cursor:pointer;border:none" onclick="togglePriceVisibility('${h.id}', ${!h.showPriceToAgents})" title="${h.showPriceToAgents ? t("hotel.hidePrices","Hide Prices") : t("hotel.showPrices","Show Prices")}">${h.showPriceToAgents ? icon("eye") + " " + t("hotel.visible","Visible") : icon("eye-off") + " " + t("hotel.hidden","Hidden")}</button>
          </td>
          <td>${statusBadge(h.isActive ? "ACTIVE" : "INACTIVE")}</td>
          <td><div class="row-actions">
            <button class="icon-button btn-icon" title="${t("btn.view","View")}" onclick="showHotelDetails('${h.id}')">${icon("eye")}</button>
            <button class="icon-button btn-icon" title="${t("btn.edit")}" onclick="showMasterModal('hotels', '${h.id}')">${icon("pencil")}</button>
            <button class="icon-button btn-icon" title="${t("btn.delete")}" onclick="deleteMasterRecord('hotels', '${h.id}')">${icon("trash-2")}</button>
          </div></td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="7" style="text-align:center;padding:32px">${emptyBlock("empty.noData")}</td></tr>`;
}

function refreshHotelsTableOnly() {
  const rows = state.cache.hotelsRows || [];
  const filtered = applyHotelFilters(rows);
  const tbody = document.getElementById("hotelsTableBody");
  if (tbody) {
    tbody.innerHTML = hotelRowsHtml(filtered);

  const count = document.getElementById("hotelsCountText");
  if (count) count.textContent = `${formatNumber(filtered.length)} / ${formatNumber(rows.length)} ${t("nav.hotels","Hotels")}`;
}

  hotelFilters.search = el.value;

      <th>${t("mealPlanAdmin.nameAr", "Name (AR)")}</th><th>${t("mealPlanAdmin.order", "Order")}</th>

async function createMealPlanRow() {
  const labelEn = (document.getElementById("mpNewEn")?.value || "").trim();
  if (!labelEn) { toast(t("mealPlanAdmin.nameRequired", "Enter an English name for the meal plan."), "error"); return; }
  const res = await apiFetch("/meal-plans", {
    method: "POST",
    body: JSON.stringify({
      labelEn,
      labelAr: (document.getElementById("mpNewAr")?.value || "").trim() || null,
      displayOrder: Number(document.getElementById("mpNewOrder")?.value || 0),
    }),
  });
  if (res?.success) { toast(t("mealPlanAdmin.saved", "Meal plan saved"), "success"); openMealPlansManager(); }
}

async function saveMealPlanRow(id) {
  const tr = document.querySelector(`#mpTbody tr[data-id="${id}"]`);
  if (!tr) return;
  const res = await apiFetch(`/meal-plans/${id}`, {
    method: "PATCH",
    body: JSON.stringify({
      labelEn: tr.querySelector(".mp-en")?.value || "",
      labelAr: tr.querySelector(".mp-ar")?.value || null,
      displayOrder: Number(tr.querySelector(".mp-order")?.value || 0),
      isActive: !!tr.querySelector(".mp-active")?.checked,
    }),
  });
  if (res?.success) toast(t("mealPlanAdmin.saved", "Meal plan saved"), "success");
}

async function deleteMealPlanRow(id) {
  if (!confirm(t("confirm.delete", "Delete this item?"))) return;
  const res = await apiFetch(`/meal-plans/${id}`, { method: "DELETE" });
  if (res?.success) {
    // A plan still used by a rate is deactivated rather than deleted; the API
    // says which happened.
    toast(res.message || t("mealPlanAdmin.removed", "Meal plan removed"), "success");
    openMealPlansManager();
  }
}

function heTab(key) {
  document.querySelectorAll(".he-tabbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
  document.querySelectorAll(".he-panel").forEach(p => p.style.display = p.dataset.panel === key ? "" : "none");
  if (key === "pricing") heBindRateTitles();
}

/**
 * Keep each rate row's header in step with what the admin types, so a hotel
 * with a season per market stays readable instead of becoming a wall of
 * identical cards. Bound once per editor.
 */
function heBindRateTitles() {
  const box = document.getElementById("heRatesBox");
  if (!box) return;
  if (!box.dataset.titlesBound) {
    box.dataset.titlesBound = "1";
    box.addEventListener("input", (e) => {
      if (e.target.closest(".he-room, .he-vf, .he-vt")) heSyncRateTitles();
    });
    box.addEventListener("change", (e) => {
      if (e.target.closest(".he-market, .he-vf, .he-vt")) heSyncRateTitles();
    });
    // A rate row's currency is what an empty supplement currency falls back to,
    // so changing it re-words every sentence underneath.
    box.addEventListener("change", (e) => {
      if (e.target.closest(".he-cur")) heSyncAllSupps(e.target.closest(".he-rate"));
    });
  }
  heSyncRateTitles();
  heSyncAllSupps(box);
}

async function heUploadMain(input) {

  input.value = "";
  if (!file) return;
  const btn = document.getElementById("heMainBtn");
  setBtnLoading(btn, true, "btn.uploading");

async function heUploadGallery(input) {
  const files = [...(input?.files || [])];
  input.value = "";
  if (!files.length) return;
  const btn = document.getElementById("heGalleryBtn");
  setBtnLoading(btn, true, "btn.uploading");
  // Multi-file endpoint in one request.
  const fd = new FormData();
  files.forEach(f => fd.append("files", f));
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch("/api/upload/images", { method: "POST", headers: { Authorization: `Bearer ${token}` }, body: fd, credentials: "include" });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json?.success) throw new Error(json?.message || "Upload failed");
    (json.data || []).forEach(d => { if (d.url) hotelEditor.gallery.push(d.url); });
    heRefreshImages();
  } catch (err) {
    toast(err.message || t("upload.failed", "Upload failed"), "error");

    setBtnLoading(btn, false);

}

/** Flatten the albums into the row-per-photo shape the API stores. An album
 *  with no name or no photos says nothing, so it is not sent. */
function heCollectAlbumImages() {
  const images = [];
  for (const album of (hotelEditor.albums || [])) {
    const label = String(album.label || "").trim();
    if (!label || !album.urls?.length) continue;
    for (const url of album.urls) {
      images.push({ url, tag: label, tagLabel: label, tagLabelAr: album.labelAr || null });
    }
  }
  return images;
}

/**
 * One room type or extra on a rate row.
 *
 * This is where an operator writes their own room category — "Suite", "Sea
 * View", "Extra Bed" — and says what it costs. The two things they reach for
 * are "this category has its own price" and "this adds so much on top", so the
 * row is built around that choice and then spells the result back out in a
 * sentence: the enum names alone ("FIXED AMOUNT", "TOTAL PRICE") never told
 * anyone which of the two they had picked.
 *
 * A new row starts as "adds an amount", the common case. A saved row always
 * shows the type it was saved with.
 */
function heSuppHtml(s) {
  s = s || {};
  const current = s.type || "FIXED_AMOUNT";
  const typeSel = HE_SUPP_TYPES.map(x => `<option value="${x}" ${current === x ? "selected" : ""}>${t("suppType." + x, x.replace(/_/g, " "))}</option>`).join("");
  const curSel = `<option value="">—</option>` + HE_CURRENCIES.map(c => `<option value="${c}" ${(s.currency || "") === c ? "selected" : ""}>${c}</option>`).join("");
  return `<div class="he-supp" style="display:grid;grid-template-columns:1.4fr 1.3fr 0.9fr 0.7fr 1.2fr auto;gap:6px;align-items:end;margin-bottom:10px">
    <div class="form-field"><label>${t("hotel.suppName", "Room type / extra")}</label><input class="hs-name" oninput="heSyncSupp(this)" value="${escapeHtml(s.name || "")}" placeholder="${escapeHtml(t("hotel.suppNamePh", "e.g. Suite, Sea View, Extra Bed"))}"></div>
    <div class="form-field"><label>${t("hotel.suppType", "What it does to the price")}</label><select class="hs-type" onchange="heSyncSupp(this)">${typeSel}</select></div>
    <div class="form-field hs-amount-field"><label class="hs-amount-label">${t("form.amount", "Amount")}</label><input class="hs-amount" type="number" step="0.01" min="0" oninput="heSyncSupp(this)" value="${s.amount != null ? escapeHtml(s.amount) : ""}"></div>
    <div class="form-field hs-cur-field"><label>${t("form.currency", "Cur")}</label><select class="hs-cur" onchange="heSyncSupp(this)">${curSel}</select></div>
    <div class="form-field"><label>${t("placeholder.notes", "Notes")}</label><input class="hs-notes" value="${escapeHtml(s.notes || "")}"></div>
    <button type="button" class="icon-button btn-icon" title="${t("btn.remove", "Remove")}" onclick="this.closest('.he-supp').remove()">${icon("x")}</button>
    <div class="hs-effect secondary-text" style="grid-column:1/-1;margin-top:-2px"></div>
  </div>`;
}

/**
 * Say back what this row will charge, in a sentence naming the operator's own
 * room type and their own number — and show only the fields that choice uses,
 * so a note-only row does not sit there asking for an amount it will ignore.
 */
function heSyncSupp(el) {
  const row = el.closest ? el.closest(".he-supp") : el;
  if (!row) return;
  const type = row.querySelector(".hs-type")?.value || "FIXED_AMOUNT";
  const amountEl = row.querySelector(".hs-amount");
  const raw = amountEl?.value;
  const name = (row.querySelector(".hs-name")?.value || "").trim();
  const priced = type !== "TEXT_ONLY";
  const pct = type === "PERCENTAGE";
  // A percentage carries no currency, and a note carries neither.
  row.querySelector(".hs-amount-field").style.display = priced ? "" : "none";
  row.querySelector(".hs-cur-field").style.display = (priced && !pct) ? "" : "none";

  const label = row.querySelector(".hs-amount-label");
  if (label) {
    label.textContent = type === "TOTAL_PRICE" ? t("hotel.suppAmountTotal", "Price per night")
      : pct ? t("hotel.suppAmountPct", "Percent to add")
      : t("hotel.suppAmountAdd", "Amount to add");
  }

  // Fall back to the rate row's own currency, which is what an empty cell means.
  const cur = row.querySelector(".hs-cur")?.value || row.closest(".he-rate")?.querySelector(".he-cur")?.value || "";
  const subject = name ? `«${escapeHtml(name)}»` : t("hotel.suppThisRow", "This row");
  const out = row.querySelector(".hs-effect");
  if (!out) return;

  if (!priced) {
    out.innerHTML = `${subject} — ${t("hotel.suppNoteOnly", "a note only, nothing is added to the price")}`;
    return;
  }
  if (raw === "" || raw == null) {
    out.innerHTML = `${subject} — ${t("hotel.suppNeedAmount", "enter an amount so it is priced")}`;
    return;
  }
  const money = pct ? `${formatNumber(raw)}%` : `${formatNumber(raw)}${cur ? " " + escapeHtml(cur) : ""}`;
  out.innerHTML = type === "TOTAL_PRICE"
    ? `${subject} = <strong>${money}</strong> ${t("hotel.suppPerNightInstead", "per night — instead of the room price")}`
    : `${subject} = ${t("hotel.suppRoomPrice", "room price")} + <strong>${money}</strong>`;
}

/** Paint every supplement sentence in a freshly rendered container. */
function heSyncAllSupps(scope) {
  (scope || document).querySelectorAll(".he-supp").forEach(row => heSyncSupp(row));
}
function heAddRate() {
  const box = document.getElementById("heRatesBox");
  if (!box) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = heRateCardHtml({});
  const card = tmp.firstElementChild;
  box.appendChild(card);
  refreshIcons(box);
  heSyncRateTitles();
  heSyncAllSupps(card);
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.querySelector(".he-room")?.focus();
}

/**
 * Copy a row so a second season or a second market is one click rather than
 * re-typing the room, currency, meal plan and prices. The dates are cleared —
 * a duplicate exists precisely to carry a different period.
