function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineJsonArg(value) {
  return escapeHtml(JSON.stringify(String(value ?? "")));
}

function icon(name) {
  return `<i data-lucide="${name}"></i>`;
}

function refreshIcons(root = document) {
  applyTranslations(root);
  if (window.lucide) window.lucide.createIcons();
}

function apiFetch(path, options = {}) {
  const token = localStorage.getItem("accessToken");
  return fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(options.headers || {}) },
    credentials: "include",
  }).then(async res => {
    if (res.status === 401) {
      const refresh = await fetch("/api/auth/refresh", { method: "POST", credentials: "include" });
      if (!refresh.ok) {
        localStorage.clear();
        location.href = "/login.html";
        return null;
      }
      const json = await refresh.json();
      localStorage.setItem("accessToken", json.data.accessToken);
      return apiFetch(path, options);
    }
    const json = await res.json().catch(() => ({ success: false, message: res.statusText }));
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Request failed");
    return json;
  }).catch(err => {
    toast(err.message || "Request failed", "error");
    return null;
  });
}

async function downloadInvoicePdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/invoices/${id}/pdf`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "PDF download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `invoice-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "PDF download failed", "error");
  }
}

function toast(message, type = "") {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = `toast ${type} show`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = "toast"; }, 3600);
}

function content(html) {
  const root = document.getElementById("content");
  root.innerHTML = html;
  refreshIcons(root);
}

function pageHeader(actions = "") {
  const [titleKey, subKey] = pageMeta[state.page] || pageMeta.dashboard;
  document.getElementById("breadcrumbTitle").textContent = t(titleKey);
  return `<div class="page-header">
    <div>
      <div class="page-kicker">${escapeHtml(state.user?.company?.name || "Elbakri B2B")}</div>
      <h1 class="page-title">${t(titleKey)}</h1>
      <p class="page-subtitle">${t(subKey)}</p>
    </div>
    <div class="page-actions">${actions}</div>
  </div>`;
}

function statusBadge(status) {
  const key = String(status || "").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("status." + key, key.replace(/_/g, " "))}</span>`;
}

function tierBadge(tier) {
  const key = String(tier || "STANDARD").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("tier." + key, key)}</span>`;
}

function skeletonRows(cols = 8, rows = 8) {
  return Array.from({ length: rows }, () => `<tr>${Array.from({ length: cols }, () => `<td><div class="skeleton" style="height:14px;width:70%"></div></td>`).join("")}</tr>`).join("");
}

function emptyBlock(messageKey, action = "") {
  return `<div class="empty-state"><div class="empty-illustration"></div><strong>${t(messageKey)}</strong><span>${t("empty.adjustFilters")}</span>${action}</div>`;
}

function tableFoot(meta, onPage, pageName) {
  const page = meta?.page || 1;
  const pages = Math.max(meta?.pages || 1, 1);
  const total = meta?.total || 0;
  const limit = meta?.limit || 20;
  const start = total ? ((page - 1) * limit) + 1 : 0;
  const end = Math.min(page * limit, total);
  return `<div class="table-foot">
    <span>${formatNumber(start)}-${formatNumber(end)} / ${formatNumber(total)}</span>
    <div class="pager">${Array.from({ length: Math.min(pages, 7) }, (_, i) => `<button class="${i + 1 === page ? "active" : ""}" onclick="${onPage}('${pageName}', ${i + 1})">${i + 1}</button>`).join("")}</div>
  </div>`;
}

function exportRows(filename, rows) {
  if (!rows || !rows.length) return toast(t("toast.noRowsSelected"), "warning");
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Export");
    XLSX.writeFile(wb, `${filename}.xlsx`);
  }
  toast(t("toast.exported"), "success");
}

function openModal(title, body, footer = "") {
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal ${body.length > 2400 ? "modal-wide" : ""}">
    <div class="modal-header"><div class="modal-title">${title}</div><button class="icon-button" onclick="closeModal()">${icon("x")}</button></div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-footer">${footer}</div>` : ""}
  </div>`;
  host.classList.add("open");
  refreshIcons(host);
}

function closeModal() {
  document.getElementById("modalHost").classList.remove("open");
  document.getElementById("modalHost").innerHTML = "";
}

document.getElementById("modalHost").addEventListener("click", e => {
  if (e.target.id === "modalHost") closeModal();
});

/** Build a pre-filled WhatsApp message URL for quote follow-up.
 *  @param {object} data – { ref, serviceType, serviceName, destination, from, to,
 *                           checkIn, checkOut, checkInTime, adults, children, rooms,
 *                           isRoundTrip, notes }
 */
function buildWhatsAppQuoteUrl(data = {}) {
  const user = state.user || {};
  const company = user.company || {};
  const lines = [
    data.ref    ? `*${t("btn.requestQuote","Quote Request")} ${data.ref}*` : null,
    `${t("th.company","Company")}: ${company.name || "—"}`,
    user.name   ? `${t("form.name","Name")}: ${user.name}`         : null,
    user.email  ? `Email: ${user.email}`                            : null,
    `${t("th.type","Type")}: ${data.serviceType || "—"}`,
    data.serviceName    ? `${t("th.service","Service")}: ${data.serviceName}`           : null,
    data.destination    ? `${t("th.destination","Destination")}: ${data.destination}`   : null,
    data.nationality    ? `${t("form.nationality","Nationality")}: ${data.nationality}` : null,
    data.travelFrom     ? `${t("form.travelFrom","Travelling From")}: ${data.travelFrom}` : null,
    data.from           ? `${t("form.from","From")}: ${data.from}`                      : null,
    data.to             ? `${t("form.to","To")}: ${data.to}`                            : null,
    data.checkIn        ? `${t("form.checkIn","Date")}: ${data.checkIn}${data.checkInTime ? " " + data.checkInTime : ""}` : null,
    data.checkOut       ? `${t("form.checkOut","Check-out")}: ${data.checkOut}`          : null,
    data.adults         ? `${t("form.adults","Adults/Pax")}: ${data.adults}`            : null,
    data.children       ? `${t("form.children","Children")}: ${data.children}`          : null,
    data.rooms          ? `${t("form.rooms","Rooms")}: ${data.rooms}`                   : null,
    data.budget         ? `${t("form.budget","Budget")}: ${data.budget}`                : null,
    data.isRoundTrip    ? `${t("form.roundTrip","Round Trip")}: ✓`                      : null,
    data.notes          ? `${t("form.notes","Notes")}: ${data.notes}`                   : null,
  ].filter(Boolean).join("\n");
  return `https://wa.me/201147515456?text=${encodeURIComponent(lines)}`;
}

function reserveWhatsAppWindow() {
  return window.open("about:blank", "_blank");
}

function redirectToWhatsApp(url, reservedWindow) {
  if (reservedWindow && !reservedWindow.closed) {
    reservedWindow.location.href = url;
    return;
  }
  window.location.href = url;
}

function setPage(page) {
  state.page = page;
  state.renderToken = (state.renderToken || 0) + 1;
  state.selected.clear();
  document.querySelectorAll(".nav-item").forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
  (pageLoaders[page] || renderDashboard)();
}

document.querySelectorAll(".nav-item[data-page]").forEach(btn => btn.addEventListener("click", () => {
  setPage(btn.dataset.page);
  closeSidebar();
}));

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("globalSearch").focus();
  }
  if (e.key === "Escape") closeSidebar();
});

function toggleSidebar() {
  const isOpen = document.getElementById("sidebar").classList.toggle("open");
  document.body.classList.toggle("sidebar-open", isOpen);
  document.getElementById("sidebarBackdrop")?.classList.toggle("open", isOpen);
}

function closeSidebar() {
  document.getElementById("sidebar")?.classList.remove("open");
  document.body.classList.remove("sidebar-open");
  document.getElementById("sidebarBackdrop")?.classList.remove("open");
}

function logout() {
  apiFetch("/auth/logout", { method: "POST" }).finally(() => {
    localStorage.clear();
    location.href = "/login.html";
  });
}

async function renderDashboard() {
  const capturedToken = state.renderToken;
  content(pageHeader() + `
    <div class="stats-grid">${Array.from({ length: 4 }, () => `<div class="stat-card"><div class="skeleton" style="height:12px;width:62%"></div><div class="skeleton" style="height:28px;width:44%;margin-top:14px"></div><div class="skeleton" style="height:12px;width:55%;margin-top:12px"></div></div>`).join("")}</div>
    <div class="grid-2">
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.bookings")}</div></div></div><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(5, 6)}</tbody></table></div></section>
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.wallet")}</div></div></div><div class="panel-body"><div class="skeleton" style="height:70px"></div></div></section>
    </div>`);

  const [report, bookings, wallet] = await Promise.all([
    state.user?.companyId ? apiFetch(`/reports/company/${state.user.companyId}`) : null,
    apiFetch("/bookings?limit=8"),
    apiFetch("/wallet/balance"),
  ]);
  if (state.renderToken !== capturedToken) return;
  if (wallet?.data) updateWallet(wallet.data);
  const d = report?.data || {};
  document.getElementById("pendingBadge").textContent = d.pendingBookings || 0;

  const walletBal = Number(wallet?.data?.balance || 0);
  const creditLim = Number(state.user?.company?.creditLimit || 0);
  const available = walletBal + creditLim;
  const cur = wallet?.data?.currency || "USD";

  content(pageHeader() + `
    <div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      ${statCard("stat.totalBookings", d.totalBookings || 0, "stat.allTime", "briefcase-business")}
      ${statCard("stat.pending", d.pendingBookings || 0, "status.PENDING", "clock")}
      ${statCard("stat.cancellations", d.bookingsByStatus?.CANCELLED || 0, "stat.lastThirty", "circle-x")}
      ${statCard("wallet.availableToSpend", formatMoney(available, cur), "stat.allTime", "wallet")}
    </div>
    <div class="grid-2">
      ${bookingPanel(bookings?.data || [])}
      <section class="panel">
        <div class="panel-header"><div><div class="panel-title">${t("nav.wallet")}</div><div class="panel-subtitle">${t("form.currentBalance")}</div></div>${tierBadge(state.user?.company?.tier)}</div>
        <div class="panel-body">
          <div class="info-grid" style="grid-template-columns:1fr">
            <div class="info-item">
              <div class="info-label">${t("wallet.walletBalance","Wallet Balance")}</div>
              <div class="info-value" style="font-size:22px;font-weight:800">${formatMoney(walletBal, cur)}</div>
            </div>
            <div class="info-item">
              <div class="info-label">${t("th.creditLimit","Credit Limit")}</div>
              <div class="info-value">${formatMoney(creditLim, cur)}</div>
            </div>
            <div class="info-item" style="background:var(--info-soft);border-radius:var(--r-8);padding:12px">
              <div class="info-label" style="color:var(--info)">${t("wallet.availableToSpend","Available to Spend")}</div>
              <div class="info-value" style="color:var(--info);font-weight:800;font-size:20px">${formatMoney(available, cur)}</div>
            </div>
          </div>
        </div>
      </section>
    </div>`);

  // Show offer popup after first dashboard load
  maybeShowOfferPopup();
}

function statCard(labelKey, value, subKey, iconName) {
  return `<div class="stat-card">
    <div class="stat-row"><div class="stat-label">${t(labelKey)}</div><span class="stat-ico">${icon(iconName || "activity")}</span></div>
    <div class="stat-value">${value}</div>
    <div class="stat-sub">${t(subKey)}</div>
  </div>`;
}

function bookingPanel(rows) {
  const cols = [
    ["th.ref", b => `<span class="primary-text">${escapeHtml(b.refNumber)}</span>`],
    ["th.type", b => escapeHtml(b.type)],
    ["th.details", b => escapeHtml(b.hotel?.name || (b.origin ? `${b.origin} → ${b.destination}` : "—"))],
    ["th.amount", b => `<span class="numeric">${formatMoney(b.totalAmount, b.currency)}</span>`],
    ["th.status", b => statusBadge(b.status)],

// ─── Price display helper ────────────────────────────────────────────────────
function hotelPriceCell(h) {
  if (h.priceVisible === false || h.pricePerNight == null || Number(h.pricePerNight) <= 0) {
    return `<span class="badge badge-pending" style="font-size:11px">${t("hotel.priceOnRequest","Price on request")}</span>`;
  }
  return `<span class="numeric">${formatMoney(h.pricePerNight, h.currency)}</span>`;
}

function hotelThumbAgent(h) {
  if (h.imageUrl) return `<img src="${escapeHtml(h.imageUrl)}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`;
  const initials = (h.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
  return `<div style="width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5b8def,#7c5cff);color:#fff;font-weight:700;font-size:13px">${escapeHtml(initials)}</div>`;
}

function hotelNameCell(h) {
  const amenities = (h.amenities || []).slice(0, 3)
    .map(a => `<span class="badge badge-outline" style="font-size:10px;padding:1px 6px">${escapeHtml(a)}</span>`)
    .join(" ");
  const more = (h.amenities || []).length > 3 ? `<span style="color:var(--text-secondary);font-size:10px"> +${(h.amenities||[]).length - 3}</span>` : "";
  return `<div style="display:flex;gap:10px;align-items:center">
    ${hotelThumbAgent(h)}
    <div style="min-width:0">
      <div class="primary-text">${escapeHtml(h.name)}</div>
      <div class="secondary-text">${escapeHtml(h.city)}, ${escapeHtml(h.country)}</div>
      <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px">${amenities}${more}</div>
    </div>
  </div>`;
}

function hotelActionCell(h) {
  const view = `<button class="btn btn-outline btn-sm" onclick="showAgentHotelDetails('${h.id}')" title="${t("btn.view","View")}">${icon("eye")}</button>`;
  const quote = (h.canRequestQuote === false || h.allowQuoteRequest === false)
    ? ""
    : `<button class="btn btn-primary btn-sm" onclick="openQuoteRequestModal('HOTEL','${h.id}',${inlineJsonArg(h.name)})">${icon("send")}&nbsp;${t("btn.requestQuote","Request Quote")}</button>`;
  return `<div style="display:flex;gap:6px;align-items:center">${view}${quote}</div>`;
}

async function showAgentHotelDetails(id) {
  const res = await apiFetch(`/hotels/${id}`);
  if (!res?.data) return;
  const h = res.data;
  const amenityChips = (h.amenities || []).map(a => `<span class="badge badge-outline" style="font-size:11px;padding:3px 8px">${escapeHtml(a)}</span>`).join(" ");
  const headerImg = h.imageUrl
    ? `<img src="${escapeHtml(h.imageUrl)}" alt="" style="width:100%;height:200px;object-fit:cover;border-radius:8px;margin-bottom:16px">`
    : `<div style="height:140px;border-radius:8px;background:linear-gradient(135deg,#5b8def,#7c5cff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:800;margin-bottom:16px">${escapeHtml((h.name||"?").charAt(0).toUpperCase())}</div>`;

  const body = `
    ${headerImg}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:20px;font-weight:700">${escapeHtml(h.name)}</div>
        <div style="color:var(--text-secondary);margin-top:4px">${"★".repeat(Math.min(h.stars||0,5))} · ${escapeHtml(h.city||"")}, ${escapeHtml(h.country||"EG")}</div>
        ${h.address ? `<div style="color:var(--text-secondary);font-size:12px;margin-top:4px">${escapeHtml(h.address)}</div>` : ""}
      </div>
      <div style="text-align:right">
        <div style="font-size:18px;font-weight:700">${hotelPriceCell(h)}</div>
        ${Number(h.pricePerNight||0) > 0 && h.priceVisible !== false ? `<div style="color:var(--text-secondary);font-size:11px">${t("form.nights","per night")}</div>` : ""}
      </div>
    </div>
    ${h.description ? `<p style="white-space:pre-wrap;color:var(--text-secondary);line-height:1.5;margin:8px 0">${escapeHtml(h.description)}</p>` : ""}
    ${h.amenities?.length ? `<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">${amenityChips}</div>` : ""}
    ${(h.galleryUrls && h.galleryUrls.length) ? `<div style="margin-top:16px"><div style="font-weight:800;margin-bottom:8px">${t("hotel.gallery","Gallery")}</div><div class="hotel-gallery">${h.galleryUrls.map(u => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener"><img src="${escapeHtml(u)}" alt="" loading="lazy"></a>`).join("")}</div></div>` : ""}`;

  openModal(`${escapeHtml(h.name)}`, body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.close")}</button>
    ${(h.canRequestQuote === false || h.allowQuoteRequest === false) ? "" : `<button class="btn btn-primary" onclick="closeModal();openQuoteRequestModal('HOTEL','${h.id}',${inlineJsonArg(h.name)})">${icon("send")}&nbsp;${t("btn.requestQuote","Request Quote")}</button>`}
  `);
}

// ─── Quote Request Modal ──────────────────────────────────────────────────────
async function openQuoteRequestModal(serviceType, serviceId, serviceName) {
  const isHotel = serviceType === "HOTEL";
  const mealPlanOptions = ["ROOM_ONLY","BREAKFAST","HALF_BOARD","FULL_BOARD","ALL_INCLUSIVE","ULTRA_ALL_INCLUSIVE"];

  const body = `
    ${nationalityDatalist()}
    <p style="color:var(--text-secondary);margin:0 0 16px">${t("quoteRequest.intro","Fill in your travel details and our team will get back to you with a tailored quote.")}</p>
    <div class="form-grid">
      <div class="form-field full"><label>${t("th.service","Service")}</label>
        <input value="${escapeHtml(serviceName)} (${serviceType})" disabled style="opacity:0.7"></div>
      <div class="form-field"><label>${t("form.nationality","Nationality")} *</label>
        <input id="qrNationality" list="nationalityList" placeholder="${t("form.nationalityPlaceholder","e.g. Egyptian")}"></div>
      <div class="form-field"><label>${t("form.checkIn","Check-in Date")} *</label>
        <input id="qrCheckIn" type="date"></div>
      <div class="form-field"><label>${t("form.checkOut","Check-out Date")} *</label>
        <input id="qrCheckOut" type="date"></div>
      <div class="form-field"><label>${t("form.adults","Adults / Pax")} *</label>
        <input id="qrAdults" type="number" min="1" value="2"></div>
      <div class="form-field"><label>${t("form.children","Children")}</label>
        <input id="qrChildren" type="number" min="0" value="0" oninput="updateChildAges()"></div>
      ${isHotel ? `<div class="form-field"><label>${t("hotel.rooms","Rooms")}</label>
        <input id="qrRooms" type="number" min="1" value="1"></div>
        <div class="form-field"><label>${t("hotel.mealPlan","Meal Plan")}</label>
        <select id="qrMealPlan">
          <option value="">${t("hotel.selectMealPlan","Select meal plan")}</option>
          ${mealPlanOptions.map(mp => `<option value="${mp}">${t("mealPlan."+mp, mp.replace(/_/g," "))}</option>`).join("")}
        </select></div>` : ""}
      <div id="childAgesContainer" class="form-field full" style="display:none"></div>
      <div class="form-field full"><label>${t("form.notes","Notes / Special Requests")}</label>
        <textarea id="qrNotes" rows="3" placeholder="${t("form.notesPlaceholder","Room preferences, dietary needs, accessibility...")}"></textarea></div>
    </div>`;

  openModal(t("btn.requestQuote","Request a Quote"), body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel","Cancel")}</button>
    <button class="btn btn-primary" id="submitQuoteBtn">${icon("brand-whatsapp")}&nbsp;${t("btn.sendRequest","Send via WhatsApp")}</button>
  `);

  function updateChildAges() {
    const count = parseInt(document.getElementById("qrChildren")?.value || "0");
    const box = document.getElementById("childAgesContainer");
    if (!box) return;
    box.style.display = count > 0 ? "" : "none";
    box.innerHTML = childAgesHtml(count);
  }
  document.getElementById("qrChildren").addEventListener("input", updateChildAges);

  document.getElementById("submitQuoteBtn").onclick = async () => {
    const checkIn = document.getElementById("qrCheckIn").value;
    const checkOut = document.getElementById("qrCheckOut").value;
    const adults = parseInt(document.getElementById("qrAdults").value || "2");
    const children = parseInt(document.getElementById("qrChildren").value || "0");
    const rooms = isHotel ? parseInt(document.getElementById("qrRooms")?.value || "1") : undefined;
    const mealPlan = isHotel ? (document.getElementById("qrMealPlan")?.value || undefined) : undefined;
    const nationality = document.getElementById("qrNationality").value.trim() || undefined;
    const notes = document.getElementById("qrNotes").value.trim() || undefined;

    const childAges = Array.from({length: children}, (_, i) =>
      parseInt(document.getElementById(`childAge_${i}`)?.value || "7"));

    if (!checkIn || !checkOut) {
      toast(t("validation.dateRequired","Please select check-in and check-out dates"), "error");
      return;
    }

    const isCruise = serviceType === "CRUISE";
    const payload = {
      serviceType,
      hotelId:    isHotel  ? serviceId : undefined,
      cruiseId:   isCruise ? serviceId : undefined,
      serviceId:  (!isHotel && !isCruise) ? serviceId : undefined,
      serviceName: !isHotel ? serviceName : undefined,
      checkIn: checkIn || undefined,
      checkOut: checkOut || undefined,
      adultsCount: adults,
      childrenCount: children,
      roomsCount: rooms,
      mealPlan: mealPlan || undefined,
      nationality,
      childAges: children > 0 ? childAges : undefined,
      customerNotes: notes,
      contactPreference: "whatsapp",
      currency: "USD",
    };

    document.getElementById("submitQuoteBtn").disabled = true;
    const waWindow = reserveWhatsAppWindow();
    const res = await apiFetch("/quote-requests", { method: "POST", body: JSON.stringify(payload) });
    if (res?.success) {
      const ref = res.data.refNumber;
      const mealPlanLabel = mealPlan ? t("mealPlan."+mealPlan, mealPlan) : null;
      const childAgesStr = children > 0 ? childAges.join(", ") + " yrs" : null;
      const waUrl = buildWhatsAppQuoteUrl({
        ref,
        serviceType,
        serviceName,
        nationality,
        checkIn, checkOut,
        adults,
        children: children || undefined,
        rooms:    rooms    || undefined,
        notes: [notes, mealPlanLabel ? `Meal Plan: ${mealPlanLabel}` : null, childAgesStr ? `Child ages: ${childAgesStr}` : null].filter(Boolean).join(" | ") || undefined,
      });
      closeModal();
      toast(`✅ ${t("toast.quoteSubmitted","Quote request submitted")} — ${ref}`, "success");
      loadMyQuotesBadge();
      redirectToWhatsApp(waUrl, waWindow);
    } else {
      if (waWindow && !waWindow.closed) waWindow.close();
      document.getElementById("submitQuoteBtn").disabled = false;
    }
  };
}

function openTransportQuoteModal() {
  const body = `
    <div class="form-grid">
      <div class="form-field"><label>${t("form.from","From Location")} *</label>
        <input id="trFrom" placeholder="${t("form.from","Airport, Hotel, City...")}"></div>

        <input id="trTime" type="time" value="10:00"></div>
      <div class="form-field"><label>${t("form.passengers","Passengers")}</label>
        <input id="trPax" type="number" min="1" value="2"></div>
      <div class="form-field"><label>${t("form.vehicleType","Vehicle Type (optional)")}</label>

          <option value="SUV">SUV</option>
          <option value="VAN_6">Van (6 pax)</option>
          <option value="VAN_12">Van (12 pax)</option>
          <option value="MINIBUS_20">Minibus (20 pax)</option>
          <option value="BUS_45">Bus (45 pax)</option>
          <option value="LUXURY_LIMO">Luxury Limo</option>

      <div class="form-field" style="align-self:center"><label class="check-row" style="margin-top:18px">
        <input id="trRoundTrip" type="checkbox"> ${t("form.roundTrip","Round Trip")}
      </label></div>
      <div class="form-field full"><label>${t("form.notes","Notes / Special Requests")}</label>
        <textarea id="trNotes" rows="2"></textarea></div>
    </div>`;

  openModal(t("btn.requestTransportQuote","Request Transport Quote"), body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" id="submitTrQuoteBtn">${icon("send")}&nbsp;${t("btn.sendRequest","Send Request")}</button>
  `);

  document.getElementById("submitTrQuoteBtn").onclick = async () => {
    const from        = document.getElementById("trFrom").value.trim();
    const to          = document.getElementById("trTo").value.trim();
    const date        = document.getElementById("trDate").value;
    const time        = document.getElementById("trTime").value;
    const passengers  = parseInt(document.getElementById("trPax").value || "2");

    const serviceName = `Transport: ${from} → ${to}${isRoundTrip ? " (Round Trip)" : ""}${vehicle ? " — " + vehicle.replace(/_/g, " ") : ""}`;

    const waWindow = reserveWhatsAppWindow();
    const res = await apiFetch("/quote-requests", { method: "POST", body: JSON.stringify(payload) });

    if (res?.success) {

        from,
        to,
        checkIn:      date,
        checkInTime:  time || undefined,
        adults:       passengers,
        isRoundTrip:  isRoundTrip || undefined,
        notes:        notes || undefined,
      });
      closeModal();
      toast(`✅ ${t("toast.quoteSubmitted","Quote request submitted")} — ${ref}`, "success");
      loadMyQuotesBadge();
      redirectToWhatsApp(waUrl, waWindow);
    } else {
      if (waWindow && !waWindow.closed) waWindow.close();
      document.getElementById("submitTrQuoteBtn").disabled = false;
    }
  };
}

function openActivityBookingModal(activityId, activityName, priceAdult, priceChild, currency) {
  currency = currency || "USD";
  priceAdult = Number(priceAdult) || 0;
  priceChild = Number(priceChild) || priceAdult;

  function calcPreview() {
    const adults = Math.max(1, parseInt(document.getElementById("actAdults")?.value || "2"));
    const children = Math.max(0, parseInt(document.getElementById("actChildren")?.value || "0"));
    const total = adults * priceAdult + children * priceChild;
    const el = document.getElementById("actAmountPreview");
    if (el) el.textContent = formatMoney(total, currency);
  }

  const body = `
    <div class="form-grid">
      <div class="form-field full"><label>${t("th.service","Activity")}</label>
        <input value="${escapeHtml(activityName)}" disabled style="opacity:0.7"></div>
      <div class="form-field"><label>${t("form.date","Activity Date")} *</label>
        <input id="actDate" type="date" required></div>
      <div class="form-field"><label>${t("form.adults","Adults")}</label>
        <input id="actAdults" type="number" min="1" value="2"></div>
      <div class="form-field"><label>${t("form.children","Children")}</label>
        <input id="actChildren" type="number" min="0" value="0"></div>
      <div class="form-field full"><label>${t("form.notes","Notes")}</label>
        <textarea id="actNotes" rows="2"></textarea></div>
    </div>
    <div class="info-grid" style="margin-top:12px">
      <div class="info-item">
        <div class="info-label">${t("form.priceAdult","Adult Price")}</div>
        <div class="info-value">${formatMoney(priceAdult, currency)}</div>
      </div>
      <div class="info-item">
        <div class="info-label">${t("form.priceChild","Child Price")}</div>
        <div class="info-value">${formatMoney(priceChild, currency)}</div>
      </div>
      <div class="info-item">
        <div class="info-label">${t("th.total","Estimated Total")}</div>
        <div class="info-value" id="actAmountPreview" style="font-weight:700">${formatMoney(2 * priceAdult, currency)}</div>
      </div>
    </div>
    <p style="color:var(--text-secondary);font-size:12px;margin-top:10px">${t("booking.pendingNote","Your request will be submitted for admin review. No payment is taken until confirmed.")}</p>`;

  openModal(t("btn.bookActivity","Book Activity"), body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" id="submitActivityBtn">${icon("calendar-check")}&nbsp;${t("btn.submitRequest","Submit Request")}</button>
  `);

  // Wire live-preview now that DOM is ready — avoids calcPreview.toString() scope bug
  document.getElementById("actAdults").addEventListener("input", calcPreview);
  document.getElementById("actChildren").addEventListener("input", calcPreview);

  document.getElementById("submitActivityBtn").onclick = async () => {
    const date = document.getElementById("actDate").value;
    if (!date) { toast(t("validation.dateRequired","Date is required"), "error"); return; }
    document.getElementById("submitActivityBtn").disabled = true;
    // totalAmount is NOT sent — backend calculates it from activity prices
    const res = await apiFetch("/activity-bookings", { method: "POST", body: JSON.stringify({
      activityId,
      activityDate: date,
      adultsCount: parseInt(document.getElementById("actAdults").value || "2"),
      childrenCount: parseInt(document.getElementById("actChildren").value || "0"),
      notes: document.getElementById("actNotes").value.trim() || undefined,
    })});
    if (res?.success) {
      closeModal();
      toast(`✅ ${t("toast.created","Created")} — ${res.data.refNumber} (${formatMoney(res.data.totalAmount, res.data.currency)})`, "success");
      setPage("bookings");
    } else {
      document.getElementById("submitActivityBtn").disabled = false;
    }
  };
}

function renderMyQuotes() {
  renderListPage("my-quotes", "/quote-requests", [

    ["th.type",        q => `<span class="badge badge-outline">${escapeHtml(q.serviceType)}</span>`],
    ["th.destination", q => escapeHtml(q.destination?.name || q.hotel?.name || "—")],
    ["th.travelDates", q => {
      const ci = q.checkIn  ? formatDate(q.checkIn)  : null;
      const co = q.checkOut ? formatDate(q.checkOut) : null;
      return ci ? `${ci}${co ? " → " + co : ""}` : "—";
    }],
    ["th.status",      q => statusBadge(q.status)],
    ["th.date",        q => formatDate(q.createdAt)],
    ["th.actions", q => {
      const waUrl = buildWhatsAppQuoteUrl({
        ref:         q.refNumber,
        serviceType: q.serviceType,
        serviceName: q.serviceName || q.hotel?.name,
        destination: q.destination?.name,
        nationality: q.nationality || undefined,
        travelFrom: q.travelFrom || undefined,
        checkIn:     q.checkIn  ? String(q.checkIn).slice(0, 10)  : undefined,
        checkOut:    q.checkOut ? String(q.checkOut).slice(0, 10) : undefined,
        adults:      q.adultsCount   || undefined,
        children:    q.childrenCount || undefined,
        rooms:       q.roomsCount    || undefined,

async function cancelMyQuote(id) {
  if (!confirm(t("modal.confirmDelete","Cancel this quote request?"))) return;
  const res = await apiFetch(`/quote-requests/${id}/cancel`, { method: "POST" });
  if (res?.success) {
    toast(t("toast.statusChanged","Cancelled"), "success");
    loadCurrentList("my-quotes");
    loadMyQuotesBadge();
  }
}

async function loadMyQuotesBadge() {
  const res = await apiFetch("/quote-requests?status=NEW&limit=1");
  const badge = document.getElementById("myQuotesBadge");
  if (!badge) return;
  const count = res?.meta?.total || 0;
  badge.textContent = count;
  badge.style.display = count > 0 ? "" : "none";
}

function openSimRequestForm(packages, preselect) {
  if (typeof packages === "string") try { packages = JSON.parse(packages); } catch { packages = []; }
  const body = `
    <div class="form-grid">
      <div class="form-field full"><label>${t("simCard.package","SIM Package")}</label>
        <select id="simPkg">
          <option value="">${t("simCard.selectPackage","Select a package")}</option>
          ${(packages||[]).map(p => `<option value="${p.id}" data-price="${p.price}" data-cur="${p.currency}" ${p.id===preselect?"selected":""}>${escapeHtml(p.name)} — ${escapeHtml(p.dataSize)} · ${formatMoney(p.price,p.currency)}</option>`).join("")}
        </select></div>
      <div class="form-field"><label>${t("simCard.clientName","Client Name")} *</label>
        <input id="simName" placeholder="Full name"></div>
      <div class="form-field"><label>${t("simCard.phone","Client Phone")} *</label>
        <input id="simPhone" type="tel" placeholder="+20..."></div>
      <div class="form-field"><label>${t("simCard.quantity","Quantity")}</label>
        <input id="simQty" type="number" min="1" value="1" oninput="updateSimTotal()"></div>
      <div class="form-field"><label>${t("simCard.arrivalDate","Arrival Date")}</label>
        <input id="simArrival" type="date"></div>
      <div class="form-field full"><label>${t("form.notes","Notes")}</label>
        <textarea id="simNotes" rows="2"></textarea></div>
    </div>
    <div class="info-grid" style="margin-top:12px">
      <div class="info-item"><div class="info-label">${t("th.total","Estimated Total")}</div>
        <div class="info-value" id="simTotal" style="font-weight:800">—</div></div>
    </div>`;
  openModal(t("simCard.requestTitle","Request SIM Card"), body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" id="submitSimBtn">${icon("send")}&nbsp;${t("btn.sendRequest","Send Request")}</button>`);

  document.getElementById("simPkg").addEventListener("change", updateSimTotal);
  updateSimTotal();

  function updateSimTotal() {
    const sel = document.getElementById("simPkg");
    const opt = sel?.options[sel.selectedIndex];
    const price = parseFloat(opt?.dataset?.price || "0");
    const cur = opt?.dataset?.cur || "USD";
    const qty = parseInt(document.getElementById("simQty")?.value || "1");
    const el = document.getElementById("simTotal");
    if (el) el.textContent = price > 0 ? formatMoney(price * qty, cur) : "—";
  }

  document.getElementById("submitSimBtn").onclick = async () => {
    const name = document.getElementById("simName").value.trim();
    const phone = document.getElementById("simPhone").value.trim();
    if (!name || !phone) { toast(t("toast.validationError","Check required fields"), "error"); return; }
    document.getElementById("submitSimBtn").disabled = true;
    const res = await apiFetch("/sim-card/requests", { method: "POST", body: JSON.stringify({
      packageId: document.getElementById("simPkg").value || undefined,
      clientName: name,
      phone,
      quantity: parseInt(document.getElementById("simQty").value || "1"),
      arrivalDate: document.getElementById("simArrival").value || undefined,
      notes: document.getElementById("simNotes").value.trim() || undefined,
    })});
    if (res?.success) {
      closeModal();
      toast(`✅ ${t("toast.created","Submitted")} — ${res.data.refNumber}`, "success");
      renderSimCard();
    } else {
      document.getElementById("submitSimBtn").disabled = false;
    }
  };
}

// ─── Offers (view active offers) ─────────────────────────────────────────────
async function renderOffers() {
  const capturedToken = state.renderToken;
  state.page = "offers";
  const res = await apiFetch("/offers?activeOnly=true");
  if (state.renderToken !== capturedToken) return;
  const offers = res?.data || [];
  const lang = localStorage.getItem("lang") || "en";
  const isAr = lang === "ar";

  const cards = offers.map(o => {
    const title = (isAr && o.titleAr) ? o.titleAr : o.title;

async function uploadAndFill(input, targetId) {
  const file = input.files?.[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json();
    if (json?.data?.url) {
      const target = document.getElementById(targetId);
      if (target) target.value = json.data.url;
      toast("✅ Uploaded", "success");
    }
  } catch {
    toast("Upload failed", "error");
  }
}

let listTimer;
function debouncedList(page) {
  clearTimeout(listTimer);
  listTimer = setTimeout(() => loadCurrentList(page), 250);
}

function clearListFilters(page) {
  document.querySelectorAll(`[id^="${page}-"], #${page}Search`).forEach(el => { el.value = ""; });
  loadCurrentList(page);
}

async function loadCurrentList(page, pageNumber = 1) {
  const config = state.listConfigs[page];
  if (config) {
    await loadListData(page, config.endpoint, config.columns, pageNumber);
    return;
  }
  const loader = pageLoaders[page];
  if (loader) loader();
}

async function loadListData(page, endpoint, columns, pageNumber = 1) {
  const params = new URLSearchParams({ page: pageNumber, limit: 50 });
  document.querySelectorAll(`[id^="${page}-"]`).forEach(el => { if (el.value) params.set(el.id.replace(page + "-", ""), el.value); });
  const search = document.getElementById(page + "Search")?.value;
  if (search) params.set("search", search);
  const res = await apiFetch(`${endpoint}?${params}`);
  const rows = res?.data || [];
  state.cache[page + "Rows"] = rows;
  const tbody = document.getElementById(page + "Tbody");
  if (!tbody) return;
  tbody.innerHTML = rows.length ? rows.map(row => `<tr>${columns.map(([, fn]) => `<td>${fn(row)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${columns.length}">${emptyBlock("empty.noData")}</td></tr>`;
  const meta = res?.meta || { total: rows.length, page: 1, limit: 50, pages: 1 };
  document.getElementById(page + "Meta").textContent = `${formatNumber(meta.total)} ${t(pageMeta[page]?.[0] || "empty.noData")}`;
  document.getElementById(page + "Foot").innerHTML = tableFoot(meta, "loadCurrentList", page);
  refreshIcons(tbody);
}

function calculateHotelQuote(payload = {}, hotel = null) {
  const checkInValue = payload.checkIn || document.getElementById("wizStart")?.value || "";
  const checkOutValue = payload.checkOut || document.getElementById("wizEnd")?.value || "";
  const adultsCount = Math.max(1, Number(payload.adultsCount ?? document.getElementById("wizAdults")?.value ?? 1));
  const childrenCount = Math.max(0, Number(payload.childrenCount ?? document.getElementById("wizChildren")?.value ?? 0));
  const checkIn = checkInValue ? new Date(`${checkInValue}T00:00:00`) : null;
  const checkOut = checkOutValue ? new Date(`${checkOutValue}T00:00:00`) : null;
  const pricePerNight = Number(hotel?.pricePerNight || 0);
  const maxGuestsPerRoom = Math.max(1, Number(hotel?.maxGuestsPerRoom || 2));
  const commissionPercent = Number(hotel?.commissionPercent || 0);
  const currency = hotel?.currency || "USD";
  const guests = adultsCount + childrenCount;
  const roomsCount = Math.max(1, Math.ceil(Math.max(1, guests) / maxGuestsPerRoom));
  const nights = checkIn && checkOut ? Math.ceil((checkOut - checkIn) / (24 * 60 * 60 * 1000)) : 0;
  const valid = Boolean(hotel?.id && checkIn && checkOut && nights > 0 && pricePerNight > 0);
  const baseAmount = valid ? pricePerNight * nights * roomsCount : 0;
  const commissionAmount = baseAmount * commissionPercent / 100;
  const totalAmount = baseAmount + commissionAmount;
  return {
    valid,
    currency,
    nights,
    roomsCount,
    adultsCount,
    childrenCount,
    commissionPercent,
    baseAmount,
    commissionAmount,
    totalAmount,
    availableRooms: Number(hotel?.availableRooms || 0),
  };
}

function wizardFooter() {
  const w = state.wizard;
  return `
    ${w.step > 1 ? `<button class="btn btn-outline" onclick="wizardBack()">${t("btn.back")}</button>` : `<button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>`}
    ${w.step < 3 ? `<button class="btn btn-primary" onclick="wizardNext()">${t("btn.next")}</button>` : `<button class="btn btn-primary" onclick="submitWizardBooking()">${t("btn.createBooking")}</button>`}`;
}

function wizardNext() {
  const w = state.wizard;
  if (w.step === 1) {
    w.type = document.getElementById("wizType").value;
  } else if (w.step === 2) {
    if (w.type === "HOTEL") {
      updateHotelQuote();
      const hotelId = document.getElementById("wizHotelId")?.value || w.payload.hotelId;
      const hotel = findWizardHotel(hotelId);
      const quote = calculateHotelQuote(w.payload, hotel);
      if (!quote.valid) return toast(t("toast.validationError"), "error");
      if (quote.availableRooms && quote.roomsCount > quote.availableRooms) return toast(t("toast.unavailable", "Not enough rooms for selected guests"), "error");
      w.payload = {
        type: w.type,
        hotelId,
        hotelName: hotel?.name || "",
        checkIn: w.payload.checkIn,
        checkOut: w.payload.checkOut,
        adultsCount: quote.adultsCount,
        childrenCount: quote.childrenCount,
        roomsCount: quote.roomsCount,
        nights: quote.nights,
        baseAmount: quote.baseAmount,
        commissionAmount: quote.commissionAmount,
        totalAmount: quote.totalAmount,
        currency: quote.currency,
        notes: w.payload.notes || "",
        hotel,
      };
    } else {
      w.payload = {
        type: w.type,
        checkIn: document.getElementById("wizStart").value || undefined,
        checkOut: document.getElementById("wizEnd").value || undefined,
        adultsCount: Number(document.getElementById("wizAdults").value || 1),
        totalAmount: Number(document.getElementById("wizAmount").value || 0),
        baseAmount: Number(document.getElementById("wizAmount").value || 0),
        currency: document.getElementById("wizCurrency").value || "USD",
        notes: document.getElementById("wizNotes").value,
      };
      if (!w.payload.totalAmount) return toast(t("toast.validationError"), "error");
    }
  }
  w.step += 1;
  renderBookingWizard();
}

function wizardBack() {
  state.wizard.step -= 1;
  renderBookingWizard();
}

async function submitWizardBooking() {
  const payload = { ...state.wizard.payload };
  if (state.wizard.type === "HOTEL") {
    delete payload.hotel;
    delete payload.hotelName;
    delete payload.totalAmount;
    delete payload.baseAmount;
    delete payload.commissionAmount;
  } else {
    delete payload.hotelId;
    payload.origin = "CAI";
    payload.destination = "JED";
    payload.departureDate = payload.checkIn || new Date().toISOString();
  }
  const res = await apiFetch("/bookings", { method: "POST", body: JSON.stringify(payload) });
  if (res?.success) {
    closeModal();
    toast(`${t("toast.created")} ${res.data.refNumber}`, "success");
    setPage("bookings");
  }
}

function field(id, labelKey, value = "", required = false, type = "text", extra = "", fallback = "") {
  return `<div class="form-field"><label>${t(labelKey, fallback || labelKey)} ${required ? '<span class="required">*</span>' : ""}</label><input id="${id}" type="${type}" value="${escapeHtml(value ?? "")}" ${extra}></div>`;
}

function updateWallet(data) {
  state.wallet = data;
  document.getElementById("walletPillValue").textContent = formatMoney(data.balance || 0, data.currency || "USD");
}

async function bootstrapUser() {
  const token = localStorage.getItem("accessToken");
  if (!token) {
    location.href = "/login.html";
    return false;
  }
  const me = await apiFetch("/auth/me");
  if (!me?.success) return false;
  if (me.data.role === "SUPERADMIN") {
    location.href = "/admin.html";
    return false;
  }
  state.user = me.data;
  localStorage.setItem("user", JSON.stringify(me.data));
  localStorage.setItem("userRole", me.data.role);
  document.getElementById("sidebarUser").textContent = me.data.name;
  document.getElementById("sidebarInitial").textContent = me.data.name?.charAt(0).toUpperCase() || "?";
  document.getElementById("sidebarCompany").textContent = me.data.company?.name || "Agency";
  document.getElementById("companyBreadcrumb").textContent = me.data.company?.name || "Agency";
  const tier = me.data.company?.tier || "STANDARD";
  document.getElementById("agentTier").textContent = t("tier." + tier, tier);
  document.getElementById("topbarTier").textContent = t("tier." + tier, tier);
  const wallet = await apiFetch("/wallet/balance");
  if (wallet?.data) updateWallet(wallet.data);
  loadMyQuotesBadge();
  return true;
}

const pageLoaders = {
  dashboard: renderDashboard,
  bookings: renderBookings,
  hotels: renderHotels,
  cruises: renderCruises,
  transport: renderTransport,
  activities: renderActivities,
  "security-approval": renderSecurityApproval,
  "airport-assist": renderAirportAssist,
  "sim-card": renderSimCard,
  offers: renderOffers,
  invoices: renderInvoices,
  wallet: renderWallet,
  reports: renderReports,
  calculators: renderCalculators,
  support: renderSupport,
  "my-quotes": renderMyQuotes,
};

document.addEventListener("portal:lang", () => { closeSidebar(); setPage(state.page); });

(async function init() {
  initI18n();
  refreshIcons();
  const ok = await bootstrapUser();
  if (ok) setPage("dashboard");
})();
</script>
