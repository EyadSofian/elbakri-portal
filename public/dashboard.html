// Fetch full activity details then open rich popup
/* ── Trip inclusions, transfers and party pricing ──────────────────────────
   Kept together above the detail modal because the single-trip form and the
   package line form both build on them. Mirrors src/shared/inclusions.ts and
   src/shared/activity-pricing.ts — the server is still what decides, these are
   what the client is shown before it does. */

/** The marked list, falling back to the two flat lists an older row still has. */
function activityInclusionRows(a) {
  if (Array.isArray(a.inclusions) && a.inclusions.length) {
    return a.inclusions
      .map(r => ({
        label: String(r?.label ?? "").trim(),
        labelAr: r?.labelAr ? String(r.labelAr).trim() : "",
        included: r?.included !== false,
      }))
      .filter(r => r.label);
  }
  return [
    ...(a.includes || []).map(x => ({ label: String(x), labelAr: "", included: true })),
    ...(a.excludes || []).map(x => ({ label: String(x), labelAr: "", included: false })),
  ].filter(r => r.label);
}

function inclusionLabel(row) {
  return isArabic() && row.labelAr ? row.labelAr : row.label;
}

/** Two boxes — what the client gets, and what they do not — instead of two
 *  chip rows that read the same and were easy to mistake for each other. */
function activityInclusionBoxes(a) {
  const rows = activityInclusionRows(a);
  const included = rows.filter(r => r.included);
  const excluded = rows.filter(r => !r.included);
  if (!included.length && !excluded.length) return "";
  const box = (list, kind, titleKey, titleFallback, ic) => list.length ? `
    <div class="act-inc-box act-inc-box--${kind}">
      <div class="act-inc-box-title">${icon(ic)}&nbsp;${t(titleKey, titleFallback)}</div>
      <ul class="act-inc-list">
        ${list.map(r => `<li><span class="act-inc-mark">${icon(ic)}</span><span>${escapeHtml(inclusionLabel(r))}</span></li>`).join("")}
      </ul>
    </div>` : "";
  return `<div class="act-inc-grid">
    ${box(included, "in", "activity.whatsIncluded", "What's included", "check")}
    ${box(excluded, "out", "activity.notIncluded", "Not included", "x")}
  </div>`;
}

/** Words that mean "we collect you" — an operator says so in the inclusions as
 *  often as they tick the flag, and both have to count. */
const ACT_TRANSFER_WORDS = [/\btransfer/i, /\bpick[- ]?up\b/i, /\btransport/i, /مواصلات/, /انتقال/, /توصيل/];

function actTransferIncluded(a) {
  if (a.transferIncluded) return true;
  return activityInclusionRows(a)
    .filter(r => r.included)
    .some(r => ACT_TRANSFER_WORDS.some(re => re.test(r.label) || (r.labelAr && re.test(r.labelAr))));
}

/** How many people one unit of each party rate covers. */
const ACT_PARTY_SIZE = { SINGLE: 1, DOUBLE: 2, TRIPLE: 3 };
const ACT_SIZE_BASIS = { 1: "SINGLE", 2: "DOUBLE", 3: "TRIPLE" };

/** The price this trip is sold at for one party of the given size, or null. */
function actPartyPrice(prices, basis) {
  const raw = prices?.[basis];
  return raw === null || raw === undefined || raw === "" ? null : Number(raw);
}

/**
 * How a party rate seats `pax` people — the same rule the server applies.
 *
 * Fill as many full parties as the rate holds, then charge whoever is left over
 * at the rate for how many THEY are: five people on a double rate are two
 * doubles and a single. When the leftover size is not priced, the odd group
 * falls back to a whole party at the chosen rate.
 *
 * Mirrors partyComposition() in src/shared/activity-pricing.ts. The two are
 * asserted against each other in tests/portal-helpers.test.js, because a
 * preview that disagreed with the server would quote one price and charge
 * another.
 */
function actPartyComposition(pax, basis, prices) {
  const unitPrice = actPartyPrice(prices, basis);
  if (unitPrice === null) return null;
  const size = ACT_PARTY_SIZE[basis];
  if (!size) return null;
  const heads = Math.max(1, Math.floor(pax) || 1);
  const full = Math.floor(heads / size);
  const rest = heads % size;

  const lines = [];
  if (full > 0) lines.push({ basis, count: full, unitPrice });
  if (rest > 0) {
    const restBasis = ACT_SIZE_BASIS[rest];
    const restPrice = restBasis ? actPartyPrice(prices, restBasis) : null;
    lines.push(restBasis && restPrice !== null
      ? { basis: restBasis, count: 1, unitPrice: restPrice }
      : { basis, count: 1, unitPrice });
  }
  return lines;
}

function actCompositionTotal(lines) {
  return (lines || []).reduce((sum, l) => sum + l.unitPrice * l.count, 0);
}

function actCompositionUnits(lines) {
  return (lines || []).reduce((sum, l) => sum + l.count, 0);
}

/** "2 × Double + 1 × Single" — what the price row says it is charging. */
function actCompositionLabel(lines, labels) {
  return (lines || [])
    .map(l => `${l.count} × ${(labels && labels[l.basis]) || l.basis}`)
    .join(" + ");
}

/** Only the ways this trip was actually priced. A blank price is "not sold that
 *  way", so the option is left out rather than shown as free. */
function actPartyPriceRows(a) {
  return [
    ["SINGLE", "hotel.single", "1 person", a.priceSingle],
    ["DOUBLE", "hotel.double", "2 people", a.priceDouble],
    ["TRIPLE", "hotel.triple", "3 people", a.priceTriple],
  ].filter(([, , , v]) => v !== null && v !== undefined && v !== "");
}

/**
 * The transfer panel: where the driver collects the clients and where they go
 * back. Hidden until the agent asks for it, and never offered at all when the
 * trip already includes a transfer.
 */
function activityTransferPanel(a, prefix) {
  if (actTransferIncluded(a)) {
    return `<div class="act-transfer-state act-transfer-state--on">

        </div>
        <button type="button" class="btn btn-outline btn-sm" id="${prefix}TransferToggle" onclick="actToggleTransfer('${prefix}')">
          ${icon("car")}&nbsp;${t("activity.addTransfer","Add transfer")}
        </button>
      </div>
      <input type="hidden" id="${prefix}TransferRequested" value="0">
      <div id="${prefix}TransferFields" class="act-transfer-fields" style="display:none">
        <div class="secondary-text" style="margin-bottom:10px">${t("activity.transferHelp","Tell us where the driver collects your clients and where to bring them back.")}</div>
        <div class="form-grid">

          </div>

          </div>

            <label>${t("activity.transferPickupTime","Pickup time")}</label>
            <input id="${prefix}TransferPickup" type="time">
          </div>

            <label>${t("activity.transferReturnTime","Return time")}</label>
            <input id="${prefix}TransferReturn" type="time" value="${escapeHtml(actTimeValue(a.returnTime))}">
            <small class="field-hint">${t("activity.transferReturnHint","Taken from the trip's return time — change it if they are going on somewhere else.")}</small>
          </div>
          <div class="form-field full">

/** "05:00 PM" and "17:00" both belong in a <input type=time>, which only takes
 *  the 24-hour form. Anything unparseable leaves the field empty. */
function actTimeValue(raw) {
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(raw ?? "").trim());
  if (!m) return "";
  let h = Number(m[1]);
  const min = Number(m[2]);
  const ap = (m[3] || "").toUpperCase();
  if (min > 59) return "";
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  if (h > 23) return "";
  return `${String(h).padStart(2,"0")}:${String(min).padStart(2,"0")}`;
}

/** Show or hide the transfer questions. Hiding the hotel field at the same time
 *  is the point: once a pickup point is given, "which hotel?" is answered. */
function actToggleTransfer(prefix) {
  const flag = document.getElementById(prefix + "TransferRequested");
  const fields = document.getElementById(prefix + "TransferFields");
  const button = document.getElementById(prefix + "TransferToggle");
  if (!flag || !fields) return;
  const on = flag.value !== "1";
  flag.value = on ? "1" : "0";
  fields.style.display = on ? "" : "none";
  if (button) {
    button.innerHTML = on
      ? `${icon("x")}&nbsp;${t("activity.removeTransfer","Remove transfer")}`
      : `${icon("car")}&nbsp;${t("activity.addTransfer","Add transfer")}`;
    refreshIcons(button);
  }
  const hotelField = document.getElementById(prefix + "HotelField");
  if (hotelField) hotelField.style.display = on ? "none" : "";
  if (on) document.getElementById(prefix + "TransferFrom")?.focus();
}

/** Most transfers bring people back where they were collected, so the return
 *  box shows the pickup as its placeholder rather than sitting blank. */
function actSyncTransferBack(prefix) {
  const from = document.getElementById(prefix + "TransferFrom");
  const to = document.getElementById(prefix + "TransferTo");
  if (!from || !to) return;
  to.placeholder = from.value.trim() || t("activity.transferSameAsPickup", "Back to the pickup point");
}

/** Read the transfer answers for submission. Returns null when none was asked
 *  for, and reports the one field that cannot be guessed. */
function actCollectTransfer(prefix) {
  const on = document.getElementById(prefix + "TransferRequested")?.value === "1";
  if (!on) return { transferRequested: false };
  const from = document.getElementById(prefix + "TransferFrom")?.value.trim();
  if (!from) return null;
  const to = document.getElementById(prefix + "TransferTo")?.value.trim();
  return {
    transferRequested: true,
    transferFromType: "ADDRESS",
    transferFromName: from,
    transferToType: "ADDRESS",
    transferToName: to || from,
    transferPickupTime: document.getElementById(prefix + "TransferPickup")?.value || undefined,
    transferReturnTime: document.getElementById(prefix + "TransferReturn")?.value || undefined,
    transferNotes: document.getElementById(prefix + "TransferNotes")?.value.trim() || undefined,
  };
}

function activityGroupTypeOptions(options) {
  return (options || []).map((option, index) => {
    const adjustment = Number(option.adjustmentValue || 0);
    const suffix = option.adjustmentType === "PERCENTAGE" && adjustment
      ? `+${formatNumber(adjustment)}%`
      : option.adjustmentType === "FIXED" && adjustment
        ? `+${formatNumber(adjustment)} ${t("pricing.fixed","fixed")}`
        : "";
    return `<label class="service-type-option">
      <input type="radio" name="actGroupType" value="${escapeHtml(option.id || "")}"
        data-code="${escapeHtml(option.code)}"
        data-adjustment-type="${escapeHtml(option.adjustmentType || "NONE")}"
        data-adjustment-value="${adjustment}" ${index === 0 ? "checked" : ""}
        onchange="actCalcTotalFromContext()">
      <span class="service-type-option__body">
        <span class="service-type-option__title">${escapeHtml(state.lang === "ar" ? (option.labelAr || option.labelEn) : option.labelEn)}</span>
        ${option.descriptionEn || option.descriptionAr ? `<span class="service-type-option__desc">${escapeHtml(state.lang === "ar" ? (option.descriptionAr || option.descriptionEn || "") : (option.descriptionEn || ""))}</span>` : ""}
      </span>
      ${suffix ? `<span class="service-type-option__price">${suffix}</span>` : ""}
    </label>`;
  }).join("") || `<div class="secondary-text">${t("empty.noData","No service types available")}</div>`;
}

function actCalcTotalFromContext() {
  const ctx = state.activityBookingContext;
  if (ctx) actCalcTotal(ctx.priceAdult, ctx.priceChild, ctx.currency);
}

let _actGroupTimer;
function actRefreshGroupTypes() {
  clearTimeout(_actGroupTimer);
  _actGroupTimer = setTimeout(async () => {
    const ctx = state.activityBookingContext;
    const box = document.getElementById("actGroupTypes");
    if (!ctx || !box) return;
    const pax = Math.max(1, parseInt(document.getElementById("actAdults")?.value || "1"))
      + Math.max(0, parseInt(document.getElementById("actChildren")?.value || "0"));
    const params = new URLSearchParams({ scope: "ACTIVITY", activityId: ctx.activityId, pax: String(pax) });
    if (ctx.destinationId) params.set("destinationId", ctx.destinationId);
    const date = document.getElementById("actDate")?.value;
    if (date) params.set("date", date);
    const res = await apiFetch(`/group-types?${params}`);
    state.activityGroupTypes = res?.data || [];
    box.innerHTML = activityGroupTypeOptions(state.activityGroupTypes);
    actCalcTotalFromContext();
  }, 220);
}

function selectActSlot(btn, slot) {
  document.querySelectorAll(".act-slot-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const inp = document.getElementById("actSelectedTime");
  if (inp) inp.value = slot;
}

/** Which price the client picked: per head, or a flat rate for the whole party. */
function actBasis() {
  return document.querySelector('input[name="actBasis"]:checked')?.value || "PER_PERSON";
}

function actBasisChanged() {
  // A party rate is charged per party, so the per-head rows in the summary no
  // longer describe what is being charged — a party row replaces them.
  const party = actBasis() !== "PER_PERSON";
  document.querySelectorAll(".act-perhead-row").forEach(el => { el.style.display = party ? "none" : ""; });
  const partyRow = document.getElementById("actPartyRow");
  if (partyRow) partyRow.style.display = party ? "" : "none";
  actCalcTotalFromContext();
}

function actCalcTotal(priceAdult, priceChild, currency) {
  const adults   = Math.max(1, parseInt(document.getElementById("actAdults")?.value || "2"));
  const children = Math.max(0, parseInt(document.getElementById("actChildren")?.value || "0"));
  const basis = actBasis();
  const ctx = state.activityBookingContext || {};
  let total;
  if (basis === "PER_PERSON") {
    total = adults * priceAdult + children * priceChild;
  } else {
    // A party rate prices ONE party, and whoever is left over is charged at the
    // rate for how many THEY are — five guests on a double rate are two doubles
    // and a single. Same rule as the server, so the preview and the confirmed
    // booking can never disagree.
    const pax = adults + children;
    const lines = actPartyComposition(pax, basis, ctx.partyPrices) || [];
    total = actCompositionTotal(lines);
    const partyLabel = ctx.partyLabels?.[basis] || basis;
    const breakdown = actCompositionLabel(lines, ctx.partyLabels);
    const label = document.getElementById("actPartyLabel");
    const calc = document.getElementById("actPartyCalc");
    if (label) label.textContent = breakdown;
    if (calc) {
      calc.textContent = lines
        .map(l => `${formatPrice(l.unitPrice, currency)} × ${l.count}`)
        .join("  +  ");
    }
    const hint = document.getElementById("actBasisHint");
    if (hint) {
      hint.textContent = t("activity.partyUnitHint","A {label} covers {size} people — {pax} are charged as {breakdown}.")
        .replace("{label}", partyLabel)
        .replace("{size}", String(ACT_PARTY_SIZE[basis] || 1))
        .replace("{pax}", String(pax))
        .replace("{breakdown}", breakdown);
    }
  }
  const selected = document.querySelector('input[name="actGroupType"]:checked');
  const adjustmentType = selected?.dataset.adjustmentType || "NONE";
  const adjustmentValue = Number(selected?.dataset.adjustmentValue || 0);
  if (adjustmentType === "PERCENTAGE") total *= 1 + adjustmentValue / 100;
  if (adjustmentType === "FIXED") total += adjustmentValue;
  const el = document.getElementById("actTotalPreview");
  if (el) el.textContent = formatPrice(total, currency);
  const ac = document.getElementById("actAdultCount");
  if (ac) ac.textContent = adults;
  const cc = document.getElementById("actChildCount");
  if (cc) cc.textContent = children;
}

function actUpdateChildAges() {

  const box = document.getElementById("actChildAgesBox");
  if (!box) return;
  box.style.display = count > 0 ? "" : "none";
  if (count > 0) {
    box.innerHTML = `<label>${t("hotel.childAge","Children Ages")}</label>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:6px">
        ${Array.from({length: count}, (_, i) => `

async function _submitActivityBooking(activityId, activityName, priceAdult, priceChild, currency) {
  const date       = document.getElementById("actDate")?.value;
  const clientName = document.getElementById("actClientName")?.value.trim();
  const clientPhone= document.getElementById("actClientPhone")?.value.trim();
  const hotelName  = document.getElementById("actHotelName")?.value.trim();
  const adults     = parseInt(document.getElementById("actAdults")?.value || "2");
  const children   = parseInt(document.getElementById("actChildren")?.value || "0");
  const notes      = document.getElementById("actNotes")?.value.trim();
  const groupType  = document.querySelector('input[name="actGroupType"]:checked');
  const selTime    = document.getElementById("actSelectedTime")?.value || undefined;
  const childAges  = Array.from({length: children}, (_, i) =>
    parseInt(document.getElementById(`actChildAge_${i}`)?.value || "7")
  );

  if (!date || !clientName || !clientPhone) {
    toast(t("transport.requiredFields","Please fill: date, client name and phone"), "error");
    return;
  }

  // A transfer with no pickup point is a car with nowhere to go, so the request
  // is held back rather than sent for the desk to chase.
  const transfer = actCollectTransfer("act");
  if (transfer === null) {
    toast(t("activity.transferFromRequired","Enter where the driver should collect them"), "error");
    document.getElementById("actTransferFrom")?.focus();
    return;
  }

  const submitBtn = document.getElementById("submitActivityBtn");
  if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = `<span class="btn-spinner"></span>&nbsp;${t("btn.saving","Saving...")}`; }

  const res = await apiFetch("/activity-bookings", { method: "POST", body: JSON.stringify({
    activityId,
    // Tells the server to charge per head or a flat party rate.
    pricingBasis: actBasis(),
    activityDate: date,
    selectedTime: selTime,
    groupTypeId: groupType?.value || undefined,
    adultsCount: adults,
    childrenCount: children,
    childAges: children > 0 ? childAges : undefined,
    clientName,
    clientPhone,
    // Once a transfer is booked the pickup point answers "which hotel?".
    hotelName: transfer.transferRequested ? undefined : (hotelName || undefined),
    ...transfer,
    notes: notes || undefined,
  })});

  if (res?.success) {
    serviceSuccessModal(res.data.refNumber, res.data.voucher);
  } else {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = `${icon("calendar-check")}&nbsp;${t("btn.submitRequest","Submit Request")}`; }
  }
}

/**
 * The airports an admin has configured. Security approval locations and airport
 * assist both pick from this list, so adding one under Transport → Airports is
 * enough to offer it — no code change, and no list to keep in step here.
 */
async function ensureAirportList() {
  if (state.cache.airports) return state.cache.airports;
  const res = await apiFetch("/airports");
  state.cache.airports = (res?.data || []).map(a => ({
    dest: a.code,
    label: `${a.code} · ${state.lang === "ar" ? (a.nameAr || a.nameEn) : a.nameEn}`,
  }));
  return state.cache.airports;
}

/**
 * The three areas an approval can be filed for. Served by the API so the portal
 * offers exactly what it accepts; the labels are kept raw and picked per render
 * so switching language relabels them without a reload.
 */
async function ensureSecurityDestinations() {
  if (state.cache.securityDestinations) return state.cache.securityDestinations;
  const res = await apiFetch("/visa-applications/destinations");
  const list = res?.data || [];
  // Only remember a list that actually arrived — caching a failed fetch would
  // leave the dropdown empty for the rest of the session.
  if (list.length) state.cache.securityDestinations = list;
  return list;
}

/**
 * The three nationalities approvals are actually filed for.
 *
 * Offering the whole country list let an agent pick "Saudi", fill the form and
 * only then learn the request cannot be filed. Served by the API so the portal
 * offers exactly what it accepts, cached like the destinations list.
 */
async function ensureSecurityNationalities() {
  if (state.cache.securityNationalities) return state.cache.securityNationalities;
  const res = await apiFetch("/visa-applications/nationalities");
  const list = res?.data || [];
  if (list.length) state.cache.securityNationalities = list;
  return list;
}

function securityNationalityLabel(code) {
  if (!code) return "";
  const found = (state.cache.securityNationalities || []).find(n => n.code === code);
  return found ? locName(found.en, found.ar) : t("nationality." + code, code);
}

function securityDestinationLabel(code) {
  if (!code) return "";
  const found = (state.cache.securityDestinations || []).find(d => d.code === code);
  return found ? locName(found.en, found.ar) : code;
}

async function updateSecurityApprovalQuote() {
  const type = document.getElementById("saType")?.value;
  // An approval is priced per nationality as well as per destination, so the
  // quote is only right once all three parts of the question are answered.
  const destinationCity = document.getElementById("saDestinationCity")?.value;
  const nationality = document.getElementById("saNationality")?.value;
  const paxCount = Math.max(1, Number(document.getElementById("saPax")?.value || 1));
  const preview = document.getElementById("saQuotePreview");
  const submitBtn = document.getElementById("submitSaBtn");
  if (!preview) return;
  const missing = !type ? t("securityApproval.types","Approval Type")
    : !destinationCity ? t("securityApproval.destination","Destination")
      : !nationality ? t("form.nationality","Nationality")
        : "";
  if (missing) {
    preview.textContent = `${t("form.select","Select")} ${missing}`;
    if (submitBtn) submitBtn.disabled = false;
    return;
  }
  preview.innerHTML = `<span class="skeleton-line" style="width:140px"></span>`;
  const res = await apiFetch(`/visa-applications/quote?${new URLSearchParams({
    visaType: "TOURIST",
    destinationCountry: type,
    destinationCity,
    nationality,
    processingType: "NORMAL",
    paxCount: String(paxCount),
  })}`, { quiet: true });
  if (!document.getElementById("saQuotePreview")) return;
  if (res?.data) {
    preview.innerHTML = `<span>${t("th.total","Total")}</span><strong>${formatStoredMoney(res.data.totalAmount, res.data.currency)}</strong>`;
    if (submitBtn) submitBtn.disabled = false;
    return;
  }
  // Nothing is priced for this combination. Booking it would fail on the
  // server anyway, so the button becomes the thing that CAN be done: send the
  // desk a request and let them quote it.
  preview.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">
    <span class="text-danger">${t("securityApproval.priceNotSetForNationality","No price is set for this nationality yet — send a request and we will quote it.")}</span>
    <button type="button" class="btn btn-primary btn-sm" onclick="saSendUnpricedRequest()">${icon("send")}&nbsp;${t("securityApproval.sendRequest","Send Request")}</button>
  </div>`;
  refreshIcons(preview);
  if (submitBtn) submitBtn.disabled = true;
}

// ─── File upload helper ───────────────────────────────────────────────────────
// isPrivate=true routes passports/tickets/private docs to /api/upload/private,
// which stores them outside the public /uploads dir and returns a protected URL
// (/api/files/private/...) only downloadable by the owning company or an admin.
async function uploadAndFill(input, targetId, isPrivate) {
  const file = input.files?.[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(isPrivate ? "/api/upload/private" : "/api/upload", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
      credentials: "include",
    });
    const json = await res.json();
    if (json?.data?.url) {
      const target = document.getElementById(targetId);
      if (target) target.value = json.data.url;
      toast("✅ Uploaded", "success");
    } else {
      toast(json?.message || "Upload failed", "error");
    }
  } catch {
    toast("Upload failed", "error");
  }
}

function invBulkSync() {
  const checked = Array.from(document.querySelectorAll(".inv-check:checked"));
  const bar = document.getElementById("invBulkBar");
  const cnt = document.getElementById("invBulkCount");
  const amt = document.getElementById("invBulkAmount");
  const btn = document.getElementById("invBulkBtn");
  if (bar) bar.style.display = checked.length ? "flex" : "none";
  document.body.classList.toggle("has-bulkbar", checked.length > 0);
  if (cnt) cnt.textContent = `${checked.length} ${t("invoice.selected","selected")}`;
  if (amt) {
    const totals = {};
    for (const c of checked) {
      const inv = (window._invoiceRows || []).find(i => i.id === c.value);
      if (inv) totals[inv.currency || "USD"] = (totals[inv.currency || "USD"] || 0) + Number(inv.total || 0);
    }
    amt.textContent = Object.entries(totals).map(([cur, v]) => formatStoredMoney(v, cur)).join("  ·  ");
  }
  // Keep the select-all checkbox in sync with row state.
  const all = document.getElementById("invSelectAll");
  const boxes = document.querySelectorAll(".inv-check");
  if (all) all.checked = boxes.length > 0 && checked.length === boxes.length;
  if (btn) btn.disabled = checked.length === 0;
}
function invToggleAll(cb) {
  document.querySelectorAll(".inv-check").forEach(c => { c.checked = cb.checked; });
  invBulkSync();

function invClearSelection() {

/**
 * Fetch a combined invoice PDF and hand it to the browser.
 *
 * `body` is either an explicit list of invoice ids or `{ all: true }` — the
 * download itself is identical, so the two buttons share this rather than each
 * keeping its own copy of the blob dance.
 */
async function invFetchCombinedPdf(body, btn, restoreHtml) {
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-spinner"></span>&nbsp;${t("invoice.preparing","Preparing…")}`; }
  try {
    const token = localStorage.getItem("accessToken");
    const res = await fetch("/api/invoices/bulk-pdf", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("bulk pdf failed");
    const blob = await res.blob();
    const disp = res.headers.get("Content-Disposition") || "";
    const name = (disp.match(/filename="?([^"]+)"?/) || [])[1] || "ELBAKRI-INVOICES.pdf";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(t("invoice.downloaded","Combined invoice PDF downloaded"), "success");
    return true;
  } catch (e) {
    toast(t("toast.error","Download failed"), "error");
    return false;
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = restoreHtml; refreshIcons(btn.parentElement); }
  }
}

async function invBulkDownloadPdf() {
  const ids = Array.from(document.querySelectorAll(".inv-check:checked")).map(c => c.value);
  if (!ids.length) return;

    `${icon("file-down")}&nbsp;${t("invoice.downloadCombined","Download Combined PDF")}`);

}

async function downloadAuthenticatedFile(path, filename) {
  const res = await fetch(`/api${path}`, {
    headers: { Authorization: `Bearer ${localStorage.getItem("accessToken")}` },
    credentials: "include",
  });
  if (!res.ok) {
    const error = await res.json().catch(() => ({}));
    toast(error.message || t("toast.error","Download failed"), "error");
    return;
  }
  const url = URL.createObjectURL(await res.blob());
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

// Single professional currency converter (replaces the old commission + markup
// + manual-rate calculators). Uses live, server-cached FX rates (state.fxRates,
// base USD) — never a hand-typed rate. Honest about cached/stale data.
function renderCalculators() {
  const rates = (state.fxRates && state.fxRates.rates) || { USD: 1 };
  const currencies = Array.from(new Set(["USD", "EUR", "EGP", "SAR", "AED", "GBP", ...Object.keys(rates)]))
    .filter(c => c === "USD" || isFinite(Number(rates[c])));
  const opt = (sel) => currencies.map(c => `<option value="${c}" ${c === sel ? "selected" : ""}>${c}</option>`).join("");
  const stale = !state.fxRates || !state.fxRates.lastUpdated || new Date(state.fxRates.lastUpdated).getTime() === 0;
  content(pageHeader() + `
    <div class="panel" style="max-width:560px">
      <div class="panel-header"><div class="panel-title">${icon("arrow-right-left")}&nbsp;${t("calc.converterTitle", "Currency Converter")}</div>
        <button class="btn btn-outline btn-sm" type="button" onclick="refreshFxRates()" title="${t("btn.refresh", "Refresh")}">${icon("refresh-cw")}</button>
      </div>
      <div class="panel-body">
        <div class="field"><label>${t("calc.amount", "Amount")}</label>
          <input id="cvAmount" type="number" min="0" step="any" inputmode="decimal" value="100" oninput="currencyConvert()"></div>
        <div style="display:flex;gap:10px;align-items:flex-end;margin-top:12px">
          <div class="field" style="flex:1"><label>${t("calc.from", "From")}</label><select id="cvFrom" onchange="currencyConvert()">${opt("USD")}</select></div>
          <button class="btn btn-outline" type="button" title="${t("calc.swap", "Swap")}" onclick="swapCurrencies()" style="margin-bottom:2px">${icon("arrow-right-left")}</button>
          <div class="field" style="flex:1"><label>${t("calc.to", "To")}</label><select id="cvTo" onchange="currencyConvert()">${opt("EGP")}</select></div>
        </div>
        <div class="stat-card" style="margin-top:16px;text-align:center">
          <div class="stat-label">${t("calc.result", "Converted amount")}</div>
          <div class="stat-value" id="cvResult" style="font-size:26px">—</div>
          <div class="secondary-text" id="cvRateLine" style="margin-top:6px"></div>
        </div>
        <div class="secondary-text" style="margin-top:12px;display:flex;align-items:center;gap:6px">
          ${icon(stale ? "alert-triangle" : "clock")}
          <span>${stale ? t("fx.stale", "Live rates unavailable — using last cached values") : escapeHtml(fxUpdatedLabel())}</span>
        </div>
      </div>
    </div>`);
  currencyConvert();
}

function currencyConvert() {
  const rates = (state.fxRates && state.fxRates.rates) || { USD: 1 };
  const amount = Number(document.getElementById("cvAmount")?.value);
  const from = document.getElementById("cvFrom")?.value || "USD";
  const to = document.getElementById("cvTo")?.value || "USD";
  const resEl = document.getElementById("cvResult");
  const rateEl = document.getElementById("cvRateLine");
  if (!resEl) return;
  if (!isFinite(amount) || amount < 0) { resEl.textContent = "—"; if (rateEl) rateEl.textContent = ""; return; }
  const rFrom = from === "USD" ? 1 : Number(rates[from]);
  const rTo = to === "USD" ? 1 : Number(rates[to]);
  if (!isFinite(rFrom) || !isFinite(rTo) || rFrom <= 0) {
    resEl.textContent = t("fx.noRate", "Rate unavailable");
    if (rateEl) rateEl.textContent = "";
    return;
  }
  const usd = amount / rFrom;     // rates are "units per 1 USD" → back to USD base
  const out = usd * rTo;          // then to the target currency
  resEl.textContent = formatMoney(out, to);
  if (rateEl) rateEl.textContent = `1 ${from} = ${formatMoney((1 / rFrom) * rTo, to)}`;
}

function swapCurrencies() {
  const f = document.getElementById("cvFrom"), tEl = document.getElementById("cvTo");
  if (!f || !tEl) return;
  const tmp = f.value; f.value = tEl.value; tEl.value = tmp;
  currencyConvert();
}

function debouncedList(page) {
  clearTimeout(listTimer);
  listTimer = setTimeout(() => loadCurrentList(page), 250);
}

function clearListFilters(page) {
  document.querySelectorAll(`[id^="${page}-"], #${page}Search`).forEach(el => { el.value = ""; });
  loadCurrentList(page);

async function loadCurrentList(page, pageNumber = 1) {
  const config = state.listConfigs[page];
  if (config) {
    await loadListData(page, config.endpoint, config.columns, pageNumber);
    return;
  }
  const loader = pageLoaders[page];
  if (loader) loader();
}

async function loadListData(page, endpoint, columns, pageNumber = 1) {
  const params = new URLSearchParams({ page: pageNumber, limit: 50 });
  document.querySelectorAll(`[id^="${page}-"]`).forEach(el => { if (el.value) params.set(el.id.replace(page + "-", ""), el.value); });
  const search = document.getElementById(page + "Search")?.value;
  if (search) params.set("search", search);

  const res = await apiFetch(`${endpoint}${endpoint.includes("?") ? "&" : "?"}${params}`);
  if (!res) return;  // apiFetch already toasted the error

  const rows = res?.data || [];
  state.cache[page + "Rows"] = rows;
  const tbody = document.getElementById(page + "Tbody");
  if (!tbody) return;

  if (rows.length) {
    tbody.innerHTML = rows.map(row => `<tr>${columns.map(([, fn]) => `<td>${fn(row)}</td>`).join("")}</tr>`).join("");
  } else {
    // For hotel sub-pages (when a destination filter is active), show Back link in empty state
    const isHotelSubPage = page === "hotels" && state.selectedDest?.id;
    tbody.innerHTML = `<tr><td colspan="${columns.length}">
      <div class="empty-state">
        ${icon("hotel")}
        <strong>${t("empty.noData","No hotels found")}</strong>
        <span>${isHotelSubPage ? t("hotel.chooseDest","Try a different destination") : t("empty.adjustFilters")}</span>
        ${isHotelSubPage ? `<button class="btn btn-outline" style="margin-top:12px" onclick="renderHotels()">${icon("arrow-left")}&nbsp;${t("btn.back","Back to Destinations")}</button>` : ""}
      </div>
    </td></tr>`;
  }

  const meta = res?.meta || { total: rows.length, page: 1, limit: 50, pages: 1 };
  const metaEl = document.getElementById(page + "Meta");
  if (metaEl) metaEl.textContent = `${formatNumber(meta.total)} ${t(pageMeta[page]?.[0] || "empty.noData")}`;
  const footEl = document.getElementById(page + "Foot");
  if (footEl) footEl.innerHTML = tableFoot(meta, "loadCurrentList", page);
  refreshIcons(tbody);
}

function wizardFooter() {
  const w = state.wizard;
  return `
    ${w.step > 1 ? `<button class="btn btn-outline" onclick="wizardBack()">${t("btn.back")}</button>` : `<button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>`}

}

function wizardNext() {
  const w = state.wizard;
  if (w.step === 1) {
    w.type = document.getElementById("wizType").value;
  } else if (w.step === 2) {
    if (w.type === "HOTEL") {
      const hotelId = document.getElementById("wizHotelId")?.value;
      const hotel = findWizardHotel(hotelId);
      const checkIn = document.getElementById("wizStart")?.value;
      const checkOut = document.getElementById("wizEnd")?.value;
      if (!hotelId || !checkIn || !checkOut || new Date(checkOut) <= new Date(checkIn)) {
        return toast(t("toast.validationError"), "error");
      }
      const childrenCount = Math.max(0, Number(document.getElementById("wizChildren")?.value || 0));
      if (childrenCount > 0 && !childAgesValid(childrenCount, "wiz")) {
        return toast(t("validation.childAges","Please enter all children ages"), "error");
      }
      w.payload = {
        hotelId,
        hotelName: hotel?.name || "",
        checkIn,
        checkOut,
        adultsCount: Math.max(1, Number(document.getElementById("wizAdults")?.value || 1)),
        childrenCount,
        childAges: childrenCount > 0 ? collectChildAges(childrenCount, "wiz") : [],
        roomsCount: Math.max(1, Number(document.getElementById("wizRooms")?.value || 1)),
        nationality: document.getElementById("wizNationality")?.value || "",
        notes: document.getElementById("wizNotes")?.value || "",
      };
    } else {
      const serviceName = document.getElementById("wizServiceName")?.value.trim();
      const checkIn = document.getElementById("wizStart")?.value;
      if (!serviceName || !checkIn) return toast(t("toast.validationError"), "error");
      const checkOut = document.getElementById("wizEnd")?.value || undefined;
      if (checkOut && new Date(checkOut) <= new Date(checkIn)) {
        return toast(t("toast.validationError"), "error");
      }
      const childrenCount = Math.max(0, Number(document.getElementById("wizChildren")?.value || 0));
      if (childrenCount > 0 && !childAgesValid(childrenCount, "wiz")) {
        return toast(t("validation.childAges","Please enter all children ages"), "error");
      }
      w.payload = {
        serviceName,
        checkIn,
        checkOut,
        adultsCount: Math.max(1, Number(document.getElementById("wizAdults")?.value || 1)),
        childrenCount,
        childAges: childrenCount > 0 ? collectChildAges(childrenCount, "wiz") : [],
        nationality: document.getElementById("wizNationality")?.value || "",
        notes: document.getElementById("wizNotes")?.value || "",
      };
    }
  }
  w.step += 1;
  renderBookingWizard();
}

function wizardBack() {
  state.wizard.step -= 1;
  renderBookingWizard();
}

async function submitWizardBooking() {
  const w = state.wizard;
  const payload = {
    serviceType: w.type,
    hotelId: w.type === "HOTEL" ? w.payload.hotelId : undefined,
    serviceName: w.type === "HOTEL" ? w.payload.hotelName : w.payload.serviceName,

    checkIn: w.payload.checkIn,
    checkOut: w.payload.checkOut,
    adultsCount: w.payload.adultsCount,
    childrenCount: w.payload.childrenCount,
    childAges: w.payload.childAges,
    roomsCount: w.type === "HOTEL" ? w.payload.roomsCount : undefined,
    nationality: w.payload.nationality,
    customerNotes: w.payload.notes,
    contactPreference: "whatsapp",

async function bootstrapUser() {
  const token = localStorage.getItem("accessToken");
  if (!token) {
    location.href = "/login.html";
    return false;
  }
  const me = await apiFetch("/auth/me");
  if (!me?.success) return false;
  if (me.data.role === "SUPERADMIN") {
    location.href = "/admin.html";
    return false;
  }
  state.user = me.data;
  // Display currency: explicit company currency, else market default.
  state.displayCurrency = normalizeCompanyDisplayCurrency(
    me.data.company?.currency,
    me.data.company?.market,
  );
  await loadFxRates();
  localStorage.setItem("user", JSON.stringify(me.data));
  localStorage.setItem("userRole", me.data.role);
  document.getElementById("sidebarUser").textContent = me.data.name;
  document.getElementById("sidebarInitial").textContent = me.data.name?.charAt(0).toUpperCase() || "?";
  document.getElementById("sidebarCompany").textContent = me.data.company?.name || "Agency";
  document.getElementById("companyBreadcrumb").textContent = me.data.company?.name || "Agency";
  const tier = me.data.company?.tier || "STANDARD";
  document.getElementById("agentTier").textContent = t("tier." + tier, tier);
  document.getElementById("topbarTier").textContent = t("tier." + tier, tier);
  const wallet = await apiFetch("/wallet/balance");
  if (wallet?.data) updateWallet(wallet.data);
  loadMyQuotesBadge();
  return true;
}

const pageLoaders = {
  dashboard: renderDashboard,
  bookings: renderBookings,
  hotels: renderHotels,
  cruises: renderCruises,
  transport: renderTransport,
  activities: renderActivities,
  "security-approval": renderSecurityApproval,
  "airport-assist": renderAirportAssist,
  "sim-card": renderSimCard,
  offers: renderOffers,
  invoices: renderInvoices,
  wallet: renderWallet,
  reports: renderReports,
  calculators: renderCalculators,
  support: renderSupport,
  "my-quotes": renderMyQuotes,
};

document.addEventListener("portal:lang", (e) => {
  state.lang = e.detail?.lang || document.documentElement.lang || "en";
  closeSidebar();
  setPage(state.page);
});

(async function init() {
  initI18n();
  refreshIcons();
  const ok = await bootstrapUser();
  if (ok) setPage("dashboard");
})();
</script>
</body>
</html>
