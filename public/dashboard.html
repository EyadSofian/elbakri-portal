    /* Hotel detail — rates, price preview, policies */
    .hd-section { margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
    .hd-title { font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:10px; }
    .hd-preview-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .hd-preview-out { margin-top:10px; }
    .hd-total { font-size:22px; font-weight:800; color:var(--brand-accent); }
    .hd-policies { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .hd-policy { background:var(--accent-tint); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
    .hd-policy-k { font-size:12px; font-weight:700; color:var(--brand-accent); margin-bottom:4px; }
    .hd-policy-v { font-size:13px; color:var(--text-secondary); white-space:pre-wrap; line-height:1.45; }
    /* Typed transport From/To */
    .tf-ep-types { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .tf-ep-type { flex:1; min-width:90px; text-align:center; padding:9px 10px; border:1px solid var(--border); border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; user-select:none; transition:all .12s; }
    .tf-ep-type.on { background:var(--brand-accent); color:#fff; border-color:var(--brand-accent); }
    /* Which hotel inside the chosen destination — a detail of that endpoint,
       so it is indented under it rather than sitting beside it as an equal. */
    .tr-ep-hotel { border-inline-start:3px solid var(--brand-accent); padding-inline-start:10px; }
    .tr-ep-hotel-label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; color:var(--text-secondary); }
    @media (max-width:640px){ .hd-preview-grid{ grid-template-columns:1fr; } }
  </style>

<script>
const { t, initI18n, applyTranslations, formatMoney, formatDate, formatNumber } = window.PortalI18n;

const state = {
  page: "dashboard",
  renderToken: 0,
  user: null,
  wallet: null,
  selected: new Set(),
  cache: {},
  filters: {},
  listConfigs: {},
  wizard: { step: 1, type: "HOTEL", payload: {} },
  fxRates: null,          // { base, rates:{USD,EUR,EGP,...}, lastUpdated }
  displayCurrency: "USD", // company's display currency (derived from market/company.currency)
  // Mirrors the document language so the "show the Arabic label" checks
  // throughout this file actually answer yes when the portal is in Arabic.
  lang: document.documentElement.lang || localStorage.getItem("lang") || "en",
};

// Default display currency by market when the company has no explicit currency set.
const MARKET_DEFAULT_CURRENCY = { EGYPTIAN: "EGP", INTERNATIONAL: "USD", GULF: "USD", FOREIGN: "USD" };
const COMPANY_DISPLAY_CURRENCIES = ["USD", "EGP"];

function normalizeCompanyDisplayCurrency(value, market) {
  const cur = String(value || "").toUpperCase();
  if (COMPANY_DISPLAY_CURRENCIES.includes(cur)) return cur;
  return MARKET_DEFAULT_CURRENCY[market] || "USD";
}

/** Convert a live catalog price from its source currency to the company's display currency. */
function convertLiveMoney(amount, sourceCurrency = "USD") {
  const source = String(sourceCurrency || "USD").toUpperCase();
  const target = String(state.displayCurrency || source).toUpperCase();
  const value = Number(amount || 0);
  if (source === target) return { amount: value, currency: target, converted: true };

  const rates = state.fxRates?.rates;
  const base = String(state.fxRates?.base || "USD").toUpperCase();
  const sourceRate = source === base ? 1 : Number(rates?.[source]);
  const targetRate = target === base ? 1 : Number(rates?.[target]);
  if (!isFinite(sourceRate) || sourceRate <= 0 || !isFinite(targetRate) || targetRate <= 0) {
    return { amount: value, currency: source, converted: false };
  }
  return { amount: (value / sourceRate) * targetRate, currency: target, converted: true };
}

/**
 * Sale prices are admin-defined per currency and resolved server-side; they are
 * shown verbatim in their own currency (NO automatic FX conversion). The live
 * currency converter remains available separately on the Calculators page.
 */
function formatPrice(amount, sourceCurrency = "USD") {
  if (amount == null || amount === "") return "—";
  return formatMoney(Number(amount), sourceCurrency || "USD");
}

/** Amounts already stored on bookings, invoices and wallets must never be converted twice. */
function formatStoredMoney(amount, currency) {
  if (amount == null || amount === "") return "—";
  return formatMoney(Number(amount), currency || state.displayCurrency || "USD");
}

/** Human-readable "rates updated at ..." line. */
function fxUpdatedLabel() {
  if (!state.fxRates || !state.fxRates.lastUpdated) return "";
  const d = new Date(state.fxRates.lastUpdated);
  if (isNaN(d.getTime()) || d.getTime() === 0) return "";
  return `${t("fx.updated", "Rates updated")}: ${formatDate(state.fxRates.lastUpdated)}`;
}

async function loadFxRates() {
  try {
    const res = await apiFetch("/fx/rates");
    if (res?.data?.rates) state.fxRates = res.data;
  } catch (_) { /* keep null → formatPrice falls back to USD */ }
}

const pageMeta = {
  dashboard: ["page.dashboardTitle", "page.dashboardSub"],
  bookings: ["page.bookingsTitle", "page.bookingsSub"],
  hotels: ["page.hotelsTitle", "page.hotelsSub"],
  cruises: ["nav.nileCruises", "page.servicesSub"],
  transport: ["nav.transport", "page.servicesSub"],
  activities: ["nav.activities", "page.servicesSub"],
  "security-approval": ["page.securityApprovalTitle", "page.securityApprovalSub"],
  "airport-assist": ["page.airportAssistTitle", "page.airportAssistSub"],
  "sim-card": ["page.simCardTitle", "page.simCardSub"],
  offers: ["page.offersTitle", "page.offersSub"],
  invoices: ["page.invoicesTitle", "page.invoicesSub"],
  wallet: ["page.walletTitle", "page.walletSub"],
  reports: ["page.reportsTitle", "page.reportsSub"],
  calculators: ["page.calculatorsTitle", "page.calculatorsSub"],
  support: ["nav.support", "page.servicesSub"],
  "my-quotes": ["nav.myQuotes", "page.quoteRequestsSub"],
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineJsonArg(value) {
  return escapeHtml(JSON.stringify(String(value ?? "")));
}

function icon(name) {
  return `<i data-lucide="${name}"></i>`;
}

function refreshIcons(root = document) {
  applyTranslations(root);
  if (window.lucide) window.lucide.createIcons();
}

/**
 * `quiet: true` suppresses the error toast and returns null instead.
 *
 * For a lookup whose failure the screen already explains — a price that has not
 * been set yet, where the panel offers "send a request" in its place — a red
 * toast saying PRICE_NOT_CONFIGURED adds noise and no information.
 */
function apiFetch(path, options = {}) {
  const token = localStorage.getItem("accessToken");
  const { quiet, ...init } = options;
  return fetch("/api" + path, {
    ...init,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(init.headers || {}) },
    credentials: "include",
  }).then(async res => {
    if (res.status === 401) {
      const refresh = await fetch("/api/auth/refresh", { method: "POST", credentials: "include" });
      if (!refresh.ok) {
        localStorage.clear();
        location.href = "/login.html";
        return null;
      }
      const json = await refresh.json();
      localStorage.setItem("accessToken", json.data.accessToken);
      return apiFetch(path, options);
    }
    const json = await res.json().catch(() => ({ success: false, message: res.statusText }));
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Request failed");
    return json;
  }).catch(err => {
    if (!quiet) toast(err.message || "Request failed", "error");
    return null;
  });
}

async function downloadVoucherPdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/vouchers/${id}/download`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "Voucher download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `voucher-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "Voucher download failed", "error");
  }
}

async function downloadInvoicePdf(id) {
  const token = localStorage.getItem("accessToken");
  try {
    const res = await fetch(`/api/invoices/${id}/pdf`, {
      headers: { Authorization: `Bearer ${token}` },
      credentials: "include",
    });
    if (!res.ok) {
      const json = await res.json().catch(() => null);
      throw new Error(json?.message || json?.error || "PDF download failed");
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/i);
    const filename = match?.[1] || `invoice-${id}.pdf`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(err.message || "PDF download failed", "error");
  }
}

function toast(message, type = "") {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = `toast ${type} show`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = "toast"; }, 3600);
}

function content(html) {
  const root = document.getElementById("content");
  root.innerHTML = html;
  refreshIcons(root);
}

function pageHeader(actions = "") {
  const [titleKey, subKey] = pageMeta[state.page] || pageMeta.dashboard;
  document.getElementById("breadcrumbTitle").textContent = t(titleKey);
  return `<div class="page-header">
    <div>
      <div class="page-kicker">${escapeHtml(state.user?.company?.name || "Elbakri B2B")}</div>
      <h1 class="page-title">${t(titleKey)}</h1>
      <p class="page-subtitle">${t(subKey)}</p>
    </div>
    <div class="page-actions">${actions}</div>
  </div>`;
}

function statusBadge(status) {
  const key = String(status || "").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("status." + key, key.replace(/_/g, " "))}</span>`;
}

function tierBadge(tier) {
  const key = String(tier || "STANDARD").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("tier." + key, key)}</span>`;
}

function skeletonRows(cols = 8, rows = 8) {
  return Array.from({ length: rows }, () => `<tr>${Array.from({ length: cols }, () => `<td><div class="skeleton" style="height:14px;width:70%"></div></td>`).join("")}</tr>`).join("");
}

function emptyBlock(messageKey, action = "") {
  return `<div class="empty-state"><div class="empty-illustration"></div><strong>${t(messageKey)}</strong><span>${t("empty.adjustFilters")}</span>${action}</div>`;
}

function tableFoot(meta, onPage, pageName) {
  const page = meta?.page || 1;
  const pages = Math.max(meta?.pages || 1, 1);
  const total = meta?.total || 0;
  const limit = meta?.limit || 20;
  const start = total ? ((page - 1) * limit) + 1 : 0;
  const end = Math.min(page * limit, total);
  return `<div class="table-foot">
    <span>${formatNumber(start)}-${formatNumber(end)} / ${formatNumber(total)}</span>
    <div class="pager">${Array.from({ length: Math.min(pages, 7) }, (_, i) => `<button class="${i + 1 === page ? "active" : ""}" onclick="${onPage}('${pageName}', ${i + 1})">${i + 1}</button>`).join("")}</div>
  </div>`;
}

function exportRows(filename, rows) {
  if (!rows || !rows.length) return toast(t("toast.noRowsSelected"), "warning");
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Export");
    XLSX.writeFile(wb, `${filename}.xlsx`);
  } else {
    // The spreadsheet library is a third-party CDN. When it does not load the
    // button used to report success and hand over nothing, so fall back to a
    // CSV the browser builds itself.
    downloadCsv(filename, rows);
  }
  toast(t("toast.exported"), "success");
}

/* CSV written with a UTF-8 BOM: without it Excel reads Arabic names as
   mojibake, which is most of what this portal exports. */
function downloadCsv(filename, rows) {
  const headers = Object.keys(rows[0]);
  const cell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const csv = [headers.join(","), ...rows.map(row => headers.map(h => cell(row[h])).join(","))].join("\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `${filename}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoking in the same tick can cancel the download in some browsers.
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openModal(title, body, footer = "") {
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal ${body.length > 2400 ? "modal-wide" : ""}">
    <div class="modal-header"><div class="modal-title">${title}</div><button class="icon-button" onclick="closeModal()">${icon("x")}</button></div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-footer">${footer}</div>` : ""}
  </div>`;
  host.classList.add("open");
  refreshIcons(host);
}

function closeModal() {
  document.getElementById("modalHost").classList.remove("open");
  document.getElementById("modalHost").innerHTML = "";
}

document.getElementById("modalHost").addEventListener("click", e => {
  if (e.target.id === "modalHost") closeModal();
});

/** Build a pre-filled WhatsApp message URL for quote follow-up.
 *  @param {object} data – { ref, serviceType, serviceName, destination, from, to,
 *                           checkIn, checkOut, checkInTime, adults, children, rooms,
 *                           isRoundTrip, notes }
 */
function buildWhatsAppQuoteUrl(data = {}) {
  const user = state.user || {};
  const company = user.company || {};
  const lines = [
    data.ref    ? `*${t("btn.requestQuote","Quote Request")} ${data.ref}*` : null,
    `${t("th.company","Company")}: ${company.name || "—"}`,
    user.name   ? `${t("form.name","Name")}: ${user.name}`         : null,
    user.email  ? `Email: ${user.email}`                            : null,
    `${t("th.type","Type")}: ${data.serviceType || "—"}`,
    data.serviceName    ? `${t("th.service","Service")}: ${data.serviceName}`           : null,
    data.destination    ? `${t("th.destination","Destination")}: ${data.destination}`   : null,
    data.nationality    ? `${t("form.nationality","Nationality")}: ${data.nationality}` : null,
    data.travelFrom     ? `${t("form.travelFrom","Travelling From")}: ${data.travelFrom}` : null,
    data.from           ? `${t("form.from","From")}: ${data.from}`                      : null,
    data.to             ? `${t("form.to","To")}: ${data.to}`                            : null,
    data.checkIn        ? `${t("form.checkIn","Date")}: ${data.checkIn}${data.checkInTime ? " " + data.checkInTime : ""}` : null,
    data.checkOut       ? `${t("form.checkOut","Check-out")}: ${data.checkOut}`          : null,
    data.adults         ? `${t("form.adults","Adults/Pax")}: ${data.adults}`            : null,
    data.children       ? `${t("form.children","Children")}: ${data.children}`          : null,
    data.rooms          ? `${t("form.rooms","Rooms")}: ${data.rooms}`                   : null,
    data.budget         ? `${t("form.budget","Budget")}: ${data.budget}`                : null,
    data.isRoundTrip    ? `${t("form.roundTrip","Round Trip")}: ✓`                      : null,
    data.notes          ? `${t("form.notes","Notes")}: ${data.notes}`                   : null,
  ].filter(Boolean).join("\n");
  return `https://wa.me/201147515456?text=${encodeURIComponent(lines)}`;
}

function reserveWhatsAppWindow() {
  return window.open("about:blank", "_blank");
}

function redirectToWhatsApp(url, reservedWindow) {
  if (reservedWindow && !reservedWindow.closed) {
    reservedWindow.location.href = url;
    return;
  }
  window.location.href = url;
}

function setPage(page) {
  state.page = page;
  state.renderToken = (state.renderToken || 0) + 1;
  state.selected.clear();
  document.querySelectorAll(".nav-item").forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
  (pageLoaders[page] || renderDashboard)();
}

document.querySelectorAll(".nav-item[data-page]").forEach(btn => btn.addEventListener("click", () => {
  setPage(btn.dataset.page);
  closeSidebar();
}));

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("globalSearch").focus();
  }
  if (e.key === "Escape") closeSidebar();
});

function toggleSidebar() {
  const isOpen = document.getElementById("sidebar").classList.toggle("open");
  document.body.classList.toggle("sidebar-open", isOpen);
  document.getElementById("sidebarBackdrop")?.classList.toggle("open", isOpen);
}

function closeSidebar() {
  document.getElementById("sidebar")?.classList.remove("open");
  document.body.classList.remove("sidebar-open");
  document.getElementById("sidebarBackdrop")?.classList.remove("open");
}

// Desktop collapse (icons-only). Persisted; mobile uses the overlay drawer instead.
function toggleSidebarCollapse() {
  const collapsed = document.body.classList.toggle("sidebar-collapsed");
  localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0");
  syncNavTips();
  if (window.lucide) lucide.createIcons();
}
function syncNavTips() {
  document.querySelectorAll(".sidebar .nav-item[data-page]").forEach(b => {
    const s = b.querySelector("span");
    if (s) b.setAttribute("data-tip", s.textContent.trim());
  });
}
if (localStorage.getItem("sidebarCollapsed") === "1") document.body.classList.add("sidebar-collapsed");
syncNavTips();
document.addEventListener("portal:lang", syncNavTips);

function logout() {
  apiFetch("/auth/logout", { method: "POST" }).finally(() => {
    localStorage.clear();
    location.href = "/login.html";
  });
}

// ─── Safe dashboard template renderer (admin-controlled, whitelisted) ─────────
// Resolve a whitelisted dataSource key against the live dashboard context.
function resolveDashboardDataSource(key, ctx) {
  switch (key) {
    case "wallet.balance":          return formatStoredMoney(ctx.remaining, ctx.cur);
    case "wallet.remainingBalance": return formatStoredMoney(ctx.remaining, ctx.cur);
    case "wallet.deducted":         return formatStoredMoney(ctx.used, ctx.cur);
    case "wallet.totalDeposited":   return formatStoredMoney(ctx.deposited, ctx.cur);
    case "company.tier":            return t("tier." + (ctx.tier || "STANDARD"), ctx.tier || "STANDARD");
    case "company.name":            return ctx.companyName || "—";
    case "bookings.pendingCount":   return ctx.pendingBookings;
    case "bookings.totalCount":     return ctx.totalBookings;
    case "quotes.pendingCount":     return ctx.pendingQuotes;
    case "offers.activeCount":      return ctx.activeOffers;
    default:                        return "—";
  }
}

// Render a single whitelisted block to safe HTML (text only — no raw HTML from admin).
function renderDashboardBlock(block, ctx) {
  if (block.visible === false) return "";
  const title = escapeHtml(locName(block.title, block.titleAr) || "");
  const ic = block.icon || "activity";
  switch (block.type) {
    case "stat_card": {
      const value = block.dataSource ? resolveDashboardDataSource(block.dataSource, ctx) : "—";
      return `<div class="stat-card">
        <div class="stat-row"><div class="stat-label">${title}</div><span class="stat-ico">${icon(ic)}</span></div>
        <div class="stat-value">${escapeHtml(String(value))}</div>
        ${block.subtitle ? `<div class="stat-sub">${escapeHtml(locName(block.subtitle, block.subtitleAr))}</div>` : ""}
      </div>`;
    }
    case "action_card":
    case "promo_card": {
      const cta = escapeHtml(locName(block.ctaLabel, block.ctaLabelAr) || t("btn.view","Open"));
      const target = block.ctaTarget && /^[a-z0-9_-]+$/i.test(block.ctaTarget) ? block.ctaTarget : "";
      return `<div class="stat-card" style="cursor:${target?"pointer":"default"}" ${target?`onclick="setPage('${target}')"`:""}>
        <div class="stat-row"><div class="stat-label">${title}</div><span class="stat-ico">${icon(ic)}</span></div>
        ${block.subtitle ? `<div class="stat-sub" style="margin-top:8px">${escapeHtml(locName(block.subtitle, block.subtitleAr))}</div>` : ""}
        ${target ? `<button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="event.stopPropagation();setPage('${target}')">${icon("arrow-right")}&nbsp;${cta}</button>` : ""}
      </div>`;
    }
    default:
      return "";
  }
}

function renderDashboardCardsFromTemplate(tpl, ctx) {
  const blocks = (tpl?.config?.blocks || [])
    .filter(b => ["stat_card","action_card","promo_card"].includes(b.type) && b.visible !== false)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  return blocks.map(b => renderDashboardBlock(b, ctx)).join("");
}

async function renderDashboard() {
  const capturedToken = state.renderToken;
  content(pageHeader() + `
    <div class="stats-grid">${Array.from({ length: 5 }, () => `<div class="stat-card"><div class="skeleton" style="height:12px;width:62%"></div><div class="skeleton" style="height:28px;width:44%;margin-top:14px"></div><div class="skeleton" style="height:12px;width:55%;margin-top:12px"></div></div>`).join("")}</div>
    <div class="grid-2">
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.bookings")}</div></div></div><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(5, 6)}</tbody></table></div></section>
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.wallet")}</div></div></div><div class="panel-body"><div class="skeleton" style="height:70px"></div></div></section>
    </div>`);

  const [report, bookings, wallet, tplRes, offersRes, quotesRes] = await Promise.all([
    state.user?.companyId ? apiFetch(`/reports/company/${state.user.companyId}`) : null,
    apiFetch("/bookings?limit=8"),
    apiFetch("/wallet/balance"),
    apiFetch("/ui-templates/company_dashboard").catch(() => null),
    apiFetch("/offers?activeOnly=true&limit=1").catch(() => null),
    apiFetch("/quote-requests?status=NEW&limit=1").catch(() => null),
  ]);
  if (state.renderToken !== capturedToken) return;
  if (wallet?.data) updateWallet(wallet.data);
  const d = report?.data || {};
  document.getElementById("pendingBadge").textContent = d.pendingBookings || 0;

  const wdata = wallet?.data || {};
  const remaining   = Number(wdata.remainingBalance ?? wdata.balance ?? 0);
  const deposited   = Number(wdata.totalDeposited ?? 0);
  const used        = Number(wdata.totalUsed ?? 0);
  const cur         = wdata.currency || "USD";
  const activeOffers = offersRes?.meta?.total ?? 0;
  const pendingQuotes = quotesRes?.meta?.total ?? 0;

  const ctx = {
    remaining, deposited, used, cur,
    tier: state.user?.company?.tier,
    companyName: state.user?.company?.name,
    pendingBookings: d.pendingBookings || 0,
    totalBookings: d.totalBookings || 0,
    pendingQuotes, activeOffers,
  };

  // Template-driven cards if an active template exists, else the default set.
  const templateCards = tplRes?.data ? renderDashboardCardsFromTemplate(tplRes.data, ctx) : "";
  const defaultCards = `
      ${statCard("wallet.remainingBalance", formatStoredMoney(remaining, cur), "wallet.walletBalance", "wallet")}
      ${statCard("wallet.totalUsed",        formatStoredMoney(used, cur),      "stat.allTime",        "receipt")}
      ${statCard("stat.totalBookings",      d.totalBookings || 0,        "stat.allTime",        "briefcase-business")}
      ${statCard("stat.pending",            d.pendingBookings || 0,      "status.PENDING",      "clock")}
      ${offerCardHtml(activeOffers)}`;

  content(dashboardHero(ctx) + serviceQuickActions() + `
    <div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
      ${templateCards || defaultCards}
    </div>
    <div class="grid-2">
      ${bookingPanel(bookings?.data || [])}
      <section class="panel wallet-panel">
        <div class="panel-header">
          <div>
            <div class="panel-title" style="display:flex;align-items:center;gap:7px">
              ${icon("wallet-cards")}&nbsp;${t("nav.wallet")}
            </div>
            <div class="panel-subtitle">${t("form.currentBalance","Account balance summary")}</div>
          </div>
          ${tierBadge(state.user?.company?.tier)}
        </div>
        <div class="panel-body">
          <div class="wallet-metrics-grid">
            <div class="wallet-metric wallet-metric--deposit">
              <div class="wallet-metric__icon">${icon("arrow-down-circle")}</div>
              <div class="wallet-metric__label">${t("wallet.totalDeposited","Total Deposited")}</div>
              <div class="wallet-metric__value">${formatStoredMoney(deposited, cur)}</div>
            </div>
            <div class="wallet-metric wallet-metric--used">
              <div class="wallet-metric__icon">${icon("receipt")}</div>
              <div class="wallet-metric__label">${t("wallet.totalUsed","Total Used / Deducted")}</div>
              <div class="wallet-metric__value">${formatStoredMoney(used, cur)}</div>
            </div>
            <div class="wallet-metric wallet-metric--balance${remaining < 0 ? " wallet-metric--negative" : ""}" id="walletBalanceCard">
              <div class="wallet-metric__icon">${icon("wallet")}</div>
              <div class="wallet-metric__label">${t("wallet.remainingBalance","Remaining Balance")}</div>
              <div class="wallet-metric__value" id="walletRemainingValue">${formatStoredMoney(remaining, cur)}</div>
              ${remaining < 0 ? `<div class="wallet-metric__warning">${icon("alert-triangle")}&nbsp;${t("wallet.insufficientBalance","Low balance")}</div>` : ""}
            </div>
          </div>
        </div>
        <div style="padding:12px 16px;border-top:1px solid var(--border)">
          <button class="btn btn-outline" style="width:100%" onclick="setPage('wallet')">${icon("arrow-right")}&nbsp;${t("nav.wallet","View Transactions")}</button>
        </div>
      </section>
    </div>`);

  // Show offer popup after first dashboard load
  maybeShowOfferPopup();
}

function greetingByHour() {
  const h = new Date().getHours();
  if (h < 12) return t("dash.morning", "Good morning");
  if (h < 18) return t("dash.afternoon", "Good afternoon");
  return t("dash.evening", "Good evening");
}

// "Date Requested" — the audit timestamp the request was submitted.
// Uses the explicit requestedAt column, falling back to createdAt for safety.
function requestedDate(r) {
  return formatDate(r.requestedAt || r.createdAt);
}

// "Date Confirmed" — the timestamp a request became confirmed/approved.
// Prefers an explicit confirmation field; falls back to updatedAt once the
// record reaches a positive terminal status (legacy rows). Shows a clear
// "Not confirmed" label (not a bare dash) while still pending.
function confirmedDate(r) {
  const explicit = r.confirmedAt || r.approvedAt;
  if (explicit) return formatDate(explicit);
  const s = String(r.status || "").toUpperCase();
  if ((s === "CONFIRMED" || s === "COMPLETED" || s === "APPROVED") && r.updatedAt) return formatDate(r.updatedAt);
  return `<span class="secondary-text">${t("th.notConfirmed", "Not confirmed")}</span>`;
}

// ─── Locale-aware display helpers ────────────────────────────────────────────
function isArabic() {
  return (localStorage.getItem("lang") || document.documentElement.lang || "en") === "ar";
}
/** Pick the right language variant. In Arabic mode prefer the *Ar field, else English. */
function locName(en, ar) {
  if (isArabic() && ar) return ar;
  return en || ar || "";
}
function hotelCity(h) {
  return locName(h.city, h.cityAr);
}
function hotelName(h) {
  return locName(h.name, h.nameAr);
}

// ─── Hotel structured amenities (sheet-driven) ───────────────────────────────
// key → { i18n key, lucide icon }
const HOTEL_AMENITY_DEFS = [
  ["aquaPark",     "filter.aquaPark",     "waves"],
  ["privateBeach", "filter.privateBeach", "umbrella"],
  ["seaFront",     "filter.seaFront",     "sailboat"],
  ["sandyBeach",   "filter.sandyBeach",   "sun"],
  ["kidsPool",     "filter.kidsPool",     "baby"],
  ["kidsClub",     "filter.kidsClub",     "blocks"],
  ["allInclusive", "filter.allInclusive", "utensils"],
  ["snorkeling",   "filter.snorkeling",   "fish"],
  ["diving",       "filter.diving",       "anchor"],
  ["adultsOnly",   "filter.adultsOnly",   "user"],
];

function hotelAttrBadges(h) {
  // Show up to 4 active structured attributes as small chips
  const active = HOTEL_AMENITY_DEFS.filter(([k]) => h[k] === true).slice(0, 4);
  return active.map(([k, labelKey]) =>
    `<span class="hotel-attr-chip">${t(labelKey, k)}</span>`
  ).join("");
}

// ─── Price display helper ────────────────────────────────────────────────────
function hotelPriceCell(h) {
  if (h.priceVisible === false || h.pricePerNight == null || Number(h.pricePerNight) <= 0) {
    return `<span class="badge badge-info" style="font-size:11px">${t("hotel.priceOnRequest","Price on request")}</span>`;
  }
  return `<span class="numeric">${formatPrice(h.pricePerNight, h.currency)}</span>`;
}

function hotelThumbAgent(h) {
  if (h.imageUrl) return `<img src="${escapeHtml(hotelImageSrc(h.imageUrl))}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`;
  const initials = (h.name || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
  return `<div style="width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--navy-800);color:#fff;font-weight:700;font-size:13px">${escapeHtml(initials)}</div>`;
}

// Upscale Booking/bstatic thumbnails (square60, max300, square600…) to large res.
function hiRes(u) {
  return String(u || "")
    .replace(/\/xdata\/images\/hotel\/(?:square|max)\d+(?:x\d+)?\//i, "/xdata/images/hotel/max1280x900/")
    .replace(/\/(?:square|max)\d+(?:x\d+)?\//i, "/max1280x900/");
}

function hotelImageSrc(u) {
  const url = hiRes(u);
  try {
    const parsed = new URL(url, window.location.origin);
    if (parsed.hostname === "bstatic.com" || parsed.hostname.endsWith(".bstatic.com")) {
      return `/media/hotel-image?url=${encodeURIComponent(parsed.href)}`;
    }
  } catch (e) {}
  return url;
}

/**
 * A photo carousel with thumbnails and a full-size lightbox.
 *
 * `fit` decides what happens when a photo is not the shape of the frame:
 *   "cover"   — fill the frame and crop the overflow. Right for a catalogue of
 *               uniformly wide photos, where a tidy row matters more.
 *   "contain" — show the whole photo, over a blurred copy of itself so the
 *               frame is still filled. Right where the operator uploaded a
 *               particular picture and expects to see all of it, whatever
 *               shape their phone or their supplier gave them.
 */
function mediaShowcase(urls, name, { fit = "cover" } = {}) {
  const id = "hms" + Math.random().toString(36).slice(2, 7);
  const label = escapeHtml(name || "");
  const slide = (u, i) => `<button type="button" class="hotel-media-slide" onclick="hotelLightbox('${id}',${i})"${
    fit === "contain" ? ` style="--slide-img:url('${escapeHtml(cssUrl(u))}')"` : ""
  }><img src="${escapeHtml(u)}" alt="${label} ${i + 1}" loading="${i ? "lazy" : "eager"}"></button>`;
  return `<div class="hotel-media-showcase${fit === "contain" ? " is-contain" : ""}" id="${id}" data-imgs='${escapeHtml(JSON.stringify(urls))}'>
    <div class="hotel-media-stage">
      <div class="hotel-media-main-scroll" onscroll="hmsSync('${id}')">
        ${urls.map(slide).join("")}
      </div>
      ${urls.length > 1 ? `
        <button type="button" class="hms-nav hms-prev" onclick="hmsScroll('${id}',-1)" aria-label="Previous photo">${icon("chevron-left")}</button>
        <button type="button" class="hms-nav hms-next" onclick="hmsScroll('${id}',1)" aria-label="Next photo">${icon("chevron-right")}</button>
        <div class="hms-count"><span id="${id}_i">1</span> / ${urls.length}</div>` : ""}
    </div>
    ${urls.length > 1 ? `<div class="hotel-media-thumbs" id="${id}_t">${urls.slice(0, 24).map((u, i) => `<button type="button" class="hms-thumb${i === 0 ? " active" : ""}" onclick="hmsGo('${id}',${i})"><img src="${escapeHtml(u)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
  </div>`;
}

function hotelMediaShowcase(h) {
  const urls = [...new Set([h.imageUrl, ...(h.galleryUrls || [])].filter(Boolean))].map(hotelImageSrc);
  if (!urls.length) {
    return `<div class="hotel-media-empty">${escapeHtml((hotelName(h)||"?").charAt(0).toUpperCase())}</div>`;
  }
  return mediaShowcase(urls, hotelName(h));
}

/**
 * The hotel's tagged albums — "Sea View", "Single Room", "Aqua Park".
 *
 * `galleryUrls` is one undifferentiated reel, which is no use when a client
 * asks to see the sea-view rooms specifically. Each album gets its own labelled
 * carousel, so an agent can jump straight to the pictures they were asked for.
 */
function hotelTaggedAlbums(h) {
  const groups = (h.imageGroups || []).filter(g => (g.images || []).length);
  if (!groups.length) return "";
  return `
    <div class="hotel-albums">
      <div class="hotel-albums-title">${icon("images")}&nbsp;${t("hotel.photoTags","Photo albums")}</div>
      ${groups.map(g => `
        <div class="hotel-album">
          <div class="hotel-album-name">${escapeHtml(isArabic() && g.labelAr ? g.labelAr : g.label)}
            <span class="hotel-album-count">${formatNumber(g.images.length)}</span>
          </div>
          ${mediaShowcase(g.images.map(i => hotelImageSrc(i.url)), `${hotelName(h)} — ${g.label}`)}
        </div>`).join("")}
    </div>`;
}

/** An excursion's own photos: whatever the operator uploaded, shown whole. */
function activityMediaShowcase(a) {
  const urls = [...new Set([a.imageUrl, ...(a.galleryUrls || [])].filter(Boolean))];
  if (!urls.length) return "";
  return mediaShowcase(urls, a.name, { fit: "contain" });
}

function hmsEl(id) { return document.querySelector("#" + id + " .hotel-media-main-scroll"); }
function hmsScroll(id, dir) { const el = hmsEl(id); if (el) el.scrollBy({ left: dir * el.clientWidth, behavior: "smooth" }); }
function hmsGo(id, i) {
  const el = hmsEl(id); if (!el) return;
  const slide = el.children[i];
  if (slide) el.scrollTo({ left: slide.offsetLeft - el.offsetLeft, behavior: "smooth" });
}
function hmsSync(id) {
  const el = hmsEl(id); if (!el) return;
  const i = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
  const idx = document.getElementById(id + "_i"); if (idx) idx.textContent = i + 1;
  document.querySelectorAll("#" + id + "_t .hms-thumb").forEach((t, k) => t.classList.toggle("active", k === i));
}

// In-portal full-screen lightbox — keeps users on our site (never opens Booking).
function hotelLightbox(id, start) {
  let imgs = [];
  try { imgs = JSON.parse(document.getElementById(id).getAttribute("data-imgs")); } catch (e) {}
  if (!imgs.length) return;
  let i = start || 0;
  const host = document.createElement("div");
  host.className = "lightbox-overlay";
  host.innerHTML = `
    <button class="lightbox-close" aria-label="Close">${icon("x")}</button>
    <button class="lightbox-nav lb-prev" aria-label="Previous">${icon("chevron-left")}</button>
    <img class="lightbox-img" src="${imgs[i]}" alt="">
    <button class="lightbox-nav lb-next" aria-label="Next">${icon("chevron-right")}</button>
    <div class="lightbox-count"></div>`;
  const imgEl = host.querySelector(".lightbox-img");
  const cnt = host.querySelector(".lightbox-count");
  const render = () => { imgEl.src = imgs[i]; cnt.textContent = (i + 1) + " / " + imgs.length; };
  const close = () => { host.remove(); document.removeEventListener("keydown", onKey); };
  const prev = () => { i = (i - 1 + imgs.length) % imgs.length; render(); };
  const next = () => { i = (i + 1) % imgs.length; render(); };
  const onKey = (e) => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") prev(); };
  host.addEventListener("click", (e) => { if (e.target === host || e.target.closest(".lightbox-close")) close(); });
  host.querySelector(".lb-prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
  host.querySelector(".lb-next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
  document.body.appendChild(host);
  document.addEventListener("keydown", onKey);
  render();
  if (window.lucide) lucide.createIcons();
}

function hotelNameCell(h) {
  const attrBadges = hotelAttrBadges(h);
  const areaLine = h.area ? ` · ${escapeHtml(locName(h.area, h.area))}` : "";
  const rating = h.googleRating ? `<span class="hotel-rating">${icon("star")}${Number(h.googleRating).toFixed(1)}</span>` : "";

      <div class="secondary-text">${"★".repeat(Math.min(h.stars||0,5))} · ${escapeHtml(hotelCity(h))}${areaLine}</div>
      <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">${attrBadges}</div>

}

function hotelActionCell(h) {

  const quote = (h.canRequestQuote === false || h.allowQuoteRequest === false)

// Structured room-rate matrix shown to the company (already filtered by market
// server-side). Prices are explicit per currency — formatStoredMoney never FX-converts.
function hotelRatesSection(h) {
  if (h.priceVisible === false) {
    return `<div class="hd-section"><div class="hd-title">${t("hotel.rates", "Room Rates")}</div>
      <span class="badge badge-info">${t("hotel.priceOnRequest", "Price on request")}</span></div>`;
  }
  const rates = Array.isArray(h.rates) ? h.rates : [];
  if (!rates.length) return "";
  const occ = { single: t("hotel.single", "Single"), double: t("hotel.double", "Double"), triple: t("hotel.triple", "Triple") };
  const cell = (v, cur) => (v != null ? formatStoredMoney(v, cur) : "—");
  const tableRows = rates.map(r => {
    const supp = (r.supplements || []).map(s => {
      if (s.type === "FIXED_AMOUNT" && s.amount != null) return `${escapeHtml(s.name)} (+${formatStoredMoney(s.amount, s.currency || r.currency)})`;
      if (s.type === "PERCENTAGE" && s.amount != null) return `${escapeHtml(s.name)} (+${Number(s.amount)}%)`;
      // A total-price supplement replaces the room price rather than adding to
      // it, so it is shown as the price itself, with no plus sign.
      if (s.type === "TOTAL_PRICE" && s.amount != null) return `${escapeHtml(s.name)} (${formatStoredMoney(s.amount, s.currency || r.currency)})`;
      return escapeHtml(s.name);
    }).join(" · ");
    return `<tr>
      <td><strong>${escapeHtml(r.roomName)}</strong>${r.mealPlan ? `<div class="secondary-text">${escapeHtml(String(r.mealPlan).replace(/_/g, " "))}</div>` : ""}</td>
      <td class="numeric">${cell(r.singlePrice, r.currency)}</td>
      <td class="numeric">${cell(r.doublePrice, r.currency)}</td>
      <td class="numeric">${cell(r.triplePrice, r.currency)}</td>
      <td class="secondary-text">${supp || "—"}</td>
    </tr>`;
  }).join("");
  window._hpvRates = rates;
  const roomOpts = rates.map((r, i) => `<option value="${i}">${escapeHtml(r.roomName)}${r.mealPlan ? " · " + String(r.mealPlan).replace(/_/g, " ") : ""}</option>`).join("");
  return `<div class="hd-section"><div class="hd-title">${t("hotel.rates", "Room Rates")}</div>
    <div class="table-scroll"><table class="data-table"><thead><tr>
      <th>${t("hotel.roomName", "Room")}</th><th>${occ.single}</th><th>${occ.double}</th><th>${occ.triple}</th><th>${t("hotel.supplements", "Supplements")}</th>
    </tr></thead><tbody>${tableRows}</tbody></table></div>
    <div class="hd-title" style="margin-top:14px">${t("hotel.pricePreview", "Price preview")}</div>
    <div class="hd-preview-grid">
      <div class="form-field"><label>${t("hotel.roomName", "Room")}</label><select id="hpvRoom" onchange="hpvUpdate()">${roomOpts}</select></div>
      <div class="form-field"><label>${t("hotel.occupancy", "Occupancy")}</label><select id="hpvOcc" onchange="hpvUpdate()"><option value="single">${occ.single}</option><option value="double" selected>${occ.double}</option><option value="triple">${occ.triple}</option></select></div>
      <div class="form-field"><label>${t("hotel.supplement", "Supplement")}</label><select id="hpvSupp" onchange="hpvUpdate()"></select></div>
    </div>
    <div class="hd-preview-out" id="hpvOut"></div></div>`;
}

function hpvUpdate() {
  const rates = window._hpvRates || [];
  const ri = Number(document.getElementById("hpvRoom")?.value || 0);
  const r = rates[ri];
  if (!r) return;
  const suppSel = document.getElementById("hpvSupp");
  const supps = r.supplements || [];
  if (suppSel && suppSel.dataset.room !== String(ri)) {
    suppSel.dataset.room = String(ri);
    suppSel.innerHTML = `<option value="-1">${t("hotel.noSupplement", "None")}</option>` + supps.map((s, j) => `<option value="${j}">${escapeHtml(s.name)}</option>`).join("");
  }
  const occ = document.getElementById("hpvOcc")?.value || "double";
  const base = occ === "single" ? r.singlePrice : occ === "triple" ? r.triplePrice : r.doublePrice;
  const out = document.getElementById("hpvOut");
  if (!out) return;
  if (base == null) { out.innerHTML = `<span class="badge badge-info">${t("hotel.occNotAvailable", "Not available for this occupancy")}</span>`; return; }
  let total = Number(base);
  let note = "";
  const si = Number(suppSel?.value ?? -1);
  if (si >= 0 && supps[si]) {
    const s = supps[si];
    if (s.type === "FIXED_AMOUNT" && s.amount != null) {
      if (!s.currency || s.currency === r.currency) total += Number(s.amount);
      else note = `+${formatStoredMoney(s.amount, s.currency)} (${s.name})`;
    } else if (s.type === "PERCENTAGE" && s.amount != null) {
      total += Number(base) * Number(s.amount) / 100;
    } else if (s.type === "TOTAL_PRICE" && s.amount != null) {
      // This room category is sold at its own price — it replaces the row's
      // occupancy price instead of being added on top of it.
      if (!s.currency || s.currency === r.currency) total = Number(s.amount);
      else note = `${formatStoredMoney(s.amount, s.currency)} (${s.name})`;
    } else { note = s.name; }
  }
  out.innerHTML = `<div class="hd-total">${formatStoredMoney(total, r.currency)} <span class="secondary-text">/ ${t("form.nights", "night")}</span></div>${note ? `<div class="secondary-text">${escapeHtml(note)}</div>` : ""}`;
}

function hotelPoliciesSection(h) {
  const rows = [];
  const time = (labelKey, label, v) => { if (v) rows.push([t(labelKey, label), String(v)]); };
  const add = (labelKey, label, en, ar) => { const v = locName(en, ar); if (v) rows.push([t(labelKey, label), v]); };
  time("hotel.checkInTime", "Check-in", h.checkInTime);
  time("hotel.checkOutTime", "Check-out", h.checkOutTime);
  add("hotel.cancellationPolicy", "Cancellation policy", h.cancellationPolicy, h.cancellationPolicyAr);
  add("hotel.childrenPolicy", "Children policy", h.childrenPolicy, h.childrenPolicyAr);
  add("hotel.extraBedPolicy", "Extra bed policy", h.extraBedPolicy, h.extraBedPolicyAr);
  add("hotel.mealPolicy", "Meal policy", h.mealPolicy, h.mealPolicyAr);
  add("hotel.importantNotes", "Important notes", h.importantNotes, h.importantNotesAr);
  if (!rows.length) return "";
  return `<div class="hd-section"><div class="hd-title">${t("hotel.policies", "Hotel policies")}</div>
    <div class="hd-policies">${rows.map(([k, v]) => `<div class="hd-policy"><div class="hd-policy-k">${escapeHtml(k)}</div><div class="hd-policy-v">${escapeHtml(v)}</div></div>`).join("")}</div></div>`;
}

async function showAgentHotelDetails(id) {
  const res = await apiFetch(`/hotels/${id}`);
  if (!res?.data) return;
  const h = res.data;
  const amenityChips = (h.amenities || []).map(a => `<span class="badge badge-outline" style="font-size:11px;padding:3px 8px">${escapeHtml(a)}</span>`).join(" ");
  const attrBadges = HOTEL_AMENITY_DEFS.filter(([k]) => h[k] === true)
    .map(([k, labelKey, ic]) => `<span class="badge badge-confirmed" style="font-size:11px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px">${icon(ic)}${t(labelKey, k)}</span>`)
    .join(" ");
  const descLoc = locName(h.description, h.descriptionAr);
  const areaLine = h.area ? ` · ${escapeHtml(h.area)}` : "";

  const body = `
    <div class="hotel-detail-shell">
    ${hotelMediaShowcase(h)}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:20px;font-weight:700">${escapeHtml(hotelName(h))}</div>
        <div style="color:var(--text-secondary);margin-top:4px">${"★".repeat(Math.min(h.stars||0,5))} · ${escapeHtml(hotelCity(h))}${areaLine}, ${escapeHtml(h.country||"EG")}</div>
        ${h.googleRating ? `<div class="hotel-rating" style="margin-top:4px">${icon("star")}${Number(h.googleRating).toFixed(1)} Google</div>` : ""}
        ${h.address ? `<div style="color:var(--text-secondary);font-size:12px;margin-top:4px">${escapeHtml(h.address)}</div>` : ""}
      </div>
      <div style="text-align:right">
        <div style="font-size:18px;font-weight:700">${hotelPriceCell(h)}</div>
        ${Number(h.pricePerNight||0) > 0 && h.priceVisible !== false ? `<div style="color:var(--text-secondary);font-size:11px">${t("form.nights","per night")}</div>` : ""}
      </div>
    </div>
    ${attrBadges ? `<div style="margin:10px 0;display:flex;flex-wrap:wrap;gap:6px">${attrBadges}</div>` : ""}
    ${descLoc ? `<p style="white-space:pre-wrap;color:var(--text-secondary);line-height:1.5;margin:8px 0">${escapeHtml(descLoc)}</p>` : ""}
    ${h.amenities?.length ? `<div class="hotel-amenity-cloud" style="margin-top:8px">${amenityChips}</div>` : ""}
    ${hotelTaggedAlbums(h)}
    ${hotelRatesSection(h)}
    ${hotelPoliciesSection(h)}
    </div>`;

  openModal(`${escapeHtml(hotelName(h))}`, body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.close")}</button>
    ${(h.canRequestQuote === false || h.allowQuoteRequest === false) ? "" : `<button class="btn btn-primary" onclick="closeModal();openQuoteRequestModal('HOTEL','${h.id}',${inlineJsonArg(h.name)})">${icon("send")}&nbsp;${t("btn.requestQuote","Request Quote")}</button>`}
  `);
  if (document.getElementById("hpvRoom")) hpvUpdate();
}

// ─── Destination-first hotel flow ────────────────────────────────────────────
// Store the selected destination so filters/refresh know what context they are in
state.selectedDest = { id: "", name: "" };

function cssUrl(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, "");
}

async function renderHotels() {
  state.selectedDest = { id: "", name: "" };
  const capturedToken = state.renderToken;
  state.page = "hotels";

  // Show skeleton while loading
  content(pageHeader() + `
    <p style="color:var(--text-secondary);margin:0 0 20px">${t("hotel.chooseDest","Choose a destination to browse hotels")}</p>
    <div class="dest-grid">
      ${Array.from({length:6}, () => `<div class="dest-card" style="pointer-events:none"><div class="skeleton" style="height:44px;width:44px;border-radius:50%;margin:0 auto"></div><div class="skeleton" style="height:12px;width:70%;margin:10px auto 6px"></div><div class="skeleton" style="height:10px;width:40%;margin:0 auto"></div></div>`).join("")}
    </div>`);

  const [destRes, allHotelsRes] = await Promise.all([
    apiFetch("/destinations?isActive=true&limit=200"),
    apiFetch("/hotels?limit=1"),
  ]);
  if (state.renderToken !== capturedToken) return;

  const dests = destRes?.data || [];
  const totalHotels = allHotelsRes?.meta?.total || 0;

  // Fetch per-destination hotel counts in parallel (max 10 destinations to avoid too many requests)
  const destCountMap = {};
  const topDests = dests.slice(0, 20);
  await Promise.all(
    topDests.map(d =>
      apiFetch(`/hotels?destinationId=${d.id}&limit=1`).then(r => {
        destCountMap[d.id] = r?.meta?.total ?? 0;
      }).catch(() => {})
    )
  );

  const destCards = [
    `<button class="dest-card dest-card-all" onclick="renderHotelsByDest('',${inlineJsonArg(t("hotel.allDestinations","All Destinations"))})">
      <div class="dest-card-icon dest-card-media"><i data-lucide="hotel"></i></div>
      <div class="dest-card-name">${t("hotel.allDestinations","All Destinations")}</div>
      <div class="dest-card-count">${formatNumber(totalHotels)} ${t("nav.hotels","Hotels")}</div>
    </button>`,
    ...dests.map(d => `
      <button class="dest-card ${d.imageUrl ? "has-bg" : ""}" ${d.imageUrl ? `style="--dest-bg:url('${escapeHtml(cssUrl(d.imageUrl))}')"` : ""} onclick="renderHotelsByDest('${escapeHtml(d.id)}',${inlineJsonArg(locName(d.name, d.nameAr))})">
        <div class="dest-card-icon dest-card-media"><i data-lucide="map-pin"></i></div>
        <div class="dest-card-name">${escapeHtml(locName(d.name, d.nameAr))}</div>
        ${(!isArabic() && d.nameAr) ? `<div class="dest-card-sub">${escapeHtml(d.nameAr)}</div>` : ""}

// Filter state for the hotel list (after a destination is chosen)
state.hotelFilters = { search: "", area: "", stars: "", amenities: new Set() };

let _hotelFilterTimer;
function debouncedHotelFilter() {
  clearTimeout(_hotelFilterTimer);
  _hotelFilterTimer = setTimeout(loadHotelList, 300);
}
function setHotelArea(area) {
  state.hotelFilters.area = area;
  document.querySelectorAll(".area-chip").forEach(c => c.classList.toggle("active", c.dataset.area === area));
  loadHotelList();
}
function setHotelStars(v) { state.hotelFilters.stars = v; loadHotelList(); }
function toggleHotelAmenity(key) {
  const set = state.hotelFilters.amenities;
  if (set.has(key)) set.delete(key); else set.add(key);
  const chip = document.querySelector(`.amenity-chip[data-amenity="${key}"]`);
  if (chip) chip.classList.toggle("active", set.has(key));
  loadHotelList();
}
function resetHotelFilters() {
  state.hotelFilters = { search: "", area: "", stars: "", amenities: new Set() };
  const sb = document.getElementById("hotelSearchBox"); if (sb) sb.value = "";
  const st = document.getElementById("hotelStarsSel"); if (st) st.value = "";
  document.querySelectorAll(".amenity-chip").forEach(c => c.classList.remove("active"));
  document.querySelectorAll(".area-chip").forEach(c => c.classList.toggle("active", c.dataset.area === ""));
  loadHotelList();
}

async function loadHotelList() {
  const f = state.hotelFilters;
  const params = new URLSearchParams({ limit: "100" });
  if (state.selectedDest.id) params.set("destinationId", state.selectedDest.id);
  const sb = document.getElementById("hotelSearchBox")?.value.trim();
  if (sb) params.set("search", sb);
  if (f.area)  params.set("area", f.area);
  if (f.stars) params.set("stars", f.stars);
  f.amenities.forEach(a => params.set(a, "true"));

  const res = await apiFetch(`/hotels?${params}`);
  if (!res) return;
  state.cache.hotelsRows = res.data || [];
  state.cache.hotelsTotal = res.meta?.total ?? state.cache.hotelsRows.length;
  renderHotelRows();
  renderHotelActiveChips();
}

// View mode: table (desktop default) or cards. Mobile (<=768px) always forces cards
// because the dense table is unusable there.
function hotelViewMode() {
  if (window.matchMedia("(max-width:768px)").matches) return "cards";
  return localStorage.getItem("hotelView") || "table";
}
function setHotelView(mode) {
  localStorage.setItem("hotelView", mode);
  renderHotelRows();
}
function renderHotelRows() {
  const host = document.getElementById("hotelsListHost");
  if (!host) return;
  const rows = state.cache.hotelsRows || [];
  const mode = hotelViewMode();
  document.querySelectorAll(".hotel-view-btn").forEach(b => b.classList.toggle("active", b.dataset.view === mode));
  if (!rows.length) {
    host.innerHTML = `<div class="empty-state">${icon("hotel")}<strong>${t("empty.noData","No hotels match")}</strong><span>${t("empty.adjustFilters","Try adjusting the filters")}</span><button class="btn btn-outline" style="margin-top:12px" onclick="resetHotelFilters()">${icon("rotate-ccw")}${t("btn.reset","Reset Filters")}</button></div>`;
  } else if (mode === "cards") {
    host.innerHTML = `<div class="hotel-cards">${rows.map(hotelCard).join("")}</div>`;
  } else {
    host.innerHTML = `<div class="table-scroll"><table class="data-table"><thead><tr>
        <th>${t("th.name")}</th><th>${t("th.amount")}</th><th>${t("th.actions")}</th>
      </tr></thead><tbody id="hotelsTbody">${rows.map(h => `<tr>
        <td>${hotelNameCell(h)}</td><td>${hotelPriceCell(h)}</td><td>${hotelActionCell(h)}</td>
      </tr>`).join("")}</tbody></table></div>`;
  }
  const meta = document.getElementById("hotelsMeta");
  if (meta) meta.textContent = `${formatNumber(state.cache.hotelsTotal || rows.length)} ${t("nav.hotels","Hotels")}`;
  refreshIcons(host);
}

function hotelHasGallery(h) { return !!(h.imageUrl || (h.galleryUrls && h.galleryUrls.length)); }

function hotelCardThumb(h) {
  if (h.imageUrl) return `<img src="${escapeHtml(hotelImageSrc(h.imageUrl))}" alt="${escapeHtml(hotelName(h))}" loading="lazy">`;
  const initials = (hotelName(h) || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
  return `<span class="hotel-card__initials">${escapeHtml(initials)}</span>`;
}

// Mobile-friendly travel card for a hotel.
function hotelCard(h) {
  const rating = h.googleRating ? `<span class="hotel-rating">${icon("star")}${Number(h.googleRating).toFixed(1)}</span>` : "";
  const stars = "★".repeat(Math.min(h.stars || 0, 5));
  const area = h.area ? ` · ${escapeHtml(locName(h.area, h.area))}` : "";
  const am = HOTEL_AMENITY_DEFS.filter(([k]) => h[k] === true);
  const chips = am.slice(0, 3).map(([k, lk]) => `<span class="hotel-attr-chip">${t(lk, k)}</span>`).join("")
    + (am.length > 3 ? `<span class="hotel-attr-chip hotel-attr-more">+${am.length - 3}</span>` : "");
  const quote = (h.canRequestQuote === false || h.allowQuoteRequest === false) ? "" :
    `<button class="btn btn-primary" onclick="openQuoteRequestModal('HOTEL','${h.id}',${inlineJsonArg(h.name)})">${icon("send")}&nbsp;${t("btn.requestQuote","Request Quote")}</button>`;
  return `<article class="hotel-card">
    <button type="button" class="hotel-card__media" onclick="showAgentHotelDetails('${h.id}')" aria-label="${t("view.details","View Details")}">
      ${hotelCardThumb(h)}
      ${hotelHasGallery(h) ? `<span class="hotel-gallery-badge">${icon("images")}</span>` : ""}
    </button>
    <div class="hotel-card__body">
      <div class="hotel-card__top">
        <div class="hotel-card__name">${escapeHtml(hotelName(h))}</div>
        ${rating}
      </div>
      <div class="hotel-card__meta">${stars ? stars + " · " : ""}${escapeHtml(hotelCity(h))}${area}</div>
      ${chips ? `<div class="hotel-card__chips">${chips}</div>` : ""}
      <div class="hotel-card__price">${hotelPriceCell(h)}</div>
      <div class="hotel-card__actions">
        ${quote}
        <button class="btn btn-glass" onclick="showAgentHotelDetails('${h.id}')">${icon("eye")}&nbsp;${t("view.details","View Details")}</button>
      </div>
    </div>
  </article>`;
}

// Mobile filter drawer toggle
function toggleHotelFilters() {
  const rail = document.getElementById("hotelFilterRail");
  if (!rail) return;
  const open = rail.classList.toggle("open");
  document.getElementById("hotelFilterBackdrop")?.classList.toggle("open", open);
  document.body.classList.toggle("filters-open", open);
}

// Active-filter chips summary (so hotels show first on mobile)
function renderHotelActiveChips() {
  const host = document.getElementById("hotelActiveChips");
  if (!host) return;
  const f = state.hotelFilters;
  const chips = [];
  const sb = document.getElementById("hotelSearchBox")?.value.trim();
  if (sb) chips.push(`<button class="filter-chip" onclick="clearHotelFilter('search')">${icon("search")}${escapeHtml(sb)}${icon("x")}</button>`);
  if (f.area) chips.push(`<button class="filter-chip" onclick="clearHotelFilter('area')">${escapeHtml(locName(f.area, f.area))}${icon("x")}</button>`);
  if (f.stars) chips.push(`<button class="filter-chip" onclick="clearHotelFilter('stars')">${f.stars}★${icon("x")}</button>`);
  f.amenities.forEach(a => { const def = HOTEL_AMENITY_DEFS.find(([k]) => k === a); if (def) chips.push(`<button class="filter-chip" onclick="clearHotelFilter('amenity','${a}')">${t(def[1], a)}${icon("x")}</button>`); });
  host.innerHTML = chips.length ? chips.join("") + `<button class="filter-chip filter-chip--clear" onclick="resetHotelFilters()">${icon("rotate-ccw")}${t("btn.reset","Reset")}</button>` : "";
  if (chips.length) refreshIcons(host);
}
function clearHotelFilter(kind, key) {
  const f = state.hotelFilters;
  if (kind === "search") { const sb = document.getElementById("hotelSearchBox"); if (sb) sb.value = ""; }
  else if (kind === "area") { f.area = ""; document.querySelectorAll(".area-chip").forEach(c => c.classList.toggle("active", c.dataset.area === "")); }
  else if (kind === "stars") { f.stars = ""; const st = document.getElementById("hotelStarsSel"); if (st) st.value = ""; }
  else if (kind === "amenity") { f.amenities.delete(key); const chip = document.querySelector(`.amenity-chip[data-amenity="${key}"]`); if (chip) chip.classList.remove("active"); }
  loadHotelList();
}

// Re-render hotels when crossing the mobile breakpoint (table <-> cards)
window.matchMedia("(max-width:768px)").addEventListener("change", () => {
  if (document.getElementById("hotelsListHost")) renderHotelRows();
});

function renderCruises() {
  renderListPage("cruises", "/cruises", [
    ["th.name", c => `<span class="primary-text">${escapeHtml(c.name)}</span>${c.operator ? `<div class="secondary-text">${escapeHtml(c.operator)}</div>` : ""}`],
    ["th.type", c => escapeHtml(c.shipType)],
    ["th.route", c => escapeHtml(c.route)],

    ["cruise.schedules", c => cruiseScheduleSummary(c)],
    ["th.amount", c => c.priceFrom != null && c.priceVisible !== false
      ? `<span class="numeric">${formatPrice(c.priceFrom, c.currency)}</span>${c.hasRateMatrix ? `<div class="secondary-text">${t("hotel.priceFrom","from")}</div>` : ""}`
      : `<span class="badge badge-info" style="font-size:11px">${t("hotel.priceOnRequest","Price on request")}</span>`],
    ["th.actions", c => `<button class="btn btn-primary btn-sm request-cta request-cta-sm" onclick="openCruiseDetails('${c.id}')">${icon("send")}&nbsp;${t("btn.detailsRequest","Details / Request")}</button>`],
  ]);
}

function weekdayLabel(day) {
  return t("weekday." + String(day || "").toUpperCase(), String(day || ""));
}

/** "Mon → Thu · 3 nights", one line per leg. */
function cruiseScheduleSummary(c) {
  const list = (c.schedules || []).filter(sc => sc.isActive !== false);
  if (!list.length) return `<span class="secondary-text">—</span>`;
  return list.slice(0, 3).map(sc =>
    `<div style="font-size:12px">${escapeHtml(weekdayLabel(sc.departureDay))} → ${escapeHtml(weekdayLabel(sc.returnDay))}<span class="secondary-text"> · ${formatNumber(sc.nights)} ${t("cruise.nights","Nights")}</span></div>`
  ).join("") + (list.length > 3 ? `<div class="secondary-text">+${formatNumber(list.length - 3)}</div>` : "");
}

/**
 * One boat: its photos, when it sails, what each cabin costs at each occupancy,
 * and the tours the client wants alongside it.
 *
 * A cruise is still quoted by the operations team, so this ends in a quote
 * request — but the request now carries the leg, the cabin, the occupancy and
 * the tours, instead of a name and a hope.
 */
async function openCruiseDetails(id) {
  const cruise = (state.cache.cruisesRows || []).find(c => c.id === id);
  if (!cruise) return toast(t("empty.failed","Failed to load"), "error");
  state.cruiseSelection = { cruiseId: id, addOns: [] };

  const description = locName(cruise.description, cruise.descriptionAr) || "";
  const photos = [...new Set([cruise.imageUrl, ...(cruise.galleryUrls || [])].filter(Boolean))];
  const schedules = (cruise.schedules || []).filter(sc => sc.isActive !== false);
  const rates = cruise.cabinRates || [];

  // Only the activities in the destinations this boat calls at would be a
  // better filter, but a cruise route is not a destination id — so the whole
  // confirmable catalogue is offered and the agent picks.
  const actRes = await apiFetch("/activities?confirmableOnly=true&limit=200");
  const activities = actRes?.data || [];
  state.cruiseTourOptions = activities;

  const body = `
    ${photos.length ? mediaShowcase(photos, cruise.name) : ""}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:12px 0;flex-wrap:wrap">
      <div>
        <div style="font-size:18px;font-weight:800">${escapeHtml(locName(cruise.name, cruise.nameAr))}</div>
        <div class="secondary-text">${escapeHtml(cruise.shipType)} · ${escapeHtml(cruise.route)}${cruise.operator ? " · " + escapeHtml(cruise.operator) : ""}</div>
      </div>
      <div style="text-align:right">
        ${cruise.priceFrom != null && cruise.priceVisible !== false
          ? `<div style="font-weight:800;font-size:16px;color:var(--brand-navy-2)">${formatPrice(cruise.priceFrom, cruise.currency)}</div>
             <div style="font-size:11px;color:var(--text-muted)">${t("hotel.priceFrom","from")}</div>`
          : `<div style="font-size:12px;color:var(--text-muted)">${t("hotel.priceOnRequest","Price on request")}</div>`}
      </div>
    </div>
    ${description ? `<div class="act-description">${escapeHtml(description)}</div>` : ""}

    <div class="form-field full" style="margin-top:14px">
      <label>${t("cruise.schedules","Departures")}</label>
      ${schedules.length ? `<div class="act-basis-grid">
        ${schedules.map((sc, i) => `<label class="act-basis">
          <input type="radio" name="crSchedule" value="${escapeHtml(sc.id)}" ${i === 0 ? "checked" : ""}>
          <span>
            <b>${escapeHtml(weekdayLabel(sc.departureDay))} → ${escapeHtml(weekdayLabel(sc.returnDay))}</b>
            <small>${formatNumber(sc.nights)} ${t("cruise.nights","Nights")}${sc.label ? " · " + escapeHtml(locName(sc.label, sc.labelAr)) : ""}</small>
          </span>
        </label>`).join("")}
      </div>` : `<div class="secondary-text">${t("cruise.schedulesHelp","When the boat leaves and when it is back.")}</div>`}
    </div>

    <div class="form-field full" style="margin-top:14px">
      <label>${t("cruise.cabinRates","Cabin Rates")}</label>
      ${rates.length ? `<div class="table-scroll"><table class="data-table">
        <thead><tr>
          <th></th><th>${t("cruise.cabinName","Cabin")}</th>
          <th>${t("hotel.single","Single")}</th><th>${t("hotel.double","Double")}</th><th>${t("hotel.triple","Triple")}</th>
        </tr></thead>
        <tbody>${rates.map((r, i) => `<tr>
          <td><input type="radio" name="crRate" value="${escapeHtml(r.id)}" ${i === 0 ? "checked" : ""}></td>
          <td><span class="primary-text">${escapeHtml(r.cabinName)}</span>${r.notes ? `<div class="secondary-text">${escapeHtml(r.notes)}</div>` : ""}</td>
          <td>${r.singlePrice != null ? formatPrice(r.singlePrice, r.currency) : "—"}</td>
          <td>${r.doublePrice != null ? formatPrice(r.doublePrice, r.currency) : "—"}</td>
          <td>${r.triplePrice != null ? formatPrice(r.triplePrice, r.currency) : "—"}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : `<div class="secondary-text">${t("cruise.noRates","No cabin rates set yet")}</div>`}
    </div>

    <div class="act-transfer-block full" style="margin-top:14px">
      <div class="act-transfer-head">
        <strong style="font-size:13px">${t("cruise.addTours","Add Tours / Activities")}</strong>
        <button type="button" class="btn btn-outline btn-sm" onclick="crAddTourRow()">${icon("plus")}&nbsp;${t("cruise.addTour","Add tour")}</button>
      </div>
      <div class="secondary-text" style="margin-top:6px">${t("cruise.addToursHelp","Excursions to run alongside the cruise. The description is shown to your client.")}</div>
      <div id="crTours" style="margin-top:10px"></div>
    </div>`;

  openModal(escapeHtml(locName(cruise.name, cruise.nameAr)), body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>
    <button class="btn btn-primary" onclick="crRequestQuote('${cruise.id}')">${icon("send")}&nbsp;${t("btn.requestQuote","Request Quote")}</button>`);
}

/** One "add tour" line: which excursion, when, for how many, plus its write-up. */

/** Picking an excursion fills its own write-up in, so the agent rarely types. */
function crTourPicked(rowId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  const id = row.querySelector(".cr-tour-activity")?.value;
  const activity = (state.cruiseTourOptions || []).find(a => a.id === id);
  const desc = row.querySelector(".cr-tour-desc");
  if (!activity || !desc || desc.value.trim()) return;
  desc.value = locName(activity.description, activity.descriptionAr) || "";
}

function crCollectTours() {
  return [...document.querySelectorAll(".cr-tour-row")].map(row => {
    const select = row.querySelector(".cr-tour-activity");
    const name = select?.selectedOptions?.[0]?.textContent?.trim() || "";
    if (!select?.value) return null;
    return {
      activityId: select.value,

/**
 * Hand the whole selection to the quote-request flow. A cruise is priced by the
 * operations team, so this stays a request — but it now carries the leg, the
 * cabin and the tours rather than only the boat's name.
 */
function crRequestQuote(cruiseId) {
  const cruise = (state.cache.cruisesRows || []).find(c => c.id === cruiseId);
  const scheduleId = document.querySelector('input[name="crSchedule"]:checked')?.value;
  const rateId = document.querySelector('input[name="crRate"]:checked')?.value;
  const schedule = (cruise?.schedules || []).find(sc => sc.id === scheduleId);
  const rate = (cruise?.cabinRates || []).find(r => r.id === rateId);
  const tours = crCollectTours();
  const lines = [
    schedule ? `${weekdayLabel(schedule.departureDay)} → ${weekdayLabel(schedule.returnDay)} (${schedule.nights} ${t("cruise.nights","Nights")})` : "",
    rate ? `${t("cruise.cabinName","Cabin")}: ${rate.cabinName}` : "",
    tours.length ? `${t("cruise.addTours","Add Tours / Activities")}: ${tours.map(x => x.name).join(", ")}` : "",
  ].filter(Boolean);

}
