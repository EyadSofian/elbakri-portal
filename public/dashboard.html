          <button class="nav-item" data-page="cruises"><i data-lucide="ship"></i><span data-i18n="nav.nileCruises">Nile Cruises</span></button>

    <div class="main-content">

        <div class="breadcrumb">
          <div class="breadcrumb-label" id="companyBreadcrumb">Agency</div>
          <div class="breadcrumb-title" id="breadcrumbTitle">Dashboard</div>
        </div>
        <label class="quick-search">

  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="modalHost"></div>

<script>
const { t, initI18n, applyTranslations, formatMoney, formatDate, formatNumber } = window.PortalI18n;

const state = {
  page: "dashboard",
  user: null,
  wallet: null,
  selected: new Set(),
  cache: {},
  filters: {},
  listConfigs: {},
  wizard: { step: 1, type: "HOTEL", payload: {} },
};

const pageMeta = {
  dashboard: ["page.dashboardTitle", "page.dashboardSub"],
  bookings: ["page.bookingsTitle", "page.bookingsSub"],
  hotels: ["page.hotelsTitle", "page.hotelsSub"],
  cruises: ["nav.nileCruises", "page.servicesSub"],
  transport: ["nav.transport", "page.servicesSub"],
  activities: ["nav.activities", "page.servicesSub"],
  visa: ["nav.visa", "page.servicesSub"],
  reception: ["nav.reception", "page.servicesSub"],
  invoices: ["page.invoicesTitle", "page.invoicesSub"],
  wallet: ["page.walletTitle", "page.walletSub"],
  reports: ["page.reportsTitle", "page.reportsSub"],
  calculators: ["page.calculatorsTitle", "page.calculatorsSub"],
  support: ["nav.support", "page.servicesSub"],
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function icon(name) {
  return `<i data-lucide="${name}"></i>`;
}

function refreshIcons(root = document) {
  applyTranslations(root);
  if (window.lucide) window.lucide.createIcons();
}

function apiFetch(path, options = {}) {
  const token = localStorage.getItem("accessToken");
  return fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(options.headers || {}) },
    credentials: "include",
  }).then(async res => {
    if (res.status === 401) {
      const refresh = await fetch("/api/auth/refresh", { method: "POST", credentials: "include" });
      if (!refresh.ok) {
        localStorage.clear();
        location.href = "/login.html";
        return null;
      }
      const json = await refresh.json();
      localStorage.setItem("accessToken", json.data.accessToken);
      return apiFetch(path, options);
    }
    const json = await res.json().catch(() => ({ success: false, message: res.statusText }));
    if (!res.ok || json.success === false) throw new Error(json.message || json.error || "Request failed");
    return json;
  }).catch(err => {
    toast(err.message || "Request failed", "error");
    return null;
  });
}

function toast(message, type = "") {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = `toast ${type} show`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = "toast"; }, 3600);
}

function content(html) {
  const root = document.getElementById("content");
  root.innerHTML = html;
  refreshIcons(root);
}

function pageHeader(actions = "") {
  const [titleKey, subKey] = pageMeta[state.page] || pageMeta.dashboard;
  document.getElementById("breadcrumbTitle").textContent = t(titleKey);
  return `<div class="page-header">
    <div>
      <div class="page-kicker">${escapeHtml(state.user?.company?.name || "Elbakri B2B")}</div>
      <h1 class="page-title">${t(titleKey)}</h1>
      <p class="page-subtitle">${t(subKey)}</p>
    </div>
    <div class="page-actions">${actions}</div>
  </div>`;
}

function statusBadge(status) {
  const key = String(status || "").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("status." + key, key.replace(/_/g, " "))}</span>`;
}

function tierBadge(tier) {
  const key = String(tier || "STANDARD").toUpperCase();
  return `<span class="badge badge-${key.toLowerCase()}">${t("tier." + key, key)}</span>`;
}

function skeletonRows(cols = 8, rows = 8) {
  return Array.from({ length: rows }, () => `<tr>${Array.from({ length: cols }, () => `<td><div class="skeleton" style="height:14px;width:70%"></div></td>`).join("")}</tr>`).join("");
}

function emptyBlock(messageKey, action = "") {
  return `<div class="empty-state"><div class="empty-illustration"></div><strong>${t(messageKey)}</strong><span>${t("empty.adjustFilters")}</span>${action}</div>`;
}

function tableFoot(meta, onPage, pageName) {
  const page = meta?.page || 1;
  const pages = Math.max(meta?.pages || 1, 1);
  const total = meta?.total || 0;
  const limit = meta?.limit || 20;
  const start = total ? ((page - 1) * limit) + 1 : 0;
  const end = Math.min(page * limit, total);
  return `<div class="table-foot">
    <span>${formatNumber(start)}-${formatNumber(end)} / ${formatNumber(total)}</span>
    <div class="pager">${Array.from({ length: Math.min(pages, 7) }, (_, i) => `<button class="${i + 1 === page ? "active" : ""}" onclick="${onPage}('${pageName}', ${i + 1})">${i + 1}</button>`).join("")}</div>
  </div>`;
}

function exportRows(filename, rows) {
  if (!rows || !rows.length) return toast(t("toast.noRowsSelected"), "warning");
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Export");
    XLSX.writeFile(wb, `${filename}.xlsx`);
  }
  toast(t("toast.exported"), "success");
}

function openModal(title, body, footer = "") {
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal ${body.length > 2400 ? "modal-wide" : ""}">
    <div class="modal-header"><div class="modal-title">${title}</div><button class="icon-button" onclick="closeModal()">${icon("x")}</button></div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-footer">${footer}</div>` : ""}
  </div>`;
  host.classList.add("open");
  refreshIcons(host);
}

function closeModal() {
  document.getElementById("modalHost").classList.remove("open");
  document.getElementById("modalHost").innerHTML = "";
}

document.getElementById("modalHost").addEventListener("click", e => {
  if (e.target.id === "modalHost") closeModal();
});

function setPage(page) {
  state.page = page;
  state.selected.clear();
  document.querySelectorAll(".nav-item").forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
  (pageLoaders[page] || renderDashboard)();
}

document.querySelectorAll(".nav-item[data-page]").forEach(btn => btn.addEventListener("click", () => {
  setPage(btn.dataset.page);
  closeSidebar();
}));

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("globalSearch").focus();
  }
  if (e.key === "Escape") closeSidebar();
});

function toggleSidebar() {
  const isOpen = document.getElementById("sidebar").classList.toggle("open");
  document.body.classList.toggle("sidebar-open", isOpen);
  document.getElementById("sidebarBackdrop")?.classList.toggle("open", isOpen);
}

function closeSidebar() {
  document.getElementById("sidebar")?.classList.remove("open");
  document.body.classList.remove("sidebar-open");
  document.getElementById("sidebarBackdrop")?.classList.remove("open");
}

function logout() {
  apiFetch("/auth/logout", { method: "POST" }).finally(() => {
    localStorage.clear();
    location.href = "/login.html";
  });
}

async function renderDashboard() {
  content(pageHeader(`<button class="btn btn-primary" onclick="openBookingWizard()">${icon("plus")}${t("btn.createBooking")}</button>`) + `
    <div class="stats-grid">${Array.from({ length: 6 }, () => `<div class="stat-card"><div class="skeleton" style="height:12px;width:62%"></div><div class="skeleton" style="height:28px;width:44%;margin-top:14px"></div><div class="skeleton" style="height:12px;width:55%;margin-top:12px"></div></div>`).join("")}</div>
    <div class="grid-2">
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.bookings")}</div><div class="panel-subtitle">${t("topbar.justNow")}</div></div></div><div class="table-scroll"><table class="data-table"><tbody>${skeletonRows(7, 6)}</tbody></table></div></section>
      <section class="panel"><div class="panel-header"><div><div class="panel-title">${t("nav.wallet")}</div><div class="panel-subtitle">${t("form.currentBalance")}</div></div></div><div class="panel-body"><div class="skeleton" style="height:70px"></div></div></section>
    </div>`);

  const [report, bookings, wallet] = await Promise.all([
    state.user?.companyId ? apiFetch(`/reports/company/${state.user.companyId}`) : null,
    apiFetch("/bookings?limit=8"),
    apiFetch("/wallet/balance"),
  ]);
  if (wallet?.data) updateWallet(wallet.data);
  const d = report?.data || {};
  document.getElementById("pendingBadge").textContent = d.pendingBookings || 0;
  content(pageHeader(`<button class="btn btn-primary" onclick="openBookingWizard()">${icon("plus")}${t("btn.createBooking")}</button>`) + `
    <div class="stats-grid">
      ${statCard("stat.totalBookings", d.totalBookings || 0, "stat.allTime")}
      ${statCard("stat.totalRevenue", formatMoney(d.totalRevenue || 0, "USD"), "stat.monthToDate")}
      ${statCard("stat.pending", d.pendingBookings || 0, "toast.validationError")}
      ${statCard("stat.commission", formatMoney((d.totalRevenue || 0) * 0.1, "USD"), "stat.vsMonth")}
      ${statCard("stat.markup", "12.5%", "stat.lastThirty")}
      ${statCard("stat.cancellations", d.bookingsByStatus?.CANCELLED || 0, "stat.lastThirty", true)}
    </div>
    <div class="grid-2">
      ${bookingPanel(bookings?.data || [])}
      <section class="panel">
        <div class="panel-header"><div><div class="panel-title">${t("nav.wallet")}</div><div class="panel-subtitle">${t("form.currentBalance")}</div></div>${tierBadge(state.user?.company?.tier)}</div>
        <div class="panel-body">
          <div class="info-grid" style="grid-template-columns:1fr">
            <div class="info-item"><div class="info-label">${t("th.balance")}</div><div class="info-value">${formatMoney(wallet?.data?.balance || 0, wallet?.data?.currency || "USD")}</div></div>
            <div class="info-item"><div class="info-label">${t("th.creditLimit")}</div><div class="info-value">${formatMoney(state.user?.company?.creditLimit || 0, wallet?.data?.currency || "USD")}</div></div>
            <div class="info-item"><div class="info-label">${t("topbar.lastRefresh")}</div><div class="info-value">${t("topbar.justNow")}</div></div>
          </div>
        </div>
      </section>
    </div>`);
}

function statCard(labelKey, value, subKey, down = false) {
  return `<div class="stat-card">
    <div class="stat-row"><div class="stat-label">${t(labelKey)}</div><span class="trend ${down ? "down" : ""}">${icon(down ? "trending-down" : "trending-up")} ${down ? "-2%" : "+8%"}</span></div>
    <div class="stat-value">${value}</div>
    <div class="stat-sub">${t(subKey)}</div>
  </div>`;
}

function bookingPanel(rows) {
  const cols = [
    ["th.ref", b => `<span class="primary-text">${escapeHtml(b.refNumber)}</span>`],
    ["th.type", b => escapeHtml(b.type)],
    ["th.details", b => escapeHtml(b.hotel?.name || (b.origin ? `${b.origin} → ${b.destination}` : "—"))],
    ["th.amount", b => `<span class="numeric">${formatMoney(b.totalAmount, b.currency)}</span>`],
    ["th.commission", b => `<span class="numeric">${formatMoney(b.commissionAmount || 0, b.currency || "USD")}</span>`],
    ["th.status", b => statusBadge(b.status)],
    ["th.date", b => formatDate(b.createdAt)],
  ];
  return `<section class="panel">
    <div class="panel-header"><div><div class="panel-title">${t("nav.bookings")}</div><div class="panel-subtitle">${t("topbar.justNow")}</div></div><button class="btn btn-outline" onclick="setPage('bookings')">${t("btn.view")}</button></div>
    <div class="table-scroll"><table class="data-table"><thead><tr>${cols.map(([k]) => `<th>${t(k)}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${cols.map(([, fn]) => `<td>${fn(r)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cols.length}">${emptyBlock("empty.noBookings")}</td></tr>`}</tbody></table></div>
  </section>`;
}

function renderBookings() {
  renderListPage("bookings", "/bookings", [
    ["th.ref", b => `<span class="primary-text">${escapeHtml(b.refNumber)}</span>`],
    ["th.type", b => escapeHtml(b.type)],
    ["th.details", b => escapeHtml(b.hotel?.name || (b.origin ? `${b.origin} → ${b.destination}` : "—"))],
    ["th.amount", b => `<span class="numeric">${formatMoney(b.totalAmount, b.currency)}</span>`],
    ["th.commission", b => formatMoney(b.commissionAmount || 0, b.currency || "USD")],
    ["th.status", b => statusBadge(b.status)],
    ["th.invoice", b => b.invoice ? statusBadge(b.invoice.status) : "—"],
    ["th.date", b => formatDate(b.createdAt)],
  ], {
    filters: [
      ["status", "form.status", ["", "PENDING", "CONFIRMED", "CANCELLED", "COMPLETED"]],
      ["type", "form.type", ["", "HOTEL", "FLIGHT", "PACKAGE"]],
      ["currency", "form.currency", ["", "USD", "EGP", "EUR"]],
    ],
  });
}

function renderHotels() {
  renderListPage("hotels", "/hotels", [
    ["th.name", h => `<span class="primary-text">${escapeHtml(h.name)}</span><div class="secondary-text">${escapeHtml(h.city)}, ${escapeHtml(h.country)}</div>`],
    ["th.stars", h => "★".repeat(Math.min(h.stars || 0, 5))],
    ["th.amount", h => `<span class="numeric">${formatMoney(h.pricePerNight, h.currency)}</span><div class="secondary-text">${Number(h.commissionPercent || 0).toFixed(2)}% ${t("th.commission")}</div>`],
    ["th.currency", h => escapeHtml(h.currency)],
    ["th.status", h => statusBadge(h.isActive ? "ACTIVE" : "INACTIVE")],
    ["th.actions", h => `<button class="btn btn-primary" onclick="openBookingWizard('HOTEL','${h.id}')">${t("btn.bookNow")}</button>`],
  ], {
    filters: [
      ["city", "th.city", "text"],
      ["stars", "th.stars", ["", "3", "4", "5", "6", "7"]],
      ["currency", "form.currency", ["", "USD", "EGP", "EUR"]],
    ],
  });
}

function renderCruises() {
  renderListPage("cruises", "/cruises", [
    ["th.name", c => `<span class="primary-text">${escapeHtml(c.name)}</span>`],
    ["th.type", c => escapeHtml(c.shipType)],
    ["th.route", c => escapeHtml(c.route)],
    ["th.amount", c => `<span class="numeric">${formatMoney(c.priceFrom, c.currency)}</span>`],
    ["th.status", c => statusBadge(c.isActive ? "ACTIVE" : "INACTIVE")],
    ["th.actions", c => `<button class="btn btn-primary" onclick="openServiceModal('cruise','${c.id}')">${t("btn.bookNow")}</button>`],
  ]);
}

function renderTransport() {
  renderListPage("transport", "/transport-bookings", [
    ["th.ref", r => escapeHtml(r.refNumber)],
    ["th.type", r => escapeHtml(r.type)],
    ["th.route", r => `${escapeHtml(r.fromLocation)} → ${escapeHtml(r.toLocation)}`],
    ["th.amount", r => `<span class="numeric">${formatMoney(r.totalAmount, r.currency)}</span>`],
    ["th.status", r => statusBadge(r.status)],
    ["th.date", r => formatDate(r.pickupDateTime)],
  ], { filters: [["status", "form.status", ["", "PENDING", "CONFIRMED", "CANCELLED", "COMPLETED"]]] });
}

function renderActivities() {
  renderListPage("activities", "/activities", [
    ["th.name", a => `<span class="primary-text">${escapeHtml(a.name)}</span>`],
    ["th.city", a => escapeHtml(a.city)],
    ["th.type", a => escapeHtml(a.category)],
    ["th.amount", a => `<span class="numeric">${formatMoney(a.priceAdult, a.currency)}</span>`],
    ["th.status", a => statusBadge(a.isActive ? "ACTIVE" : "INACTIVE")],
    ["th.actions", a => `<button class="btn btn-primary" onclick="openServiceModal('activity','${a.id}')">${t("btn.bookNow")}</button>`],
  ], { filters: [["city", "th.city", ["", "CAIRO", "HURGHADA", "SHARM_EL_SHEIKH", "ALEXANDRIA"]]] });
}

function renderVisa() {
  renderListPage("visa", "/visa-applications", [
    ["th.ref", v => escapeHtml(v.refNumber)],
    ["th.name", v => escapeHtml(v.applicantName)],
    ["th.type", v => escapeHtml(v.visaType)],
    ["th.country", v => escapeHtml(v.destinationCountry)],
    ["th.amount", v => `<span class="numeric">${formatMoney(v.totalAmount, v.currency)}</span>`],
    ["th.status", v => statusBadge(v.status)],
  ], { filters: [["status", "form.status", ["", "PENDING", "SUBMITTED", "APPROVED", "REJECTED"]]] });
}

function renderReception() {
  renderListPage("reception", "/airport-receptions", [
    ["th.ref", r => escapeHtml(r.refNumber)],
    ["th.name", r => escapeHtml(r.guestName)],
    ["th.service", r => escapeHtml(r.serviceType)],
    ["th.route", r => escapeHtml(r.airport)],
    ["th.amount", r => `<span class="numeric">${formatMoney(r.totalAmount, r.currency)}</span>`],
    ["th.status", r => statusBadge(r.status)],
  ], { filters: [["status", "form.status", ["", "PENDING", "CONFIRMED", "CANCELLED", "COMPLETED"]]] });
}

function renderInvoices() {
  renderListPage("invoices", "/invoices", [
    ["th.invoice", i => `<span class="primary-text">${escapeHtml(i.invoiceNumber)}</span>`],
    ["th.ref", i => escapeHtml(i.booking?.refNumber || "—")],
    ["th.amount", i => `<span class="numeric">${formatMoney(i.total, i.currency)}</span>`],
    ["th.status", i => statusBadge(i.status)],
    ["th.dueDate", i => formatDate(i.dueDate)],
    ["th.actions", i => `<a class="btn btn-outline" href="/api/invoices/${i.id}/pdf" target="_blank">${icon("file-down")}${t("btn.downloadPdf")}</a>`],
  ], { filters: [["status", "form.status", ["", "UNPAID", "PAID", "OVERDUE", "CANCELLED"]]] });
}

function renderWallet() {
  renderListPage("wallet", "/wallet/transactions", [
    ["th.type", r => statusBadge(r.type)],
    ["th.amount", r => `<span class="numeric">${formatMoney(r.amount, "USD")}</span>`],
    ["th.before", r => formatMoney(r.balanceBefore, "USD")],
    ["th.after", r => formatMoney(r.balanceAfter, "USD")],
    ["th.reference", r => escapeHtml(r.reference || "—")],
    ["th.description", r => escapeHtml(r.description)],
    ["th.date", r => formatDate(r.createdAt)],
  ], { filters: [["type", "form.type", ["", "CREDIT", "DEBIT", "REFUND", "ADJUSTMENT"]]] });
}

async function renderReports() {
  state.page = "reports";
  const res = state.user?.companyId ? await apiFetch(`/reports/company/${state.user.companyId}`) : null;
  const d = res?.data || {};
  content(pageHeader(`<button class="btn btn-outline" onclick="renderReports()">${icon("refresh-cw")}${t("btn.refresh")}</button>`) + `
    <div class="stats-grid">
      ${statCard("stat.totalBookings", d.totalBookings || 0, "stat.allTime")}
      ${statCard("stat.totalRevenue", formatMoney(d.totalRevenue || 0, "USD"), "stat.monthToDate")}
      ${statCard("stat.pending", d.pendingBookings || 0, "status.PENDING")}
      ${statCard("stat.commission", formatMoney((d.totalRevenue || 0) * 0.1, "USD"), "stat.vsMonth")}
    </div>
    <section class="panel"><div class="panel-header"><div class="panel-title">${t("page.reportsTitle")}</div></div><div class="panel-body">${emptyBlock("empty.noData")}</div></section>`);
}

function renderCalculators() {
  content(pageHeader() + `
    <div class="stats-grid">
      ${calcCard("stat.commission", "calcSale", "calcRate", "calcResult", "calcCommission()")}
      ${calcCard("stat.markup", "calcCost", "calcMarkup", "markupResult", "calcMarkup()")}
      ${calcCard("form.currency", "currAmount", "currRate", "currResult", "calcCurrency()")}
    </div>`);
}

function renderSupport() {
  content(pageHeader() + `<section class="panel"><div class="panel-body"><div class="info-grid"><div class="info-item"><div class="info-label">Email</div><div class="info-value">bookings@elbakri.com</div></div><div class="info-item"><div class="info-label">Phone</div><div class="info-value">+20 2 0000 0000</div></div></div></div></section>`);
}

async function renderListPage(page, endpoint, columns, options = {}) {
  state.page = page;
  state.listConfigs[page] = { endpoint, columns };
  const filters = options.filters || [];
  content(pageHeader(`
    <button class="btn btn-primary" onclick="openBookingWizard()">${icon("plus")}${t("btn.createBooking")}</button>
    <button class="btn btn-outline" onclick="exportRows('${page}', state.cache['${page}Rows'] || [])">${icon("download")}${t("btn.exportExcel")}</button>
  `) + `
    <div class="workbench">
      <aside class="filter-rail">
        <div class="filter-head"><span>${t("filter.title")}</span>${icon("sliders-horizontal")}</div>
        <div class="filter-body">
          <div class="field"><label>${t("filter.search")}</label><input id="${page}Search" placeholder="${t("placeholder.searchAny")}" oninput="debouncedList('${page}')"></div>
          ${filters.map(([key, labelKey, values]) => renderFilterControl(page, key, labelKey, values)).join("")}
          <button class="btn btn-outline" onclick="clearListFilters('${page}')">${icon("rotate-ccw")}${t("btn.reset")}</button>
        </div>
      </aside>
      <section class="workbench-main table-card">
        <div class="table-toolbar">
          <div><strong>${t(pageMeta[page]?.[0] || "nav."+page)}</strong><div class="secondary-text" id="${page}Meta">${t("empty.loading")}</div></div>
          <div class="toolbar-actions"><button class="btn btn-outline" onclick="${pageLoaders[page].name}()">${icon("refresh-cw")}${t("btn.refresh")}</button></div>
        </div>
        <div class="table-scroll">
          <table class="data-table"><thead><tr>${columns.map(([k]) => `<th>${t(k)}</th>`).join("")}</tr></thead><tbody id="${page}Tbody">${skeletonRows(columns.length, 8)}</tbody></table>
        </div>
        <div id="${page}Foot"></div>
      </section>
    </div>`);
  await loadListData(page, endpoint, columns);
}

function renderFilterControl(page, key, labelKey, values) {
  if (values === "text") return `<div class="field"><label>${t(labelKey)}</label><input id="${page}-${key}" oninput="debouncedList('${page}')"></div>`;
  return `<div class="field"><label>${t(labelKey)}</label><select id="${page}-${key}" onchange="loadCurrentList('${page}')">${values.map(v => `<option value="${v}">${v ? t("status."+v, v) : t("form.allTypes")}</option>`).join("")}</select></div>`;
}

let listTimer;
function debouncedList(page) {
  clearTimeout(listTimer);
  listTimer = setTimeout(() => loadCurrentList(page), 250);
}

function clearListFilters(page) {
  document.querySelectorAll(`[id^="${page}-"], #${page}Search`).forEach(el => { el.value = ""; });
  loadCurrentList(page);
}

async function loadCurrentList(page, pageNumber = 1) {
  const config = state.listConfigs[page];
  if (config) {
    await loadListData(page, config.endpoint, config.columns, pageNumber);
    return;
  }
  const loader = pageLoaders[page];
  if (loader) loader();
}

async function loadListData(page, endpoint, columns, pageNumber = 1) {
  const params = new URLSearchParams({ page: pageNumber, limit: 50 });
  document.querySelectorAll(`[id^="${page}-"]`).forEach(el => { if (el.value) params.set(el.id.replace(page + "-", ""), el.value); });
  const search = document.getElementById(page + "Search")?.value;
  if (search) params.set("search", search);
  const res = await apiFetch(`${endpoint}?${params}`);
  const rows = res?.data || [];
  state.cache[page + "Rows"] = rows;
  const tbody = document.getElementById(page + "Tbody");
  if (!tbody) return;
  tbody.innerHTML = rows.length ? rows.map(row => `<tr>${columns.map(([, fn]) => `<td>${fn(row)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${columns.length}">${emptyBlock("empty.noData")}</td></tr>`;
  const meta = res?.meta || { total: rows.length, page: 1, limit: 50, pages: 1 };
  document.getElementById(page + "Meta").textContent = `${formatNumber(meta.total)} ${t(pageMeta[page]?.[0] || "empty.noData")}`;
  document.getElementById(page + "Foot").innerHTML = tableFoot(meta, "loadCurrentList", page);
  refreshIcons(tbody);
}

function calcCard(titleKey, input1, input2, resultId, handler) {
  return `<div class="stat-card" style="min-height:190px">
    <div class="stat-label">${t(titleKey)}</div>
    <div class="field" style="margin-top:10px"><input id="${input1}" type="number" placeholder="0.00" oninput="${handler}"></div>
    <div class="field" style="margin-top:8px"><input id="${input2}" type="number" placeholder="10" oninput="${handler}"></div>
    <div class="stat-value" id="${resultId}">USD 0.00</div>
  </div>`;
}

function calcCommission() {
  const sale = Number(document.getElementById("calcSale")?.value || 0);
  const rate = Number(document.getElementById("calcRate")?.value || 0);
  document.getElementById("calcResult").textContent = formatMoney(sale * rate / 100, "USD");
}

function calcMarkup() {
  const cost = Number(document.getElementById("calcCost")?.value || 0);
  const rate = Number(document.getElementById("calcMarkup")?.value || 0);
  document.getElementById("markupResult").textContent = formatMoney(cost * (1 + rate / 100), "USD");
}

function calcCurrency() {
  const amount = Number(document.getElementById("currAmount")?.value || 0);
  const rate = Number(document.getElementById("currRate")?.value || 1);
  document.getElementById("currResult").textContent = formatMoney(amount * rate, "EGP");
}

function openBookingWizard(type = "HOTEL", presetId = "") {
  const hotel = presetId ? findWizardHotel(presetId) : null;
  state.wizard = {
    step: presetId ? 2 : 1,
    type,
    payload: {
      hotelId: presetId,
      hotelName: hotel?.name || "",
      hotel,
      adultsCount: 2,
      childrenCount: 0,
    },
  };
  renderBookingWizard();
}

function findWizardHotel(id) {
  if (!id) return null;
  const rows = state.cache.hotelsRows || [];
  const current = state.wizard?.payload?.hotel;
  return rows.find(item => item.id === id) || (current?.id === id ? current : null);
}

function selectWizardHotel(id) {
  state.wizard.payload.checkIn = document.getElementById("wizStart")?.value || state.wizard.payload.checkIn || "";
  state.wizard.payload.checkOut = document.getElementById("wizEnd")?.value || state.wizard.payload.checkOut || "";
  state.wizard.payload.adultsCount = Number(document.getElementById("wizAdults")?.value || state.wizard.payload.adultsCount || 2);
  state.wizard.payload.childrenCount = Number(document.getElementById("wizChildren")?.value || state.wizard.payload.childrenCount || 0);
  state.wizard.payload.notes = document.getElementById("wizNotes")?.value || state.wizard.payload.notes || "";
  const hotel = findWizardHotel(id);
  state.wizard.payload.hotelId = id;
  state.wizard.payload.hotelName = hotel?.name || "";
  state.wizard.payload.hotel = hotel;
  renderBookingWizard();
}

function calculateHotelQuote(payload = {}, hotel = null) {
  const checkInValue = payload.checkIn || document.getElementById("wizStart")?.value || "";
  const checkOutValue = payload.checkOut || document.getElementById("wizEnd")?.value || "";
  const adultsCount = Math.max(1, Number(payload.adultsCount ?? document.getElementById("wizAdults")?.value ?? 1));
  const childrenCount = Math.max(0, Number(payload.childrenCount ?? document.getElementById("wizChildren")?.value ?? 0));
  const checkIn = checkInValue ? new Date(`${checkInValue}T00:00:00`) : null;
  const checkOut = checkOutValue ? new Date(`${checkOutValue}T00:00:00`) : null;
  const pricePerNight = Number(hotel?.pricePerNight || 0);
  const maxGuestsPerRoom = Math.max(1, Number(hotel?.maxGuestsPerRoom || 2));
  const commissionPercent = Number(hotel?.commissionPercent || 0);
  const currency = hotel?.currency || "USD";
  const guests = adultsCount + childrenCount;
  const roomsCount = Math.max(1, Math.ceil(Math.max(1, guests) / maxGuestsPerRoom));
  const nights = checkIn && checkOut ? Math.ceil((checkOut - checkIn) / (24 * 60 * 60 * 1000)) : 0;
  const valid = Boolean(hotel?.id && checkIn && checkOut && nights > 0 && pricePerNight > 0);
  const baseAmount = valid ? pricePerNight * nights * roomsCount : 0;
  const commissionAmount = baseAmount * commissionPercent / 100;
  const totalAmount = baseAmount + commissionAmount;
  return {
    valid,
    currency,
    nights,
    roomsCount,
    adultsCount,
    childrenCount,
    commissionPercent,
    baseAmount,
    commissionAmount,
    totalAmount,
    availableRooms: Number(hotel?.availableRooms || 0),
  };
}

function hotelQuoteHtml(quote) {
  if (!quote.valid) {
    return `<div class="empty-state" style="padding:16px"><strong>${t("modal.details")}</strong><span>${t("form.chooseDates", "Choose hotel dates to calculate the booking amount")}</span></div>`;
  }
  const capacityText = quote.availableRooms ? `${quote.roomsCount}/${quote.availableRooms}` : t("form.openInventory", "Open");
  return `<div class="info-grid">
    <div class="info-item"><div class="info-label">${t("form.nights", "Nights")}</div><div class="info-value">${formatNumber(quote.nights)}</div></div>
    <div class="info-item"><div class="info-label">${t("form.rooms", "Rooms")}</div><div class="info-value">${formatNumber(quote.roomsCount)}</div></div>
    <div class="info-item"><div class="info-label">${t("form.availableRooms", "Available rooms")}</div><div class="info-value">${capacityText}</div></div>
    <div class="info-item"><div class="info-label">${t("th.amount")}</div><div class="info-value">${formatMoney(quote.baseAmount, quote.currency)}</div></div>
    <div class="info-item"><div class="info-label">${t("th.commission")}</div><div class="info-value">${formatMoney(quote.commissionAmount, quote.currency)} (${quote.commissionPercent.toFixed(2)}%)</div></div>
    <div class="info-item"><div class="info-label">${t("th.total", "Total")}</div><div class="info-value">${formatMoney(quote.totalAmount, quote.currency)}</div></div>
  </div>`;
}

function updateHotelQuote() {
  const w = state.wizard;
  if (!w || w.type !== "HOTEL") return;
  w.payload.checkIn = document.getElementById("wizStart")?.value || "";
  w.payload.checkOut = document.getElementById("wizEnd")?.value || "";
  w.payload.adultsCount = Number(document.getElementById("wizAdults")?.value || 1);
  w.payload.childrenCount = Number(document.getElementById("wizChildren")?.value || 0);
  w.payload.notes = document.getElementById("wizNotes")?.value || "";
  const hotel = findWizardHotel(w.payload.hotelId);
  const quote = calculateHotelQuote(w.payload, hotel);
  const box = document.getElementById("hotelQuoteBox");
  if (box) box.innerHTML = hotelQuoteHtml(quote);
}

function renderBookingWizard() {
  const w = state.wizard;
  const steps = ["modal.type", "modal.details", "modal.review"];
  let body = `<div class="tabs" style="margin-bottom:16px">${steps.map((k, i) => `<button class="tab ${w.step === i + 1 ? "active" : ""}">${i + 1}. ${t(k)}</button>`).join("")}</div>`;
  if (w.step === 1) {
    body += `<div class="form-grid">
      <div class="form-field full"><label>${t("modal.type")}</label><select id="wizType">${["HOTEL","FLIGHT","PACKAGE"].map(v => `<option value="${v}" ${v === w.type ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    </div>`;
  } else if (w.step === 2) {
    if (w.type === "HOTEL") {
      const hotel = findWizardHotel(w.payload.hotelId);
      const hotels = state.cache.hotelsRows || [];
      const quote = calculateHotelQuote(w.payload, hotel);
      body += `<div class="form-grid">
        <div class="form-field full"><label>${t("nav.hotels")} <span class="required">*</span></label><select id="wizHotelId" onchange="selectWizardHotel(this.value)">
          <option value="">${t("form.selectHotel", "Select hotel")}</option>
          ${hotels.map(h => `<option value="${h.id}" ${h.id === w.payload.hotelId ? "selected" : ""}>${escapeHtml(h.name)} - ${escapeHtml(h.city || "")}</option>`).join("")}
        </select></div>
        ${field("wizStart", "form.checkIn", w.payload.checkIn || "", true, "date", 'onchange="updateHotelQuote()"', "Check-in")}
        ${field("wizEnd", "form.checkOut", w.payload.checkOut || "", true, "date", 'onchange="updateHotelQuote()"', "Check-out")}
        ${field("wizAdults", "form.adults", w.payload.adultsCount ?? 2, true, "number", 'min="1" step="1" oninput="updateHotelQuote()"', "Adults")}
        ${field("wizChildren", "form.children", w.payload.childrenCount ?? 0, false, "number", 'min="0" step="1" oninput="updateHotelQuote()"', "Children")}
        <div class="form-field"><label>${t("form.currency")}</label><input value="${escapeHtml(quote.currency)}" readonly></div>
        <div class="form-field full"><label>${t("placeholder.notes")}</label><textarea id="wizNotes" oninput="updateHotelQuote()">${escapeHtml(w.payload.notes || "")}</textarea></div>
        <div class="form-field full" id="hotelQuoteBox">${hotelQuoteHtml(quote)}</div>
      </div>`;
    } else {
      body += `<div class="form-grid">
        ${field("wizRefName", "th.details", w.payload.hotelId || "")}
        ${field("wizStart", "th.date", "", true, "date")}
        ${field("wizEnd", "form.checkOut", "", false, "date", "", "Return date")}
        ${field("wizAdults", "form.adults", "2", true, "number", 'min="1" step="1"', "Adults")}
        ${field("wizAmount", "th.amount", "", true, "number")}
        <div class="form-field"><label>${t("form.currency")}</label><select id="wizCurrency"><option>USD</option><option>EGP</option><option>EUR</option></select></div>
        <div class="form-field full"><label>${t("placeholder.notes")}</label><textarea id="wizNotes"></textarea></div>
      </div>`;
    }
  } else {
    const amount = w.payload.totalAmount || 0;
    const commission = w.payload.commissionAmount || 0;
    body += `<div class="info-grid">
      <div class="info-item"><div class="info-label">${t("th.type")}</div><div class="info-value">${escapeHtml(w.type)}</div></div>
      ${w.type === "HOTEL" ? `<div class="info-item"><div class="info-label">${t("nav.hotels")}</div><div class="info-value">${escapeHtml(w.payload.hotelName || "")}</div></div>
      <div class="info-item"><div class="info-label">${t("form.nights", "Nights")}</div><div class="info-value">${formatNumber(w.payload.nights || 0)}</div></div>
      <div class="info-item"><div class="info-label">${t("form.rooms", "Rooms")}</div><div class="info-value">${formatNumber(w.payload.roomsCount || 1)}</div></div>` : ""}
      <div class="info-item"><div class="info-label">${t("th.amount")}</div><div class="info-value">${formatMoney(w.payload.baseAmount || amount, w.payload.currency || "USD")}</div></div>
      <div class="info-item"><div class="info-label">${t("th.commission")}</div><div class="info-value">${formatMoney(commission, w.payload.currency || "USD")}</div></div>
      <div class="info-item"><div class="info-label">${t("th.total", "Total")}</div><div class="info-value">${formatMoney(amount, w.payload.currency || "USD")}</div></div>
    </div>`;
  }
  openModal(t("modal.bookingNew"), body, wizardFooter());
}

function wizardFooter() {
  const w = state.wizard;
  return `
    ${w.step > 1 ? `<button class="btn btn-outline" onclick="wizardBack()">${t("btn.back")}</button>` : `<button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel")}</button>`}
    ${w.step < 3 ? `<button class="btn btn-primary" onclick="wizardNext()">${t("btn.next")}</button>` : `<button class="btn btn-primary" onclick="submitWizardBooking()">${t("btn.createBooking")}</button>`}`;
}

function wizardNext() {
  const w = state.wizard;
  if (w.step === 1) {
    w.type = document.getElementById("wizType").value;
  } else if (w.step === 2) {
    if (w.type === "HOTEL") {
      updateHotelQuote();
      const hotelId = document.getElementById("wizHotelId")?.value || w.payload.hotelId;
      const hotel = findWizardHotel(hotelId);
      const quote = calculateHotelQuote(w.payload, hotel);
      if (!quote.valid) return toast(t("toast.validationError"), "error");
      if (quote.availableRooms && quote.roomsCount > quote.availableRooms) return toast(t("toast.unavailable", "Not enough rooms for selected guests"), "error");
      w.payload = {
        type: w.type,
        hotelId,
        hotelName: hotel?.name || "",
        checkIn: w.payload.checkIn,
        checkOut: w.payload.checkOut,
        adultsCount: quote.adultsCount,
        childrenCount: quote.childrenCount,
        roomsCount: quote.roomsCount,
        nights: quote.nights,
        baseAmount: quote.baseAmount,
        commissionAmount: quote.commissionAmount,
        totalAmount: quote.totalAmount,
        currency: quote.currency,
        notes: w.payload.notes || "",
        hotel,
      };
    } else {
      w.payload = {
        type: w.type,
        checkIn: document.getElementById("wizStart").value || undefined,
        checkOut: document.getElementById("wizEnd").value || undefined,
        adultsCount: Number(document.getElementById("wizAdults").value || 1),
        totalAmount: Number(document.getElementById("wizAmount").value || 0),
        baseAmount: Number(document.getElementById("wizAmount").value || 0),
        currency: document.getElementById("wizCurrency").value || "USD",
        notes: document.getElementById("wizNotes").value,
      };
      if (!w.payload.totalAmount) return toast(t("toast.validationError"), "error");
    }
  }
  w.step += 1;
  renderBookingWizard();
}

function wizardBack() {
  state.wizard.step -= 1;
  renderBookingWizard();
}

async function submitWizardBooking() {
  const payload = { ...state.wizard.payload };
  if (state.wizard.type === "HOTEL") {
    delete payload.hotel;
    delete payload.hotelName;
    delete payload.totalAmount;
    delete payload.baseAmount;
    delete payload.commissionAmount;
  } else {
    delete payload.hotelId;
    payload.origin = "CAI";
    payload.destination = "JED";
    payload.departureDate = payload.checkIn || new Date().toISOString();
  }
  const res = await apiFetch("/bookings", { method: "POST", body: JSON.stringify(payload) });
  if (res?.success) {
    closeModal();
    toast(`${t("toast.created")} ${res.data.refNumber}`, "success");
    setPage("bookings");
  }
}

function openServiceModal(kind, id) {
  toast(`${t("btn.bookNow")}: ${kind} ${id}`, "");
}

function field(id, labelKey, value = "", required = false, type = "text", extra = "", fallback = "") {
  return `<div class="form-field"><label>${t(labelKey, fallback || labelKey)} ${required ? '<span class="required">*</span>' : ""}</label><input id="${id}" type="${type}" value="${escapeHtml(value ?? "")}" ${extra}></div>`;
}

function updateWallet(data) {
  state.wallet = data;
  document.getElementById("walletPillValue").textContent = formatMoney(data.balance || 0, data.currency || "USD");
}

async function bootstrapUser() {
  const token = localStorage.getItem("accessToken");
  if (!token) {
    location.href = "/login.html";
    return false;
  }
  const me = await apiFetch("/auth/me");
  if (!me?.success) return false;
  if (me.data.role === "SUPERADMIN") {
    location.href = "/admin.html";
    return false;
  }
  state.user = me.data;
  localStorage.setItem("user", JSON.stringify(me.data));
  localStorage.setItem("userRole", me.data.role);
  document.getElementById("sidebarUser").textContent = me.data.name;
  document.getElementById("sidebarInitial").textContent = me.data.name?.charAt(0).toUpperCase() || "?";
  document.getElementById("sidebarCompany").textContent = me.data.company?.name || "Agency";
  document.getElementById("companyBreadcrumb").textContent = me.data.company?.name || "Agency";
  const tier = me.data.company?.tier || "STANDARD";
  document.getElementById("agentTier").textContent = t("tier." + tier, tier);
  document.getElementById("topbarTier").textContent = t("tier." + tier, tier);
  const wallet = await apiFetch("/wallet/balance");
  if (wallet?.data) updateWallet(wallet.data);
  return true;
}

const pageLoaders = {
  dashboard: renderDashboard,
  bookings: renderBookings,
  hotels: renderHotels,
  cruises: renderCruises,
  transport: renderTransport,
  activities: renderActivities,
  visa: renderVisa,
  reception: renderReception,
  invoices: renderInvoices,
  wallet: renderWallet,
  reports: renderReports,
  calculators: renderCalculators,
  support: renderSupport,
};

document.addEventListener("portal:lang", () => setPage(state.page));

(async function init() {
  initI18n();
  refreshIcons();
  const ok = await bootstrapUser();
  if (ok) setPage("dashboard");
})();
</script>
