// ─── Reusable dynamic child-age fields (GLOBAL — works in any form) ────────────
// Builds N "Child i age" number inputs with ids `${prefix}ChildAge_${i}`.
function buildChildAgeInputs(count, prefix, ages = []) {
  if (!count || count < 1) return "";
  return `
    <label style="display:block;margin-bottom:6px">${t("form.children","Children Ages")} <span class="required">*</span></label>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">
      ${Array.from({length: count}, (_, i) => `
        <div>
          <label style="font-size:11px;color:var(--text-muted)">${t("hotel.childAge","Child {n} Age").replace("{n}", i+1)}</label>
          <input type="number" min="0" max="17" value="${escapeHtml(ages[i] ?? 7)}" id="${prefix}ChildAge_${i}" placeholder="${i+1}" style="width:100%">
        </div>`).join("")}
    </div>`;
}

/** Global handler — call from a children-count input's oninput.
 *  countId    = id of the number input holding the children count
 *  containerId= id of the container div to fill with age inputs
 *  prefix     = id prefix for the generated age inputs */
function onChildrenCountChange(countId, containerId, prefix) {
  const count = Math.max(0, parseInt(document.getElementById(countId)?.value || "0"));
  const box = document.getElementById(containerId);
  if (!box) return;
  const existingAges = Array.from(box.querySelectorAll('input[type="number"]')).map(input => input.value);
  box.style.display = count > 0 ? "" : "none";
  box.innerHTML = count > 0 ? buildChildAgeInputs(count, prefix, existingAges) : "";
}

/** Collect child ages from a prefixed group into an array. */
function collectChildAges(count, prefix) {
  return Array.from({length: Math.max(0, count)}, (_, i) =>
    parseInt(document.getElementById(`${prefix}ChildAge_${i}`)?.value || "7"));
}

/** Validate that all child-age inputs are filled (required when children > 0). */
function childAgesValid(count, prefix) {
  for (let i = 0; i < count; i++) {
    const v = document.getElementById(`${prefix}ChildAge_${i}`)?.value;
    if (v === "" || v == null || isNaN(parseInt(v))) return false;
  }
  return true;
}

// ════════════════════════════════════════════════════════════════════════════
// REQUEST FORM BUILDER — generic, template-driven form renderer
// Renders a request form from an admin-configured UiTemplate (config.fields[]),
// then collects + validates values and routes the submission through a
// per-target adapter. Falls back to each form's hardcoded body when no active
// template exists (zero regression). Field input ids are `rf_<key>`.
// ════════════════════════════════════════════════════════════════════════════

let rfState = { template: null, ctx: null, target: null };

function rfIsAr()      { return (localStorage.getItem("lang") || document.documentElement.lang || "en") === "ar"; }
function rfLabel(f)    { return (rfIsAr() && f.labelAr)       ? f.labelAr       : (f.label || f.key); }
function rfPlace(f)    { return (rfIsAr() && f.placeholderAr) ? f.placeholderAr : (f.placeholder || ""); }
function rfHelp(f)     { return (rfIsAr() && f.helpTextAr)    ? f.helpTextAr    : (f.helpText || ""); }
function rfOptLabel(o) { return (rfIsAr() && o.labelAr)       ? o.labelAr       : (o.label || o.value); }
function rfNum(v, d)   { const n = parseInt(v); return isNaN(n) ? d : n; }

const RF_MEAL_PLANS = ["ROOM_ONLY","BREAKFAST","HALF_BOARD","FULL_BOARD","ALL_INCLUSIVE","ULTRA_ALL_INCLUSIVE"];

/** Fetch the active template for a target; null → caller uses its hardcoded form. */
async function rfLoadTemplate(target) {
  try { const r = await apiFetch("/ui-templates/" + target); return (r && r.data) ? r.data : null; }
  catch { return null; }
}

/** Visible fields of a template, sorted by order. */
function rfFields(tpl) {
  return (((tpl && tpl.config && tpl.config.fields) || [])
    .filter(f => f && f.key && f.visible !== false))
    .slice()
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

/** Build the inner control HTML for one field. */
function rfControl(f, ctx) {
  const id = "rf_" + f.key;
  const ph = rfPlace(f);
  const phAttr = ph ? ` placeholder="${escapeHtml(ph)}"` : "";
  const dv = f.defaultValue;
  switch (f.type) {
    case "readonly-service":
      return `<input id="${id}" value="${escapeHtml(ctx.serviceName || "")}" disabled style="opacity:.7">`;
    case "readonly-price":
      return `<div id="${id}" class="rf-price">${escapeHtml(ctx.priceText || "—")}</div>`;
    case "nationality-select":
      return nationalitySelectHtml(id, dv, ph);
    case "textarea":
      return `<textarea id="${id}" rows="3"${phAttr}>${escapeHtml(dv || "")}</textarea>`;
    case "select":
    case "searchable-select":
    case "meal-plan-select": {
      let opts = (Array.isArray(f.options) && f.options.length) ? f.options.slice() : null;
      if (!opts && f.key === "packageId" && Array.isArray(ctx.packages)) {
        opts = ctx.packages.map(p => ({ value: p.id, label: `${p.name} — ${p.dataSize} · ${formatPrice(p.price, p.currency)}`, price: p.price, currency: p.currency }));
      }
      if (!opts && f.type === "meal-plan-select") {
        opts = RF_MEAL_PLANS.map(mp => ({ value: mp, label: t("mealPlan." + mp, mp.replace(/_/g, " ")) }));
      }
      opts = opts || [];
      const onch = (f.key === "packageId" || f.affectsPrice) ? ` onchange="rfFieldChanged('${f.key}')"` : "";
      return `<select id="${id}"${onch}>
        <option value="">${escapeHtml(ph || t("form.select", "Select"))}</option>
        ${opts.map(o => `<option value="${escapeHtml(o.value)}"${o.price != null ? ` data-price="${escapeHtml(o.price)}" data-cur="${escapeHtml(o.currency || "USD")}"` : ""}${String(dv) === String(o.value) ? " selected" : ""}>${escapeHtml(rfOptLabel(o))}</option>`).join("")}
      </select>`;
    }
    case "child-count": {
      const rep = rfFields(rfState.template).find(x => x.type === "child-age-repeater");
      const boxId = rep ? ("rf_" + rep.key + "_box") : "rfChildAgesBox";
      return `<input id="${id}" type="number" min="0" max="10" value="${dv != null ? escapeHtml(dv) : 0}" oninput="onChildrenCountChange('${id}','${boxId}','rf')">`;
    }
    case "child-age-repeater":
      return `<div id="rf_${f.key}_box" class="rf-ages" style="display:none"></div>`;
    case "checkbox":
    case "toggle":
      return `<label class="check-row"><input type="checkbox" id="${id}"${dv ? " checked" : ""}> ${escapeHtml(rfLabel(f))}</label>`;
    case "file-upload":
    case "image-upload":
      return `<input type="file" accept="${f.type === "image-upload" ? "image/*" : "image/*,.pdf"}" onchange="uploadAndFill(this,'${id}',${f.type !== "image-upload"})">
              <input id="${id}" placeholder="${escapeHtml(ph || t("form.orPasteUrl", "or paste URL"))}" style="margin-top:6px">`;
    case "number":
    case "pax-counter":
    case "room-counter": {
      const min = f.min != null ? f.min : (f.type === "number" ? null : 1);
      const minAttr = min != null ? ` min="${min}"` : "";
      const maxAttr = f.max != null ? ` max="${f.max}"` : "";
      const stepAttr = f.step != null ? ` step="${f.step}"` : "";
      const val = dv != null ? dv : (f.type === "number" ? "" : 1);
      return `<input id="${id}" type="number"${minAttr}${maxAttr}${stepAttr} value="${escapeHtml(val)}"${phAttr} oninput="rfFieldChanged('${f.key}')">`;
    }
    case "date":     return `<input id="${id}" type="date" value="${escapeHtml(dv || "")}">`;
    case "time":     return `<input id="${id}" type="time" value="${escapeHtml(dv || "")}">`;
    case "datetime": return `<input id="${id}" type="datetime-local" value="${escapeHtml(dv || "")}">`;
    case "hidden":   return `<input id="${id}" type="hidden" value="${escapeHtml(dv || "")}">`;
    default:         return `<input id="${id}" type="text"${phAttr} value="${escapeHtml(dv || "")}">`;
  }
}

/** Wrap a field control in a .form-field cell (honouring width + help text). */
function rfFieldCell(f, ctx) {
  const fullTypes = ["textarea", "child-age-repeater", "readonly-service", "readonly-price", "file-upload", "image-upload"];
  const full = f.width === "full" || (!f.width && fullTypes.includes(f.type));
  const help = rfHelp(f);
  const helpHtml = help ? `<div class="rf-help">${escapeHtml(help)}</div>` : "";
  if (f.type === "checkbox" || f.type === "toggle") {
    return `<div class="form-field${full ? " full" : ""}">${rfControl(f, ctx)}${helpHtml}</div>`;
  }
  const ic = f.icon ? icon(f.icon) + " " : "";
  const req = f.required ? ` <span class="required">*</span>` : "";
  return `<div class="form-field${full ? " full" : ""}">
    <label>${ic}${escapeHtml(rfLabel(f))}${req}</label>
    ${rfControl(f, ctx)}${helpHtml}
  </div>`;
}

/** Render the complete form body for a template + context. */
function renderRequestForm(tpl, ctx) {
  const fields = rfFields(tpl);
  const needsNat = fields.some(f => f.type === "nationality-select");
  return `${needsNat ? nationalityDatalist() : ""}
    <div class="form-grid">
      ${fields.map(f => rfFieldCell(f, ctx)).join("")}
    </div>`;
}

/** Current children count from the template's child-count field (0 if none). */
function rfChildCount() {
  const cf = rfFields(rfState.template).find(x => x.type === "child-count");
  if (!cf) return 0;
  const el = document.getElementById("rf_" + cf.key);
  return Math.max(0, parseInt((el && el.value) || "0") || 0);
}

/** Read one field's value (typed); undefined when empty / not collectable. */
function rfReadValue(f) {
  const el = document.getElementById("rf_" + f.key);
  switch (f.type) {
    case "readonly-service":
    case "readonly-price":
      return undefined;
    case "child-age-repeater": {
      const cnt = rfChildCount();
      return cnt > 0 ? collectChildAges(cnt, "rf") : undefined;
    }
    case "checkbox":
    case "toggle":
      return el ? el.checked : undefined;
    case "number":
    case "pax-counter":
    case "room-counter":
    case "child-count": {
      if (!el || el.value === "") return undefined;
      const n = parseInt(el.value); return isNaN(n) ? undefined : n;
    }
    default: {
      if (!el) return undefined;
      const v = String(el.value || "").trim();
      return v === "" ? undefined : v;
    }
  }
}

/** Evaluate a field's showWhen condition against live DOM values. */
function rfShown(f) {
  if (!f.showWhen || !f.showWhen.field) return true;
  const ref = document.getElementById("rf_" + f.showWhen.field);
  if (!ref) return true;
  const cur = ref.type === "checkbox" ? ref.checked : ref.value;
  return rfCmp(cur, f.showWhen.op, f.showWhen.value);
}

function rfCmp(cur, op, val) {
  const a = parseFloat(cur), b = parseFloat(val);
  switch (op) {
    case "truthy": return !!cur && cur !== "0";
    case "eq":  return String(cur) === String(val);
    case "ne":  return String(cur) !== String(val);
    case "gt":  return a > b;
    case "gte": return a >= b;
    case "lt":  return a < b;
    case "lte": return a <= b;
    default:    return true;
  }
}

/** Collect all shown field values into { key: value }. */
function collectRequestFormValues(tpl) {
  const out = {};
  rfFields(tpl).forEach(f => {
    if (!rfShown(f)) return;
    const v = rfReadValue(f);
    if (v !== undefined && !(Array.isArray(v) && v.length === 0)) out[f.key] = v;
  });
  return out;
}

/** Validate required + conditional fields; returns first failing label or null. */
function validateRequestForm(tpl) {
  for (const f of rfFields(tpl)) {
    if (!f.required || !rfShown(f)) continue;
    if (f.type === "child-age-repeater") {
      const cnt = rfChildCount();
      if (cnt > 0 && !childAgesValid(cnt, "rf")) return rfLabel(f);
      continue;
    }
    const v = rfReadValue(f);
    if (v === undefined || (Array.isArray(v) && v.length === 0)) return rfLabel(f);
  }
  return null;
}

/**
 * Find the quantity field for price math without relying solely on a fragile
 * regex: explicit field role first (role:"quantity" / affectsPrice:"quantity"),
 * then a known key, then a last-resort name match.
 */
function rfQuantityField(tpl) {
  const fields = rfFields(tpl);
  return fields.find(f => f.role === "quantity" || f.affectsPrice === "quantity")
    || fields.find(f => f.key === "quantity" || f.key === "qty")
    || fields.find(f => (f.type === "number" || f.type === "pax-counter") && /qty|quantity/i.test(f.key))
    || null;
}

/**
 * Supported field-dependency hook: any field that affects price (the priced
 * select or the quantity input) calls this on change to recompute the live total.
 */
function rfFieldChanged(_key) {
  rfUpdatePrice();
}

/** Recompute a readonly-price node: unit price (from the priced select) × quantity. NO FX. */
function rfUpdatePrice() {
  const tpl = rfState.template;
  const priceField = rfFields(tpl).find(f => f.type === "readonly-price");
  const pkgField = rfFields(tpl).find(f => f.key === "packageId" || f.affectsPrice === "unit");
  if (!priceField || !pkgField) return;
  const sel = document.getElementById("rf_" + pkgField.key);
  const opt = sel && sel.options[sel.selectedIndex];
  const unit = parseFloat((opt && opt.dataset.price) || "0");
  const cur = (opt && opt.dataset.cur) || "USD";
  const qtyField = rfQuantityField(tpl);
  const qty = qtyField ? Math.max(1, parseInt(document.getElementById("rf_" + qtyField.key)?.value || "1") || 1) : 1;
  const el = document.getElementById("rf_" + priceField.key);
  if (!el) return;
  if (unit > 0) {
    // Live summary: unit price × quantity = total, in the explicit currency (no conversion).
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:12px;color:var(--text-muted)">${t("sim.unitPrice","Unit")}: ${escapeHtml(formatPrice(unit, cur))} × ${qty}</span>
      <span style="font-weight:800">${escapeHtml(formatPrice(unit * qty, cur))}</span>
    </div>`;
  } else {
    el.textContent = "—";
  }
}

/** WhatsApp + toast success handler shared by the 3 quote-request targets. */

  const waUrl = buildWhatsAppQuoteUrl({

    notes: values.notes || undefined,

  closeModal();
  toast(`✅ ${t("toast.quoteSubmitted", "Quote request submitted")} — ${ref}`, "success");
  if (typeof loadMyQuotesBadge === "function") loadMyQuotesBadge();
  redirectToWhatsApp(waUrl, waWindow);
}

    toast(`✅ ${t("toast.created", "Submitted")} — ${res.data.refNumber}`, "success");
    if (typeof rerenderFn === "function") rerenderFn();
  };
}

    }),
    success: rfSimpleSuccess(() => typeof renderSimCard === "function" && renderSimCard()),
  },
};

/** Open a template-driven request modal. */
function rfOpenModal(target, tpl, ctx) {
  rfState = { template: tpl, ctx: ctx || {}, target };
  const adapter = REQUEST_FORM_TARGETS[target] || {};
  const cfg = tpl.config || {};
  const title = ((rfIsAr() && cfg.titleAr) ? cfg.titleAr : cfg.title) || tpl.name || t("btn.requestQuote", "Request");
  const submitIcon = adapter.whatsapp ? "brand-whatsapp" : adapter.confirm ? "circle-check" : "send";
  const submitLabel = adapter.whatsapp ? t("btn.sendRequest", "Send via WhatsApp")
    : adapter.confirm ? t("btn.confirm", "Confirm")
    : t("btn.sendRequest", "Send Request");
  openModal(title, renderRequestForm(tpl, rfState.ctx), `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel", "Cancel")}</button>
    <button class="btn btn-primary" id="rfSubmitBtn" onclick="rfSubmit('rfSubmitBtn')">${icon(submitIcon)}&nbsp;${submitLabel}</button>
  `);
  refreshIcons(document.querySelector(".modal-overlay") || document);
  const cf = rfFields(tpl).find(x => x.type === "child-count");
  const rep = rfFields(tpl).find(x => x.type === "child-age-repeater");
  if (cf && rep) onChildrenCountChange("rf_" + cf.key, "rf_" + rep.key + "_box", "rf");
  if (adapter.hasPrice) rfUpdatePrice();
}

/** Validate → split known/custom → POST → success, for a template form. */
async function rfSubmit(btnId) {
  const { template: tpl, ctx, target } = rfState;
  const adapter = REQUEST_FORM_TARGETS[target];
  if (!tpl || !adapter) return;

  const bad = validateRequestForm(tpl);
  if (bad) { toast(`${t("validation.fieldRequired", "Please complete")}: ${bad}`, "error"); return; }

  const values = collectRequestFormValues(tpl);
  const custom = {};
  Object.keys(values).forEach(k => { if (!adapter.known.includes(k)) custom[k] = values[k]; });
  const payload = adapter.build(values, ctx, Object.keys(custom).length ? custom : undefined);

  const btn = document.getElementById(btnId);
  if (btn) btn.disabled = true;
  const waWindow = adapter.whatsapp ? reserveWhatsAppWindow() : null;

  const res = await apiFetch(adapter.endpoint, { method: "POST", body: JSON.stringify(payload) });
  if (res && res.success) {
    adapter.success(res, ctx, values, waWindow);
  } else {
    if (waWindow && !waWindow.closed) waWindow.close();
    if (btn) btn.disabled = false;
  }
}

async function openQuoteRequestModal(serviceType, serviceId, serviceName) {
  // Template-driven path: use the active Request Form Builder template when one exists.

  // Fallback: original hardcoded quote form.
  const isHotel = serviceType === "HOTEL";

  const body = `

      <div class="form-field"><label>${t("form.children","Children")}</label>
        <input id="qrChildren" type="number" min="0" max="10" value="0" oninput="onChildrenCountChange('qrChildren','childAgesContainer','qr')"></div>
      ${isHotel ? `<div class="form-field"><label>${t("hotel.rooms","Rooms")}</label>
        <input id="qrRooms" type="number" min="1" value="1"></div>
        <div class="form-field"><label>${t("hotel.mealPlan","Meal Plan")}</label>
        <select id="qrMealPlan">
          <option value="">${t("hotel.selectMealPlan","Select meal plan")}</option>
          ${mealPlanOptions.map(mp => `<option value="${mp}">${t("mealPlan."+mp, mp.replace(/_/g," "))}</option>`).join("")}

      <div id="childAgesContainer" class="form-field full" style="display:none"></div>
      <div class="form-field full"><label>${t("form.notes","Notes / Special Requests")}</label>

    </div>`;

  openModal(t("btn.requestQuote","Request a Quote"), body, `
    <button class="btn btn-outline" onclick="closeModal()">${t("btn.cancel","Cancel")}</button>
    <button class="btn btn-primary" id="submitQuoteBtn">${icon("brand-whatsapp")}&nbsp;${t("btn.sendRequest","Send via WhatsApp")}</button>
  `);
  // Consumed once. Leaving it set would carry one screen's selection into the
  // next, unrelated, quote request.
  state.quotePrefillNotes = "";

  document.getElementById("submitQuoteBtn").onclick = async () => {
    const checkIn = document.getElementById("qrCheckIn").value;
    const checkOut = document.getElementById("qrCheckOut").value;
    const adults = parseInt(document.getElementById("qrAdults").value || "2");
    const children = parseInt(document.getElementById("qrChildren").value || "0");
    const rooms = isHotel ? parseInt(document.getElementById("qrRooms")?.value || "1") : undefined;
    const mealPlan = isHotel ? (document.getElementById("qrMealPlan")?.value || undefined) : undefined;
    const nationality = document.getElementById("qrNationality").value.trim() || undefined;
    const notes = document.getElementById("qrNotes").value.trim() || undefined;

    const childAges = collectChildAges(children, "qr");

    if (!checkIn || !checkOut) {
      toast(t("validation.dateRequired","Please select check-in and check-out dates"), "error");
      return;
    }
    if (children > 0 && !childAgesValid(children, "qr")) {
      toast(t("validation.childAges","Please enter all children ages"), "error");
      return;
    }

    const isCruise = serviceType === "CRUISE";
    const payload = {
      serviceType,
      hotelId:    isHotel  ? serviceId : undefined,
      cruiseId:   isCruise ? serviceId : undefined,
      serviceId:  (!isHotel && !isCruise) ? serviceId : undefined,
      serviceName: !isHotel ? serviceName : undefined,
      checkIn: checkIn || undefined,
      checkOut: checkOut || undefined,
      adultsCount: adults,
      childrenCount: children,
      roomsCount: rooms,
      mealPlan: mealPlan || undefined,
      nationality,
      childAges: children > 0 ? childAges : undefined,
      customerNotes: notes,
      contactPreference: "whatsapp",
      currency: "USD",
    };

    document.getElementById("submitQuoteBtn").disabled = true;
    const waWindow = reserveWhatsAppWindow();
    const res = await apiFetch("/quote-requests", { method: "POST", body: JSON.stringify(payload) });
    if (res?.success) {
      const ref = res.data.refNumber;
      const mealPlanLabel = mealPlan ? t("mealPlan."+mealPlan, mealPlan) : null;
      const childAgesStr = children > 0 ? childAges.join(", ") + " yrs" : null;
      const waUrl = buildWhatsAppQuoteUrl({
        ref,
        serviceType,
        serviceName,
        nationality,
        checkIn, checkOut,
        adults,
        children: children || undefined,
        rooms:    rooms    || undefined,

      closeModal();
      toast(`✅ ${t("toast.quoteSubmitted","Quote request submitted")} — ${ref}`, "success");
      loadMyQuotesBadge();
      redirectToWhatsApp(waUrl, waWindow);
    } else {
      if (waWindow && !waWindow.closed) waWindow.close();
      document.getElementById("submitQuoteBtn").disabled = false;
    }
  };

// Holds the live-fetch transport data: { fromLocations, toLocations, vehicleTypes }
state.transportData = { fromLocations: [], toLocations: [], vehicleTypes: [] };
// Holds current quote result
state.transportQuote = null;

async function renderTransport() {
  state.page = "transport";
  const capturedToken = state.renderToken;

  content(pageHeader(`<button class="btn btn-outline" onclick="renderTransportHistory()">${icon("list")}&nbsp;${t("nav.bookings","My Bookings")}</button>`) + `
    <div id="transportFormArea">${trFormSkeleton()}</div>`);

  };

// Typed From/To picker — Airport (admin list), Hotel (list or free text) or
// Destination (admin list). Replaces the old single free-text dropdown.
function trEpField(side, defaultType) {
  const cap = side === "from" ? "From" : "To";
  const refs = state.transportRefs || { airports: [], destinations: [], hotels: [] };
  const lbl = (en, ar) => (state.lang === "ar" && ar ? ar : en);
  const airOpts = `<option value="">${t("transport.selectAirport", "Select airport...")}</option>` +
    refs.airports.map(a => `<option value="${a.id}" data-name="${escapeHtml(a.code + " · " + a.nameEn)}">${escapeHtml(a.code + " · " + lbl(a.nameEn, a.nameAr))}</option>`).join("");
  const destOpts = `<option value="">${t("transport.selectDestination", "Select destination...")}</option>` +
    refs.destinations.map(d => `<option value="${d.id}" data-name="${escapeHtml(d.name)}">${escapeHtml(lbl(d.name, d.nameAr))}</option>`).join("");
  const typeBtn = (type, ic, label) => `<div class="tf-ep-type ${defaultType === type ? "on" : ""}" data-type="${type}" onclick="trEpType('${side}','${type}')">${icon(ic)} ${label}</div>`;
  // A journey runs between an airport and a place — the hotel is which building
  // inside that place, not a third kind of endpoint. Offering "hotel → hotel"
  // asked the client to pick a route no rate is ever priced for; the hotel is
  // now asked for underneath the destination, once one is chosen.
  return `
    <div class="tf-ep-types" data-side="${side}">
      ${typeBtn("AIRPORT", "plane", t("transport.airport", "Airport"))}
      ${typeBtn("DESTINATION", "map-pin", t("transport.destination", "Destination"))}
    </div>
    <input type="hidden" id="tr${cap}Type" value="${defaultType}">
    <select id="tr${cap}Airport" class="tr-ep-ctrl" data-kind="AIRPORT" onchange="trRouteChanged()">${airOpts}</select>
    <select id="tr${cap}Dest" class="tr-ep-ctrl" data-kind="DESTINATION" onchange="trDestChanged('${side}')" style="display:none">${destOpts}</select>
    <div id="tr${cap}HotelBox" class="tr-ep-hotel" style="display:none;margin-top:8px">
      <label class="tr-ep-hotel-label">${t("transport.whichHotel", "Which hotel?")}</label>
      <select id="tr${cap}Hotel" onchange="trHotelPicked('${side}')"></select>
      <input id="tr${cap}HotelText" placeholder="${t("transport.orTypeHotel", "…or type hotel / address")}" oninput="trRouteChanged()" style="margin-top:6px">
    </div>`;
}

/**
 * Fill one side's hotel picker with the hotels in the chosen destination. The
 * client is going to a specific hotel inside Sharm, so the list is scoped —
 * an unfiltered list of every hotel in Egypt is not a choice anyone can make.
 */
function trFillHotelsFor(side) {
  const cap = side === "from" ? "From" : "To";
  const box = document.getElementById(`tr${cap}HotelBox`);
  const select = document.getElementById(`tr${cap}Hotel`);
  const isDest = document.getElementById(`tr${cap}Type`)?.value === "DESTINATION";
  const destId = document.getElementById(`tr${cap}Dest`)?.value || "";
  if (!box || !select) return;
  if (!isDest || !destId) { box.style.display = "none"; return; }

  const refs = state.transportRefs || { hotels: [], destinations: [] };
  const dest = (refs.destinations || []).find(d => d.id === destId);
  const destName = (dest?.name || "").trim().toLowerCase();
  // Prefer the explicit link; fall back to the city label so hotels imported
  // before destinations existed still appear under the right place.
  const hotels = (refs.hotels || []).filter(h =>
    h.destinationId ? h.destinationId === destId : (h.city || "").trim().toLowerCase() === destName);

  const previous = select.value;
  select.innerHTML = `<option value="">${t("transport.selectHotel", "Select hotel...")}</option>`
    + hotels.map(h => `<option value="${h.id}" data-name="${escapeHtml(h.name)}">${escapeHtml(h.name)}</option>`).join("");
  if (previous && hotels.some(h => h.id === previous)) select.value = previous;
  box.style.display = "";
  const textEl = document.getElementById(`tr${cap}HotelText`);
  if (textEl) {
    textEl.placeholder = hotels.length
      ? t("transport.orTypeHotel", "…or type hotel / address")
      : t("transport.typeHotelNoList", "Type the hotel or address in this destination");
  }
}

/** Destination changed on one side → rescope its hotel list, then re-price. */
function trDestChanged(side) {
  const cap = side === "from" ? "From" : "To";
  const select = document.getElementById(`tr${cap}Hotel`);
  const textEl = document.getElementById(`tr${cap}HotelText`);
  // The old hotel belongs to the old destination — never carry it over.
  if (select) select.value = "";
  if (textEl) textEl.value = "";
  trFillHotelsFor(side);
  trRouteChanged();
}

/** Picking a hotel from the list clears any hand-typed one, and vice versa. */
function trHotelPicked(side) {
  const cap = side === "from" ? "From" : "To";
  const select = document.getElementById(`tr${cap}Hotel`);
  const textEl = document.getElementById(`tr${cap}HotelText`);
  if (select?.value && textEl) textEl.value = "";
  trRouteChanged();
}

/** The hotel named on one side, whether picked from the list or typed. */
function trHotelFor(side) {
  const cap = side === "from" ? "From" : "To";
  if (document.getElementById(`tr${cap}Type`)?.value !== "DESTINATION") return null;
  const select = document.getElementById(`tr${cap}Hotel`);
  const typed = (document.getElementById(`tr${cap}HotelText`)?.value || "").trim();
  if (typed) return typed;
  return select?.value ? (select.selectedOptions[0]?.dataset.name || null) : null;
}

/* Whether the operator has picked the pickup point themselves. Until they do,
   switching trip type is free to choose the sensible default for that type. */
let trPickupChosen = false;

function trEpType(side, type, fromUser = true) {
  const cap = side === "from" ? "From" : "To";
  const hidden = document.getElementById(`tr${cap}Type`);
  if (hidden) hidden.value = type;
  // A pickup the operator picked themselves is never overwritten by a default.
  if (fromUser && side === "from") trPickupChosen = true;
  document.querySelectorAll(`.tf-ep-types[data-side="${side}"] .tf-ep-type`).forEach(b => b.classList.toggle("on", b.dataset.type === type));
  const map = { AIRPORT: [`tr${cap}Airport`], DESTINATION: [`tr${cap}Dest`] };
  ["AIRPORT", "DESTINATION"].forEach(k => map[k].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = k === type ? "" : "none"; }));
  // The hotel question only makes sense once a destination is chosen.
  trFillHotelsFor(side);
  if (side === "from") trSyncFlightFields();
  trSyncDropoffFields();
  trRouteChanged();
}

/**
 * The drop-off half of the "when" question.
 *
 * A city-to-city transfer is sold on two times — collected at one end, due at
 * the other — while an airport run is timed by the flight and a car at disposal
 * has no far end at all. So the pair is shown exactly when both endpoints are
 * destinations, and cleared otherwise so a leftover value is never submitted.
 */
function trSyncDropoffFields() {
  const box = document.getElementById("trDropoffFields");
  if (!box) return;
  const bothDestinations = document.getElementById("trFromType")?.value === "DESTINATION"
    && document.getElementById("trToType")?.value === "DESTINATION"
    && !trIsDisposal();
  box.style.display = bothDestinations ? "" : "none";
  if (!bothDestinations) {
    const date = document.getElementById("trDropoffDate");
    const time = document.getElementById("trDropoffTime");
    if (date) date.value = "";
    if (time) time.value = "";
    return;
  }
  // Most transfers land the same day they start, so the drop-off date follows
  // the pickup date until the operator says otherwise.
  const pickupDate = document.getElementById("trDate")?.value;
  const dropoffDate = document.getElementById("trDropoffDate");
  if (pickupDate && dropoffDate && !dropoffDate.value) dropoffDate.value = pickupDate;
}

/**
 * Airline and flight number belong to a driver meeting a plane. Show them only
 * when the pickup is an airport, and title the section for what it collects.
 */
function trSyncFlightFields() {
  const isAirport = document.getElementById("trFromType")?.value === "AIRPORT";
  const fields = document.getElementById("trFlightFields");
  if (fields) fields.style.display = isAirport ? "" : "none";
  const title = document.getElementById("trFlightTitle");
  if (title) title.textContent = isAirport
    ? t("transport.flightDetails", "Flight / Arrival Details")
    : t("transport.pickupWhen", "Pickup Date & Time");
  const ic = document.getElementById("trFlightIcon");
  if (ic) { ic.innerHTML = icon(isAirport ? "plane-landing" : "clock"); refreshIcons(ic); }
  if (!isAirport) {
    // Never submit a flight left over from an earlier airport pickup.
    const airline = document.getElementById("trAirline");
    const flightNo = document.getElementById("trFlightNo");
    if (airline) airline.value = "";
    if (flightNo) flightNo.value = "";
  }
}

// Read the typed endpoint for one side → { type, id, name }.
function trReadEndpoint(side) {
  const cap = side === "from" ? "From" : "To";
  const type = document.getElementById(`tr${cap}Type`)?.value || "";
  let id = null, name = null;
  if (type === "AIRPORT") { const s = document.getElementById(`tr${cap}Airport`); id = s?.value || null; name = s?.selectedOptions[0]?.dataset.name || null; }
  else if (type === "DESTINATION") { const s = document.getElementById(`tr${cap}Dest`); id = s?.value || null; name = s?.selectedOptions[0]?.dataset.name || null; }
  // The hotel is carried separately as the pickup / drop-off detail — it
  // narrows the address inside the destination, it does not replace it, so the
  // rate still matches on the destination the operator actually priced.
  return { type, id, name };
}

// Transport keeps its live-pricing engine; the active transport_booking template
// can only ADD extra fields (anything outside the base booking columns). They
// render below Notes and are saved to the booking's customFields JSON.
const TR_BASE_KEYS = ["passengerName","contactNumber","flightNumber","airlineName","notes",
  "vehicleType","fromLocation","toLocation","pickupDateTime","passengerCount","isRoundTrip",
  "returnFlightNumber","returnAirlineName","fromType","toType"];

async function trLoadCustomFields() {
  const box = document.getElementById("trCustomFields");
  if (!box) return;
  const tpl = await rfLoadTemplate("transport_booking");
  const fields = tpl ? rfFields(tpl).filter(f => !TR_BASE_KEYS.includes(f.key)) : [];
  window._trCustomFields = fields;
  if (!fields.length) { box.style.display = "none"; box.innerHTML = ""; return; }
  box.style.display = "";
  box.innerHTML = `<div class="form-grid" style="margin-top:4px">${fields.map(trCustomCell).join("")}</div>`;
  refreshIcons(box);
}

function trCustomCell(f) {
  const id = "tcf_" + f.key;
  const ph = rfPlace(f); const phAttr = ph ? ` placeholder="${escapeHtml(ph)}"` : "";
  const full = f.width === "full" || f.type === "textarea";
  let ctrl;
  switch (f.type) {
    case "textarea": ctrl = `<textarea id="${id}" rows="2"${phAttr}></textarea>`; break;
    case "select": case "searchable-select": case "meal-plan-select": {
      const opts = (Array.isArray(f.options) && f.options.length) ? f.options
        : (f.type === "meal-plan-select" ? RF_MEAL_PLANS.map(mp => ({ value: mp, label: t("mealPlan." + mp, mp.replace(/_/g, " ")) })) : []);
      ctrl = `<select id="${id}"><option value="">${escapeHtml(ph || t("form.select", "Select"))}</option>${opts.map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(rfOptLabel(o))}</option>`).join("")}</select>`; break;
    }
    case "number": case "pax-counter": case "room-counter": ctrl = `<input id="${id}" type="number"${phAttr}>`; break;
    case "date": ctrl = `<input id="${id}" type="date">`; break;
    case "time": ctrl = `<input id="${id}" type="time">`; break;
    case "datetime": ctrl = `<input id="${id}" type="datetime-local">`; break;
    case "checkbox": case "toggle": ctrl = `<label class="check-row"><input type="checkbox" id="${id}"> ${escapeHtml(rfLabel(f))}</label>`; break;
    default: ctrl = `<input id="${id}" type="text"${phAttr}>`;
  }
  if (f.type === "checkbox" || f.type === "toggle") return `<div class="form-field${full ? " full" : ""}">${ctrl}</div>`;
  const req = f.required ? ` <span class="required">*</span>` : "";
  return `<div class="form-field${full ? " full" : ""}"><label>${escapeHtml(rfLabel(f))}${req}</label>${ctrl}</div>`;
}

function trCollectCustom() {
  const fields = window._trCustomFields || [];
  const out = {};
  fields.forEach(f => {
    const el = document.getElementById("tcf_" + f.key);
    if (!el) return;
    let v;
    if (f.type === "checkbox" || f.type === "toggle") v = el.checked || undefined;
    else if (["number","pax-counter","room-counter"].includes(f.type)) v = el.value === "" ? undefined : parseInt(el.value);
    else v = String(el.value || "").trim() || undefined;
    if (v !== undefined) out[f.key] = v;
  });
  return Object.keys(out).length ? out : undefined;
}

function setTripType(type) {
  document.getElementById("trTripType").value = type;
  document.getElementById("trOneWayBtn").classList.toggle("active", type === "ONE_WAY");
  document.getElementById("trRoundBtn").classList.toggle("active", type === "ROUND_TRIP");
  document.getElementById("trDisposalBtn")?.classList.toggle("active", type === "AT_DISPOSAL");

  const isDisposal = type === "AT_DISPOSAL";
  const returnSec = document.getElementById("trReturnSection");
  // A return leg is meaningless when the car is already yours for the period.
  if (returnSec) returnSec.style.display = type === "ROUND_TRIP" ? "" : "none";

  const dispSec = document.getElementById("trDisposalSection");
  if (dispSec) dispSec.style.display = isDisposal ? "" : "none";

  // At disposal there is no destination to enter — only a pickup point, so the
  // route section stays but sheds its "To" half and is relabelled accordingly.
  const toField = document.getElementById("trToField");
  if (toField) toField.style.display = isDisposal ? "none" : "";
  const routeTitle = document.getElementById("trRouteTitle");
  if (routeTitle) routeTitle.textContent = isDisposal
    ? t("transport.disposalPickup", "Where should the driver pick you up?")
    : t("transport.route", "Route");
  const fromLabel = document.getElementById("trFromLabel");
  if (fromLabel) fromLabel.textContent = isDisposal
    ? t("transport.disposalPickup", "Where should the driver pick you up?")
    : t("form.from", "From");
  const fromHint = document.getElementById("trFromHint");
  if (fromHint) fromHint.style.display = isDisposal ? "" : "none";

  // A car at disposal is picked up where the client already is, not at an
  // airport — the destination, with the hotel asked for underneath it.
  if (isDisposal && !trPickupChosen && document.getElementById("trFromType")?.value === "AIRPORT") {
    trEpType("from", "DESTINATION", false);
  }
  // At disposal the client already says where they want the car, further down.
  // Showing the same destination question again up here — answered for them —
  // is the duplication that made this screen read as two conflicting choices,
  // so the pickup narrows to WHICH hotel inside it.
  const fromTypes = document.querySelector('.tf-ep-types[data-side="from"]');
  if (fromTypes) fromTypes.style.display = isDisposal ? "none" : "";
  // A car at disposal has no far end to be due at.
  trSyncDropoffFields();
  const fromDest = document.getElementById("trFromDest");
  if (fromDest && isDisposal) fromDest.style.display = "none";
  else if (fromDest && document.getElementById("trFromType")?.value === "DESTINATION") fromDest.style.display = "";
  const fromLabelEl = document.getElementById("trFromLabel");
  if (fromLabelEl && isDisposal) fromLabelEl.textContent = t("transport.disposalPickupHotel", "Which hotel should the driver collect you from?");
  trSyncFlightFields();

  if (isDisposal) trLoadDisposalCatalogue();
  else {
    // Leaving disposal drops the package so a later quote cannot reuse it.
    const rid = document.getElementById("trDisposalRateId");
    if (rid) rid.value = "";
  }
  trTypeChanged();
}

/** True when the customer is booking a car for a block of time, not a route. */
function trIsDisposal() {
  return document.getElementById("trTripType")?.value === "AT_DISPOSAL";
}

/**
 * Load the at-disposal catalogue for the chosen vehicle / pax and fill the area
 * dropdown. Packages are held in state so switching area re-renders without a
 * second request.
 */
async function trLoadDisposalCatalogue() {
  const areaSel = document.getElementById("trDisposalArea");
  const pkgBox = document.getElementById("trDisposalPackages");
  if (!areaSel || !pkgBox) return;

  const vehicle = document.getElementById("trVehicle")?.value || "";
  const pax = parseInt(document.getElementById("trPax")?.value || "1");
  // Every destination that actually has a car is listed, because this dropdown
  // IS how the client picks where they want it. Narrowing it by the pickup
  // would leave them unable to change their mind — the pickup follows this
  // choice, not the other way round.
  const params = new URLSearchParams({ pax: String(pax) });
  if (vehicle) params.set("vehicleType", vehicle);

  pkgBox.innerHTML = `<div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px"></div>`;
  const res = await apiFetch(`/transport-rates/disposal?${params}`);
  const areas = res?.data?.areas || [];
  state.transportDisposal = areas;

  const previous = areaSel.value;
  // Each option carries the destination behind it, so the quote and the booking
  // can name it and the server only ever offers cars parked in that place.
  areaSel.innerHTML = `<option value="">${t("transport.selectArea", "Choose an area...")}</option>` +
    areas.map(a => {
      const label = state.lang === "ar" && a.areaAr ? a.areaAr : a.area;
      return `<option value="${escapeHtml(a.area)}" data-destination-id="${escapeHtml(a.destinationId || "")}">${escapeHtml(label)}</option>`;
    }).join("");
  if (previous && areas.some(a => a.area === previous)) areaSel.value = previous;
  else if (areas.length === 1) areaSel.value = areas[0].area;
  trSyncDisposalDestination();

  if (!areas.length) {
    pkgBox.innerHTML = `<div class="tr-disposal-empty">${t("transport.noAreas", "No at-disposal service is configured yet.")}</div>`;
    return;
  }

  // A package the new vehicle / pax no longer offers must not stay selected.
  const ridEl = document.getElementById("trDisposalRateId");
  if (ridEl?.value) {
    const stillThere = areas.some(a => a.packages.some(p => p.rateId === ridEl.value));
    if (!stillThere) ridEl.value = "";
  }
  trRenderDisposalPackages();
}

/** The destination behind the currently chosen at-disposal area. */
function trDisposalDestinationId() {
  const sel = document.getElementById("trDisposalArea");
  return sel?.selectedOptions?.[0]?.dataset.destinationId || "";
}

/**
 * Point the pickup at the destination the car was booked in. The client is
 * already telling us where they want the car; asking them the same question
 * again under "where should the driver pick you up?" is what made this screen
 * confusing — that field is now only for WHICH hotel inside it.
 */
function trSyncDisposalDestination() {
  if (!trIsDisposal()) return;
  const destId = trDisposalDestinationId();
  if (!destId) return;
  const fromType = document.getElementById("trFromType");
  const fromDest = document.getElementById("trFromDest");
  if (!fromDest || !fromDest.querySelector(`option[value="${destId}"]`)) return;
  if (fromType?.value !== "DESTINATION") trEpType("from", "DESTINATION", false);
  if (fromDest.value !== destId) {
    fromDest.value = destId;
    const hotelSel = document.getElementById("trFromHotel");
    const hotelTxt = document.getElementById("trFromHotelText");
    if (hotelSel) hotelSel.value = "";
    if (hotelTxt) hotelTxt.value = "";
  }
  trFillHotelsFor("from");
}

/** Area changed → show that area's packages and drop any stale selection. */
function trAreaChanged() {
  const rid = document.getElementById("trDisposalRateId");
  if (rid) rid.value = "";
  trSyncDisposalDestination();
  trRenderDisposalPackages();
  trUpdateQuote();
}

/**
 * "8 hours" / "12 hours" — and in Arabic the noun changes with the number:
 * 1 ساعة, 2 ساعتان, 3-10 ساعات, 11+ back to the singular ساعة. Writing
 * "12 ساعات" reads as broken Arabic to every one of these agents.
 */
function trHoursLabel(hours) {
  const n = Number(hours);
  if (!Number.isFinite(n) || n <= 0) return "";
  if (state.lang !== "ar") return `${n} ${t("transport.hoursUnit", "hours")}`;
  if (n === 1) return "ساعة";
  if (n === 2) return "ساعتان";
  return n <= 10 ? `${formatNumber(n)} ساعات` : `${formatNumber(n)} ساعة`;
}

/** Render the duration packages for the selected area. */
function trRenderDisposalPackages() {
  const pkgBox = document.getElementById("trDisposalPackages");
  if (!pkgBox) return;
  const area = document.getElementById("trDisposalArea")?.value || "";
  const areas = state.transportDisposal || [];
  const entry = areas.find(a => a.area === area);
  const packages = entry?.packages || [];
  const selectedId = document.getElementById("trDisposalRateId")?.value || "";

  if (!area) {
    pkgBox.innerHTML = `<div class="tr-disposal-empty">${t("transport.selectArea", "Choose an area...")}</div>`;
    return;
  }
  if (!packages.length) {
    pkgBox.innerHTML = `<div class="tr-disposal-empty">${t("transport.noPackages", "No package is available in this area.")}</div>`;
    return;
  }

  pkgBox.innerHTML = packages.map(p => {
    // A full-day package is named by the day, an hourly one by its hours.
    const dur = p.serviceMode === "DAY_USE"
      ? t("transport.fullDay", "Full day")
      : trHoursLabel(p.durationHours);
    const name = state.lang === "ar" ? (p.serviceNameAr || p.serviceNameEn || "") : (p.serviceNameEn || "");
    const price = p.price != null
      ? `<div class="tr-pkg-price">${formatStoredMoney(p.price, p.currency)} <span class="tr-pkg-unit">${t("transport.perVehicle", "per vehicle")}</span></div>`
      : `<div class="tr-pkg-price on-request">${t("hotel.priceOnRequest", "Price on request")}</div>`;
    return `
      <button type="button" class="tr-pkg ${p.rateId === selectedId ? "active" : ""}" data-rate-id="${p.rateId}" onclick="trPickPackage('${p.rateId}')">
        <span class="tr-pkg-dur">${escapeHtml(dur)}</span>
        ${name ? `<span class="tr-pkg-name">${escapeHtml(name)}</span>` : ""}
        ${price}
      </button>`;
  }).join("");
}

/** Choose one duration package and re-price. */
function trPickPackage(rateId) {
  const rid = document.getElementById("trDisposalRateId");
  if (rid) rid.value = rateId;
  document.querySelectorAll("#trDisposalPackages .tr-pkg").forEach(el => {
    el.classList.toggle("active", el.dataset.rateId === rateId);
  });
  trUpdateQuote();
}

/** Endpoint visibility is handled by trEpType; this only re-quotes. */
function trTypeChanged() {
  trUpdateQuote();
}

/** Round-trip "same route reversed" toggle: reveal the independent return route fields when OFF. */
function trSameRouteToggle() {
  const same = document.getElementById("trSameRouteReversed")?.checked;
  const box = document.getElementById("trReturnRouteFields");
  if (box) box.style.display = same ? "none" : "";
  trUpdateQuote();
}

/** Show/hide the return hotel-name inputs based on the independent return From/To type. */
function trReturnTypeChanged() {
  const rf = document.querySelector('input[name="returnFromType"]:checked')?.value;
  const rt = document.querySelector('input[name="returnToType"]:checked')?.value;
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? "" : "none"; };
  show("trReturnPickupHotel", rf === "HOTEL");
  show("trReturnDropoffHotel", rt === "HOTEL");
  trUpdateQuote();
}

let _trQuoteTimer;
function trUpdateQuote() {
  clearTimeout(_trQuoteTimer);
  _trQuoteTimer = setTimeout(_doTransportQuote, 420);
}

/** Vehicle / pax changed: those decide which disposal packages exist at all. */
function trDisposalInputsChanged() {
  if (trIsDisposal()) trLoadDisposalCatalogue();
  trUpdateQuote();
}

function trGetFrom() { return (trReadEndpoint("from").name || "").trim(); }
function trGetTo() { return (trReadEndpoint("to").name || "").trim(); }

// Build the full vehicle catalogue options (fallback when no route-specific rates exist).
function trAllVehicleOptions() {
  return `<option value="">${t("transport.selectVehicle","Select vehicle...")}</option>` +
    VEHICLE_OPTIONS.map(v => `<option value="${v.value}">${v.label} — ${v.hint}</option>`).join("");
}

// Data-driven tiers: rebuild the vehicle/tier dropdown from the TransportRate
// rows actually defined for the selected route, so the customer only sees tiers
// an admin has priced for that destination. Falls back to the full catalogue
// when the route has no fixed rates (so a quote request is still possible).
async function trLoadRouteOptions() {
  const sel = document.getElementById("trVehicle");
  if (!sel) return;
  // Rebuilding the list must never silently discard the vehicle the customer
  // already picked — losing it blocks the quote with nothing on screen to
  // explain why.
  const prev = sel.value;
  const restore = () => { if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev; };

  const from = trGetFrom(), to = trGetTo();
  // At disposal there is no route to look tiers up by: the area's packages are
  // what narrow the choice, so the full vehicle catalogue stays on offer.
  if (trIsDisposal() || !from || !to) { sel.innerHTML = trAllVehicleOptions(); restore(); return; }

  const res = await apiFetch(`/transport-rates?${new URLSearchParams({ from, to })}`);
  const available = [...new Set((res?.data || []).map(r => r.vehicleType).filter(Boolean))];

  if (!available.length) {
    sel.innerHTML = trAllVehicleOptions();
  } else {
    const opts = VEHICLE_OPTIONS.filter(v => available.includes(v.value));
    available.forEach(vt => { if (!opts.some(o => o.value === vt)) opts.push({ value: vt, label: vt.replace(/_/g, " "), hint: "" }); });
    sel.innerHTML = `<option value="">${t("transport.selectVehicle","Select vehicle...")}</option>` +
      opts.map(v => `<option value="${v.value}">${escapeHtml(v.label)}${v.hint ? " — " + v.hint : ""}</option>`).join("");
  }
  restore();
}

// Route changed → refresh available tiers, then re-quote.
async function trRouteChanged() {
  state.transportQuote = null;
  state.transportGroupTypes = [];
  const field = document.getElementById("trGroupTypeField");
  const box = document.getElementById("trGroupTypes");
  if (field) field.style.display = "none";
  if (box) box.innerHTML = "";
  await trLoadRouteOptions();
  trUpdateQuote();
}

function transportGroupTypeOptions(options, selectedId) {
  return (options || []).map((option, index) => {
    const checked = selectedId ? option.id === selectedId : index === 0;
    const adjustment = Number(option.adjustmentValue || 0);
    const suffix = option.adjustmentType === "PERCENTAGE" && adjustment
      ? `+${formatNumber(adjustment)}%`
      : option.adjustmentType === "FIXED" && adjustment
        ? `+${formatNumber(adjustment)} ${t("pricing.fixed","fixed")}`
        : "";
    const label = state.lang === "ar" ? (option.labelAr || option.labelEn) : option.labelEn;
    const description = state.lang === "ar"
      ? (option.descriptionAr || option.descriptionEn || "")
      : (option.descriptionEn || "");
    return `<label class="service-type-option">
      <input type="radio" name="trGroupType" value="${escapeHtml(option.id || "")}" ${checked ? "checked" : ""}
        onchange="trUpdateQuote()">
      <span class="service-type-option__body">
        <span class="service-type-option__title">${escapeHtml(label)}</span>
        ${description ? `<span class="service-type-option__desc">${escapeHtml(description)}</span>` : ""}
      </span>
      ${suffix ? `<span class="service-type-option__price">${suffix}</span>` : ""}
    </label>`;
  }).join("");
}

async function trLoadGroupTypes(rateId, selectedId) {
  const field = document.getElementById("trGroupTypeField");
  const box = document.getElementById("trGroupTypes");
  if (!field || !box || !rateId) return;
  const pax = Math.max(1, parseInt(document.getElementById("trPax")?.value || "1"));
  const date = document.getElementById("trDate")?.value;
  const params = new URLSearchParams({
    scope: "TRANSPORT",
    transportRateId: rateId,
    pax: String(pax),
  });
  if (date) params.set("date", date);
  const res = await apiFetch(`/group-types?${params}`);
  state.transportGroupTypes = res?.data || [];
  if (!state.transportGroupTypes.length) {
    field.style.display = "none";
    box.innerHTML = "";
    return;
  }
  field.style.display = "";
  box.innerHTML = transportGroupTypeOptions(state.transportGroupTypes, selectedId);
}

async function _doTransportQuote() {
  const from       = trGetFrom();
  const to         = trGetTo();
  const vehicle    = document.getElementById("trVehicle")?.value || "";
  const pax        = parseInt(document.getElementById("trPax")?.value || "1");
  const isRoundTrip = document.getElementById("trTripType")?.value === "ROUND_TRIP";
  const isDisposal = trIsDisposal();
  const disposalArea = document.getElementById("trDisposalArea")?.value || "";
  const disposalRateId = document.getElementById("trDisposalRateId")?.value || "";
  const summaryEl  = document.getElementById("trPriceSummary");
  const bodyEl     = document.getElementById("trPriceBody");
  const actionsEl  = document.getElementById("trBookingActions");

  // At disposal there is no "to" to wait for — the area and the chosen block of
  // time are what make the request priceable.
  if (!vehicle || !summaryEl) return;
  if (isDisposal ? (!disposalArea || !disposalRateId) : (!from || !to)) return;

  summaryEl.style.display = "";
  if (bodyEl) bodyEl.innerHTML = `<div class="skeleton" style="height:14px;width:60%"></div><div class="skeleton" style="height:28px;width:40%;margin-top:10px"></div>`;
  if (actionsEl) actionsEl.innerHTML = "";

  const fromEp = trReadEndpoint("from");
  const toEp = trReadEndpoint("to");
  const selectedGroupTypeId = document.querySelector('input[name="trGroupType"]:checked')?.value || "";
  const date = document.getElementById("trDate")?.value || "";
  const params = new URLSearchParams({ vehicleType: vehicle, pax: String(pax), roundTrip: String(isRoundTrip) });
  if (isDisposal) {
    // The package IS the product — the endpoints play no part in resolving it.
    params.set("rateId", disposalRateId);
    params.set("serviceArea", disposalArea);
    const disposalDestId = trDisposalDestinationId();
    if (disposalDestId) params.set("destinationId", disposalDestId);
  } else {
    if (fromEp.type) params.set("fromType", fromEp.type);
    if (fromEp.id) params.set("fromId", fromEp.id);
    if (fromEp.name) params.set("fromName", fromEp.name);
    if (toEp.type) params.set("toType", toEp.type);
    if (toEp.id) params.set("toId", toEp.id);
    if (toEp.name) params.set("toName", toEp.name);
  }
  if (selectedGroupTypeId) params.set("groupTypeId", selectedGroupTypeId);
  if (date) params.set("date", date);
  const res = await apiFetch(`/transport-rates/quote?${params}`);
  state.transportQuote = res?.data || null;

  if (!res?.data) {
    if (bodyEl) bodyEl.innerHTML = `<p style="color:var(--danger);margin:0">${t("toast.validationError","Failed to fetch price")}</p>`;
    return;
  }

  const q = res.data;
  await trLoadGroupTypes(q.rateId, q.groupType?.id || selectedGroupTypeId);
  if (!q.found) {
    if (bodyEl) bodyEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;color:var(--text-muted)">
        ${icon("info")}
        <span>${t("hotel.priceOnRequest","Price on request")} — ${t("transport.noRateNote","No fixed rate for this route. Send a quote request and we will get back to you.")}</span>
      </div>`;
    if (actionsEl) actionsEl.innerHTML = `
      <button class="btn btn-outline" onclick="trSendQuoteRequest()">${icon("send")}&nbsp;${t("btn.requestQuote","Request Quote")}</button>`;
  } else {
    if (bodyEl) bodyEl.innerHTML = `
      ${q.isDisposal
        ? `<div class="tr-price-row"><span>${t("transport.disposalSummary","Car at disposal")}</span><span class="tr-price-route">${escapeHtml([q.serviceArea || disposalArea, q.durationHours ? trHoursLabel(q.durationHours) : (q.serviceMode === "DAY_USE" ? t("transport.fullDay","Full day") : "")].filter(Boolean).join(" · "))}</span></div>
           <div class="tr-price-row"><span>${t("transport.disposalPickup","Pickup")}</span><span class="tr-price-route">${escapeHtml(from || "—")}</span></div>`
        : `<div class="tr-price-row"><span>${t("form.from","From")} → ${t("form.to","To")}</span><span class="tr-price-route">${escapeHtml(from)} → ${escapeHtml(to)}</span></div>`}
      <div class="tr-price-row"><span>${t("form.vehicleType","Vehicle")}</span><span>${escapeHtml(vehicle.replace(/_/g," "))}</span></div>
      <div class="tr-price-row"><span>${t("transport.serviceType","Service Type")}</span><span>${escapeHtml(state.lang === "ar" ? (q.groupType?.labelAr || q.groupType?.labelEn || "—") : (q.groupType?.labelEn || "—"))}</span></div>
      <div class="tr-price-row"><span>${t("form.passengers","Passengers")}</span><span>${pax}</span></div>
      <div class="tr-price-row"><span>${t("transport.tripType","Trip Type")}</span><span>${q.isDisposal ? t("transport.atDisposal","At Disposal") : isRoundTrip ? t("form.roundTrip","Round Trip") : t("transport.oneWay","One Way")}</span></div>
      <div class="tr-price-total">
        <span>${t("th.total","Total")}</span>
        <span class="tr-price-amount" id="trLivePrice">${formatStoredMoney(q.totalAmount, q.currency)}</span>
      </div>`;
    // Trigger price highlight animation
    requestAnimationFrame(() => {
      const el = document.getElementById("trLivePrice");
      if (el) { el.classList.remove("price-pulse"); void el.offsetWidth; el.classList.add("price-pulse"); }
    });
    if (actionsEl) actionsEl.innerHTML = `
      <button class="btn btn-success" style="flex:1" onclick="trConfirmBooking()">${icon("calendar-check")}&nbsp;${t("transport.bookConfirmed","Confirm Booking")}</button>
      <button class="btn btn-outline" onclick="trSendQuoteRequest()">${icon("send")}&nbsp;${t("btn.requestQuote","Quote via WhatsApp")}</button>`;
  }

  refreshIcons(summaryEl);
}

async function trConfirmBooking() {
  const from        = trGetFrom();
  const to          = trGetTo();
  const date        = document.getElementById("trDate")?.value;
  const time        = document.getElementById("trTime")?.value || "10:00";
  const paxName     = document.getElementById("trPaxName")?.value.trim();
  const contact     = document.getElementById("trContact")?.value.trim();
  const pax         = parseInt(document.getElementById("trPax")?.value || "1");
  const vehicle     = document.getElementById("trVehicle")?.value;
  const isRoundTrip = document.getElementById("trTripType")?.value === "ROUND_TRIP";
  const notes       = document.getElementById("trNotes")?.value.trim();
  const airline     = document.getElementById("trAirline")?.value.trim();
  const flightNo    = document.getElementById("trFlightNo")?.value.trim();
  const retDate     = document.getElementById("trReturnDate")?.value;
  const retTime     = document.getElementById("trReturnTime")?.value;
  const retAirline  = document.getElementById("trReturnAirline")?.value.trim();
  const retFlight   = document.getElementById("trReturnFlight")?.value.trim();
  const fromEp      = trReadEndpoint("from");
  const toEp        = trReadEndpoint("to");
  const fromType    = fromEp.type || "AIRPORT";
  const toType      = toEp.type || "DESTINATION";
  const groupTypeId = document.querySelector('input[name="trGroupType"]:checked')?.value || undefined;
  const pickupHotel  = trHotelFor("from") || "";
  const dropoffHotel = trHotelFor("to") || "";
  const sameRouteReversed = document.getElementById("trSameRouteReversed")?.checked !== false;
  const retFromType  = document.querySelector('input[name="returnFromType"]:checked')?.value;
  const retToType    = document.querySelector('input[name="returnToType"]:checked')?.value;
  const retFrom      = document.getElementById("trReturnFrom")?.value.trim();
  const retTo        = document.getElementById("trReturnTo")?.value.trim();
  const retPickupHotel  = document.getElementById("trReturnPickupHotel")?.value.trim();
  const retDropoffHotel = document.getElementById("trReturnDropoffHotel")?.value.trim();
  const isDisposal   = trIsDisposal();
  const serviceMode  = state.transportQuote?.serviceMode;
  const disposalArea = document.getElementById("trDisposalArea")?.value || "";
  const disposalRateId = document.getElementById("trDisposalRateId")?.value || "";
  const isAddr = (ty) => ty === "ADDRESS" || ty === "LANDMARK";

  // At disposal the area and the block of time stand in for the destination.
  if (isDisposal) {
    if (!disposalArea) { toast(t("transport.disposalAreaRequired","Choose the area where you want the car"), "error"); return; }
    if (!disposalRateId) { toast(t("transport.disposalPackageRequired","Choose how long you want the car for"), "error"); return; }
  }
  if (!from || !date || !paxName || !contact || !vehicle || (!isDisposal && !to) || (isRoundTrip && !retDate)) {
    toast(t("transport.requiredFields","Please fill all required fields: route, date, lead name, contact, vehicle"), "error");
    return;
  }
  // Hourly / day-use: a REAL pickup (the chosen hotel / destination) is required.
  if (isDisposal && !from) {
    toast(t("transport.pickupRequiredDisposal","Choose where the driver should pick you up"), "error");
    return;
  }
  // Round trip: return must be after outbound; a different return route needs its endpoints.
  const pickupDateTime = `${date}T${time}:00`;
  const returnDateTime = (isRoundTrip && retDate) ? `${retDate}T${(retTime||"10:00")}:00` : undefined;
  if (isRoundTrip && returnDateTime && returnDateTime <= pickupDateTime) {
    toast(t("transport.returnAfterOutbound","Return date/time must be later than the outbound pickup"), "error"); return;
  }
  // Only a destination-to-destination run collects a drop-off time; the fields
  // are cleared whenever they are hidden, so an empty box means "not asked".
  const dropoffDate = document.getElementById("trDropoffDate")?.value;
  const dropoffTime = document.getElementById("trDropoffTime")?.value;
  const dropoffDateTime = dropoffDate ? `${dropoffDate}T${(dropoffTime || time || "10:00")}:00` : undefined;
  if (dropoffDateTime && dropoffDateTime < pickupDateTime) {
    toast(t("transport.dropoffAfterPickup","Drop-off must not be earlier than the pickup"), "error"); return;
  }
  if (isRoundTrip && !sameRouteReversed) {
    const rFromOk = retFromType === "HOTEL" ? !!retPickupHotel : !!retFrom;
    const rToOk   = retToType === "HOTEL" ? !!retDropoffHotel : !!retTo;
    if (!rFromOk || !rToOk) { toast(t("transport.returnEndpointsRequired","Enter the return pickup and drop-off for the different return route"), "error"); return; }
  }

  const payload = {
    rateId: (isDisposal ? disposalRateId : state.transportQuote?.rateId) || undefined,
    serviceMode,
    serviceArea: isDisposal ? disposalArea : undefined,
    // Names the place the car belongs to, so the server can refuse a rate
    // parked somewhere else even if the free-text area happens to look alike.
    destinationId: isDisposal ? (trDisposalDestinationId() || undefined) : undefined,
    type: state.transportQuote?.rateType || (fromType === "AIRPORT" ? "AIRPORT_TRANSFER" : "PRIVATE_TRANSFER"),
    vehicleType: vehicle,
    // At disposal there is no destination. Leaving "to" empty lets the server
    // label the booking with the package itself ("Cairo at disposal 8 hours")
    // instead of echoing the pickup back as a fake drop-off.
    fromLocation: from, toLocation: isDisposal ? undefined : to,
    fromType, fromId: fromEp.id || undefined, fromName: from,
    toType: isDisposal ? undefined : toType, toId: isDisposal ? undefined : (toEp.id || undefined), toName: isDisposal ? undefined : to,
    pickupType: fromType, dropoffType: isDisposal ? undefined : toType,
    pickupLocation: from || undefined,
    pickupHotelName: pickupHotel || undefined,
    dropoffLocation: isDisposal ? undefined : (to || undefined),
    dropoffHotelName: isDisposal ? undefined : (dropoffHotel || undefined),
    pickupDateTime,
    dropoffDateTime,
    returnDateTime,
    // A disposal block already includes coming back — sending the round-trip
    // flag here would ask the server to bill the same car twice.
    isRoundTrip: isDisposal ? false : isRoundTrip,
    sameRouteReversed,
    returnFromType: (isRoundTrip && !sameRouteReversed) ? retFromType : undefined,
    returnToType:   (isRoundTrip && !sameRouteReversed) ? retToType : undefined,
    returnFromLocation: (isRoundTrip && !sameRouteReversed) ? (retFrom || undefined) : undefined,
    returnToLocation:   (isRoundTrip && !sameRouteReversed) ? (retTo || undefined) : undefined,
    returnPickupHotelName: (isRoundTrip && !sameRouteReversed) ? (retPickupHotel || undefined) : undefined,
    returnDropoffHotelName:(isRoundTrip && !sameRouteReversed) ? (retDropoffHotel || undefined) : undefined,
    returnPickupAddress:  (isRoundTrip && !sameRouteReversed && isAddr(retFromType)) ? (retFrom || undefined) : undefined,
    returnDropoffAddress: (isRoundTrip && !sameRouteReversed && isAddr(retToType)) ? (retTo || undefined) : undefined,
    passengerCount: pax,
    groupTypeId,
    passengerName: paxName,
    contactNumber: contact,
    airlineName: airline || undefined,
    flightNumber: flightNo || undefined,
    returnAirlineName: retAirline || undefined,
    returnFlightNumber: retFlight || undefined,
    notes: notes || undefined,
    customFields: trCollectCustom(),
  };

  const btn = document.querySelector("#trBookingActions .btn-success");
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-spinner"></span>&nbsp;${t("btn.saving","Saving...")}`; }

  const res = await apiFetch("/transport-bookings", { method: "POST", body: JSON.stringify(payload) });

  if (res?.success) {
    const ref = res.data.refNumber;
    const amount = formatStoredMoney(res.data.totalAmount, res.data.currency);
    const voucherId = res.data.voucher?.id;
    openModal(`✅ ${t("toast.created","Booking Created")}`, `
      <div style="text-align:center;padding:10px 0">
        <div style="font-size:48px;margin-bottom:12px">🚐</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:8px">${t("transport.bookingConfirmed","Booking Submitted")}</div>
        <div style="color:var(--text-secondary);margin-bottom:16px">${t("booking.pendingNote","Your booking is pending admin confirmation.")}</div>
        <div style="background:var(--surface-muted);border-radius:var(--r-8);padding:12px;display:inline-block">
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">${t("th.ref","Reference")}</div>
          <div style="font-size:20px;font-weight:900;color:var(--brand-navy-2)">${escapeHtml(ref)}</div>
          <div style="font-size:13px;color:var(--success);font-weight:700;margin-top:4px">${amount}</div>
        </div>
      </div>`, `
      <button class="btn btn-outline" onclick="closeModal()">${t("btn.close","Close")}</button>
      ${voucherId ? `<button class="btn btn-teal" onclick="downloadVoucherPdf('${voucherId}')">${icon("ticket")}&nbsp;${t("btn.downloadVoucher","Download Voucher")}</button>` : ""}
      <button class="btn btn-outline" onclick="closeModal();setPage('invoices')">${icon("receipt-text")}&nbsp;${t("nav.invoices","Invoices")}</button>
      <button class="btn btn-primary" onclick="closeModal();renderTransportHistory()">${icon("list")}&nbsp;${t("nav.bookings","My Bookings")}</button>`);
  } else {
    if (btn) { btn.disabled = false; btn.innerHTML = `${icon("calendar-check")}&nbsp;${t("transport.bookConfirmed","Confirm Booking")}`; }
  }
}

async function trSendQuoteRequest() {
  const from        = trGetFrom();
  const to          = trGetTo();
  const date        = document.getElementById("trDate")?.value;
  const time        = document.getElementById("trTime")?.value;
  const pax         = parseInt(document.getElementById("trPax")?.value || "1");
  const vehicle     = document.getElementById("trVehicle")?.value;
  const isRoundTrip = document.getElementById("trTripType")?.value === "ROUND_TRIP";
  const notes       = document.getElementById("trNotes")?.value.trim();
  const paxName     = document.getElementById("trPaxName")?.value.trim();
  const contact     = document.getElementById("trContact")?.value.trim();
  const airline     = document.getElementById("trAirline")?.value.trim();
  const flightNo    = document.getElementById("trFlightNo")?.value.trim();

  // An at-disposal request has no destination to quote — what the operator
  // needs to see is the area, the block of time and where to collect the client.
  const isDisposal   = trIsDisposal();
  const disposalArea = document.getElementById("trDisposalArea")?.value || "";
  const pkg = (state.transportDisposal || [])
    .find(a => a.area === disposalArea)?.packages
    .find(p => p.rateId === (document.getElementById("trDisposalRateId")?.value || ""));
  const disposalDuration = pkg
    ? (pkg.serviceMode === "DAY_USE" ? "Full day" : `${pkg.durationHours} hours`)
    : "";
  const disposalLabel = [disposalArea, disposalDuration].filter(Boolean).join(" · ");

  const serviceName = isDisposal
    ? `Transport: Car at disposal — ${disposalLabel || "area to confirm"}${vehicle ? " · " + vehicle.replace(/_/g," ") : ""}`
    : `Transport: ${from} → ${to}${isRoundTrip ? " (Round Trip)" : ""}${vehicle ? " · " + vehicle.replace(/_/g," ") : ""}`;
  const payload = {
    serviceType: "MULTI_SERVICE",
    serviceName,
    adultsCount: pax,
    checkIn: date || undefined,
    customerNotes: [
      notes,
      ...(isDisposal
        ? [`At disposal area: ${disposalArea || "—"}`, disposalDuration ? `Duration: ${disposalDuration}` : "", `Pickup: ${from || "—"}`]
        : [`From: ${from}`, `To: ${to}`, isRoundTrip ? "Round Trip" : ""]),
      paxName ? `Pax: ${paxName}` : "",
      contact ? `Contact: ${contact}` : "",
      airline ? `Airline: ${airline}` : "",
      flightNo ? `Flight: ${flightNo}` : "",
    ].filter(Boolean).join(" | ") || undefined,
    currency: "USD",
  };

  const waWindow = reserveWhatsAppWindow();
  const res = await apiFetch("/quote-requests", { method: "POST", body: JSON.stringify(payload) });
  if (res?.success) {
    const ref = res.data.refNumber;
    const waUrl = buildWhatsAppQuoteUrl({
      ref, serviceType: "TRANSPORT", serviceName,
      from: isDisposal ? (from || disposalArea) : from,
      to: isDisposal ? disposalLabel : to,
      checkIn: date, checkInTime: time, adults: pax,
      isRoundTrip: (!isDisposal && isRoundTrip) || undefined,
      notes: notes || undefined,
    });
    toast(`✅ ${t("toast.quoteSubmitted","Quote submitted")} — ${ref}`, "success");
    loadMyQuotesBadge();
    redirectToWhatsApp(waUrl, waWindow);
  } else {
    if (waWindow && !waWindow.closed) waWindow.close();
  }
}

/**
 * The destination cards both activity modes open on.
 *
 * Trips are organised by destination, so "which destination?" is the first
 * question — the same question the hotels page already opens with. Showing one
 * flat list of every excursion in Egypt and a filter dropdown asked the agent
 * to narrow something they had not chosen yet.
 *
 * `onPick` names the function a card calls, so the single-trip mode and the
 * package builder share this screen instead of each growing their own.
 */
async function renderActivityDestinations(onPick, subtitleKey, subtitleFallback) {
  state.page = "activities";
  const capturedToken = state.renderToken;

  content(pageHeader(`
    <button class="btn btn-outline" onclick="renderActivities()">${icon("arrow-left")}&nbsp;${t("btn.back","Back")}</button>
  `) + `
    <p style="color:var(--text-secondary);margin:0 0 20px">${t(subtitleKey, subtitleFallback)}</p>
    <div class="dest-grid">
      ${Array.from({length:6}, () => `<div class="dest-card" style="pointer-events:none"><div class="skeleton" style="height:44px;width:44px;border-radius:50%;margin:0 auto"></div><div class="skeleton" style="height:12px;width:70%;margin:10px auto 6px"></div><div class="skeleton" style="height:10px;width:40%;margin:0 auto"></div></div>`).join("")}
    </div>`);

  const [destRes, actRes] = await Promise.all([
    apiFetch("/destinations?isActive=true&limit=200"),
    apiFetch("/activities?limit=500"),
  ]);
  if (state.renderToken !== capturedToken) return;

  const dests = destRes?.data || [];
  const activities = actRes?.data || [];
  state.activityCatalogue = activities;

  // Counted from the trips themselves rather than one request per destination:
  // the whole catalogue is already loaded, and twenty extra round-trips to
  // count rows we are holding would only make the screen slower.
  const counts = new Map();
  let unfiled = 0;
  for (const a of activities) {
    if (a.destinationId) counts.set(a.destinationId, (counts.get(a.destinationId) || 0) + 1);
    else unfiled += 1;
  }

  const card = (id, name, nameAr, imageUrl, count) => `
    <button class="dest-card ${imageUrl ? "has-bg" : ""}" ${imageUrl ? `style="--dest-bg:url('${escapeHtml(cssUrl(imageUrl))}')"` : ""} onclick="${onPick}(${inlineJsonArg(id)},${inlineJsonArg(locName(name, nameAr))})">
      <div class="dest-card-icon dest-card-media"><i data-lucide="map-pin"></i></div>
      <div class="dest-card-name">${escapeHtml(locName(name, nameAr))}</div>
      ${(!isArabic() && nameAr) ? `<div class="dest-card-sub">${escapeHtml(nameAr)}</div>` : ""}
      <div class="dest-card-count">${formatNumber(count)} ${t("activity.tripsCount","Trips")}</div>
    </button>`;

  const cards = [
    `<button class="dest-card dest-card-all" onclick="${onPick}('',${inlineJsonArg(t("activity.allDestinations","All Destinations"))})">
      <div class="dest-card-icon dest-card-media"><i data-lucide="ticket"></i></div>
      <div class="dest-card-name">${t("activity.allDestinations","All Destinations")}</div>
      <div class="dest-card-count">${formatNumber(activities.length)} ${t("activity.tripsCount","Trips")}</div>
    </button>`,
    // Every destination is offered, empty ones included — an agent looking for
    // Luxor needs to see that Luxor exists and has nothing in it yet.
    ...dests.map(d => card(d.id, d.name, d.nameAr, d.imageUrl, counts.get(d.id) || 0)),
    ...(unfiled ? [card("__none__", t("activity.noDestinationTrips","Trips with no destination"), null, null, unfiled)] : []),
  ];

  content(pageHeader(`
    <button class="btn btn-outline" onclick="renderActivities()">${icon("arrow-left")}&nbsp;${t("btn.back","Back")}</button>
  `) + `
    <p style="color:var(--text-secondary);margin:0 0 20px">${t(subtitleKey, subtitleFallback)}</p>
    ${dests.length || activities.length
      ? `<div class="dest-grid">${cards.join("")}</div>`
      : `<div class="empty-state">${icon("map-pin")}<strong>${t("empty.noDestinations","No destinations added yet")}</strong><span>${t("empty.adjustFilters","Ask admin to add destinations")}</span></div>`}`);
  refreshIcons(document.getElementById("content"));
}

function pkgUpdateTotal(priceAdult, priceChild, currency) {
  const adults = Math.max(1, parseInt(document.getElementById("pkgAdults")?.value || "1"));
  const children = Math.max(0, parseInt(document.getElementById("pkgChildren")?.value || "0"));
  const el = document.getElementById("pkgTotalPreview");
  if (el) el.textContent = formatPrice((adults * priceAdult) + (children * (priceChild || priceAdult)), currency);
}

function pkgUpdateChildAges() {
  const count = Math.max(0, parseInt(document.getElementById("pkgChildren")?.value || "0"));
  const box = document.getElementById("pkgChildAgesBox");
  if (!box) return;
  box.style.display = count > 0 ? "" : "none";
  box.innerHTML = count > 0
    ? `<label>${t("hotel.childAge","Children Ages")}</label>
       <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:6px">
         ${Array.from({length: count}, (_, i) => `<div>
           <label style="font-size:11px;color:var(--text-muted)">${t("hotel.childAge","Child {n} Age").replace("{n}", i + 1)}</label>
           <input type="number" min="0" max="17" value="7" id="pkgChildAge_${i}" style="width:100%">
         </div>`).join("")}
       </div>`
    : "";
}

function addPackageActivity(activityId) {
  const activity = (state.activityPackageSource || []).find(a => a.id === activityId);
  if (!activity) return;
  const activityDate = document.getElementById("pkgDate")?.value;
  const selectedTime = document.getElementById("pkgTime")?.value || "";
  const clientName = document.getElementById("pkgClientName")?.value.trim();
  const clientPhone = document.getElementById("pkgClientPhone")?.value.trim();
  const adultsCount = Math.max(1, parseInt(document.getElementById("pkgAdults")?.value || "1"));
  const childrenCount = Math.max(0, parseInt(document.getElementById("pkgChildren")?.value || "0"));
  if (!activityDate || !clientName || !clientPhone) return toast(t("toast.validationError","Check required fields"), "error");
  const conflict = (state.activityPackageCart || []).find(item => item.activityDate === activityDate && selectedTime && item.selectedTime === selectedTime);
  if (conflict) return toast(t("activity.timeConflict","This package already has a trip at the same date/time."), "error");
  const childAges = Array.from({length: childrenCount}, (_, i) =>
    parseInt(document.getElementById(`pkgChildAge_${i}`)?.value || "7"));
  const groupType = document.querySelector('input[name="actGroupType"]:checked');
  const transfer = actCollectTransfer("pkg");
  if (transfer === null) {
    toast(t("activity.transferFromRequired","Enter where the driver should collect them"), "error");
    document.getElementById("pkgTransferFrom")?.focus();
    return;
  }
  state.activityPackageCart = state.activityPackageCart || [];
  state.activityPackageCart.push({
    localId: `pkg_${Date.now()}_${Math.random().toString(16).slice(2)}`,
    activityId,
    activityName: activity.name,
    activityDate,
    selectedTime,
    groupTypeId: groupType?.value || undefined,
    adultsCount,
    childrenCount,
    childAges: childrenCount > 0 ? childAges : undefined,
    clientName,
    clientPhone,
    hotelName: transfer.transferRequested
      ? undefined
      : (document.getElementById("pkgHotelName")?.value.trim() || undefined),
    // The trip's own answer, not the agent's — kept so the cart can label the line.
    transferIncluded: actTransferIncluded(activity),
    ...transfer,
    notes: document.getElementById("pkgNotes")?.value.trim() || undefined,
    city: activity.city || undefined,
    totalPreview: adultsCount * (Number(activity.priceAdult) || 0) + childrenCount * (Number(activity.priceChild || activity.priceAdult) || 0),
    currency: activity.currency || "USD",
  });
  closeModal();
  renderActivityPackagePicker();
}

async function submitActivityPackage() {
  const cart = state.activityPackageCart || [];
  if (!cart.length) return toast(t("activity.packageEmpty","No trips added yet"), "error");
  const first = cart[0];
  const btn = document.querySelector('[onclick="submitActivityPackage()"]');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-spinner"></span>&nbsp;${t("btn.saving","Saving...")}`; }

  // ONE package record with line items (server creates one PKG ref + one voucher).
  const res = await apiFetch("/activity-packages", { method: "POST", body: JSON.stringify({
    clientName: first.clientName,
    clientPhone: first.clientPhone,
    hotelName: first.hotelName,
    adultsCount: Math.max(...cart.map(i => i.adultsCount || 1)),
    childrenCount: Math.max(0, ...cart.map(i => i.childrenCount || 0)),
    notes: state.activityPackageNotes || undefined,
    items: cart.map(i => ({
      activityId: i.activityId,
      activityDate: i.activityDate,
      selectedTime: i.selectedTime || undefined,
      groupTypeId: i.groupTypeId,
      adultsCount: i.adultsCount,
      childrenCount: i.childrenCount,
      childAges: i.childAges && i.childAges.length ? i.childAges : undefined,
      hotelName: i.hotelName,
      clientPhone: i.clientPhone,
      transferIncluded: i.transferIncluded,
      transferRequested: i.transferRequested,
      transferFromType: i.transferFromType,
      transferFromName: i.transferFromName,
      transferToType: i.transferToType,
      transferToName: i.transferToName,
      transferPickupTime: i.transferPickupTime,
      transferReturnTime: i.transferReturnTime,
      transferNotes: i.transferNotes,
      notes: i.notes,
    })),
  })});

  if (!res?.success) {
    // apiFetch already surfaced the message (e.g. TIME_CONFLICT). Keep the cart.
    if (btn) { btn.disabled = false; btn.innerHTML = `${icon("send")}${t("activity.submitPackage","Submit Package")}`; refreshIcons(btn.parentElement); }
    return;
  }
  state.activityPackageCart = [];
  state.activityPackageNotes = "";
  renderActivities();
  packageSuccessModal(res.data);
}
